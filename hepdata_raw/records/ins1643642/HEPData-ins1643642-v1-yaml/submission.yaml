additional_resources: []
comment: "CERN-LHC. Measurement of semi-inclusive distributions of charged-particle
  jets recoiling from a high-transverse momentum trigger hadron in p-Pb collisions
  at sqrt(sNN)=5.02 TeV. Jets are reconstructed from charged-particle tracks using
  the anti-kT algorithm with resolution parameter R=0.2 and 0.4. A data-driven statistical
  approach is used to correct the uncorrelated background jet yield. Recoil jet distributions
  are reported for jet transverse momentum 15<p_{T,jet}^{ch} <50 GeV/c and are compared
  in various intervals of p-Pb event activity, based on charged-particle multiplicity
  and zero-degree neutral energy in the forward (Pb-going) direction. Analysis is
  based on data collected by ALICE in 2013. \n\nCharged tracks are constrained to
  the pseudorapidity range |eta_{track}| < 0.9.\nTrigger tracks are required to be
  in the pT ranges  12 to 50 GeV/c  and 6 to 7 GeV/c.\n\nPseudorapidity of reconstructed
  jets is constrained by a fiducial cut |eta_{jet}|<0.9 - R.\nLowest p_{T} of a jet
  constituent track is 150 MeV/c.\nThe angle enclosed by a trigger track and a recoiling
  jet is greater than pi - 0.6 rad."
hepdata_doi: 10.17182/hepdata.83540.v1
