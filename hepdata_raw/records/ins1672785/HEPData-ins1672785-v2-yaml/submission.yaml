data_file: Figure_04.yaml
description: Global polarization of $\Lambda$ and $\bar{\Lambda}$ as a function of
  the collision energy $\sqrt{s_{_{NN}}}$ for 20-50% centrality Au+Au collisions.
  Thin lines show calculations from a 3+1D cascade + viscous hydrodynamic model (UrQMD+vHLLE)
  and bold lines show the AMPT model calculations. In the case of each model, primary
  $\Lambda$ with and without the feed-down effect are indicated by dashed and solid
  lines, respectively. Open boxes and vertical lines show systematic and statistical
  uncertainties, respectively. Note that the data points at 200 GeV and for $\bar{\Lambda}$
  are slightly horizontally shifted for visibility.
