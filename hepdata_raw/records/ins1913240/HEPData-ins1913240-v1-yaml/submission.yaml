additional_resources:
- {description: web page with auxiliary material, location: 'https://lhcbproject.web.cern.ch/Publications/LHCbProjectPublic/LHCb-PAPER-2021-015.html'}
comment: CERN-LHC. Prompt charged particle production cross-sections are measured
  in proton-lead (pPb) and proton-proton (pp) collisions at a the nucleon-nucleon
  centre-of-mass energy of 5TeV by the LHCb detector. The nuclear modification factor
  $RpPb= \sigma_{pPb}/(A \sigma_{pp})$, with $A=208$, is also measured. Prompt charged
  particles are defined as any charged hadron or lepton with a mean lifetime above
  0.310^{-10} s produced directly in the collision or from decays of shorter-lifetime
  particles.
