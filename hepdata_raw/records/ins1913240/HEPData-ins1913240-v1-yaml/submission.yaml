data_file: Table1.yaml
description: Double-differential production cross-section for prompt charged particles
  in pp collisions at 5TeV with respect to pseudorapidity and transverse momentum.
  First uncertainty is statistical, the second is systematic and the third is from
  the luminosity. Luminosity uncertainty is fully correlated among the different kinematic
  ranges.
keywords:
- name: reactions
  values: [P P --> CHARGED X, P PB --> CHARGED X]
- name: observables
  values: [D2SIG/DPTDETARAP]
- name: phrases
  values: [Inclusive, Prompt, Double Differential Cross Section, Pseudorapidity Dependence,
    Transverse Momentum Dependence, Proton-Proton Scattering]
- name: cmenergies
  values: [5020.0]
name: Table1
table_doi: 10.17182/hepdata.131597.v1/t1
