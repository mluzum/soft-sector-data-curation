  values: [Au Au --> 2$pi^-$ + X]
- name: cmenergies
  values: [130.0]
- name: phrases
  values: [ppg010, transverse momentum, mid-rapidity]
location: Data From Fig. 2 of PRL 88 (192302) 2002
name: Figure 2a
