description: HBT radii for pion pairs as a function of $k_T$ measured at mid-rapidity
  for various energies for Au+Au collisions at $\sqrt{s_{NN}}$ = 130 GeV. Values used
  are from the Longitudinal Co-Moving System (LCMS) frame.
