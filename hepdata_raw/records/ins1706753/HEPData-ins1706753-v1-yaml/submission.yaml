{comment: 'Measurements of charged particle multiplicity density in p-Pb collisions
    at centre-of-mass energies of 8.16 TeV in the pseudorapidity range -1.7 to 1.7.
    Results are given for NSD (non-single diffractive, i.e. non-diffractive and double
    processes only) class of events and for different centrality estimators, CL1 (mid-rapidity
    multiplicity estimator), V0A (forward-rapidity multiplicity estimator) and ZNA
    (energy deposited in the Zero Degree Calorimeter).', hepdata_doi: 10.17182/hepdata.89268.v1}
---
data_file: Table1.yaml
description: "Pseudorapidity density of charged particles in p\u2013Pb NSD collisions
  at a centre-of-mass energy of 8.16 TeV."
keywords:
- name: observables
  values: [MULT]
- name: reactions
  values: [P PB --> CHARGED X]
- name: cmenergies
  values: [8.16]
- name: phrases
  values: [Charged particle multiplicity, Minimum bias]
location: Data from Fig. 3
name: Table 1
table_doi: 10.17182/hepdata.89268.v1/t1
