- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/phi-meson-production-au-au-and-p-p-collisions-sqrt-s-200-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0406003'}
comment: We report the STAR measurement of $\phi$ meson production in Au+Au and p+p
  collisions at $\sqrt{s_{NN}}$ = 200 GeV. Using the event mixing technique, the $\phi$
  spectra and yields are obtained at mid-rapidity for five centrality bins in Au+Au
  collisions and for non-singly-diffractive p+p collisions. It is found that the $\phi$
  transverse momentum distributions from Au+Au collisions are better fitted with a
  single-exponential while the p+p spectrum is better described by a double-exponential
  distribution. The measured nuclear modification factors indicate that $\phi$ production
  in central Au+Au collisions is suppressed relative to peripheral collisions when
  scaled by the number of binary collisions ($<N_{bin}>)$. The systematics of $<p_T>$
  versus centrality and the constant $\phi/K^-$ ratio versus beam species, centrality,
  and collision energy rule out kaon coalescence as the dominant mechanism for $\phi$
  production.
hepdata_doi: 10.17182/hepdata.99154.v1
