description: '$R_{CP}$ (a): The ratio of central (top 5%) over peripheral (60-80%)
  ($R_{CP}$) normalized by $<N_{bin}>$. The ratios for the $\Lambda$ and $K_S^0$,
  shown by dotted-dashed and dashed lines, are taken from [13]; $R_{AA}$ (b) and (c)
  are the ratios of central Au + Au (top 5%) to p + p and peripheral Au + Au (60-80%)
  to p + p, respectively. The values of $R_{AA}$ for charged hadrons are shown as
  open circles [25]. The width of the gray bands represent the uncertainties in the
  estimation of $<N_{bin}>$ summed in quadrature with the normalization uncertainties
  of the spectra. Errors on the $\phi$ data points are the statistical plus 15% systematic
  errors. Overall normalization errors from binary scaling are listed in the header
  of each column.'
