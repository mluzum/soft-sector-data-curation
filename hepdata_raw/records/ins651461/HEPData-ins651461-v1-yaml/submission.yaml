data_file: figure_1.yaml
description: Transverse mass distributions for $\phi$ meson from Au+Au (circles) and
  p+p (squares) collisions at 200 GeV. For clarity, some Au+Au distributions for different
  centralities are scaled by factors. The top 5% data are obtained from the central
  trigger data set. All other distributions are obtained from the minimum-bias data
  set. Dashed lines represent the exponential fits to the distributions and the dotted-dashed
  line is the result of a double-exponential fit to the distribution from p+p collisions.
  Error bars are statistical errors only. (x500), (x30), etc. in plot refers to the
  scaling of data for clearer visual results.
