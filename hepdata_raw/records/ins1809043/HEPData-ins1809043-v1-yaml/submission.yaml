additional_resources:
- {description: webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/flow-and-interferometry-results-auau-collisions-sqrtsnn-45-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/2007.14005'}
comment: |
  The Beam Energy Scan (BES) program at the Relativistic Heavy Ion Collider (RHIC) was extended to energies below sqrt(sNN) = 7.7 GeV in 2015 by successful implementation of the fixed-target mode of operation in the STAR (Solenoidal Track At RHIC) experiment. In the fixed-target mode, ions circulate in one ring of the collider and interact with a stationary target at the entrance of the STAR Time Projection Chamber. The first results for Au+Au collisions at sqrt(sNN) = 4.5 GeV are presented, including directed and elliptic flow of identified hadrons, and radii from pion femtoscopy. The proton flow and pion femtoscopy results agree quantitatively with earlier measurements by Alternating Gradient Synchrotron experiments at similar energies. This validates running the STAR experiment in the fixed-target configuration. Pion directed and elliptic flow are presented for the first time at this beam energy. Pion and proton elliptic flow show behavior which hints at constituent quark scaling, but large error bars preclude reliable conclusions. The ongoing second phase of BES (BES-II) will provide fixed-target data sets with 100 times more events at each of several energies down to sqrt(sNN) = 3.0 GeV.
hepdata_doi: 10.17182/hepdata.95903.v1
