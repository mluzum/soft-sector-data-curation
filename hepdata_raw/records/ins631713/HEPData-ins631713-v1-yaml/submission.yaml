- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0310029'}
- {description: web page, location: 'https://drupal.star.bnl.gov/STAR/publications/azimuthal-anisotropy-relativistic-heavy-ion-collider-first-and-fourth-harmonics'}
comment: We report the first observations of the first harmonic (directed flow, $v_1$)
  and the fourth harmonic ($v_4$), in the azimuthal distribution of particles with
  respect to the reaction plane in Au+Au collisions at the BNL Relativistic Heavy
  Ion Collider (RHIC). Both measurements were done taking advantage of the large elliptic
  flow ($v_2$) generated at RHIC. From the correlation of $v_2$ with $v_1$ it is demonstrated
  that $v_2$ is positive, or $in$-$plane$. The integrated $v_4$ is is about a factor
  of 10 smaller than $v_2$. For the sixth ($v_6$) and eighth ($v_8$) harmonics upper
  limits on the magnitudes are reported. An erratum of this paper can be found in
  Phys.Rev.Lett.127.069901 (2021).
hepdata_doi: 10.17182/hepdata.102322.v1
