data_file: data4.yaml
description: "A summary of worldwide $^3_{\\Lambda}$H R_3 experimental measurements
  and theoretical  calculations. The marker represents the present analysis. This
  Fig. summarizes previous measurements of this decay branching ratio in the literature.
  The present results close to the combined measurement from helium bubble chamber
  experiments and is consistent with the average value of 0.35 \xB1 0.04 based on
  early measurements in helium bubble chambers."
