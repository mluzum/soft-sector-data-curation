data_file: data1.yaml
description: "The hypertriton yield as a function of ~l/\u03B2\u03B3 for each of the
  two analyzed decay channels.  The redpoints are for 2-body decays in four bins of
  ~l/\u03B2\u03B3. The yields indicate the number of $^3_{\\Lambda}$H per million
  events for each channel, and are already divided by the theoretical branching ratio
  24.89% for the 2-body channel. The data points are fitted with the usual radioactive
  \ decay  function. Using a minimum chisquare estimation."
keywords:
- name: reactions
  values: [Au+Au]
- name: observables
  values: ["counts with the l/\u03B2\u03B3"]
- name: cmenergies
  values: [200]
- name: phrases
  values: [Measurement of hypertriton, RHIC, STAR]
location: Data from Figure 2(a)
name: Table 1(a)
table_doi: 10.17182/hepdata.102407.v1/t1
