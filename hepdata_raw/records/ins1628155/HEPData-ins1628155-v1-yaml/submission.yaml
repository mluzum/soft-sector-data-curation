data_file: data3.yaml
description: "A summary of worldwide $^3_{\\Lambda}$H lifetime experimental measurements
  and theoretical calculations. The two star markers are the STAR collaboration\u2019s
  measurement published in 2010 and the present analysis. This measurement was based
  on the 3-body decay channel $^3_{\\Lambda}$H\u2192p+d+\u03C0\u2212in a nuclear emulsion
  experiment. The shorter lifetime was attributed to the dissociation of the lightly-bound
  \u039B and deuteron when traveling in a dense medium."
keywords:
- name: reactions
  values: [Au+Au]
- name: observables
  values: [lifetime experimental measurements and theoretical calculations.]
- name: cmenergies
  values: [200]
- name: phrases
  values: [Measurement of hypertriton, RHIC, STAR]
location: Data from Figure 3
name: Table 2(a)
table_doi: 10.17182/hepdata.102407.v1/t3
