comment: |
  CERN-LHC. Measurements of the inclusive production of muons from heavy flavour decays at forward rapidities in Lead-Lead and Proton-Proton collisions  at a centre-of-mass energy per nucleon of 2.76 TeV.  The rapidity region covered is 2.5 to 4.0. The P P reference data were taken during a  special 2.76 TeV run in March 2011 and the Lead-Lead data were collected in 2010.  The PT spectrum of the P P data is presented as well as the nuclear modification factor RAA as a function of PT in two centrality regions and as a function of the number of participating nucleons.
