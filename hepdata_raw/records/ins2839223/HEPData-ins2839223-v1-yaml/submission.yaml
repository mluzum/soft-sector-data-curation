additional_resources:
- {description: CMS physics analysis summaries, location: 'https://cds.cern.ch/record/2895223'}
comment: |
  CERN-LHC.  Intrinsic kT tuning results of Pythia and Herwig to 10 experiments with the nucleon-nucleon center-of-mass energy ranging from 38.8 GeV to 13 TeV.
hepdata_doi: 10.17182/hepdata.154142.v1
