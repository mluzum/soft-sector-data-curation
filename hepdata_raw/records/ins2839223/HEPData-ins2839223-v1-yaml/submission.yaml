- name: phrases
  values: [Proton-Proton Scattering, Nucleon-Nucleon Scattering, Drell-Yan, Pythia,
    CP5, Intrinsic kT, Differential Cross Section]
location: Data from Page 4 of preprint
name: Figure 1 (CP5)
table_doi: 10.17182/hepdata.154142.v1/t1
