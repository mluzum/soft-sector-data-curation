data_file: data1.yaml
description: Tuned intrinsic kT parameters BeamRemnants:PrimordialkThard in Pythia
  with the underlying-event tune CP5 at nucleon-nucleon center-of-mass energy from
  38.8 GeV to 13 TeV.
