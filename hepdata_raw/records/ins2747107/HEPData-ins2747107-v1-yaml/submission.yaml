comment: Ultrarelativistic nuclear collisions create a strongly interacting state
  of hot and dense quark-gluon matter that exhibits a remarkable collective flow behavior
  with minimal viscous dissipation. To gain deeper insights into its intrinsic nature
  and fundamental degrees of freedom, we extracted the speed of sound in this medium
  created using lead-lead (PbPb) collisions at a center-of-mass energy per nucleon
  pair of 5.02 TeV. The data were recorded by the CMS experiment at the CERN LHC and
  correspond to an integrated luminosity of $0.607 \mathrm{nb}^{-1}$. The measurement
  is performed by studying the multiplicity dependence of the average transverse momentum
  of charged particles emitted in head-on PbPb collisions. Our findings reveal that
  the speed of sound in this matter is nearly half of the speed of light, with its
  squared value being $0.241\pm0.002 (\mathrm{stat})\pm0.016 (\mathrm{syst})$ in natural
  units at a medium temperature of $219\pm8(\mathrm{syst})\mathrm{MeV}$, precisely
  aligning with predictions from lattice quantum chromodynamic (QCD) calculations.
  This result provides a stringent constraint on the equation of state of the created
  medium and a direct evidence for a deconfined QCD phase being attained in relativistic
  nuclear collisions.
