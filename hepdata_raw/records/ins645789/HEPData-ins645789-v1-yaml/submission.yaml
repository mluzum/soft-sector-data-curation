comment: BNL-RHIC-BRAHMS. We report on a study of the transverse momentum dependence
  of nuclear modification factors $R_{dAu}$ for charged hadrons produced in deuteron
  + gold collisions at $\sqrt{s_{NN}=\unit[200]{GeV}$, as a function of collision
  centrality and of the pseudorapidity ($\eta = 0,1,2.2,3.2 $) of the produced hadrons.
  We find significant and systematic decrease of $R_{dAu}$ with increasing rapidity.
  The midrapidity enhancement and the forward rapidity suppression are more pronounced
  in central collisions relative to peripheral collisions. These results are relevant
  to the study of the possible onset of gluon saturation at RHIC energies.
