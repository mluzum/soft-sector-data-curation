{comment: 'Charged-particle spectra at midrapidity are measured in Pb--Pb collisions
    at the centre-of-mass energy per nucleon--nucleon pair $\snn = 5.02$ TeV and presented
    in centrality classes ranging from most central~(0--5\%) to most peripheral~(95--100\%)
    collisions. Possible medium effects are quantified using the nuclear modification
    factor~($\RAA$) by comparing the measured spectra with those from proton--proton
    collisions, scaled by the number of independent nucleon--nucleon collisions obtained
    from a Glauber model.', hepdata_doi: 10.17182/hepdata.89396.v1}
---
data_file: Table1.yaml
description: Nuclear modification factor RAA versus pT for charged particles at midrapidity
  in 0-5% central Pb-Pb collisions at 5.02 TeV
keywords:
- name: reactions
  values: [PB PB --> charged X]
- name: phrases
  values: [RAA]
- name: cmenergies
  values: [5020.0]
location: Figure 2
name: Table 1
