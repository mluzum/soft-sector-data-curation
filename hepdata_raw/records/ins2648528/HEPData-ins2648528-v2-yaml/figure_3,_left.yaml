dependent_variables:
- header: {name: '${\rm (N_{Y(3S)}/ N_{Y(2S)})}_{\rm PbPb}/{\rm (N_{Y(3S)}/N_{Y(2S)})}_{\rm
      pp}$', units: ''}
  qualifiers:
  - {name: RE, value: 'Pb Pb --> $\Upsilon(2S)$, $\Upsilon(3S)$ < $\mu$$^+$ $\mu$$^-$
      > X'}
  - {name: SQRT(S)/NUCLEON, value: 5020 GeV}
  - {name: $|y|$, value: $ < 2.4$}
  - {name: '$p_{T}$', units: GeV/c, value: 0 -- 30}
  - {name: GLOBAL UNC., value: 1.5 %}
  values:
  - errors:
    - {label: stat, symerror: 0.31}
    - {label: sys, symerror: 0.15}
    value: 0.9
  - errors:
    - {label: stat, symerror: 0.21}
    - {label: sys, symerror: 0.1}
    value: 0.94
  - errors:
    - {label: stat, symerror: 0.22}
    - {label: sys, symerror: 0.1}
    value: 0.74
  - errors:
    - {label: stat, symerror: 0.19}
    - {label: sys, symerror: 0.1}
    value: 0.57
- header: {name: '$\left< N_\text{part} \right>$', units: ''}
  values:
  - errors:
    - {symerror: 0.3}
    value: 11.43
  - errors:
    - {symerror: 1.0}
    value: 42.81
  - errors:
    - {symerror: 1.3}
    value: 109.1
  - errors:
    - {symerror: 1.0}
    value: 269.1
independent_variables:
- header: {name: Centrality, units: PCT}
