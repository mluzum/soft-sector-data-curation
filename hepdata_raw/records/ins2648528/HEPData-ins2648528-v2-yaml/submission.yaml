comment: The production of $\Upsilon(2S)$ and $\Upsilon(3S)$ mesons in lead-lead ($\text{PbPb}$)
  and proton-proton ($\text{pp}$) collisions is studied in their dimuon decay channel
  using the CMS detector at the LHC. The $\Upsilon(3S)$ meson is observed for the
  first time in \PbPb collisions, with a significance above five standard deviations.
  The nuclear modification factors, derived from the ratio of yields measured in $\text{PbPb}$
  to $\text{pp}$ collisions, are reported for both $\Upsilon(2S)$ and $\Upsilon(3S)$
  mesons as functions of $\Upsilon$ meson transverse momentum and $\text{PbPb}$ collision
  centrality. The suppression is found to be stronger for $\Upsilon(3S)$ mesons compared
  to $\Upsilon(2S)$ mesons, extending the pattern of sequential suppression of quarkonium
  states in nuclear collisions previously seen for the $J/\psi$, $\psi(2S)$, $\Upsilon(1S)$
  and $\Upsilon(2S)$ mesons. The results provide new constraints on theoretical descriptions
  of the dynamics of quarkonium states in heavy ion collisions.
