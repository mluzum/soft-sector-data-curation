comment: |
  CERN-LHC.  The production of jets associated to bottom quarks is measured for the first time in PbPb collisions at a center-of-mass energy of 2.76 TeV per nucleon pair. Jet spectra are reported in the transverse momentum (pT) range of 80-250 GeV, and within pseudorapidity abs(eta) < 2. The nuclear modification factor (R[AA]) calculated from these spectra shows a strong suppression in the b-jet yield in PbPb collisions relative to the yield observed in pp collisions at the same energy. The suppression persists to the largest values of pT studied, and is centrality dependent. The R[AA] is about 0.4 in the most central events, similar to previous observations for inclusive jets. This implies that jet quenching does not have a strong dependence on parton mass and flavor in the jet pt range studied.

  The statistical errors submitted to HepData take into account an erratum presented in Phys.Rev.Lett. 115 (2015) 2, 029903.
