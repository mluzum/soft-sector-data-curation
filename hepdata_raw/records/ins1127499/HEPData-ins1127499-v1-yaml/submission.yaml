- {description: arXiv, location: 'https://arxiv.org/abs/1208.2736'}
comment: We report $J/\psi$ spectra for transverse momenta $p_{T}$> 5 GeV/c at mid-rapidity
  in p+p and Au+Au collisions at $\sqrt{s_{NN}}$ = 200 GeV.The inclusive $J/\psi$
  spectrum and the extracted B-hadron feed-down are compared to models incorporating
  different production mechanisms. We observe significant suppression of the $J/\psi$
  yields for $p_{T}$ > 5 GeV/c in 0-30% Au+Au collisions relative to the p+p yield
  scaled by the number of binary nucleon-nucleon collisions in Au+Au collisions. In
  30-60% collisions, no such suppression is observed.The level of suppression is consistently
  less than that of high-$p_{T}$ $\pi^{\pm}$ and low-$p_{T}$ $J/\psi$.
hepdata_doi: 10.17182/hepdata.98623.v1
