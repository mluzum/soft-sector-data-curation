description: (Color online) $R_{AA}$ versus $N_{part}$ for high-$p_{T}$ $J/\psi$ in
  comparison with a) low-$p_{T}$ $J/\psi$ data from PHENIX [6], and high-$p_{T}$ $\pi^{\pm}$
  from STAR [41, 42], and b) high-$p_{T}$ $J/\psi$ from CMS [8]. The statistical (systematic)
  uncertainties are shown in vertical bars (boxes). The shaded green band about unity
  shows the systematic uncertainties from $N_{bin}$ and the box about unity on the
  right shows the $R_{AA}$ normalization uncertainty from the statistical and global
  systematic uncertainties of the $p+p$ reference data. The percentage in the top
  horizontal axis of (a) and (b) refer to the collision centrality for high-$p_{T}$
  $J/\psi$ data at the RHIC and LHC, respectively.
