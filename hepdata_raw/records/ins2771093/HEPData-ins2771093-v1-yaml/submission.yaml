{comment: 'Measurements of the $p_\mathrm{T}$-dependent flow vector fluctuations in
    Pb-Pb collisions at $\sqrt{s_\mathrm{NN}} = 5.02$ TeV using azimuthal correlations
    with the ALICE experiment at the LHC are presented. A four-particle correlation
    approach is used to quantify the effects of flow angle and magnitude fluctuations
    separately. This paper extends previous studies to additional centrality intervals
    and provides measurements of the $p_\mathrm{T}$-dependent flow vector fluctuations
    at $\sqrt{s_\mathrm{NN}} = 5.02$ with two-particle correlations. Significant $p_\mathrm{T}$-dependent
    fluctuations of the $\vec{V}_{2}$ flow vector in Pb-Pb collisions are found across
    different centrality ranges, with the largest fluctuations of up to $\sim$15\%
    being present in the 5\% most central collisions. In parallel, no evidence of
    significant $p_\mathrm{T}$-dependent fluctuations of $\vec{V}_{3}$ or $\vec{V}_{4}$
    is found. Additionally, evidence of flow angle and magnitude fluctuations is observed
    with more than $5\sigma$ significance in central collisions. These observations
    in Pb-Pb collisions indicate precisely where the classical picture of hydrodynamic
    modeling with a common symmetry plane breaks down. This has implications for hard
    probes at high $p_\mathrm{T}$, which are biased by kinematic-dependent fluctuations
    of the flow vector direction of at least 23\% in central collisions. Given the
    presented results, existing theoretical models should be re-examined to improve
    our understanding of initial conditions, quark--gluon plasma (QGP) properties,
    and the dynamic evolution of the created system.', hepdata_doi: 10.17182/hepdata.158065.v1}
