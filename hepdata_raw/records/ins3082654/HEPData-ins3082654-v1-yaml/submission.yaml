comment: The centrality dependence of strange ($\rm K^{0}_{\mathrm S}$, $\Lambda+\bar{\Lambda}$)
  and multi-strange ($\Xi^{-}+\bar{\Xi}^{+}$, $\Omega^{-}+\bar{\Omega}^{+}$) hadron
  production is measured by ALICE in lead$-$lead (Pb$-$Pb) collisions at a centre-of-mass
  energy per nucleon pair of $\sqrt{s_{\mathrm{NN}}}=5.02~\mathrm{TeV}$, using the
  full data set collected during LHC Run 2 (2015 and 2018). This is the largest heavy-ion
  data set analysed to date at the LHC and it allows for the extraction of transverse-momentum
  ($p_{\mathrm T}$) spectra and $p_{\mathrm T}$-integrated yields with unprecedented
  precision over a broad range of charged-particle multiplicity densities ($\langle
  dN_{\mathrm{ch}}/d\eta\rangle_{|\eta|<0.5}$), probing regions where results from
  smaller collision systems (pp and p$-$Pb) are also available. The $p_{\mathrm T}$
  spectra evolve with centrality, featuring larger $\langle p_{\mathrm T}\rangle$
  in central events for all particles. The $\Lambda/\rm K^{0}_{\mathrm S}$ ratio exhibits
  the distinctive baryon-to-meson enhancement in the intermediate-$p_{\mathrm T}$
  region, with a maximum that shifts to larger $p_{\mathrm T}$ for more central collisions.
  The hadron-to-pion yield ratios are presented as a function of $\langle dN_{\mathrm{ch}}/d\eta\rangle_{|\eta|<0.5}$
  and compared to results from different collision systems and energies. A smooth
  connection from pp to Pb$-$Pb is observed, demonstrating that collision system or
  energy do not play a role in the multiplicity evolution of this observable. The
  previously reported enhancement of strangeness production in the multiplicity range
  probed in pp and p$-$Pb collisions saturates in the multiplicity range of the Pb$-$Pb
  data. These results constitute a key test bench for theoretical models, and a first
  comparison to the EPOS 4 generator is presented.
