  values: [PB PB --> PI+ PI+ X, PB PB --> PI- PI- X]
- name: observables
  values: [CORR]
- name: phrases
  values: [Inclusive]
- name: cmenergies
  values: [2760.0]
location: Data from Figure 2 (same-charge)
name: Table 1
