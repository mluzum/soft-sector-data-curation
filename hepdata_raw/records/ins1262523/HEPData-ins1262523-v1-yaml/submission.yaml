comment: |
  CERN-LHC.  The r3 variable is measured with charged pions in Pb-Pb collisions at the LHC.  The following measurements are reported:
  - C2 for same- and mixed-charge pairs versus qinv for six kT intervals and two centrality intervals.
  - C2 fit parameters: lambda and Rch
  - C3 and c3 for same- and mixed-charge triplets versus Q3 in two KT3 intervals and six centrality intervals.
  - r3 versus Q3 in two different KT3 intervals and six different centrality intervals.
dateupdated: 08/06/2016 12:12:27
hepdata_doi: 10.17182/hepdata.69985.v1
modifications:
