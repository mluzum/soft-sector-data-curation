additional_resources:
- {description: web page with auxiliary material, location: 'http://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-16-008/index.html'}
comment: "CERN-LHC. The relative yields of \u03A5 mesons produced in pp and PbPb collisions
  at 5.02TeV and reconstructed via the dimuon decay channel are measured using data
  collected by the CMS experiment. Double ratios are formed by comparing the yields
  of the excited states, \u03A5(2S) and \u03A5(3S), to the ground state, \u03A5(1S),
  in both PbPb and pp collisions at the same center-of-mass energy, in data collected
  in 2015. The double ratios are studied as a function of collision centrality, as
  well as \u03A5 transverse momentum and rapidity.\n"
hepdata_doi: 10.17182/hepdata.79055.v1
record_ids:
- {id: 1605750, type: inspire}
