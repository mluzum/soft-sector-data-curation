comment: |
  CERN-LHC.  Measurements of the transverse momentum distributions of charged pions, kaons and (anti)protons   in Lead-Lead collisions at a centre-of-mass energy per nucleon of 2.76 TeV. The data, covering the PT range up to 4.5 GeV for  protons, is restricted to the central rapidity range |y| < 0.5.
