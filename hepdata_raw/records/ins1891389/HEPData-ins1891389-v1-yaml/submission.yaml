{comment: 'The polarization of the $\Lambda$ and $\overline\Lambda$ hyperons along
    the beam ($z$) direction, $P_{\rm z}$, has been measured in Pb--Pb collisions
    at $\sqrt{s_{\rm NN}} =$ 5.02 TeV recorded with ALICE at the Large Hadron Collider
    (LHC). The largest contribution to $P_{\rm z}$ comes from elliptic flow induced
    vorticity and can be characterized by the second Fourier sine coefficient $P_{\rm
    z,\,{\rm s2}} = \langle{P_{\rm z}\sin(2\varphi - 2 \Psi_{\rm 2})}\rangle$, where
    $\varphi$ is the hyperon azimuthal emission angle, and $\Psi_{\rm 2}$ is the elliptic
    flow plane angle. We report the measurement of $P_{\rm z,\,{\rm s2}}$ for different
    collision centralities, and in the 30--50\% centrality interval as a function
    of the hyperon transverse momentum ($p_{\rm T}$) and rapidity ($y_{\rm H}$).',
  hepdata_doi: 10.17182/hepdata.128775.v1}
---
