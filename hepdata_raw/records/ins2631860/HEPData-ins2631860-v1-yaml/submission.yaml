data_file: table4.yaml
description: "Main contributors to systematic uncertainty to the proton cumulant ratios:
  $C_2/C_1$, $C_3/C_2$,and $C_4/C_2$ from 0\u20135% central 3 GeV Au+Au collisions.
  The first row shows the values and statistical uncertainties of those ratios. The
  corresponding values of these ratios along with the statistical uncertainties are
  listed in the table. The final total value is the quadratic sum of uncertainties
  from centrality, pileup, and the dominant contribution from TPC hits, DCA, TOF $m^2$,
  and detector efficiency. Clearly, this analysis is systematically dominant."
