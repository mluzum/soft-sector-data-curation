data_file: table1.yaml
description: "The uncorrected number of charged particles except protons ($N_{\\rm
  ch}$) within the pseudorapidity $\u22122<\\eta<0$ used for the centrality selection
  for Au+Au collisions at $\\sqrt{s_{\\rm NN}}$ = 3 GeV. The centrality classes are
  expressed in % of the total cross section. The lower boundary of the particle multiplicity
  ($N_{\\rm ch}$) is included for each centrality class. Values are provided for the
  average number of participants ($\\langle N_{\\rm part}\\rangle$) and pileup fraction.
  The fraction of pileup for each centrality bin is also shown in the last column.
  The averaged pileup fraction from the minimum biased collisions is determined to
  be 0.46%. Values in the parentheses are systematic uncertainty."
