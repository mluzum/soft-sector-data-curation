description: "Collision energy dependence of the cumulant ratios: $C_2/C_1=\\sigma/M$,
  $C_3/C_2=S\\sigma$, and $C_4/C_2=\\kappa\\sigma^2$, for protons (open squares) and
  net protons (red circles) from top 0\u20135% (top panels) and 50\u201360% (bottom
  panels) Au+Au collisions at RHIC. The points for protons are shifted horizontally
  for clarity. The new result for protons from $\\sqrt{s_{\\rm NN}}$ = 3 GeV Au+Au
  collisions is shown as a filled square. UrQMD results with $|y|<0.5$ for protons
  are shown as gold bands while those for net protons are shown as green dashed lines
  or green bands. At 3GeV, the model results for protons (\u22120.5) are shown as
  blue crosses. UrQMD results of proton and net-proton $C_4/C_2$, see right panels,
  are almost totally overlapped. The open cross is the result of the model with a
  fixed impact parameter $b < 3$ fm. The hydrodynamic calculations, for 5% central
  Au+Au collisions, for protons from $|y|<0.5$ are shown as dashed red linea and the
  result of the 3 GeV protons from $\u22120.5<y<0$ is shown as an open red star."
