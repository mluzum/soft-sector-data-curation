comment: "CERN-LHC.  Production of upsilon mesons in proton-lead collisions at a nucleon-nucleon
  centre-of-mass energy sqrt(sNN) = 5 TeV is studied with the LHCb detector. The analysis
  is based on a data sample collected in early 2013 corresponding to an integrated
  luminosity of 1.6 nb^{-1}. Upsilon mesons of transverse momenta up to 15 GeV are
  reconstructed in the dimuon decay mode. The rapidity coverage in the centre-of-mass
  system is 1.5 < YRAP < 4.0 (forward region) and -5.0 < YRAP < -2.5 (backward region).
  \ \n\nThe product of the production cross section and the branching fraction for
  the dimuon decay mode of UPSILON(1S), UPSILON(2S) and UPSILON(3S) in the the forward
  and backward regions are given. This product is also measured for UPSILON(1S) in
  the common rapidity coverage of the forward and backward regions, 2.5 < ABS(YRAP)
  < 4.0. \n\n The production ratios of UPSILON(2S) and UPSILON(3S), R(X/1S) = SIG(X)*BR(X)
  / (SIG(UPSILON(1S))*BR(UPSILON(1S))), are measured in the forward and backward regions.
  \n\nThe forward-backward production ratio and the nuclear modification factor for
  UPSILON(1S) are also given.\n"
