description: 'FIG. 1:  a) left side: The $\Delta\phi$ - $\Delta\eta$ correlation data
  for unlike-sign charge particle pairs from the Star central trigger dataset shown
  in a 2-dimensional (2-D) perspective plot. The particle tracks have 0.8 GeV/c <
  $p_t$ < 2.0 GeV/c and |$\eta$| < 1.0. The structure that looks like tiles on a roof
  is due to the readout boundary effects of the 12 sector TPC. b) right side: The
  similar correlation data for like-sign charge particle pairs is shown.'
