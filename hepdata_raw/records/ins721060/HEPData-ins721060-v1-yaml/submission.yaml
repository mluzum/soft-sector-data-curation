additional_resources:
- {description: arXiv, location: 'https://arxiv.org/pdf/nucl-ex/0607003.pdf'}
comment: "We report charged-particle pair correlation analyses in the space of \u2206\u03C6
  (azimuth) and \u2206\u03B7 (pseudorapidity), for central Au + Au collisions at $\\sqrt{s_{NN}}$
  = 200 GeV in the STAR detector. The analysis involves unlike-sign charge pairs and
  like-sign charge pairs, which are transformed into chargedependent (CD) signals
  and charge-independent (CI) signals. We present detailed parameterizations of the
  data. A model featuring dense gluonic hot spots as first proposed by Van Hove predicts
  that the observables under investigation would have sensitivity to such a substructure
  should it occur, and the model also motivates selection of transverse momenta in
  the range 0.8 < $p_t$ < 2.0 GeV/c. Both CD and CI correlations of high statistical
  significance are observed, and possible interpretations are discussed."
