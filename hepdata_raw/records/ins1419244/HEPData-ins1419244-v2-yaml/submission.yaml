comment: |
  CERN-LHC. The anisotropic flow coefficients relative to the second, third and fourth harmonic ($v_2$, $v_3$ and $v_4$, respectively) are measured with two- and multi-particle correlation techniques in Pb-Pb collisions at 5.02 TeV, recorded in November 2015 with the ALICE detector at the CERN Large Hadron Collider.  The measurements are performed in the central pseudorapidity region (|$\eta$| < 0.8) and transverse momentum range 0.2 < $p_{\rm T}$ < 5.0 GeV/$c$.
dateupdated: 17/05/2016 17:02:23
hepdata_doi: 10.17182/hepdata.72886.v2
modifications:
- {action: Encoded, date: 21 APR 2016, who: ALICE Publications}
record_ids:
- {id: 1419244, type: inspire}
- {id: 6524, type: red}
