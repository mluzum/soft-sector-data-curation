  Centrality dependence of $v_2$, with two- and multi-particle correlations, integrated over the $p_{\rm T}$ range 0.2 < $p_{\rm T}$ < 5.0 GeV/$c$, at $\sqrt{s_{\rm NN}}$ = 5.02 TeV.
keywords:
- name: reactions
  values: [PB PB --> CHARGED X]
