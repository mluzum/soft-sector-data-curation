additional_resources:
- {description: Created with hepdata_lib 0.10.1, location: 'https://zenodo.org/record/4946277'}
comment: The azimuthal anisotropy of particles associated with jets (jet particles)
  at midrapidity is measured for the first time in p--Pb and Pb--Pb collisions at
  $\sqrt{s_{NN}}$ $=$ 5.02 TeV down to transverse momentum ($\it{p}_{\rm T}$) of 0.5
  GeV/$c$ and 2 GeV/$c$, respectively, with ALICE. The second-order Fourier coefficient
  of the jet-particle azimuthal distribution ($v_2$) in high-multiplicity p--Pb collisions
  is positive, with a significance reaching 6.8$\sigma$ at low $\it{p}_{\rm T}$. Comparisons
  with the inclusive charged-particle $v_2$ and with AMPT calculations are discussed.
  The model describes qualitatively the main features of the jet-particle $v_2$ in
  high-multiplicity p--Pb collisions and indicates that the positive jet-particle
  $v_2$ is generated by parton interactions.
