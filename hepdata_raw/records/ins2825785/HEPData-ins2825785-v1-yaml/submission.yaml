additional_resources:
- {description: Webpage with all figures and tables, location: 'http://alice-publications.web.cern.ch/node/11265'}
- {description: arXiv, location: 'https://www.arxiv.org/abs/2409.04343'}
comment: This Letter presents systematic measurements of various flow observables
  using charged particles from Xe$-$Xe collisions at $\sqrt{s_{_{\mathrm{NN}}}}~=~5.44$~TeV
  and Pb$-$Pb collisions at $\sqrt{s_{_{\mathrm{NN}}}}~=~5.02$~TeV recorded by the
  ALICE detector. Flow coefficients, flow fluctuations, nonlinear flow modes, and
  correlations between flow coefficients are measured as a function of centrality.
  Charged-particle tracks in the pseudorapidity region $|\eta|<0.8$ and transverse
  momentum region $0.2<p_{\rm T}<3.0$ GeV/$c$ were selected for the analysis.
data_license: {description: The content can be shared and adapted but you must give
