description: $p_{\rm T}$-differential yields of $\Lambda$(1520) (sum of particle and
  anti-particle states) at midrapidity in the 0-20% centrality class. The uncertainty
  'syst,uncorrelated' indicates the systematic uncertainty after removing the contributions
  common to all centrality classes
