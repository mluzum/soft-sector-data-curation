additional_resources:
- {description: web page with auxiliary material, location: 'https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2017-06/'}
comment: "CERN-LHC. The forward-forward and forward-central dijet azimuthal angular
  correlations and conditional yields are measured in Pb+Pb and pp collisions with
  the ATLAS detector at the LHC.\n\nThe measurement is performed as a function of
  jets transverse momentum and rapidity.\n\nThe analysis utilises an integrated luminosity
  of 25 pb^{-1} of pp data and 360 ub^{-1} of Pb+Pb data collected in 2015 and 2016,
  respectively, at the same centre-of-mass energy of 5.02 TeV per colliding nucleon
  pair. \n\nThe measurement is performed in the center-of-mass frame of the nucleon-nucleon
  system in the rapidity range between -4.0 and 4.0 using the two highest transverse
  momentum jets in each event, with the highest transverse momentum jet restricted
  to the forward rapidity range. \n\nNo significant broadening of azimuthal angular
  correlations is observed for forward-forward or forward-central dijets in p+Pb compared
  to p+p collisions. \n\nFor forward-forward jet pairs in the proton-going direction,
  the ratio of conditional yields in p+Pb collisions to those in pp collisions is
  suppressed by approximately 20%, with no significant dependence on the transverse
  momentum of the dijet system. No modification of conditional yields is observed
  for forward-central dijets.\n"
hepdata_doi: 10.17182/hepdata.93905.v1
