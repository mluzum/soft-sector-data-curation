additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/0809.4737'}
- {description: web page, location: 'https://drupal.star.bnl.gov/STAR/publications/mid-rapidity-phi-production-au-au-collisions-sqrt-s-sub-nn-sub-130-gev'}
comment: We present the first measurement of midrapidity vector meson $\phi$ production
  in Au+Au collisions at RHIC ($\sqrt{s_{_{NN}}}$ = 130 GeV) from from the STAR detector.
  For the 11% highest multiplicity collisions, the slope parameter from an exponential
  fit to the transverse mass distribution is $T=379\pm50({\rm stat})\pm45({\rm syst})$
  MeV, the yield $dN/dy = 5.73\pm0.37({\rm stat})\pm0.69({\rm syst})$ per event, and
  the ratio $N_\phi/N_h^-$ is found to be $0.021\pm0.001({\rm stat})\pm0.04({\rm syst})$.
  The measured ratio $N_\phi/N_h^-$ and $T$ for the $\phi$ meson at midrapidity do
  not change for the selected multiplicity bins.
hepdata_doi: 10.17182/hepdata.102317.v1
