description: "(a) The corrected integrated yield $dN/dy$ at mid-rapidity for $\\overline{\\Xi}^{+}$
  , $\\overline{\\Lambda}$ and $\\overline{p}$ divided by $N_{part}$, normalized to
  the most peripheral centrality interval (60 \u2212 80%), plotted as a function of
  $N_{part}$. The gray, black and dashed bands represent the errors on the normalization
  to the most peripheral bin for the $\\overline{\\Xi}^{+}$, $\\overline{\\Lambda}$
  and $\\overline{p}$. Other errors shown are statistical only. (b) $\\gamma_{s}$
  as a function of $N_{part}$ calculated from thermal model fits to the measured particle
  yields ($\\pi$,K,p [24], $\\Lambda$, $\\Xi$, $\\Omega$ and their anti-particles)
  at 200 GeV. Values for $e^{+}+e^{\u2212}$ and $p+\\overline{p}$ collisions at $\\sqrt{s_{NN}}$
