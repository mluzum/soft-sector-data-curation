- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/scaling-properties-hyperon-production-au-au-collisions-sqrt-s-sub-nn-sub-200-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0606014'}
comment: We present the scaling properties of $\Lambda$, $\Xi$, $\Omega$ and their
  anti-particles produced at mid-rapidity in Au+Au collisions at RHIC at $\sqrt{s_{NN}}$
  = 200 GeV. The yield of multi-strange baryons per participant nucleon increases
  from peripheral to central collisions more rapidly than the $\Lambda$ yield, which
  appears to correspond to an increasing strange quark density of matter produced.
  The value of the strange phase space occupancy factor $\gamma_{s}$, obtained from
  a thermal model fit to the data, approaches unity for the most central collisions.
  We also show that the nuclear modification factors, $R_{CP}$, of $\Lambda$ and $\Xi$
  are consistent with each other and with that of protons in the transverse momentum
  range 2.0 < $p_{T}$ < 5.0 GeV/c. This scaling behaviour is consistent with a scenario
  of hadron formation from constituent quark degrees of freedom through quark recombination
  or coalescence.
hepdata_doi: 10.17182/hepdata.98928.v1
