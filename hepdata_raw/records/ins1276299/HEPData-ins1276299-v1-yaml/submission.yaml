comment: |
  CERN-LHC.  Production of charged pions, kaons and (anti-)protons up to pT = 20 GeV at mid-rapidity in pp, peripheral (60-80%) and central (0-5%) Pb-Pb collisions at sqrt(sNN) = 2.76 TeV measured using the ALICE detector at the Large Hadron Collider.

  UPDATE (26 AUG 2014): tables extended to lower pT values corresponding to journal publication.
