data_file: Table1.yaml
description: |
  Invariant yields of identified pions in central and peripheral Pb-Pb collisions, together with the unscaled pp reference yields.
keywords:
- name: reactions
  values: [PB PB --> PI+ X, PB PB --> PI- X, P P --> PI+ X, P P --> PI- X]
- name: observables
  values: [DN/DPT]
- name: phrases
  values: [Inclusive, Single Differential Distribution, Transverse Momentum Dependence,
    Proton-Proton Scattering]
- name: cmenergies
  values: [2760.0]
location: Data from Figure 4 (left)
name: Table 1
