data_file: data_11.yaml
description: Multiplicity dependence of HBT parameters for low-pT (0.125-0.225 GeV/c)
  pi- pi- channel. They are Coulomb corrected (5 fm Gaussian source assumed), corrected
  for merging effects ("bad systematic" for STAR-HBT insiders), and corrected for
  finite-momentum-resolution effects. Systematic errors are estimated by the size
  of the merging correction and the effect of varying source size used in the Coulomb
  correction by +/- 1 fm.
keywords:
- name: reactions
  values: [AU AU]
- name: cmenergies
  values: [130.0]
- name: observables
  values: [HBT correlation]
- name: phrases
  values: [pion, interferometry]
name: Table 1.1
table_doi: 10.17182/hepdata.93264.v1/t1
