- {description: web page with auxiliary material, location: 'http://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-16-004/index.html'}
comment: |
  CERN-LHC. The relative modification of the prompt psi(2S) and J/psi yields from pp to PbPb collisions, at the center of mass energy of 5.02 TeV per nucleon pair, is presented. The analysis is based on pp and PbPb data samples collected by the CMS experiment at the LHC in 2015, corresponding to integrated luminosities of 28.0 inverse picobarns and 464 inverse microbarns, respectively. The double ratio of measured yields of prompt charmonia reconstructed through their decays into muon pairs, (N[psi(2S)]/N[J/psi])[PbPb]/ (N[psi(2S)]/N[J/psi])[pp], is determined as a function of PbPb collision centrality and charmonium transverse momentum pt, in two kinematic intervals: abs(y) < 1.6 covering 6.5 < pt < 30GeV/c and 1.6 < abs(y) < 2.4 covering 3 <pt< 30GeV/c. The centrality-integrated double ratios are 0.36 +/- 0.08 (stat) +/-0.05 (syst) in the first interval and 0.24 +/- 0.22 (stat) +/- 0.09 (syst) in the second. The double ratio is lower than unity in all the measured bins, suggesting that the psi(2S) yield is more suppressed than the J/psi yield in the explored phase space.
hepdata_doi: 10.17182/hepdata.77102.v1
