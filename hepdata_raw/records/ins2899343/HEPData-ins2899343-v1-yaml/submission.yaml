data_file: table_3.yaml
description: The incoherent $\mathrm{J}/\psi$ photoproduction cross section as a function
  of photon-nuclear center-of-mass energy per nucleon $W_{\gamma \mathrm{N}}^{\mathrm{Pb}}$
  or Bjorken $x$, measured in PbPb ultra-peripheral collisions at $\sqrt{s_{\mathrm{NN}}}$
  = 5.02 TeV. The $W_{\gamma \mathrm{N}}^{\mathrm{Pb}}$ values used correspond to
  the center of each rapidity range. The theoretical uncertainties is due to the uncertainties
  in the photon flux.
keywords:
- name: observables
  values: [SIG]
- name: cmenergies
  values: [5020]
- name: reactions
  values: [Pb Pb --> J/psi Pb Pb]
- name: phrases
  values: [J/psi, Photoproduction, Suppression, Nuclear Shadowing, Cross Section]
location: Data from Figure 2
name: Table 3
table_doi: 10.17182/hepdata.156185.v1/t3
---
data_file: table_4.yaml
description: The nuclear suppression factor $S^{\mathrm{J}/\psi}$ of incoherent $\mathrm{J}/\psi$
  meson photoproduction as a function of Bjorken $x$ in PbPb ultra-peripheral collisions
  at $\sqrt{s_{\mathrm{NN}}}$ = 5.02 TeV. The $x$ values are evaluated at the centers
  of their corresponding rapidity ranges. The theoretical uncertainties are due to
  the uncertainties in the photon flux.
keywords:
- name: observables
  values: [S]
- name: cmenergies
  values: [5020]
- name: reactions
  values: [Pb Pb --> J/psi Pb Pb]
- name: phrases
  values: [J/psi, Photoproduction, Suppression, Nuclear Shadowing, Cross Section]
location: Example location
name: Table 4
table_doi: 10.17182/hepdata.156185.v1/t4
