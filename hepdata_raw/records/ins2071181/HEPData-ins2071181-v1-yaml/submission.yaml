data_file: table_0.yaml
description: Production yield of non-prompt $\mathrm{D}_{s}^{\pm}$ candidates average
  for 0-10% Pb--Pb collisions at $\sqrt{s_{\mathrm{NN}}} = 5.02$ TeV.
keywords:
- name: observables
  values: [yield]
- name: reactions
  values: [PbPb --> Ds --> phi pi --> K K pi]
- name: cmenergies
  values: [5200]
location: Data from Figure 4 (blue markers)
name: Table 0
table_doi: 10.17182/hepdata.135986.v1/t1
