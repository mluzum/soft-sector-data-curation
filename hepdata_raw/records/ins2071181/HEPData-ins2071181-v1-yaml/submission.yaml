comment: The production yields of non-prompt  $\mathrm{D}_{s}^{+}$ mesons, namely  $\mathrm{D}_{s}^{+}$
  mesons from beauty-hadron decays, were measured for the first time as a function
  of the transverse momentum ($p_{T}$) at midrapidity ($|y|<0.5$) in central and semi-central
  Pb--Pb collisions at a centre-of-mass energy per nucleon pair $\sqrt{s_{NN}}=5.02~$TeV
  with the ALICE experiment at the LHC.The $\mathrm{D}_{s}^{\pm}$ mesons were reconstructed
  from the hadronic decay channel $\rm D_s^{+}\to \phi\pi^+$, with $\rm \phi\to  K^-K^+$,
  in the $4<p_{T}<36~$GeV/$c$ and $2<p_{T}<24~$GeV/$c$ intervals for the 0--10\% and
  30--50\% centrality classes, respectively.The measured yields of non-prompt  $\mathrm{D}_{s}^{+}$
  mesons are compared to those of prompt $\mathrm{D}_{s}^{+}$ and non-prompt $\mathrm{D}^{0}$
  mesons by calculating the ratios of the production yields in Pb--Pb collisions and
  the nuclear modification factor Raa. The ratio between the Raa of non-prompt  $\mathrm{D}_{s}^{+}$
  and prompt  $\mathrm{D}_{s}^{+}$ mesons, and that between the Raa of non-prompt  $\mathrm{D}_{s}^{+}$
  and non-prompt $\mathrm{D}^{0}$ mesons in central Pb--Pb collisions are found to
  be on average higher than unity in the $4<p_{T}<12~$GeV/$c$ interval with a statistical
  significance of about $1.6\,\sigma$ and $1.7\,\sigma$, respectively. The measured
  Raa ratios are compared with the predictions of theoretical models of heavy-quark
  transport in a hydrodynamically expanding QGP that incorporate hadronisation via
  quark recombination.
