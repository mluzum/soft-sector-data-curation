data_file: fig3.yaml
description: The 1st-order event plane ($\Psi_{1}$) resolution as a function of centrality
  of Au+Au collisions at $\sqrt{s_{NN}}$ = 7.7, 11.5, 14.5, 19.6, 27, and 39 GeV.
  The $\Psi_{1}$ is reconstructed with the BBC detectors and its resolution is estimated
  by the correlation of sub-$\Psi_{1}$ from east BBC and west BBC. Data presented
  later (10-40\% centrality) is indicated by the dashed-line box.
