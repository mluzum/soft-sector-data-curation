data_file: fig5.yaml
description: Directed flow slope at mid-rapidity, $dv_{1}/dy|_{y=0}$, as a function
  of beam energy in 10-40\% Au+Au collisions. Dots represent deuterons. Open squares
  are the published results in~\cite{Adamczyk_2018} for protons. The band denotes
  the results for deuterons from AMPT transport model. Statistical uncertainties (bars)
  and systematic uncertainties (horizontal lines) are shown separately. For visibility,
  the data points are staggered horizontally.
