comment: |
  CERN-LHC.  Measurement of charged particle elliptic flow in Pb-Pb collisions at 2.76 TeV recorded in November 2010 with the ALICE detector at the CERN Large Hadron Collider.  The measurement is performed in the central pseudorapidity region (|eta| < 0.8) and transverse momentum range 0.2 < pT < 5.0 GeV.  The elliptic flow signal v2, measured using the 4-particle correlation method, averaged over transverse momentum and pseudorapidity is 0.087 +/- 0.002 (stat) +/- 0.004 (syst) in the 40-50% centrality class.  The differential elliptic flow v2(pT) reaches a maximum of 0.2 near pT = 3 GeV.
