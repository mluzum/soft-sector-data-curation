  $\\phi$ are from the reaction plane method (full up-triangles) and invariant mass
  method (full circles), where data points from the reaction plane method are shifted
  slightly along the $x$ axis for clarity. Vertical error bars represent statistical
  errors, while the square bands represent systematic uncertainties. The magenta curved
  band represents the $v_{2}$ of $\\phi$ meson from the AMPT model with a string melting
  mechanism [116]. The dash and dot curves represent parametrizations inspired by
  number-of-quark scaling ideas from Ref. [117] for NQ = 2 and NQ = 3, respectively."
