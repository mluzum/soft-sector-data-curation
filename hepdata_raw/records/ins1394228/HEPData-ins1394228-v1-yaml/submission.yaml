additional_resources:
- {description: web page with data points, location: 'https://phenix-intra.sdcc.bnl.gov/phenix/WWW/p/info/ppg/185/'}
- {description: arXiv, location: 'http://arxiv.org/abs/1509.06337'}
- {description: InspireHEP, location: 'https://inspirehep.net/literature/1394228'}
comment: "The PHENIX experiment at the Relativistic Heavy Ion Collider has measured
  $\\phi$ meson production and its nuclear modification in asymmetric Cu+Au heavy-ion
  collisions at $\\sqrt{s_{NN}}$ = 200 GeV at both forward Cu-going direction (1.2
  < $y$ < 2.2) and backward Au-going direction (\u22122.2 < $y$ < \u22121.2), rapidities.
  The measurements are performed via the dimuon decay channel and reported as a function
  of the number of participating nucleons, rapidity, and transverse momentum. In the
  most central events, 0%\u201320% centrality, the $\\phi$ meson yield integrated
  over 1 < $p_T$ < 5 GeV/$c$ prefers a smaller value, which means a larger nuclear
  modification, in the Cu-going direction compared to the Au-going direction. Additionally,
  the nuclear-modification factor in Cu+Au collisions averaged over all centrality
  is measured to be similar to the previous PHENIX result in $d$+Au collisions for
  these rapidities.\n"
hepdata_doi: 10.17182/hepdata.142075.v1
