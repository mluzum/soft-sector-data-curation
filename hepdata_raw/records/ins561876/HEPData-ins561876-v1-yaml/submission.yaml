- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0108022'}
comment: The first measurements of light antinucleus production in Au+Au collisions
  at the Relativistic Heavy-Ion Collider are reported. The observed production rates
  for $\overline{d}$ and $^3\overline{\mathrm{He}}$ are much larger than in lower
  energy nucleus-nucleus collisions. A coalescence model analysis of the yields indicates
  that there is little or no increase in the antinucleon freeze-out volume compared
  to collisions at CERN SPS energy. These analyses also indicate that the $^3\overline{\mathrm{He}}$
  freeze-out volume is smaller than the $\overline{d}$ freeze-out volume.
hepdata_doi: 10.17182/hepdata.102316.v1
