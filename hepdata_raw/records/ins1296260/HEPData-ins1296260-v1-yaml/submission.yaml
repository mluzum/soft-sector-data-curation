additional_resources:
- {description: web page with auxiliary material, location: 'https://twiki.cern.ch/twiki/bin/view/AtlasPublic/HeavyIonsPublicResults'}
comment: |
  CERN-LHC. The integrated elliptic flow of charged particles produced in Pb+Pb collisions at $\sqrt{s_{NN}} = 2.76$ TeV has been measured with the ATLAS detector using data collected at the Large Hadron Collider. The anisotropy parameter, $v_{2}$, was measured in the pseudorapidity range $|\eta| \leq 2.5$ with the event-plane method. In order to include tracks with very low transverse momentum $p_{T}$, thus reducing the uncertainty in $v_{2}$ integrated over $p_{T}$, a 1$\mu b^{-1}$ data sample recorded without a magnetic field in the tracking detectors is used. The centrality dependence of the integrated $v_{2}$ is compared to other measurements obtained with higher $p_{T}$ thresholds. The integrated $v_{2}$ transformed to the rest frame of one of the colliding nuclei is compared to the lower-energy RHIC data.
  For more details see the paper.
