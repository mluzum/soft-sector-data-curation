description: Panels (ab), $D^0$ $R_{\rm AA}$ for peripheral 40$-$80% and semi a central
  10$-$40% collisions; Panel (c), $D^0$ $R_{\rm AA}$ for 0$-$10% most central events
  (blue circles) compared with model calculations from the TAMU (solid curve), SUBATECH
  (dashed curve), Torino (dot-dashed curve), Duke (long-dashed and long-dot-dashed
  curves), and LANL groups (filled band). The open symbol indicates the result with
  the extrapolated p+p reference. The vertical lines and brackets around the data
  points denote the statistical and systematic uncertainties respectively. The vertical
  bars around unity denote the overall normalization uncertainties in the Au+Au and
  p+p data, respectively. The $R_{\rm AA}$ probability distribution for the 0$-$0.7
  GeV/$c$ data point is largely skewed. The uncertainty we report is the 68.3% probability
  range with respect to the measured central value assuming Gaussian distribution.
