{comment: 'The measurement of the azimuthal-correlation function of prompt D mesons
    with charged particles in pp collisions at $\sqrt{s}=5.02$ TeV and p-Pb collisions
    at $\sqrt{s_{\rm NN}}=5.02$ TeV with the ALICE detector at the LHC is reported.
    The D$^0$, D$^+$, and D$^{*+}$  mesons, together with their charge conjugates,
    were reconstructed at midrapidity in the transverse momentum interval $3 < p_{\rm
    T} < 24$ GeV/c and correlated with charged particles having $p_{\rm T} > 0.3$
    GeV/c and pseudorapidity $|\eta| < 0.8$. The properties of the correlation peaks
    appearing in the near- and away-side regions (for $\Delta\varphi \approx 0$ and
    $\Delta\varphi \approx \pi$, respectively) were extracted via a fit to the azimuthal
    correlation functions. The shape of the correlation functions and the near- and
    away-side peak features are found to be consistent in pp and p-Pb collisions,
    showing no modifications due to nuclear effects within uncertainties. The results
    are compared with predictions from Monte Carlo simulations performed with the
    PYTHIA, POWHEG+PYTHIA, HERWIG, and EPOS 3 event generators.', hepdata_doi: 10.17182/hepdata.95121.v1}
---
data_file: data1.yaml
description: Comparison of the azimuthal-correlation distributions of D mesons (average
  of D$^{0}$, D$^{+}$, D$^{*+}$) with $3 < p_{\rm T} < 5$ GeV/$c$ and charged particles
  with $p_{\rm T} > 0.3$ GeV/$c$, in pp collisions at $\sqrt{s} = 5.02$ TeV and p-Pb
  collisions at $\sqrt{s_{NN}} = 5.02$ TeV, after baseline subtraction. Rapidity range
  for the D mesons are $|y^{\rm D}_{\rm cms}| < 0.5$ in pp, $-0.96 < y^{\rm D}_{\rm
  cms} < 0.04$ in p-Pb. Correlations are integrated for $|\Delta\eta|=|\eta_{\rm ch}-\eta_{\rm
  D}| < 1$. The azimuthal-correlation distributions are reported in the range $0 <
  \Delta\varphi < \pi$.
