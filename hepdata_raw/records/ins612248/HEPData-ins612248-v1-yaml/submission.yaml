  mixed events from central and peripheral Au+Au collisions, and b) HIJING events
  filtered with GEANT [16] and shuffled pseudorapidity events from central and peripheral
  Au+Au collisions. To guide the eye, Gaussian fits excluding the lowest bin in \u2206\u03B7
  are shown. The error bars shown are statistical. The balance function for HIJING
  events is independent of centrality."
