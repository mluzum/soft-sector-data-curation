- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/narrowing-balance-function-centrality-au-au-collisions-sqrt-s-sub-nn-sub-130-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0301014'}
comment: The balance function is a new observable based on the principle that charge
  is locally conserved when particles are pair produced. Balance functions have been
  measured for charged particle pairs and identified charged pion pairs in Au+Au collisions
  at $\sqrt{s_{NN}}$ = 130 GeV at the Relativistic Heavy Ion Collider using STAR.
  Balance functions for peripheral collisions have widths consistent with model predictions
  based on a superposition of nucleon-nucleon scattering. Widths in central collisions
  are smaller, consistent with trends predicted by models incorporating late hadronization.
hepdata_doi: 10.17182/hepdata.98620.v1
