description: Mid-rapidity (|y| < 0.1) identified particle spectra in d+Au collisions
  at 200 GeV. The p and pbar spectra are inclusive, including weak decay products.
  Spectra are plotted for three centrality bins and for minimum bias events. Spectra
  from top to bottom are for 0-20% scaled by 4, 20-40% scaled by 2, minimum bias not
  scaled, and 40-100% scaled by 1/2. Errors plotted are statistical and point-to-point
  systematic errors added in quadrature, but are smaller than the point size. The
  curves are the blast-wave model fits to the minimum bias data; the normalizations
  of the curves are fixed by the corresponding negative particle spectra.
