additional_resources:
- {description: webpage with auxiliary material, location: 'https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2020-09'}
comment: CERN-LHC. The azimuthal variation of jet yields in heavy-ion collisions provides
  information about the path-length dependence of the energy loss experienced by partons
  passing through the hot, dense nuclear matter known as the quark-gluon plasma. This
  paper presents the azimuthal anisotropy coefficients, $v_2$, $v_3$, and $v_4$, for
  jets in Pb+Pb collisions at $\sqrt{s_\mathrm{NN}} = 5.02$ TeV using the ATLAS detector
  at the LHC. The measurement uses data collected in 2015 and 2018, corresponding
  to an integrated luminosity of 2.2 nb$^{-1}$. The $v_n$ values are measured as a
  function of the transverse momentum of the jets between 71 and 398 GeV and the event
  centrality. A non-zero value of $v_2$ is measured in all but the most central collisions.
  The value of $v_2$ is largest for jets with lower transverse momentum, with values
  up to 0.05 in mid-central collisions. A smaller, non-zero value of $v_3$ of approximately
  0.01 is measured with no significant dependence on jet $p_\mathrm{T}$ or centrality,
  suggesting that fluctuations in the initial state play a small but distinct role
  in jet energy loss. No significant $v_4$ is observed in any kinematic region.
hepdata_doi: 10.17182/hepdata.132663.v1
