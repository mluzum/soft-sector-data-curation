additional_resources:
- {description: web page with auxiliary material, location: 'https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2016-05/'}
comment: |
  CERN-LHC.  Measurement of the total fiducial cross section for light-by-light scattering in lead-lead collisions at a centre-of-mass energy of 5.02 TeV with 0.48 nb^-1 of data collected in 2015.  The final states used are 2 photons and no further activity in the detector.

  The fiducial region is defined as:
  - 2Gamma
  - pt_Gamma > 3 GeV
  - |eta_Gamma| < 2.4
  - m_GammaGamma must be above 6 GeV
  - pt_GammaGamma must be below 2 GeV
  - aco_GammaGamma must be below 0.01
hepdata_doi: 10.17182/hepdata.77761.v1
