  - {name: SQRT(S)/NUCLEON, units: GeV, value: 5020}
  - {name: PT, units: GeV, value: 6-35}
  - {name: ABS(RAP), value: 1.3-2.3 if (PT<11 GeV) else 0-2.3}
  - {name: bin-to-bin correlation factor, value: 0.57}
