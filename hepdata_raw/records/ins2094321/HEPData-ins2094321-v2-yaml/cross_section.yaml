dependent_variables:
- header: {name: Fiducial $\gamma\gamma\to\tau\tau$ cross section, units: $\mu$b}
  qualifiers:
  - {name: SQRT(S)/NUCLEON, units: GeV, value: 5020}
  - {name: RE, value: PB PB  (GAMMA GAMMA)  --> PB PB TAU+TAU-}
  - {name: Luminosity used for the measurement, units: '$\mu$b$^{-1}$', value: 404}
  - {name: Fiducial region for muons, value: '$p_{T}$ > 3.5 GeV for $|\eta|$ < 1.2;
      $p_{T}$ > 2.5 GeV for 1.2 < $|\eta|$ < 2.4'}
  - {name: Fiducial region for charged pions, value: '$p_{T}$ > 0.5 GeV for the leading;
      $p_{T}$ > 0.3 GeV for the (sub-)subleading'}
  - {name: 'Fiducial region for $\tau_{3prong}$', value: '$p_{T}^\mathrm{vis}$ > 2
      GeV and $m_\tau^\mathrm{vis}$ < 1.5'}
  values:
  - errors:
    - {label: stat, symerror: 0.6}
    - {label: syst, symerror: 0.5}
    value: 4.8
independent_variables: []
