comment: |
  RHIC-STAR. Azimuthal anisotropy of produced particles is one of the most important observables used to access the collective properties of the expanding medium created in relativistic heavy-ion collisions. In this paper, we present second ($v_{2}$) and third ($v_{3}$) order azimuthal anisotropies of $K_{S}^{0}$, $\phi$, $\Lambda$, $\Xi$ and $\Omega$ at mid-rapidity ($|y|<$1) in Au+Au collisions at $\sqrt{s_{\text{NN}}}$ = 54.4 GeV measured by the STAR detector.
  The $v_{2}$ and $v_{3}$  are measured as a function of transverse momentum and centrality. Their energy dependence is also studied. $v_{3}$ is found to be more sensitive to the change in the center-of-mass energy than $v_{2}$. Scaling by constituent quark number is found to hold  for $v_{2}$ within 10\%. This observation could be evidence for the development of partonic collectivity in 54.4 GeV Au+Au collisions. Differences in $v_{2}$ and $v_{3}$ between baryons and anti-baryons are presented, and ratios of $v_{3}$/$v_{2}^{3/2}$ are studied and motivated by hydrodynamical calculations. The ratio of $v_{2}$ of $\phi$ mesons to that of anti-protons ($v_{2}(\phi)/v_{2}(\bar{p})$) shows centrality dependence at low transverse momentum, presumably resulting from the larger effects from hadronic interactions on anti-proton $v_{2}$.
hepdata_doi: 10.17182/hepdata.130768.v1
