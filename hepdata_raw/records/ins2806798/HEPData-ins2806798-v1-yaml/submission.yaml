additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/2407.08586'}
- {description: InspireHEP, location: 'https://inspirehep.net/literature/2806798'}
comment: "The PHENIX experiment measured the centrality dependence of two-pion Bose-Einstein
  correlation functions in $\\sqrt{s_{NN}}$=200~GeV Au+Au collisions at the Relativistic
  Heavy Ion Collider at Brookhaven National Laboratory. The data are well represented
  by L\xE9vy-stable source distributions. The extracted source parameters are the
  correlation-strength parameter $\\lambda$, the L\xE9vy index of stability $\\alpha$,
  and the L\xE9vy-scale parameter $R$ as a function of transverse mass $m_T$\u200B
  and centrality. The $\\lambda(m_T)$ parameter is constant at larger values of $m_T$\u200B,
  but decreases as $m_T$\u200B decreases. The L\xE9vy scale parameter $R(m_T\u200B)$
  decreases with $m_T$\u200B and exhibits proportionality to the length scale of the
  nuclear overlap region. The L\xE9vy exponent $\\alpha(m_T)$ is independent of $m_T$
  within uncertainties in each investigated centrality bin, but shows a clear centrality
  dependence. At all centralities, the L\xE9vy exponent $\\alpha$ is significantly
  different from that of Gaussian ($\\alpha=2$) or Cauchy ($\\alpha=1$) source distributions.
  Comparisons to the predictions of Monte-Carlo simulations of resonance-decay chains
  show that in all but the most peripheral centrality class (50\\%-60\\%), the obtained
  results are inconsistent with the measurements, unless a significant reduction of
  the in-medium mass of the $\\eta'$ meson is included. In each centrality class,
  the best value of the in-medium $\\eta'$ mass is compared to the mass of the $\\eta$
  meson, as well as to several theoretical predictions that consider restoration of
  $U_A\u200B(1)$ symmetry in hot hadronic matter.\n"
hepdata_doi: 10.17182/hepdata.158642.v1
