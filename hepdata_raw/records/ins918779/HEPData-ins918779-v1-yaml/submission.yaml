description: Ratio of particle yields in central Cu+Cu and midcentral Au+Au collisions
  when $\langle N_{part} \rangle = 99$ in each case for $|y| < 0.5$. $\pi$ yields
  are from elsewhere [17]. Boxed uncertainties are from the Glauber calculations and
  are correlated for every particle. $\langle N_{part>1} \rangle$ refers to the parameterization
  shown by eq. 1, while the EPOS and AMPT models are described in the text. The default
  settings are used for each model. The vertical lines show the remaining independent
  statistical and systematic uncertainties.
