data_file: Table1.yaml
description: |
  Distributions of $C(\Delta\varphi)$ for h$-$h, K$^{0}_\mathrm{S}$-h,and ($\Lambda+\overline{\Lambda})-$h as trigger particles with $8 < p_\mathrm{T,trig}<16 \mathrm{GeV}/c$ and associated particles with $4 < p_\mathrm{T,assoc}<6$ GeV/$c$ in $0-10\%$ central Pb$-$Pb and pp collisions. The background has been subtracted based on the estimation of ZYAM in pp collisions and the additional contributions of the anisotropic flow harmonics $v_{2}$ and $v_{3}$ in Pb$-$Pb collisions.
