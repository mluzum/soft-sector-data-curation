comment: The azimuthal anisotropy of $\mathrm{\Upsilon(1S)}$ mesons in high-multiplicity
  pPb collisions is studied using data collected by the CMS experiment at a nucleon-nucleon
  center-of-mass energy of 8.16 TeV. The $\mathrm{\Upsilon(1S)}$ mesons are reconstructed
  using the dimuon decay channel. The anisotropy, characterized by the second Fourier
  harmonic coefficient $v_2^{\mathrm{sub}}$, is determined using the two-particle
  correlation technique, in which the $\mathrm{\Upsilon(1S)}$ mesons are correlated
  with charged hadrons. A large psuedorapidity gap is used to suppress short-range
  correlations. The $v_2^{\mathrm{sub}}$ values are measured in four transverse momentum
  intervals in the range from 0 - 30 GeV/c. No azimuthal anisotropy is observed for
  the $\mathrm{\Upsilon(1S)}$ mesons in high-multiplicity pPb collisions, which is
  consistent with previous PbPb collision results. The results suggest that any collectivity
  on bottomonia is smaller than that of charmonia in pPb collisions.
