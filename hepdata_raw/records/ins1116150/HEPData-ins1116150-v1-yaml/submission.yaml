comment: |
  CERN-LHC.  The elliptic, v2, triangular, v3, and quadrangular, v4, azimuthal anisotropic flow coefficients are measured for unidentified charged particles, pions and (anti-)protons in Pb-Pb collisions at sqrt(sNN) = 2.76 TeV recorded in 2010 with the ALICE detector at the Large Hadron Collider.  Results obtained with the event plane and four-particle cumulant methods are reported for the pseudo-rapidity range |eta| < 0.8 at different collision centralities and as a function of transverse momentum, pT, out to pT = 20 GeV.  The observed non-zero elliptic and triangular flow depends only weakly on transverse momentum for pT > 8 GeV.  The small pT dependence of the difference between elliptic flow results obtained from the event plane and four-particle cumulant methods suggests a common origin of flow fluctuations up to pT = 8 GeV.  The magnitude of the (anti-)proton elliptic and triangular flow is larger than that of pions out to at least pT = 8 GeV indicating that the particle type dependence persists out to high pT.
  Update Note (07/09/2015): Additional tables from ALICE-PUBLIC-2015-003 (http://cds.cern.ch/record/2045885) were added.
