additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/fluctuations-charge-separation-perpendicular-event-plane-and-local-parity-violation-radicssubnnsub200-gev-auau-coll'}
- {description: arXiv, location: 'https://arxiv.org/abs/1302.3802'}
comment: Previous experimental results based on data (~ 15 million events) collected
  by the STAR detector at RHIC suggest event-by-event charge separation fluctuations
  perpendicular to the event plane in non-central heavy-ion collisions. Here we present
  the correlator previously used split into its two component parts to reveal correlations
  parallel and perpendicular to the event plane. The results are from a high statistics
  200 GeV Au+Au collisions data set (57 million events) collected by the STAR experiment.
  We explicitly count units of charge separation from which we find clear evidence
  for more charge separation fluctuations perpendicular than parallel to the event
  plane. We also employ a modified correlator to study the possible P-even background
  in same and opposite charge correlations, and find that the P-even background may
  largely be explained by momentum conservation and collective motion.
hepdata_doi: 10.17182/hepdata.98967.v1
