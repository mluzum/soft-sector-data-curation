data_file: ppg058f2.yaml
description: Conditional yields (CY) shown as a function of trigger particle pseudorapitidy
  for trigger particle $p_T$ from 2.5 to 4.0 and associated particle $p_T$ from 1.0
  to 2.5 GeV/$c$. The additional $\pm$0.037 systematic error on the mid-rapidity $p+p$
  point is from jet yield extraction. There is a 1% point-by-point systematical error
  on all points except central arm triggers. There is also a 10% systematic error
  for all data points due to the determination of associated particle efficiency.
  For $p + p$ point, forward and backward trigger are combined, so the results are
  identical.
