additional_resources:
- {description: 'Exclusive four pion photoproduction in ultraperipheral Pb\textendash
    Pb collisions at $\mathbf{\sqrt{\textit{s}_{\textup{NN}}} = 5.02}$\;TeV', location: 'https://alice-publications.web.cern.ch/node/9525'}
comment: The intense photon fluxes from relativistic nuclei provide an opportunity
  to study photonuclear interactions in ultraperipheral collisions. The measurement
  of coherently photoproduced \fourpi~final states in ultraperipheral $\rm{Pb\textendash
  Pb}$ collisions at \fivenn~is presented for the first time. The cross section, d$\sigma$/d$y$,
  times the branching ratio ($\rho\rightarrow \pi^+ \pi^+ \pi^- \pi^-$) is found to
  be $47.8\pm2.3~\rm{\rm{(stat.)}}\pm7.7~\rm{\rm{(syst.)}}$~mb in the rapidity interval
  $|y| < 0.5$. The invariant mass distribution is best described by the fit assuming
  two excited resonances, $\rho(1450)$ and $\rho(1700)$, and the interference term
  between them. The values of the masses ($m$) and widths ($\Gamma$) of the resonances
  extracted from the fit are $m_{1}=1385\pm14~\rm{(stat.)}\pm3~\rm{(syst.)}$~\MeVmass,
  $\Gamma_{1}=431\pm36~\rm{(stat.)}\pm82~\rm{(syst.)}$~\MeVmass, $m_{2}=1663\pm13~\rm{(stat.)}\pm22~\rm{(syst.)}$~\MeVmass~and
  $\Gamma_{2}=357~\pm31~\rm{(stat.)}\pm49~\rm{(syst.)}$ \MeVmass, respectively. The
  measured cross sections times the branching ratios are compared to recent theoretical
  predictions.
