comment: |
  First measurements of Ds meson elliptic flow (v2) and triangular flow (v3) in PbPb collisions at 5.02 TeV in CMS.
  Results include v2 results in three centrality intervals (0-10%, 10-30%, 30-50%), and v3 in centrality interval 10-30%, both as a function pf pT .
  Tables contain central values and associated statistical and systematic uncertainties for each pT bin.
hepdata_doi: 10.17182/hepdata.158600.v1
---
data_file: v2.yaml
description: Ds meson v2 in PbPb collisions at 5.02 TeV as a function of pT in different
  centralities.
keywords:
- name: reactions
  values: [Pb Pb --> Ds X]
- name: observables
  values: [v2]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [elliptic flow, centrality dependence, transverse momentum dependence]
location: v2.yaml
name: Table 1
table_doi: 10.17182/hepdata.158600.v1/t1
