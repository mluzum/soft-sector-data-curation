additional_resources:
- {description: Webpage with all figures and tables, location: 'https://drupal.star.bnl.gov/STAR/publications/azimuthal-charged-particle-correlations-and-possible-local-strong-parity-violation'}
- {description: arXiv, location: 'https://arxiv.org/abs/0909.1739'}
comment: "Parity-odd domains, corresponding to non-trivial topological solutions of
  the QCD vacuum, might be created during relativistic heavy-ion collisions. These
  domains are predicted to lead to charge separation of quarks along the system\u2019s
  orbital momentum axis. We investigate a three particle azimuthal correlator which
  is a $\\mathcal{P}$ even observable, but directly sensitive to the charge separation
  effect. We report measurements of charged hadrons near center-of-mass rapidity with
  this observable in Au+Au and Cu+Cu collisions at $\\sqrt{s_{NN}}$ = 200 GeV using
  the STAR detector. A signal consistent with several expectations from the theory
  is detected. We discuss possible contributions from other effects that are not related
  to parity violation."
hepdata_doi: 10.17182/hepdata.98578.v1
