comment: |
  CERN-LHC. Measurements of distributions of number densities, summed transverse momenta and azimuthal  correlations in Underlying Event data from proton-proton collisions at centre-of mass energies of 0.9 and 7 TeV.  The charged particle distributions are presented with various thresholds on both track and leading track PT and in different azimuthal regions relative to the leading PT particle. The data sample comprises 6 million events recorded in May 2010 at 0.9 TeV with low luminsoity  (10**26 cm-2s-1)and 25 million events collected in April 2010 at 7 TeV with ten times higher luminosity.
dateupdated: 19/06/2012 00:00:00
hepdata_doi: 10.17182/hepdata.58863.v1
modifications:
- {action: Encoded, date: 19 Jun 2012, who: Mike Whalley}
record_ids:
- {id: 1080735, type: inspire}
- {id: 4998, type: red}
