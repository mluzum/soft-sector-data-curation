data_file: Table1.yaml
description: |
  Number density as a function of the leading charged-particle PT   at a centre-mass-energy of 900 GeV for events having charged-particle  PT > 0.15 GeV.  The data is  shown for the three azimuthal regions.
keywords:
- name: reactions
  values: [P P --> CHARGED X]
- name: observables
  values: [DN/DPT]
- name: phrases
  values: [Inclusive, Single Differential Distribution, Transverse Momentum Dependence,
    Proton-Proton Scattering]
- name: cmenergies
  values: [900.0]
location: Data from F 4
name: Table 1
table_doi: 10.17182/hepdata.58863.v1/t1
