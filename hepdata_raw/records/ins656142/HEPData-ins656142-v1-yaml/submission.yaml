additional_resources:
- {description: web page with data points, location: 'https://phenix-intra.sdcc.bnl.gov/WWW/p/info/ppg/033/'}
- {description: arXiv, location: 'http://arxiv.org/abs/nucl-ex/0408007'}
- {description: InspireHEP, location: 'https://inspirehep.net/literature/656142'}
comment: "Two particle correlations between identified meson and baryon trigger particles
  with 2.5 < $p_T$ < 4.0 GeV/$c$ and lower $p_T$ charged hadrons have been measured
  at midrapidity by the PHENIX experiment at RHIC in $p$+$p$, $d$+Au and Au+Au collisions
  at $\\sqrt{s_{NN}}$ = 200 GeV. In noncentral Au+Au collisions, the probability of
  finding a hadron near in azimuthal angle to the trigger particles is almost identical
  for mesons and baryons and significantly higher than in $p$+$p$ collisions. The
  associated yields for trigger baryons decrease in the most central collisions, consistent
  with some baryon production by thermal recombination in addition to hard scattering.
  \n"
hepdata_doi: 10.17182/hepdata.142148.v1
