additional_resources:
- {description: webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/azimuthally-sensitive-hbt-au-au-collisions-sqrt-s-sub-nn-sub-200-gev'}
- {description: arXiv, location: 'http://arxiv.org/abs/nucl-ex/0312009'}
comment: "We present the results of a systematic study of the shape of the pion distribution
  in coordinate space at freeze-out in Au+Au collisions at BNL RHIC using two-pion
  Hanbury Brown\u2013Twiss (HBT) interferometry. Oscillations of the extracted HBT
  radii versus emission angle indicate sources elongated perpendicular to the reaction
  plane. The results indicate that the pressure and expansion time of the collision
  system are not sufficient to completely quench its initial shape.\n"
hepdata_doi: 10.17182/hepdata.97122.v1
