data_file: Table1.yaml
description: |
  Inclusive Jpsi Nuclear Modification Factor (Raa) measured in Lead-Lead collisions at sqrt(sNN) = 2.76 TeV in 2.5 < y < 4 and  0 < pt < 8 GeV/c,  as a function of the average number of participating nucleons (<Npart>).
  Data have been collected in 2011 and the integrated luminosity is ~ 70 inverse microbarn.
