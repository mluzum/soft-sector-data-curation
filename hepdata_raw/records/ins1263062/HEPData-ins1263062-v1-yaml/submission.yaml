comment: |
  CERN-LHC.  Measurements of the inclusive J/PSI nuclear modification factor (RAA) in Lead-Lead collisions during 2010 and 2011 at a centre-of-mass energy of 2.76 TeV per nucleon-nucleon collision.  Results as a function of centrality are presented at mid-rapidity (|y| < 0.8) in the E+ E- decay mode, and as a function of centrality, transverse momentum and rapidity in the MU+ MU- decay mode at forward-rapidity (2.5 < y < 4).
dateupdated: 21/05/2014 15:23:09
hepdata_doi: 10.17182/hepdata.63191.v1
