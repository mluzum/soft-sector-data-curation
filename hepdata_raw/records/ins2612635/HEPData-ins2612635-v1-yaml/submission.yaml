additional_resources:
- {description: web page with auxiliary material, location: 'https://alice-publications.web.cern.ch/node/6749'}
- {description: Archive of full likelihoods in the HistFactory JSON format, location: 'https://alice-publications.web.cern.ch/node/6749'}
comment: |
  Transverse momentum spectra of protons, deuterons, and 3He nuclei, measured in p--Pb collisions at centre-of-mass per nucleon-nucleon energy of 8.16 TeV, are shown in Fig. 1. The coalescence parameters B2 and B3 as a function of the transverse momentum per nucleon are reported in Fig. 2. The coalescence parameter B2 as a function of the average charged particle multiplicity density is shown in Fig. 3. The ratios of the integrated yields of deuterons to protons and 3He to protons are shown in Fig. 4 as a function of the average charged particle multiplicity density.
hepdata_doi: 10.17182/hepdata.138567.v1
---
data_file: HEPData_Spectra_proton0to5.yaml
description: Transverse momentum spectra of protons measured in pPb collisions at
  centre-of-mass per nucleon-nucleon energy of 8d16 TeV, as shown in Fig. 1 (left
  panel). Centrality class 0 to 5 percent.
keywords:
- name: reactions
  values: [P PB --> p X]
- name: observables
  values: [PT]
- name: cmenergies
  values: [8160.0]
- name: phrases
  values: [protons, transverse momentum, spectra]
name: Table 1 - Proton PT spectrum centrality 0 to 5
table_doi: 10.17182/hepdata.138567.v1/t1
