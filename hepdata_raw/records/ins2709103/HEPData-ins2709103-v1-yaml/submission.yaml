additional_resources:
- {description: Created with hepdata_lib 0.13.0, location: 'https://zenodo.org/record/4946277'}
comment: Measurements of charged-particle production in pp, p-Pb, and Pb-Pb collisions
  in the toward, away, and transverse regions with the ALICE detector are discussed.
  These regions are defined event-by-event relative to the azimuthal direction of
  the charged trigger particle, which is the reconstructed particle with the largest
  transverse momentum ($p_\mathrm{T}^\mathrm{trig}$) in the range $8 < p_\mathrm{T}^\mathrm{trig}
  < 15~\mathrm{GeV}/c$. The toward and away regions contain the primary and recoil
  jets, respectively; both regions are accompanied by the underlying event (UE). In
  contrast, the transverse region perpendicular to the direction of the trigger particle
  is dominated by the so-called UE dynamics, and includes also contributions from
  initial- and final-state radiation. The relative transverse activity classifier,
  $R_\mathrm{T}=N_\mathrm{ch}^\mathrm{T}/\langle N_\mathrm{ch}^\mathrm{T}\rangle$,
  is used to group events according to their UE activity, where $N_\mathrm{ch}^\mathrm{T}$
  is the charged-particle multiplicity per event in the transverse region and $\langle
  N_\mathrm{ch}^\mathrm{T}\rangle$ is the mean value over the whole analysed sample.  The
  energy dependence of the $R_\mathrm{T}$ distributions in pp collisions at $\sqrt{s}=2.76,
  5.02, 7$, and $13~\mathrm{TeV}$ is reported, exploring the Koba-Nielsen-Olesen (KNO)
  scaling properties of the multiplicity distributions. The first measurements of
  charged-particle $p_\mathrm{T}$ spectra as a function of $R_\mathrm{T}$ in the three
  azimuthal regions in pp, p-Pb, and Pb-Pb collisions at $\sqrt{s_\mathrm{NN}}=5.02~\mathrm{TeV}$
  are also reported. Data are compared with predictions obtained from the event generators
  $\mathrm{PYTHIA}~8$ and $\mathrm{EPOS}~\mathrm{LHC}$. This set of measurements is
  expected to contribute to the understanding of the origin of collective-like effects
  in small collision systems (pp and p-Pb).
