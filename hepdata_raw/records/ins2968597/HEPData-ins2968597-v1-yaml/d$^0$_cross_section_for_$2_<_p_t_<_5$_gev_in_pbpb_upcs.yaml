dependent_variables:
- header: {name: 'd$^{2}\sigma$/dydp$_{\mathrm{T}}$ (mb/GeV)'}
  qualifiers:
  - {name: PT, value: 2 -- 5 GeV}
  - {name: SQRT(S)/NUCLEON, value: 5360 GeV}
  - {name: RE, value: PB PB --> D0 <pi+ K-> + PB + X}
  - {name: Y, value: -1.0 -- 1.0}
  values:
  - errors:
    - {label: Stat., symerror: '0.15'}
    - {label: Syst., symerror: '0.58'}
    value: '2.15'
independent_variables:
- header: {name: $y$}
  values:
  - {high: 1.0, low: -1.0}
