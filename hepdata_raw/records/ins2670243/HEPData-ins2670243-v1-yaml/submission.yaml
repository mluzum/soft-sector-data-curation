additional_resources: []
comment: Two-particle Bose-Einstein momentum correlation functions for charged-hadron
  pairs in lead-lead collisions at a center-of-mass energy per nucleon pair of $\sqrt{s_{_{\mathrm{NN}}}}
  = 5.02$ TeV are studied. The data sample, containing $4.27\times 10^{9}$ events
  corresponding to an integrated luminosity of 0.607 $\mathrm{nb}^{-1}$, was collected
  by the CMS experiment in 2018. The experimental results are discussed in terms of
  a Levy-type source distribution. The parameters of this distribution are extracted
  as functions  of particle pair average transverse mass and collision centrality.
  These parameters include the correlation strength parameter, the Levy index or shape
  parameter ($\alpha$), and the Levy scale parameter ($R$). The source shape, characterized
  by $\alpha$, is found to be neither Cauchy nor Gaussian, implying the need for a
  full Levy analysis. Similarly to what was previously found for systems characterized
  by Gaussian source radii, a hydrodynamical scaling is also observed for the Levy
  $R$ parameter.
hepdata_doi: 10.17182/hepdata.134676.v1
