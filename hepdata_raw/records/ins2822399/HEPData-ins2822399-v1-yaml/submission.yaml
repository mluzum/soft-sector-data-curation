data_file: figure_2.yaml
description: "Baryon transport in \u03B3+Au interactions. Proton, antiproton, and
  net-proton rapidity\ndensities (dN/dy) in \u03B3+Au events selected from Au+Au collisions
  at \u221AsNN = 54.4 GeV. The\nselection requires remnants of a single neutron (1n)
  in the \u03B3-going direction (negative y) and\nmore than one neutron (Xn) in the
  Au-going direction (positive y). Fit results with an expo-\nnential function to
  antiproton and net-proton distributions are shown as solid curves. The 6%\nglobal
  uncertainty is a correlated systematic uncertainty applied to all data points."
