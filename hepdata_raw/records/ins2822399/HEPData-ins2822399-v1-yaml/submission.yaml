  all decay contribu-\ntions, within |y| < 0.5 in Ru+Ru (left two columns) and Zr+Zr
  (right two columns) collisions at\n\u221AsNN = 200 GeV. From top to the bottom,
  the particles being plotted are pions, kaons, protons\nand deuterons, respectively.
  The x-axis, pT/A, is the transverse momentum per nucleon. For\nsimplicity, A = 1
  for pions and kaons even though they are not nucleons. For both the Zr and\nRu cases,
  the left column shows positively charged particles, and the right shows negatively\ncharged
  particles. The vertical error bar size represents the statistical uncertainty while
  the\nbox height represents the systematic uncertainty. The dashed curves show the
  fitted Blast-wave\nfunction (38)."
