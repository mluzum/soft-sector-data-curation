additional_resources:
- {description: Created with hepdata_lib 0.16.0, location: 'https://doi.org/10.5281/zenodo.1217998'}
- {description: arXiv, location: 'https://arxiv.org/abs/2408.15441'}
comment: Baryon quantum number is found to be conserved since baryogenesis in the
  early Universe. Conventionally, each fractionally charged valence quark is understood
  to carry one-third of a baryon number. An alternative hypothesis posits that baryon
  number is instead carried by a baryon junction -- a non-perturbative, Y-shaped gluonic
  configuration.Neither scenario has been verified experimentally. The STAR Collaboration
  reports measurements at mid-rapidity of baryon number ($\boldsymbol{B}$) over the
  electric charge number difference ($\boldsymbol{\Delta Q}$) in isobar nuclear collisions,
  and the net-proton yield along rapidity in photonuclear collisions. A larger $\boldsymbol{B/\Delta
  Q}$ ratio and less asymmetric net-proton yield are observed than predicted from
  models assigning baryon number to valence quarks. These findings, corroborated by
  previous measurements  in Au+Au collisions, disfavor the valence quark picture.
