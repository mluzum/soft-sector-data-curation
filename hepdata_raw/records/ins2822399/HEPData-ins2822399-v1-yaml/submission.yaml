data_file: figure_3.yaml
description: "Rapidity slope of baryon transport. The exponential slopes of the net-proton
  dN/dy\nvs. \u2206y in different centrality intervals of Au+Au collisions (16, 20,
  22) and p+p collisions (31).\nThey are compared to those from \u03B3+Au events and
  various predictions. Vertical bars around\nexperimental data points represent combined
  statistical and systematic uncertainties. The two\npoints from Regge theory are
  connected by a gray band to show the range of \u03B1B values, with\nthe lower bound
  given by J + P and upper bound by J + J."
