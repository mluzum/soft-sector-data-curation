data_file: figure_4.yaml
description: "Baryon to charge transport ratio. The ratio of the mean net-baryon number\n(\u27E8B\u27E9)
  to the net-charge difference between Ru+Ru and Zr+Zr collisions (\u2206Q) at mid-rapidity\n(|y|
  < 0.5), scaled by \u2206Z/A = 4/96, as a function of centrality. Red stars denote
  data points;\nsurrounding boxes and vertical bars indicate systematic and statistical
  uncertainties, respec-\ntively. Uncertainties arising from estimations of feed-down
  contributions to neutrons and an-\ntineutrons are shown separately as brackets.
  The horizontal dashed line at 1 shows the naive\nexpectation if the baryon number
  is carried by valence quarks and all other effects are ignored.\nModel calculations
  from UrQMD (hatched band) (32, 33, 39), TRENTO (solid band) (40),\nPYTHIA 8.3 (diamond)
  (28), PYTHIA 8.3 with CR Mode 2 (triangle), and HERWIG 7.2 (cir-\ncle) (34) are
  also shown for comparison. See text for details."
keywords: []
location: Data from Figure 4
name: Figure 4
