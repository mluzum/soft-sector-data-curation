description: "Comparison between data and UrQMD. Distributions of net-charge difference\n(left)
  and average net-baryon yield (right), scaled by \u27E8Npart\u27E9, between Ru+Ru
  and Zr+Zr colli-\nsions at \u221AsNN = 200 GeV as a function of centrality. Red
  circles represent data with the boxes\n(vertical bars) around them representing
  systematic (statistical) uncertainties. Uncertainties due\nto feed-down correction
  for net-baryon yields are shown separately as brackets. UrQMD cal-\nculations (39)
  are shown as hatched bands for comparison. In the right panel, the hatched band\ncollapses
  to a curve due to very small statistical uncertainties."
keywords: []
location: Data from Figure S5 (left)
name: Figure S5 (left)
table_doi: 10.17182/hepdata.154708.v1/t25
