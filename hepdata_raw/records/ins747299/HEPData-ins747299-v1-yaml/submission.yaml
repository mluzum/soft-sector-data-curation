additional_resources:
- {description: webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/energy-dependence-pi-p-and-pbar-transverse-momentum-spectra-au-au-collisions-sqrt-s-nn-62-4-and-200-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0703040'}
comment: "We study the energy dependence of the transverse momentum (pT) spectra for
  charged pions, protons and anti-protons for Au+Au collisions at \\sqrt{s_NN} = 62.4
  and 200 GeV. Data are presented at mid-rapidity (|y| < 0.5) for 0.2 < pT < 12 GeV/c.
  In the intermediate pT region (2 < pT < 6 GeV/c), the nuclear modification factor
  is higher at 62.4 GeV than at 200 GeV, while at higher pT (pT >7 GeV/c) the modification
  is similar for both energies. The p/pi+ and pbar/pi- ratios for central collisions
  at \\sqrt{s_NN} = 62.4 GeV peak at pT ~ 2 GeV/c. In the pT range where recombination
  is expected to dominate, the p/pi+ ratios at 62.4 GeV are larger than at 200 GeV,
  while the pbar/pi- ratios are smaller. For pT > 2 GeV/c, the pbar/pi- ratios at
  the two beam energies are independent of pT and centrality indicating that the dependence
  of the pbar/pi- ratio on pT does not change between 62.4 and 200 GeV. These findings
  challenge various models incorporating jet quenching and/or constituent quark coalescence.
  \n"
hepdata_doi: 10.17182/hepdata.100592.v1
