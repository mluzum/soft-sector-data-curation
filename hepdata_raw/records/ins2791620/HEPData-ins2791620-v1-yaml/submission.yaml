additional_resources:
- {description: web page with auxiliary material, location: 'https://alice-publications.web.cern.ch/node/6749'}
- {description: Archive of full likelihoods in the HistFactory JSON format, location: 'https://alice-publications.web.cern.ch/node/6749'}
comment: |
  Transverse momentum spectra of deuterons and 3He nuclei, measured in Xe--Xe collisions at centre-of-mass per nucleon-nucleon energy of 5.44 TeV, are shown in Fig. 3. The coalescence parameters B2 and B3 as a function of the transverse momentum per nucleon are reported in Fig. 7. The ratios of the integrated yields of deuterons to protons and 3He to protons are shown in Fig. 5 as a function of the average charged particle multiplicity density. The ratios of the integrated yields of deuterons to pions and 3He to pions are shown in Fig. 6 as a function of the average charged particle multiplicity density. The coalescence parameter B2 as a function of the average charged particle multiplicity density is not shown in the paper but the data are reported in Table 17. Finally, in Fig. 8 the elliptic flow v2 is shown.
hepdata_doi: 10.17182/hepdata.155473.v1
---
data_file: HEPData_Spectra_helion0to100.yaml
description: Transverse momentum spectra of 3He nuclei measured in Xe--Xe collisions
  at centre-of-mass per nucleon-nucleon energy of 5.44 TeV, as shown in Fig. 3 (right
  panel).
keywords:
- name: reactions
  values: [XE XE --> h X]
- name: observables
  values: [PT]
- name: cmenergies
  values: [5440.0]
- name: phrases
  values: [3He, transverse momentum, spectra]
name: 'Table 1 - 3He PT spectrum '
table_doi: 10.17182/hepdata.155473.v1/t1
