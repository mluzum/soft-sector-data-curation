comment: |
  CERN-LHC.  We report on the measurement of the inclusive Upsilon(1S) production in Pb-Pb collisions at sqrt(sNN) = 2.76 TeV carried out at forward rapidity (2.5 < y < 4) and down to zero transverse momentum using its mu+ mu- decay channel with the ALICE detector at the Large Hadron Collider.  A strong suppression of the inclusive Upsilon(1S) yield is observed with respect to pp collisions scaled by the number of independent nucleon-nucleon collisions.  The nuclear modification factor, for events in the 0-90% centrality range, amounts to 0.30 +- 0.05 (stat) +- 0.04 (syst).  The observed Upsilon(1S) suppression increases with the centrality of the collision and is more pronounced than in corresponding mid-rapidity measurements.
