data_file: data1.yaml
description: |
  Differential cross sections of the Y(1S) meson as a function of pT for pp collisions. The global uncertainty arises from the integrated luminosity uncertainty in pp collisions.
keywords:
- name: reactions
  values: [P P --> Upsilon(1S) X]
- name: observables
  units: NB/GEV
  values: ['$\frac{d^2 \sigma}{dy dp_{T}}$ (nb / GeV/c)']
- name: phrases
  values: [Inclusive, Bottomonia, Cross Section, Lead-Lead Scattering, Muon production]
- name: cmenergies
  values: [5020.0]
location: Data from Figure 2a
name: Table 1
table_doi: 10.17182/hepdata.83200.v2/t1
