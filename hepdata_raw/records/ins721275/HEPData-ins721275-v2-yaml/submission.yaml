comment: The STAR collaboration at the BNL Relativistic Heavy-Ion Collider (RHIC)
  reports measurements of the inclusive yield of nonphotonic electrons, which arise
  dominantly from semileptonic decays of heavy flavor mesons, over a broad range of
  transverse momenta (1.2<$p_{T}$<10 GeV/c) in p+p d+Au and Au+Au collisions at $\sqrt{s_{NN}}=$200
  GeV. The nonphotonic electron yield exhibits an unexpectedly large suppression in
  central Au+Au collisions at high $p_{T}$, suggesting substantial heavy-quark energy
  loss at RHIC. The centrality and $p_{T}$ dependences of the suppression provide
  constraints on theoretical models of suppression. An erratum of this paper can be
  found in Phys. Rev. Lett. 106. 159902 (2011), which reports new background estimates.
