additional_resources:
- {description: web page with auxiliary material, location: 'https://aliceinfo.cern.ch/Notes/node/481'}
comment: |
  Event characterization in pp and p-Pb collisions thorough the measurement of the very forward energy detected by the ZDC. Energy detected in the neutron (ZN) and proton (ZP) zero-degree calorimeters are correlated to activity measured at midrapidity and in particular with: - multiplicity of charged particles produced in |eta|<1 - transverse momentum of particle with highest pt, pt leading, in |eta|<0.8.
hepdata_doi: 10.17182/hepdata.131521.v1
---
data_file: Table2left.yaml
description: Average signal on A-side vs. C-side ZN in pp collisions at 13 TeV
keywords:
- name: reactions
  values: [P P]
- name: cmenergies
  values: [13000.0]
- name: phrases
  values: [Very forward energy, ZDC, forward backward energy, asymmetry, leading baryons]
location: Data from Figure 2 (left panel)
name: Table 1
table_doi: 10.17182/hepdata.131521.v1/t1
