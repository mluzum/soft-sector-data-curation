comment: |
  Brookhaven-RHIC. Measurement of the invariant cross section distributions for the production of the charged hadrons PI+, PI-, K+, K-, P and PBAR in proton-proton collisions at a centre-of-mass energy of 200 GeV at forward rapidity values of 2.95 and 3.3. Numerical values supplied by R. Debbe.
dateupdated: 08/03/2016 12:06:48
hepdata_doi: 10.17182/hepdata.41746.v1
modifications:
- {action: Encoded, date: 25 JUN 2007, who: Mike Whalley}
- {action: Modified, date: 08 May 2016, who: Mike Whalley}
record_ids:
- {id: 742956, type: inspire}
- {id: 4722, type: red}
---
data_file: Table1.yaml
description: |
  Invariant cross section for PI+ production in P P collisions at SQRT(S)=200 GeV and rapidity 2.95.
keywords:
- name: reactions
  values: [P P --> PI+ X]
- name: observables
  values: [D2SIG/DPT/DYRAP]
- name: phrases
  values: [Inclusive, Double Differential Cross Section, Transverse Momentum Dependence,
    Rapidity Dependence, Proton-Proton Scattering]
- name: cmenergies
  values: [200.0]
location: Data from F 2
name: Table 1
table_doi: 10.17182/hepdata.41746.v1/t1
