additional_resources:
- {description: web page with all results and auxiliary material, location: 'http://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-14-009/'}
comment: "CERN-LHC. Measurements of J/$\\psi$ meson production in proton-proton (pp)
  and proton-lead (pPb) collisions at a center-of-mass energy per nucleon pair of
  5.02 TeV by the CMS experiments at the LHC are reported. The data samples used in
  the analysis correspond to integrated luminosities of 28 pb$^{-1}$ and 35 nb$^{-1}$
  for pp and pPb collisions, respectively. Prompt and nonprompt J/$\\psi$ mesons,
  the latter produced in the decay of B hadrons, are measured in their dimuon decay
  channels. Differential cross sections are measured in the transverse momentum range
  of 2$<p_{\\mathrm{T}}<$30 GeV/c, and center-of-mass rapidity of $|y_{\\mathrm{CM}}|<$2.4
  (pp) and -2.87$<y_{\\mathrm{CM}}<$1.93 (pPb). The nuclear modification factor, $R_{\\mathrm{pPb}}$
  is measured as a function of both $p_{\\mathrm{T}}$ and $y_{\\mathrm{CM}}$. Small
  modifications to the J/$\\psi$ cross sections are observed in pPb relative to pp
  collisions. The ratio of production cross sections in p-going and Pb-going directions
  ,$R_{\\mathrm{pPb}}$, studied as functions of $p_{\\mathrm{T}}$ and $y_{\\mathrm{CM}}$,
  shows a significant decrease for increasing transverse energy deposited at large
  pesudorapidities. These results, which cover a wide kinematic range, provide new
  insight on the role of cold nuclear matter effects on prompt and nonprompt J/$\\psi$
  production. \n \nSee arXiv:1702.01462 for more details.\n"
hepdata_doi: 10.17182/hepdata.77480.v1
---
data_file: data1.yaml
description: Differential cross section (multiplied by the dimuon branching fraction)
  of prompt J/$\psi$ mesons in pp collisions at forward $y_{\mathrm{CM}}$.
keywords:
- name: reactions
  values: [P P --> J/PSI < MU+ MU- > X]
- name: observables
  values: [B*D2SIG/DPT/DY_CM]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Prompt JPsi, Differential Cross Section, Proton-Proton]
location: Data from Fig. 2 of preprint and paper (upper left)
name: Table 1
table_doi: 10.17182/hepdata.77480.v1/t1
