comment: |
  CERN-LHC. Measurements of the PT and rapidity distributions of Z bosons produced in Lead-Lead  collisions at a nucleon-nucleon centre-of-mass energy of 2.76 TeV.  The data sample has 1995 Z boson candidates  from the 2011 heavy-ion run with a total integrated luminosity of 0.15 nb-1.  The electron and muon decay   channels of the Z boson are found to be consistent and combined results are presented.    In addition to the rapidity and PT distributions in different centrality regions, the centrality (Npart)   dependence of the Z boson yield divided by the mean number of collisions, Ncoll, is presented.
dateupdated: 04/04/2013 16:44:23
hepdata_doi: 10.17182/hepdata.60336.v1
