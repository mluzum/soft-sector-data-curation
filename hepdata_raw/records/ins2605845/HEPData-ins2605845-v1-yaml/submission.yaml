additional_resources:
- {description: Image file, location: Fig4.png}
- {description: Thumbnail image file, location: thumb_Fig4.png}
data_file: fig4_l_d.yaml
description: Mass dependence of the mid-rapidity $v_1$ slope, $dv_1/dy$, for $\Lambda$,
  $^{3}_{\Lambda}$H and $^{4}_{\Lambda}$H from the $\sqrt{s_{NN}}$ = 3 GeV 5-40% mid-central
  Au+Au collisions. The statistical and systematic uncertainties are presented by
  vertical lines and square brackets, respectively. The slopes of $p$, $d$, $t$, $^3$He
  and $^4$He from the same collisions are shown as black circles. The blue and dashed
  green lines are the results of a linear fit to the measured light nuclei and hypernuclei
  $v_1$ slopes, respectively. For comparison, calculations of transport models plus
  coalescence afterburner are shown as gold and red bars from JAM model, and blue
  bars from UrQMD model.
