additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/2211.16981'}
comment: Wereport here the first observation of directed flow ($v_1$) of the hypernuclei
  $^{3}_{\Lambda}$H and $^{4}_{\Lambda}$H in mid-central Au+Au collisions at $\sqrt{s_{NN}}$
  = 3 GeV at RHIC. These data are taken as part of the beam energy scan program carried
  out by the STAR experiment. From 165 million events in 5-40% centrality, about 8400
  $^{3}_{\Lambda}$H and 5200 $^{4}_{\Lambda}$H candidates are reconstructed through
  two- and three-body decay channels. We observe that these hypernuclei exhibit significant
  directed flow. Comparing to that of light nuclei, it is found that the mid-rapidity
  $v_1$ slopes of $^{3}_{\Lambda}$H and $^{4}_{\Lambda}$H follow baryon number scaling,
  implying that the coalescence is the dominant mechanism for these hypernuclei production
  in the 3 GeV Au+Au collisions.
hepdata_doi: 10.17182/hepdata.136028.v1
---
