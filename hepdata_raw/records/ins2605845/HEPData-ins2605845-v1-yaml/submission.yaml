- {description: Image file, location: Fig3.png}
- {description: Thumbnail image file, location: thumb_Fig3.png}
data_file: fig3_a.yaml
description: $\Lambda$ hyperon and hypernuclei directed flow $v_1$, shown as a function
  of rapidity, from the $\sqrt{s_{NN}}$ = 3 GeV 5-40% mid-central Au+Au collisions.
  In the case of $^{3}_{\Lambda}$H $v_1$, both two-body (dots) and three-body (triangles)
  decays are used. The linear terms of the fitting for $#Lambda$, $^{3}_{\Lambda}$H
  and $^{4}_{\Lambda}$H are shown as the yellow-red lines. The rapidity dependence
  of $v_1$ for $p$, $d$, $t$, $^3$He, and $^4$He are also shown as open markers (circles,
  diamonds, up-triangles, down-triangles and squares), and the linear terms of the
  fitting results are shown as dashed lines in the positive rapidity region.
