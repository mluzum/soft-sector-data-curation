{comment: "This Letter reports on the first measurements of transverse momentum dependent
    flow angle $\\Psi_{n}$ and flow magnitude $v_{n}$ fluctuations, determined using
    new four-particle correlators. The measurements are performed for various centralities
    in Pb-\u2013Pb collisions at a centre of mass energy of $\\sqrt{s_{\\rm NN}} =
    5.02{\\rm\\ TeV}$ with ALICE at the LHC. Both flow angle and flow magnitude fluctuations
    are observed in the presented centrality ranges and are strongest in the most
    central collisions and for a transverse momentum $p_{\\rm T} > 2{\\rm\\ GeV}/c$.
    Comparison with theoretical models, including iEBE-VISHNU, MUSIC, and AMPT, show
    that the measurements bring novel insights into the fluctuating initial conditions
    that are not well known. In addition, these new results exhibit unique sensitivities
    to the specific shear viscosity, $\\eta/s$, of the quark\u2013gluon plasma (QGP)
    and to the initial state of the heavy-ion collisions. As such fluctuations are
    getting stronger with increasing $p_{\\rm T}$, a re-examination of existing models
    is needed to have a more precise and unbiased extraction of properties of the
    QGP.", hepdata_doi: 10.17182/hepdata.139721.v1}
