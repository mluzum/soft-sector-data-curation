- {description: Webpage with all figures and tables, location: 'https://drupal.star.bnl.gov/STAR/publications/identified-baryon-and-meson-distributions-large-transverse-momenta-au-au-collisions-sqrt-s-sub-nn-sub-200-gev'}
- {description: arXiv, location: 'http://arxiv.org/abs/arxiv:nucl-ex/0606003'}
comment: |
  'Transverse momentum spectra of $\pi^{\pm}$, p and $\bar{p}$ up to 12 GeV/c at mid-rapidity in centrality selected Au+Au collisions at $\sqrt{s}_{NN}$ = 200 GeV are presented. In central Au+Au collisions, both $\pi^{\pm}$ and  p($\bar{p}$) show significant suppression with respect to binary scaling at $p_{T}$ $\gtrsim$ 4GeV/c. Protons and anti-protons are less suppressed that $\pi^{\pm}$, in the range 1.5 $\lesssim$ $p_{T}$ $\lesssim$ 6 GeV/c. The $\pi^{-}$/$\pi^{+}$ and $\bar{p}$/p ratios show at most a weak $p_{T}$ dependence and no significant centrality dependence. The p/$\pi$ ratios in central Au+Au collisions approach the values in p+p and d+Au collisions at $p_{T}$ $\gtrsim$ 5 GeV/c. The results at high at $p_{T}$ indicate that the partonic sources of $\pi^{\pm}$, p and $\bar{p}$ have similar energy loss when traversing the nuclear medium.'
hepdata_doi: 10.17182/hepdata.98860.v1
table_doi: 10.17182/hepdata.98860.v1
