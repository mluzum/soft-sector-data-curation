comment: |
  CERN-LHC.  The quark-gluon plasma is studied via medium-induced changes to correlations between jets and charged particles in PbPb collisions compared to pp reference data. This analysis uses data sets from PbPb and pp collisions with integrated luminosities of 166 inverse microbarns and 5.3 inverse picobarns, respectively, collected at sqrt(s[NN]) = 2.76 TeV. The angular distributions of charged particles are studied as a function of relative pseudorapidity (Delta eta) and relative azimuthal angle (Delta phi) with respect to reconstructed jet directions. Charged particles are correlated with all jets with transverse momentum (pT) above 120 GeV, and with the leading and subleading jets (the highest and second-highest in pT, respectively) in a selection of back-to-back dijet events. Modifications in PbPb data relative to pp reference data are characterized as a function of PbPb collision centrality and charged particle pT. A centrality-dependent excess of low-pT particles is present for all jets studied, and is most pronounced in the most central events. This excess of low-pT particles follows a Gaussian-like distribution around the jet axis, and extends to large relative angles of Delta eta ~ 1 and Delta phi ~1.
