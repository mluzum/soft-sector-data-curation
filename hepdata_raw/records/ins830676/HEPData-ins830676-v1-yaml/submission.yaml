data_file: Figure_14.yaml
description: "$\\langle cos(\\phi_{\\alpha} + \\phi_{\\beta} \u2212 2\\Psi_{RP})\\rangle$
  calculated for 200 GeV Au+Au events with event generators HIJING (with and without
  an \u201Celliptic flow afterburner\u201D), UrQMD, and MEVSIM. Blue symbols mark
  opposite-charge correlations, and red are same-charge. Solid stars represent the
  values from the data to facilitate comparison. Acceptance cuts of 0.15 < p$_{t}$
  < 2 GeV/c and |$\\eta$| < 1.0 were used in all cases. For MEVSIM, HIJING, and UrQMD
  points the true reaction plane from the generated event was used for $\\Psi_{RP}$
  . Thick solid lighter colored lines represent possible non-reactionplane dependent
  contribution from many-particle clusters as estimated by HIJING and discussed in
  Section VII A. Corresponding estimates from UrQMD are about factor of two smaller."
keywords:
- name: cmenergies
  values: [200]
- name: reactions
  values: [Au+Au]
name: Figure 14
