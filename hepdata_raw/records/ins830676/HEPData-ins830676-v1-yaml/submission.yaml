additional_resources:
- {description: Webpage with all figures and tables, location: 'https://drupal.star.bnl.gov/STAR/publications/observation-charge-dependent-azimuthal-correlations-and-possible-local-strong-parity-violation-heavy-ion-collisions'}
- {description: arXiv, location: 'https://arxiv.org/abs/0909.1717'}
comment: Parity-odd domains, corresponding to non-trivial topological solutions of
  the QCD vacuum, might be created during relativistic heavy-ion collisions. These
  domains are predicted to lead to charge separation of quarks along the orbital momentum
  of the system created in non-central collisions. To study this effect, we investigate
  a three particle mixed harmonics azimuthal correlator which is a $\mathcal{P}$-even
  observable, but directly sensitive to the charge separation effect. We report measurements
  of this observable using the STAR detector in Au+Au and Cu+Cu collisions at $\sqrt{s_{NN}}$
  = 200 and 62 GeV. The results are presented as a function of collision centrality,
  particle separation in rapidity, and particle transverse momentum. A signal consistent
  with several of the theoretical expectations is detected in all four data sets.
  We compare our results to the predictions of existing event generators, and discuss
  in detail possible contributions from other effects that are not related to parity
  violation.
hepdata_doi: 10.17182/hepdata.98577.v1
