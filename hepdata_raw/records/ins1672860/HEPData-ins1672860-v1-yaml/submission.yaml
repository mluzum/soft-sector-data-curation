{comment: 'The production of $\rho^{0}$ mesons is measured with the ALICE detector
    in pp and Pb-Pb collisions at the centre-of-mass energy per nucleon pair, $\sqrt{s_{\rm
    NN}}$ = 2.76 TeV. The yields of $\rho^{0}$ for rapidity $|y|<0.5$ are presented
    as a function of transverse momentum ($p_{\rm T}$). The $p_{\rm T}$-integrated
    and $p_{\rm T}$-differential particle ratios $\rho^{0}/\pi$ are obtained in pp
    and Pb--Pb collisions. The nuclear modification factors $R_{\rm AA}$ are computed
    using a proton-proton reference at $\sqrt{s} = 2.76$ TeV.', hepdata_doi: 10.17182/hepdata.84285.v1}
---
data_file: Table1.yaml
description: Reconstructed mass of $\rho^{0}$ meson in pp collisions at $\sqrt{s}=2.76~{\rm
  TeV}$.
keywords:
- name: reactions
  values: [P P --> Rho X]
- name: phrases
  values: [Mass]
- name: cmenergies
  values: [2760.0]
location: Figure 4, black diamonds
name: Table 1
