comment: CERN-LHC.  The spectra and nuclear modification factor, $R_{\rm AA}$, of
  electron from heavy flavour hadron decays at mid-rapidity is measured in Pb--Pb
  collisions at 2.76 TeV with ALICE at the LHC in the transverse momentum intervals,
  $0.5<p_{\rm T}<3$ GeV/$c$ and in two collision centrality classes (0-10% and 20-40%).
  A new pp reference at the same collision energy is measured.
