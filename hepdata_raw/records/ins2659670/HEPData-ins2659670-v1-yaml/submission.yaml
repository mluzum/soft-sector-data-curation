additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/2305.08705'}
comment: |
  STAR-RHIC. Global $\Lambda$-hyperon polarization is measured at $\sqrt{s_{\rm NN}}=19.6$ and 27 GeV. The results presented in this study find no significant splitting at the collision energies of $\sqrt{s_{\rm NN}}=19.6$ and $27$ GeV in the RHIC Beam Energy Scan Phase II using the STAR detector, with an upper limit of $P_{\bar{\Lambda}}$ and $P_{\Lambda}<0.24$% and $P_{\bar{\Lambda}}$ and $P_{\Lambda}<0.35$%, respectively, at a 95% confidence level. We derive an upper limit on the na\"ive extraction of the late-stage magnetic field of $B<9.4\cdot10^{12}$ T and $B<1.4\cdot10^{13}$ T at $\sqrt{s_{\rm NN}}=19.6$ and $27$ GeV, respectively, although more thorough derivations are needed. Differential measurements of $P_{\rm H}$ were performed with respect to collision centrality, transverse momentum, and rapidity. With our current acceptance of $|y|<1$ and uncertainties, we observe  no dependence  on transverse momentum and rapidity in this analysis.
hepdata_doi: 10.17182/hepdata.140936.v1
