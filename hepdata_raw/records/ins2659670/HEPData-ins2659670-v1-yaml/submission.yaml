description: The mid-central $P_{\rm H}$ measurements reported in this work are shown
  alongside previous measurements in the upper panel, and are consistent with previous
  measurements at the energies studied here. The difference between integrated $P_{\bar{\Lambda}}$
  and $P_{\Lambda}$ is shown at $\sqrt{s_{\rm{NN}}}$=19.6 and 27 GeV alongside previous
  measurements in the lower panel. The splittings observed with these high-statistics
  data sets are consistent with zero. Statistical uncertainties are represented as
  lines while systematic uncertainties are represented as boxes. The previous $P_{\bar{\Lambda}}-P_{\Lambda}$
  result at $\sqrt{s_{\rm NN}}=7.7$ GeV is outside the axis range, but is consistent
  with zero within $2\sigma$.
