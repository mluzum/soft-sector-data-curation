{comment: '$p_{\mathrm{T}}$-differential $v_2$ measured with the two-particle correlation
    method for mesons ($\mathrm{\pi}^{\pm}, \mathrm{K}^{\pm}, \mathrm{K_{S}^{0}}$)
    and baryons ($\mathrm{p}(\bar{\mathrm{p}}), \Lambda(\bar{\Lambda})$) in high-multiplicity
    p--Pb collisions at $\sqrt{s_{\mathrm{NN}}} = 5.02$ TeV and pp collisions at $\sqrt{s}
    = 13$ TeV. The multiplicity, $\langle N_{\rm ch} \rangle$, represents the average
    number of reconstructed, efficiency-corrected charged particles with transverse
    momentum in the range $0.2 < p_{\rm T} < 3.0$ GeV/$c$, measured at midrapidity
    ($|\eta| < 0.8$). This work demonstrates the distinctive grouping of anisotropic
    flow for baryons and mesons in high-multiplicity proton--lead and proton--proton
    collisions at the Large Hadron Collider (LHC).', hepdata_doi: 10.17182/hepdata.165859.v1}
---
