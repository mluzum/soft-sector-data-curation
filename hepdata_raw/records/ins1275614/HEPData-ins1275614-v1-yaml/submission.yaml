comment: |
  BNL-RHIC. Dielectron Mass Spectra from Au + Au Collisions at $\sqrt{s_{{NN}}}$ = 200 GeV

  - DOI: 10.1103/PhysRevLett.113.022301
hepdata_doi: 10.17182/hepdata.95663.v1
---
data_file: fig1A.yaml
description: Uncorrected Distributions of e+ e- invariant mass, the reconstructed
  background, and the signal pairs in 200 GeV Au+Au minimum bias collisions.
keywords:
- name: reactions
  values: [Au Au --> e+ e-]
- name: observables
  values: ['$dN/dM_{ee}$']
- name: cmenergies
  values: [200]
- name: phrases
  values: [Dielectron Invariant Mass]
location: Data from Figure 1A
name: Table 1A
table_doi: 10.17182/hepdata.95663.v1/t1
