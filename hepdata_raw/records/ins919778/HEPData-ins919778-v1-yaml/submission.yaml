data_file: Fig3.yaml
description: $\rho^0$ production cross section determined with the data set collected
  with trigger B, as a function of momentum transfer $t$, fitted with a double exponential
  fit function in the range $t < 0.1$. The statistical errors are shown. The ratio
  of incoherent to coherent cross sections is measured to be $0.20 \pm 0.8$. The fit
  parameters are shown in Table I.
