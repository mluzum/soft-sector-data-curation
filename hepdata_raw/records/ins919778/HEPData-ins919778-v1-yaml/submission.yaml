data_file: Fig1_TrigA.yaml
description: Acceptance corrected invariant mass distributions for the coherently
  produced $\rho^0$ candidates collected with trigger A (left) and B (right). The
  fit function (solid) encompasses the Breit-Wigner (dashed), the mass independent
  contribution from direct $\pi^+\pi^-$ production (dash-dotted), and the interference
  term (dotted). The hatched area is the contribution from the combinatorial background.
  The statistical errors are shown.
