comment: |
  CERN-LHC. The production cross sections of the $B^{+}$, $B^{0}$, and $B_{s}^{0}$ mesons, and of their charge conjugates, are measured via exclusive hadronic decays in $p$ + Pb collisions at the center-of-mass energy $\sqrt{s_{NN}} = 5.02$ TeV with the CMS detector at the CERN LHC.
