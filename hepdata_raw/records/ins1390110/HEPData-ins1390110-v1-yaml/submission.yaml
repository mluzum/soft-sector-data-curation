data_file: Table1.yaml
description: |
  The measured $p_{\rm{T}}$-differential production cross section of $B^{+}$ in $p$ + Pb collisions at $\sqrt{s_{NN}} = 5.02$ TeV, together with the cross section calculated by the FONLL model.
