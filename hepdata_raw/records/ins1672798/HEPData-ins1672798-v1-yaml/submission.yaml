additional_resources: []
comment: CERN-LHC. Inclusive $\Upsilon$(1S) and $\Upsilon$(2S) production have been
  measured in Pb-Pb collisions at the centre-of-mass energy per nucleon-nucleon pair
  $\sqrt{s_{_{\rm NN}}}=5.02$ TeV, using the ALICE detector at the CERN LHC. The $\Upsilon$
  mesons are reconstructed in the centre-of-mass rapidity interval $2.5<y<4$ and in
  the transverse-momentum range $p_{\rm T}<15$ GeV/$c$, via their decays to muon pairs.
  Results on the inclusive $\Upsilon$(1S) nuclear modification factor $R_{\rm AA}$
  as a function of collision centrality, transverse momentum and rapidity are reported.
