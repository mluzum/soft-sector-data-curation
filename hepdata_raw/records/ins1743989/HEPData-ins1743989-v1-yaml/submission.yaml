comment: |
  An improved value for the  lifetime of the hypertriton has been obtained using the data sample of Pb-Pb collisions at $\sqrt{s_{\mathrm{NN}}}$ = 5.02 TeV collected by the ALICE experiment at the LHC. The (anti-)hypertriton has been identified via its charged two-body mesonic decay channel and the lifetime has been determined with an exponential fit to the d$N$/d($c$t) spectrum. The measured value, $\tau$ = 242$^{+34}_{-38}$ (stat.) $\pm$ 17 (syst.) ps, is in agreement within 1$\sigma$ with the free $\Lambda$ lifetime. This result is compatible with all the available theoretical predictions, thus contributing to the solution of the longstanding hypertriton lifetime puzzle.
