additional_resources:
- {description: CMS public results page for this analysis, location: 'http://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-15-011/index.html'}
comment: "CERN-LHC.  Decomposing transverse momentum balance contributions for quenched
  jets in PbPb collisions at 2.76 TeV with CMS\n\nInteractions between jets and the
  quark-gluon plasma produced in heavy ion collisions are studied via the angular
  distributions of summed charged-particle transverse momenta (pT) with respect to
  both the leading and subleading jet axes in high-pT dijet events.  The contributions
  of charged particles in different momentum ranges to the overall event pT balance
  are decomposed into short-range jet peaks and a long-range azimuthal asymmetry in
  charged-particle pT.  The results for PbPb collisions are compared to those in pp
  collisions using data collected in 2011 and 2013, at collision energy 2.76 TeV with
  integrated luminosities of 166 inverse microbarns and 5.3 inverse picobarns, respectively,
  by the CMS experiment at the LHC.  Measurements are presented as functions of PbPb
  collision centrality, charged-particle pT, relative azimuth, and radial distance
  from the jet axis for balanced and unbalanced dijets.  \n\nDijet events are characterized
  by asymmetry parameter Aj = (pT1 - pT2)/(pT1 + pT2), where pT1 = transverse momentum
  of the leading (highest-pT) jet and pT2 = transverse momentum of the subleading
  (second-highest-pT) jet. The sample is divided into two asymmetry classes--more
  balanced dijets for which Aj < 0.22 (52% of the PbPb sample and 67% of the pp sample),
  and more unbalanced dijets for which Aj > 0.22.  \n"
hepdata_doi: 10.17182/hepdata.77493.v1
