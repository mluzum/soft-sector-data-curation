additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/measurements-transverse-energy-distributions-au-au-collisions-sqrt-s-sub-nn-sub-200-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0407003'}
comment: Transverse energy ($E_{T}$) distributions have been measured for Au+Au collisions
  at $sqrt{s_{NN}}$=200 GeV by the STAR collaboration at RHIC. $E_{T}$ is constructed
  from its hadronic and electromagnetic components, which have been measured separately.
  $E_{T}$ production for the most central collisions is well described by several
  theoretical models whose common feature is large energy density achieved early in
  the fireball evolution. The magnitude and centrality dependence of $E_{T}$ per charged
  particle agrees well with measurements at lower collision energy, indicating that
  the growth in $E_{T}$ for larger collision energy results from the growth in particle
  production. The electromagnetic fraction of the total $E_{T}$ is consistent with
  a final state dominated by mesons and independent of centrality.
hepdata_doi: 10.17182/hepdata.98621.v1
