description: "\u27E8$dE_{T}/d\\eta|_{\\eta=0.5}$\u27E9 per $N_{part}$ pair vs. $N_{part}$.
  Upper panel: $N_{part}$ is obtained from Monte Carlo Glauber calculations. The lines
  show calculations using the HIJING model [27](solid), the EKRT saturation model
  [7] (dotted, Eq. 8) and the two component fit (dashed, see text). Results from WA98
  [14] and PHENIX [15] are also shown. The grey bands correspond to overall systematic
  uncertainties, independent of $N_{part}$. Error bars are the quadrature sum of the
  errors on the measurements and the uncertainties on $N_{part}$ calculation. Lower
  panel: the same data are shown as in the upper panel but using and Optical Glauber
  model calculation for $N_{part}$. The line shows the same result from EKRT model
  calculation."
keywords:
