comment: |
  DATA USES SLAC 8 GEV SPECTROMETER,USING ANGLES OF 15,18,19,26,34 DEG. RANGE OF VARIABLES PLAB 4.5 TO 18.0 GEV , NU 2.1 TO 13.4 GEV , Q2 1.0 TO 16.0 GEV**2 , X 0.1 TO 0.8 , W 1.88 TO 4.84 GEV. ONLY DATA ON R=SIGL/SIGT AND THE STRUCTURE FUNCTIONS IN THIS RECORD.
  THESE DATA ARE FROM EXPERIMENT E 87 AT SLAC. THE RANGES OF VARIABLES ARE E LAB 4.5 TO 18.0 GEV THETA LAB 6,10,15,18,19,26,34 DEGREES NU 0.301 TO 16.804 GEV Q2 0.145 TO 21.78 GEV**2 X 0.022 TO 0.965 W 1.104 TO 5.563 GEV THE DATA HAS BEEN PROCESSED BY SLAC RADIATIVE CORRECTIONS AND WAS OBTAINED THROUGH G.C.FOX AT CALTECH.
