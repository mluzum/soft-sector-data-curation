- {description: arXiv, location: 'https://arxiv.org/abs/0912.3977'}
comment: "We report the first three-particle coincidence measurement in pseudorapidity
  (\u2206\u03B7) between a high transverse momentum (p\u22A5) trigger particle and
  two lower p\u22A5 associated particles within azimuth |\u2206\u03C6|<0.7 in $\\sqrt{s_{NN}}$=
  200 GeV d+Au and Au+Au collisions. Charge ordering properties are exploited to separate
  the jet-like component and the ridge (long-range \u2206\u03B7 correlation). The
  results indicate that the particles from the ridge are uncorrelated in \u2206\u03B7
  not only with the trigger particle but also between themselves event-by-event. In
  addition, the production of the ridge appears to be uncorrelated to the presence
  of the narrow jet-like component."
hepdata_doi: 10.17182/hepdata.102404.v1
