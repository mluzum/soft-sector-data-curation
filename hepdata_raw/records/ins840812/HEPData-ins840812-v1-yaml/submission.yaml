data_file: Fig4(b).yaml
description: "The R dependence of the average in 0-12% Au+Au collisions.for the ridge
  as a function of \u03BE within R<1.4. The solid curves are Gaussian fits. To investigate
  possible structures in the ridge, we show in Fig. 4(b) the average ridge particle
  pair density as a function of \u03BE = arctan(\u2206\u03B72/\u2206\u03B71) within
  R<1.4. The data are consistent with a uniform distribution in \u03BE(\u03C72/ndf=1.7/7).
  This suggests that the ridge particles are uncorrelated in \u2206\u03B7 not only
  with the trigger particle but also between themselves. In other words,the ridge
  appears to be uniform in \u2206\u03B7 event-by-event."
