data_file: Fig3(b),2.yaml
description: "Radial dependence of average 3-particle correlation pair density for
  d+Au (AAT) data. We expect the ridge contributions in the correlated pair density
  to be the same in all charge combinations. We verified this for large \u2206\u03B7
  correlatedpair densities within our current statistics, as can be seen from Fig.
  3(b). Therefore the total ridge particle pair density (\u02C6Prr) can be obtained
  as four times A^\xB1A^\xB1T^\xB1.  The remaining jet-like signal, the sum of jet-like
  correlated particle pairs (\u02C6Pjj) and cross pairs of a jet-like and a ridge
  particle (\u02C6Pjr), can then be obtained by subtracting the total ridge from AAT."
