data_file: ppg206fig1ab.yaml
description: Components $\langle\langle$4$\rangle\rangle$ and 2$\langle\langle$2$\rangle\rangle^{2}$
  and cumulant $c_2${4} = $\langle\langle$4$\rangle\rangle$ - 2$\langle\langle$2$\rangle\rangle^{2}$
  as a function of $N^{FVTX}_{tracks}$. (a) and (b) show the components and cumulant,
  respectively, in $p$+Au collisions at $\sqrt{s_{NN}}$ = 200 GeV. (c) and (d) show
  the components and cumulant, respectively, in $d$+Au collisions at $\sqrt{s_{NN}}$
  = 200 GeV. (b) and (d) also show the cumulant as measured in AMPT for $p$+Au and
  $d$+Au, respectively, indicated by the green line. The shaded green band indicates
  the statistical uncertainty on the AMPT values.
