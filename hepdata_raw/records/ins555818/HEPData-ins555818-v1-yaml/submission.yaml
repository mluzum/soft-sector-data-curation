additional_resources:
- {description: web page with figures, location: 'https://drupal.star.bnl.gov/STAR/publications/midrapidity-antiproton-proton-ratio-au-au-sqrt-s-sub-nn-sub-130-gev'}
comment: "We report results on the ratio of mid-rapidity anti-proton to proton yields
  in Au+Au collisions at $\\rts=130$ GeV per nucleon pair as measured by the STAR
  experiment at RHIC. Within the rapidity and transverse momentum range of $|y|<0.5$
  and $0.4 <pt< 1.0$ GeV/c, the ratio is essentially independent of either transverse
  momentum or rapidity, with an average of 0.65\xB10.01(stat.)\xB10.07(syst.) for
  minimum bias collisions. Within errors, no strong centrality dependence is observed.
  The results indicate that at this RHIC energy, although the $p-\\pb$ pair production
  becomes important at mid-rapidity, a significant excess of baryons over anti-baryons
  is still present.\n"
hepdata_doi: 10.17182/hepdata.98921.v1
