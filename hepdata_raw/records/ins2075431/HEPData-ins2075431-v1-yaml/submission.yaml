comment: Studies of the correlations of the two highest transverse momentum (leading)jets
  in individual Pb+Pb collision events can provide information about themechanism
  of jet quenching by the hot and dense matter created in suchcollisions.  In Pb+Pb
  and $pp$ collisions at  $\sqrt{s_{_\text{NN}}}$ = 5.02TeV, measurements of the leading
  dijet transverse momentum ($p_{\mathrm{T}}$)correlations are presented. Additionally,
  measurements in Pb+Pb collisions ofthe dijet pair nuclear modification factors projected
  along leading andsubleading jet $p_{\mathrm{T}}$ are made. The measurements are
  performed usingthe ATLAS detector at the LHC with 260 ${\mathrm {pb}^{-1}}$ of $pp$
  datacollected in 2017 and 2.2 ${\mathrm {nb}^{-1}}$ of Pb+Pb data collected in2015
  and 2018. An unfolding procedure is applied to the two-dimensionalleading and subleading
  jet $p_{\mathrm{T}}$ distributions to account forexperimental effects in the measurement
  of both jets. Results are provided fordijets with leading jet $p_{\mathrm{T}}$ greater
  than 100 GeV. Measurements ofthe dijet-yield-normalized $x_{\mathrm{J}}$ distributions
  in Pb+Pb collisionsshow an increased fraction of imbalanced jets compared to $pp$
  collisions;these measurements are in agreement with previous measurements of the
  samequantity at 2.76 TeV in the overlapping kinematic range. Measurements of theabsolutely-normalized
  dijet rate in Pb+Pb and $pp$ collisions are alsopresented, and show that balanced
  dijets are significantly more suppressedthan imbalanced dijets in Pb+Pb collisions.  It
  is observed in themeasurements of the pair nuclear modification  factors that the
  subleadingjets are significantly suppressed  relative to leading jets with$p_{\mathrm{T}}$   between
  100 and 316 GeV for all centralities in Pb+Pbcollisions.
