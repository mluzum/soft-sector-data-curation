additional_resources:
- {description: web page with auxiliary material, location: 'http://lhcbproject.web.cern.ch/lhcbproject/Publications/LHCbProjectPublic/LHCb-PAPER-2018-035.html'}
comment: CERN-LHC. The production of $\Upsilon(nS)$ mesons ($n=1,2,3$) in $p$Pb and
  Pb$p$ collisions at a centre-of-mass energy per nucleon pair $\sqrt{s_{NN}}=8.16$
  TeV is measured by the LHCb experiment, using a data sample corresponding to an
  integrated luminosity of 31.8 $nb^{-1}$. The $\Upsilon(nS)$ mesons are reconstructed
  through their decays into two opposite-sign muons. The measurements comprise the
  differential production cross-sections of the $\Upsilon(1S)$ and $\Upsilon(2S)$
  states, their forward-to-backward ratios and nuclear modification factors, performed
  as a function of the transverse momentum p_{T} and rapidity in the nucleon-nucleon
  centre-of-mass frame $y^*$ of the $\Upsilon(nS)$ states, in the kinematic range
  $p_{T}<25$ GeV$/c$ and $1.5<y^*<4.0$ ($-5.0<y^*<-2.5$) for $p$Pb (Pb$p$) collisions.
  In addition, production cross-sections for $\Upsilon(3S)$ are measured integrated
  over phase space and the production ratios between all three $\Upsilon(nS)$ states
  are determined.
hepdata_doi: 10.17182/hepdata.93070.v1
---
data_file: Table1.yaml
description: $\Upsilon(1S)$ production cross-section in $p$Pb, as a function of $p_{T}$
  and $y*$. The uncertainty is the sum in quadrature of the statistical and systematic
  components.
keywords:
- name: reactions
  values: [P Pb --> UPSI(1S) X, P Pb --> MU+ MU- X]
- name: observables
  values: [D2SIG/DPT/DYRAP]
- name: cmenergies
  values: [8160]
- name: phrases
  values: [Inclusive, Upsilon, Integrated Cross Section, Double Differential Cross
      Section, Proton-Lead Scattering, Transverse Momentum Dependence, Rapidity Dependence,
    Di-Muon Production]
location: Data from Table 4, Figure 3 (left)
name: Table 1
table_doi: 10.17182/hepdata.93070.v1/t1
