comment: |
  CERN-LHC. First measurements of neutron emission in electromagnetic dissociation  of PB208 nuclei at the LHC. The measurement uses the neutron zero degree calorimeters of the  ALICE experiment to detect neutral particles close to beam rapidity.  Cross sections  for single and mutual electromagnetic dissociation are given together with comparisons  with the measured total hadronic cross section.
