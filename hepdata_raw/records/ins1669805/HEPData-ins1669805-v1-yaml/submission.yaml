comment: "phi meson measurements provide insight into strangeness production, which
  is one of \nthe key observables for the hot medium formed in high-energy heavy-ion
  \ncollisions. ALICE measured phi production through its decay \nin muon pairs in
  Pb-Pb collisions at SQRT(S_NN) = 2.76 TeV \nin the intermediate transverse momentum
  range 2 < PT < 5 GeV/c \nand in the rapidity interval 2.5 < y <4. \nThe phi yield
  was measured as a function of the transverse momentum and collision centrality.
  \nThe nuclear modification factor was obtained as a\nfunction of the average number
  of participating nucleons.  \nResults were compared with the ones obtained via the
  kaon decay channel in the same \nPT range at midrapidity. The values of the nuclear
  modification factor in the two rapidity \nregions are in agreement within uncertainties.\n"
