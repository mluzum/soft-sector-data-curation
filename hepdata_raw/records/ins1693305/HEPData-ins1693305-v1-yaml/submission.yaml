comment: "CERN-LHC. The ALICE Collaboration has measured the energy dependence of
  \ exclusive photoproduction of J/PSI vector mesons off proton targets in ultra-peripheral
  proton-lead collisions at a centre-of-mass energy per nucleon pair sqrt(sNN) = 5.02$
  TeV. The E+E-$ and MU+MU-$ decay channels are used to measure the cross section
  as a function of the rapidity  of the J\PSI in the range $-2.5 < y < 2.7$, corresponding
  to an energy in the GAMMA-P centre-of-mass in the interval 40 < W(GAMMA P) <550$
  GeV. The differential cross section as a function of rapidity is also presented
  along with the product of the photon energy, K, and the photon flux, DN/DK.\n"
