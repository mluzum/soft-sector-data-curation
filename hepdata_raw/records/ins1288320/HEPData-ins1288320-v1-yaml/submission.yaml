comment: |
  CERN-LHC.  The yields of the K*(892)0, anti-K*(892)0, and phi(1020) resonances are measured in Pb-Pb collisions at sqrt(sNN) = 2.76 TeV through their hadronic decays using the ALICE detector.  Throughout this paper, measurements for K*(892)0 and its antiparticle are combined and referred to using the symbol K*(892)0.  The measurements are performed in multiple centrality intervals at mid-rapidity (|y| < 0.5) in the transverse-momentum ranges 0.3 < pT < 5 GeV for the K*(892)0 and 0.5 < pT < 5 GeV for the phi(1020).  The K*(892)0 resonance is identified through its decays to charged pions and charged kaons, while the phi(1020) is identified through its decays to pairs of charged kaons.  The decay product candidates are identified through measurements of their specific energy loss (dE/dx) in the ALICE TPC.  The following measurements are reported:
  - transverse-momentum distributions in different centrality intervals
  - masses and widths as functions of transverse momentum
  - total dN/dy for |y| < 0.5
  - pT-integrated K*(892)0/K- and phi(1020)/K- ratios
  - mean transverse momentum
  - pT-dependent Omega/phi(1020), (anti)proton/phi(1020), and phi(1020)/pi ratios
  - enhancement ratios of phi(1020) and Lambda
  - pT-integrated phi(1020)/pi ratios.

  UPDATE (27 JAN 2015): replaced Table 18, corresponding to Figure 5(c), with the final published values.
