data_file: npartYieldRatio.yaml
description: Ratio of $\Upsilon(2\mathrm{S})$ and $\Upsilon(1\mathrm{S})$ yields (cf.
  equation 2 in the article for the definition) as a function of the average number
  of participants $\langle N_{\mathrm{part}} \rangle$ or as a function of the collision
  centrality. The global uncertainty is the quadratic sum of the branching ratio uncertainties.
keywords:
- name: reactions
  values: [Pb Pb --> UPSI(1S) < MU+ MU- > X, Pb Pb --> UPSI(2S) < MU+ MU- > X]
- name: observables
  values: [N/N]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Upsilon, Centrality Dependence, Lead-Lead Scattering]
location: Data from Figure 5 (left)
name: Table 6
table_doi: 10.17182/hepdata.114190.v1/t6
