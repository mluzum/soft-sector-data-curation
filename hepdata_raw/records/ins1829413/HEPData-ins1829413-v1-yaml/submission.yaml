additional_resources:
- {description: Webpage with all figures and tables, location: 'https://alice-publications.web.cern.ch/node/6694#'}
comment: "CERN-LHC. The production of $\\Upsilon$ mesons in Pb\u2013Pb collisions
  at a centre-of-mass energy per nucleon pair $\\sqrt{s_{\\mathrm{NN}}}$ = 5.02 TeV
  is measured with the muon spectrometer of ALICE at the LHC. The yields as well as
  the nuclear modification factors are determined in the forward rapidity region 2.5
  $<y<$ 4.0, as a function of rapidity, transverse momentum and collision centrality.\n\nThe
  cross sections in proton\u2013proton collisions at $\\sqrt{s}$ = 5.02 TeV used for
  the determination of the nuclear modification factors are also reported.\n"
hepdata_doi: 10.17182/hepdata.114190.v1
---
data_file: rapidityYield1S.yaml
description: "Rapidity-differential yield of $\\Upsilon(1\\mathrm{S}) \\rightarrow
  \\mu^{+}\\mu^{-}$ divided by the average nuclear overlap function $\\langle T_{\\mathrm{AA}}
  \\rangle$ for the 0\u201390% centrality interval ($\\langle T_{\\mathrm{AA}} \\rangle$
  = 6.28 $\\pm$ 0.06 mb$^{-1}$)."
keywords:
- name: reactions
  values: [Pb Pb --> UPSI(1S) < MU+ MU- > X]
- name: observables
  values: [DN/DYRAP]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Inclusive, Upsilon, Rapidity Dependence, Lead-Lead Scattering]
location: Data from Figure 3 (left)
name: Table 1
table_doi: 10.17182/hepdata.114190.v1/t1
