data_file: integratedPpCrossSections.yaml
description: "Interpolated production cross sections and cross-section ratio for $\\Upsilon(1\\mathrm{S})
  \\rightarrow \\mu^{+}\\mu^{-}$ and $\\Upsilon(2\\mathrm{S}) \\rightarrow \\mu^{+}\\mu^{-}$
  in proton\u2013proton collisions, integrated over the rapidity interval 2.5\u20134.0
  and $p_{\\mathrm{T}} <$ 15 GeV/$c$. Results used for the determination of the integrated
  nuclear modification factors and of the nuclear modification factors as a function
  of centrality (Figures 4 and 5 (right))."
keywords:
- name: reactions
  values: [P P --> UPSI(1S) < MU+ MU- > X, P P --> UPSI(2S) < MU+ MU- > X]
- name: observables
  values: [SIG, RATIO]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Upsilon, Integrated Cross Section, Proton-Proton Scattering]
location: Data for nuclear modification factors
name: Table 11
table_doi: 10.17182/hepdata.114190.v1/t11
