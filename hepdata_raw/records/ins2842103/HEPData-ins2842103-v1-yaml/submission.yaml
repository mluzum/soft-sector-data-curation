data_file: HEPData_yield.yaml
description: average pT-integrated yield of particle and antiparticle of both analyzed
  (anti)hypernuclei in Pb-Pb collisions in 0-10% V0M centrality class
keywords:
- name: observables
  values: [dN/dy]
- name: cmenergies
  values: ['5020']
- name: reactions
  values: ['PB PB --> (anti)${}^4_{\Lambda}\mathrm{H(e)}$ + X']
location: Data from Figure 2.
name: Corrected measured yield
table_doi: 10.17182/hepdata.158317.v1/t1
