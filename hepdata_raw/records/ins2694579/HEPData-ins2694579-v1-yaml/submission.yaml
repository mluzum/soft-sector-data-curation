additional_resources:
- {description: Created with hepdata_lib 0.13.0, location: 'https://zenodo.org/record/4946277'}
comment: The ALICE Collaboration reports a search for jet quenching effects in high-multiplicity
  (HM) proton--proton collisions at $\sqrt{s} = 13$ TeV, using the semi-inclusive
  azimuthal-difference distribution $\Delta\varphi$ of charged-particle jets recoiling
  from a high transverse momentum (high-$p_{\mathrm{T,trig}}$) trigger hadron. Jet
  quenching may broaden the $\Delta\varphi$ distribution measured in HM events compared
  to that in minimum bias (MB) events. The measurement employs a $p_{\mathrm{T,trig}}$-differential
  observable for data-driven suppression of the contribution of multiple partonic
  interactions, which is the dominant background. While azimuthal broadening is indeed
  observed in HM compared to MB events, similar broadening for HM events is observed
  for simulations based on the PYTHIA 8 Monte Carlo generator, which does not incorporate
  jet quenching. We elucidate the origin of the broadening by comparing biases induced
  by HM selection in the data and simulations, and discuss its implications for the
  study of jet quenching in small collision systems.
