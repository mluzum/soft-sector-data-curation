{comment: 'The transverse momentum $(p_T)$ spectra of prompt D$^+_S$ mesons and charge
    conjugates are measured in pp and PbPb collisions at a center-of-mass energy of
    5.02 TeV per nucleon pair using the CMS detector at the LHC. The measurement is
    performed through the $\text{D}^+_S \rightarrow \phi\pi^+\rightarrow \text{K}^+
    \text{K}^-\pi^+$ decay channels with the D$^+_S$ rapidity range $|y|<1.0$. The  production
    in the $p_T$ range from 2 (6) GeV/c to 40 GeV/c in pp (PbPb) collisions is measured.
    Suppression of the D$^+_S$ nuclear modification factor (RAA) in PbPb collisions
    suggests a strong interaction between charm quarks and the quark-gluon plasma.
    The double ratio of prompt D$^+_S$ to prompt D$^0$ production in pp and PbPb is
    consistent with a PHSD model calculation and consistent with unity, which indicates
    that strange charm meson enhancement in PbPb collisions is not significant in
    the measured D$^+_S$ $p_T$ interval', hepdata_doi: 10.17182/hepdata.88295.v1}
---
