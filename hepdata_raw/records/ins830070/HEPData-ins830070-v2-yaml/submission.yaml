additional_resources:
- {description: arXiv, location: 'https://arxiv.org/pdf/0909.0191.pdf'}
comment: The STAR Collaboration at the Relativistic Heavy lon Collider presents a
  systematic study of hightransverse-momentum charged-di-hadron correlations at small
  azimuthal pair separation $\Delta \phi$ in $d+\mathrm{Au}$ and central $\mathrm{Au}+$
  Au collisions at $\sqrt{s_{N N}}=200 \mathrm{GeV}$. Significant correlated yield
  for pairs with large longitudinal separation $\Delta \eta$ is observed in central
  $\mathrm{Au}+\mathrm{Au}$ collisions, in contrast to $d+\mathrm{Au}$ collisions.
  The associated yield distribution in $\Delta \eta \times \Delta \phi$ can be decomposed
  into a narrow jet-like peak at small angular separation which has a similar shape
  to that found in $d+$ Au collisions, and a component that is narrow in $\Delta \phi$
  and depends only weakly on $\Delta \eta$, the "ridge." Using two systematically
  independent determinations of the background normalization and shape, finite ridge
  yield is found to persist for trigger $p_{t}>6 \mathrm{GeV} / c$, indicating that
  it is correlated with jet production. The transverse-momentum spectrum of hadrons
  comprising the ridge is found to be similar to that of bulk particle production
  in the measured range $\left(2<p_{t}<4 \mathrm{GeV} / c\right)$.
