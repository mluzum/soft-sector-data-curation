comment: |
  The azimuthal ($\Delta\varphi$) correlation distributions between heavy-flavor decay electrons and associated charged particles are measured in pp and p$\textendash$Pb collisions at $\sqrt{s_{\rm{NN}}} = 5.02$ TeV. Results are reported for electrons with transverse momentum $4<p_{\rm T}<16$ ${\rm GeV}/c$ and pseudorapidity $|\eta|<0.6$. The associated charged particles are selected with transverse momentum $1<p_{\rm T}<7$ ${\rm GeV}/c$, and relative pseudorapidity separation with the leading electron $|\Delta\eta| < 1$. The correlation measurements are performed to study and characterize the fragmentation and hadronization of heavy quarks. The correlation structures are fitted with a constant and two von Mises functions to obtain the baseline and the near- and away-side peaks, respectively. The results from p$\textendash$Pb collisions are compared with those from pp collisions to study the effects of cold nuclear matter. In the measured trigger electron and associated particle kinematic regions, the two collision systems give consistent results. The $\Delta\varphi$ distribution and the peak observables in pp and p$\textendash$Pb collisions are compared with calculations from various Monte Carlo event generators.
hepdata_doi: 10.17182/hepdata.141857.v1
---
data_file: Delphi_panel1.yaml
description: |
  $\Delta\varphi$ distribution between heavy-flavor decay electrons and associated charged particles for $4 < p_{\rm T}^{\rm e} < 12$ ${\rm GeV}/c$ and $1 < p_{\rm T}^{\rm assoc} < 7$ ${\rm GeV}/c$ in pp collisions at $\sqrt{s_{\rm{NN}}} = 5.02$ TeV. The publication shows $\Delta\varphi$ distribution only for the ranges $1 < p_{\rm T}^{\rm assoc} < 2$, $2 < p_{\rm T}^{\rm assoc} < 3$, and $5 < p_{\rm T}^{\rm assoc} < 7$  ${\rm GeV}/c$.
keywords:
- name: reactions
  values: [pp --> b c --> e X]
- name: observables
  values: [$\Delta\varphi$]
- name: cmenergies
