comment: "\nMeasuring K$^0_{\\rm S}$K$^0_{\\rm S}$ and K$^{\\rm \\pm}$K$^{\\rm \\pm}$
  \nthree-dimensional femtoscopic correlations using Pb-Pb collisions at \n$\\mathbf
  {\\sqrt{s_{\\rm NN}}=2.76}$ TeV\n\nLHC ALICE collaboration\nKchKch and K0sK0s femtoscopy
  from 2.76 TeV/nucleon Pb-Pb collision\n0-10%, 10-30% and 30-50% centrality, -0.8
  < eta < 0.8\n\nWe present the results of three-dimensional femtoscopic analyses
  for charged and neutral kaons recorded by ALICE in Pb-Pb collisions at $\\sqrt{s_{\\rm{NN}}}$
  = 2.76 TeV. The $m_{\\mathrm{T}}$ scaling predicted by pure hydrodynamic models
  appears to be broken in our data, which indicates the importance of the hadronic
  rescattering phase at LHC energies. A $k_{\\mathrm{T}}$ scaling of pion and kaon
  source radii is observed instead. The time of maximal emission of the system is
  estimated using the three-dimensional femtoscopic analysis for kaons. The measured
  emission time is larger than that of pions. Our observations are well supported
  by the hydrokinetic model predictions. \nFor correlation functions (Figure 2, Figure
  3) the errors are statistical only, systematic uncertainties are equal to or less
  than the statistical errors.\nFor all other figures total errors are presented.
  \n"
hepdata_doi: 10.17182/hepdata.79128.v1
