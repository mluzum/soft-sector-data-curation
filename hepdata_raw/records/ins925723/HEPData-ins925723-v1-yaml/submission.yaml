comment: |
  CERN-LHC. Measurements of the per-event charged particle density distributions - dN/deta - over the |eta| range < 2.0, and the averaged  charged particle multiplicity in the central |eta| range < 0.5, in several centrality regions in lead-lead collisions at a centre-of-mass energy of 2.76 TeV/nucleon.
