comment: |
  CERN-LHC. Measurements of correlations between event-by-event fluctuations
  of amplitudes of anisotropic flow harmonics in nucleus-nucleus collisions
  at $\sqrt{s_{_{\rm NN}}}=5.02$ TeV. The measurements are performed in the
  central pseudorapidity region (|$\eta$| < 0.8) and transverse momentum
  range 0.2 < $p_T$ < 5.0 GeV/c.
hepdata_doi: 10.17182/hepdata.159493.v1
