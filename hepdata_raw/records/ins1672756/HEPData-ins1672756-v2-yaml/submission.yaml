comment: "CERN-LHC. The charged-particle pseudorapidity density in Xe--Xe collisions
  at $\\sqrt{s_{_{\\mathrm{NN}}}} = 5.44\\,\\mathrm{TeV}$ in centrality classes measured
  by ALICE.  The measurement covers a wide pseudorapidity range from $-3.5$ to $5$.
  The distributions of $\\mathrm{d}N_\\mathrm{ch}/\\mathrm{d}\\eta$, the densities
  of the distributions at mid-rapidity and $N^\\mathrm{tot}_\\mathrm{ch}$ are presented.
  \n"
hepdata_doi: 10.17182/hepdata.88397.v2
record_ids:
- {id: 1507090, type: inspire}
- {id: 2239845, type: cds}
- {id: 9999, type: red}
