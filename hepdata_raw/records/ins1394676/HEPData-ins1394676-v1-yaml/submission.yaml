comment: |
  CERN-LHC.  The centrality dependence of the charged-particle pseudorapidity density measured with ALICE in Pb-Pb collisions at $\sqrt{s_{\rm NN}}$ over a broad pseudorapidity range is presented. This Letter extends the previous results reported by ALICE to more peripheral collisions. The broad pseudorapidity range allows precise estimates of the total number of produced charged particles.
