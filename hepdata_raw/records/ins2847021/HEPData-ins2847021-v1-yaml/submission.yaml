comment: Differential two-particle normalized cumulants ($R_2$) and transverse momentum
  correlations ($P_2$) are measured as a function of the relative pseudorapidity and
  azimuthal angle difference $(\Delta \eta, \Delta \varphi)$ of charged particle pairs
  in minimum bias pp collisions at $\sqrt{\textit{s}}$ = 13 TeV. The measurements
  use charged hadrons in the pseudorapidity region of $|\eta| < 0.8$ and the transverse
  momentum range 0.2 $< \textit{p}_{\mathrm T} < $ 2.0 $\mathrm{GeV}/\textit{c}$ in
  order to focus on soft multiparticle interactions and to complement  prior measurements
  of these correlation functions in p$-$Pb and Pb$-$Pb collisions. The correlation
  functions are reported for both unlike-sign and like-sign pairs and their charge-independent
  and charge-dependent combinations. Both the $R_2$ and $P_2$ measured in pp collisions
  exhibit  features qualitatively similar to those observed in p$-$Pb and Pb$-$Pb
  collisions. The $\Delta\eta$ and $\Delta\varphi$ root mean square widths of the
  near-side peak of the correlation functions are evaluated and compared with those
  observed  in p$-$Pb and Pb$-$Pb collisions and show smooth evolution with the multiplicity
  of charged particles produced in the collision. The comparison of the measured correlation
  functions with predictions from PYTHIA8 shows that this model qualitatively captures
  their basic structure and characteristics but feature important differences. In
  addition, the $R_2^{\rm CD}$ is used to determine the charge balance function of
  hadrons produced within the detector acceptance of the measurements. The integral
  of the balance function is found to be compatible with those reported by a previous
  measurement in  Pb$-$Pb collisions. These results, which are sensitive to the interplay
  between the underlying event and mini-jets in pp collisions, establish a baseline
  for heavy-ion collisions.
