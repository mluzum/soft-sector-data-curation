description: Projections onto $\Delta\eta$ of $R_2^{\rm CI}$ correlation functions
  of charged hadrons calculated in the selected $p_{\rm T}$ range in pp collisions
  at $\sqrt{s}=13\;\text{TeV}$. The $\Delta\eta$ projection is calculated as averages
  of the two-dimensional correlations in the range $|\Delta\varphi| \leq \pi$ and
  $|\Delta\eta| \leq 1.6$, respectively. Simulations using PYTHIA8 with the Monash
  2013 tune and color reconnection (CR) enabled are added.
