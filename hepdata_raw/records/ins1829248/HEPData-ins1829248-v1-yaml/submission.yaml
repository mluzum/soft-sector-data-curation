data_file: table_1.yaml
description: Neutron multiplicity dependence of acoplanarity ($\alpha$) from process
  $\gamma\gamma$ to $\mu^+\mu^-$ in ultraperipheral PbPb at $\sqrt{s_{NN}}=5.02$ TeV.
keywords:
- name: observables
  values: [(1/NSig)dNSig/dAlpha]
- name: reactions
  values: [Pb ($\gamma$) Pb ($\gamma$) --> mu + mu + Pb(*) + Pb(*)]
- name: cmenergies
  values: ['5020.0']
- name: phrases
  values: [photon-photon interaction, di-muon production, neutron multiplicity dependence]
location: Data from Figure 1 (top left -- 0n0n).
name: Table 1
table_doi: 10.17182/hepdata.95233.v1/t1
