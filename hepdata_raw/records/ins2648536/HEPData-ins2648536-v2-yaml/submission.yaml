location: Data from Figure 2
name: Table 1
table_doi: 10.17182/hepdata.138867.v2/t1
---
data_file: table_2.yaml
description: The total coherent $\mathrm{J}/\psi$ photoproduction cross section as
  a function of photon-nuclear center-of-mass energy per nucleon $W_{\gamma \mathrm{N}}^{\mathrm{Pb}}$,
  measured in PbPb ultra-peripheral collisions at $\sqrt{s_{\mathrm{NN}}}$ = 5.02
  TeV. The $W_{\gamma \mathrm{N}}^{\mathrm{Pb}}$ values used correspond to the center
  of each rapidity range. The theoretical uncertainties is due to the uncertainties
  in the photon flux.
keywords:
- name: observables
  values: [SIG]
- name: cmenergies
  values: [5020]
- name: reactions
  values: [Pb Pb --> J/psi Pb Pb]
- name: phrases
  values: [J/psi, Photoproduction, Suppression, Nuclear Shadowing, Cross Section]
location: Data from Figure 3
name: Table 2
table_doi: 10.17182/hepdata.138867.v2/t2
---
data_file: table_3.yaml
description: The nuclear gluon suppression factor $R_{\mathrm{g}}^{\mathrm{Pb}}$ as
  a function of Bjorken $x$ extracted from the CMS measurement of the coherent $\mathrm{J}/\psi$
  photoproduction in PbPb ultra-peripheral collisions at $\sqrt{s_{\mathrm{NN}}}$
  = 5.02 TeV. The $x$ values are evaluated at the centers of their corresponding rapidity
  ranges. The theoretical uncertainties are due to the uncertainties in the photon
  flux and the  impulse approximation model.
keywords:
- name: observables
  values: [R]
- name: cmenergies
  values: [5020]
- name: reactions
  values: [Pb Pb --> J/psi Pb Pb]
- name: phrases
  values: [J/psi, Photoproduction, Suppression, Nuclear Shadowing, Cross Section]
location: Data from Figure 4
name: Table 3
table_doi: 10.17182/hepdata.138867.v2/t3
