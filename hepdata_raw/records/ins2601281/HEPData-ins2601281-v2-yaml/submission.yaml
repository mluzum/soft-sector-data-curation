- {description: analysis output file containing all data shown here, location: SpectralShapeEvolution.root}
- {description: python script used to create this HEPData entry from the attached
    root file, location: makeHEPDataEntry.py}
comment: CERN-LHC. ALICE. Multiplicity ($N_{\mathrm{ch}}$) distributions and transverse
  momentum ($p_{\mathrm{T}}$) spectra of inclusive primary charged particles in the
  kinematic range of $|\eta| < 0.8$ and $0.15\ \mathrm{GeV}/c < p_{\mathrm{T}} < 10\
  \mathrm{GeV}/c$ are reported for pp, p-Pb, Xe-Xe and Pb-Pb collisions at centre-of-mass
  energies per nucleon pair ranging from $\sqrt{s_\mathrm{NN}} = 2.76\ \mathrm{TeV}$
  up to $13\ \mathrm{TeV}$. The multiplicity distributions are also shown in their
  KNO-scaled form. The correlation between the transverse momentum of primary charged
  particles and the charged-particle multiplicity of the corresponding collision is
  reported in fine intervals. In addition, the mean $ \langle p_{\mathrm{T}} \rangle
  $ and standard deviation $ \sigma(p_{\mathrm{T}}) $ derived from these multiplicity
  dependent $p_\mathrm{T}$ spectra are shown as a function of $N_{\mathrm{ch}}$. The
  relative standard deviation $ \sigma(p_{\mathrm{T}}) / \langle p_{\mathrm{T}} \rangle
  $ of the spectra is reported as well. All observables are also presented as a function
  of the reltaive multiplicity $ N_{\mathrm{ch}}\ / \langle N_{\mathrm{ch}} \rangle
  $. Note that $ \langle N_{\mathrm{ch}} \rangle $ is calculated for the whole multiplicity
  range extending beyond the $N_{\mathrm{ch}}$ values reported for the multiplicity-differential
  observables. Also the transverse momentum spectra integrated over this full range
  of multiplicities are presented. The mean and standard deviation derived from these
  multiplicity-integrated $p_\mathrm{T}$ spectra are used to normalize the corresponding
  multiplicity-dependent values which are then reported as a function of $ N_{\mathrm{ch}}\
  / \langle N_{\mathrm{ch}} \rangle $.
hepdata_doi: 10.17182/hepdata.142463.v2
