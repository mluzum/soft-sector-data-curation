additional_resources:
- {description: cds record, location: 'https://cds.cern.ch/record/'}
comment: |
  CERN-LHC. Measurement of J/psi and Psi(2S) yields and their ratio as a function of charged-particle multiplicity in pp collisions at 13 TeV and p-Pb collisions at 8.16 TeV.

  Quarkonia:
  - in their dimuon decay
  - pT>0

  Charged-particle multiplicity in |eta|<1.0, pT>0

  Measurements reported in the INEL>0 event class.
hepdata_doi: 10.17182/hepdata.135830.v1
---
data_file: psi2s_yield_pp.yaml
description: Ratio of measured PSI(2S) cross section in charged-particle multiplicity
  intervals and integrated in multiplicity.
keywords:
- name: reactions
  values: [P P --> PSI(2S) X]
- name: observables
  values: [DSIG/DY]
- name: cmenergies
  values: [13000.0]
- name: phrases
  values: [Inclusive, Cross Section, Proton-Proton Scattering, PSI(2S) Production,
    Multiplicity Dependence]
location: Data from Figure 1 of preprint
name: Psi(2S) vs mult., pp
table_doi: 10.17182/hepdata.135830.v1/t1
