comment: BNL-RHIC-BRAHMS. Charged-particle pseudorapidity densities are presented
  for the d+Au reaction at sqrt{s_{NN}}=200 GeV with -4.2 <= eta <= 4.2$. The results,
  from the BRAHMS experiment at RHIC, are shown for minimum-bias events and 0-30%,
  30-60%, and 60-80% centrality classes. Models incorporating both soft physics and
  hard, perturbative QCD-based scattering physics agree well with the experimental
  results. The data do not support predictions based on strong-coupling, semi-classical
  QCD. In the deuteron-fragmentation region the central 200 GeV data show behavior
  similar to full-overlap d+Au results at sqrt{s_{NN}}=19.4 GeV.
