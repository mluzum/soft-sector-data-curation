data_file: table19_a.yaml
description: "Left panel: Statistical fluctuation and detector effects in the charge
  asymmetry variance (multiplied by the number of participants $N_{part}$) from the
  $\\eta<0$ region. The dotted curve shows the $1/N$ approximation, the dashed curve
  shows the statistical fluctuations $\\langle A^{2}_{-,{ LR,stat}}\\rangle$ obtained
  by the (50-50) method (see the text). The solid curve connecting the solid points
  shows the net effect of the statistical fluctuations and detector non-uniformities,
  $\\langle A^{2}_{-,{ LR,stat+det}}\\rangle$, obtained by the adding-$\\pi$ method,
  and the crosses shows the same but obtained from the ``scramble'' method. See the
  text for details. Middle panel: The statistical fluctuation effects relative to
  the $1/N$ approximation (thin curves) and the effects due to the imperfect detector
  (thick curves). The dashed curves are for the region $\\eta>0$ and the solid curves
  are for $\\eta<0$. Right panel: The ratios of the statistical fluctuation and detector
  effects $\\langle A^{2}_{+,{ LR,stat+det}}\\rangle/\\langle A^{2}_{-,{ LR,stat+det}}\\rangle$
  and $\\langle A^{2}_{+,{ UD,stat+det}}\\rangle/\\langle A^{2}_{+,{ LR,stat+det}}\\rangle$,
  separately for the $\\eta>0$ and $\\eta<0$ regions. The $\\phi$-acceptance correction
  was applied for the results in this figure.  \n"
