additional_resources:
- {description: web page with auxiliary material, location: 'https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2014-03/'}
comment: |
  CERN-LHC.
  Experimental measurements of the correlations between the elliptic or triangular flow coefficients, $v_m$ ($m=2$ or 3), and other flow harmonics, $v_n$ ($n=2$ to 5) in lead-lead collisions. The data tables are linked to the corresponding figure number in the paper as well as additional plots in reference.
