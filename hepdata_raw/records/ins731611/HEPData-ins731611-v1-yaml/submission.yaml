comment: |
  Measurement of J/PSI production at the PHENIX experiment, in p+p collisions at center-of-mass energy of 200GeV, for rapidities -2.2<y<2.2.The J/PSI invariant yield and nuclear modification factor Raa as a function of transverse momentum and rapidity are reported.     The statistical errors are the combination of statistical error and uncorrelated point-to-point systematic error (i.e. which can move the points independently of each other),quadratically summed. The systematic error is the point-to-point correlated systematic errors (which can move the points coherently, thus not necessarly by the same amount).Global systematic are mentioned in comments, if necessary.
