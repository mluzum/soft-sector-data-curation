description: "Subtracted $p_{T}$ spectrum in 300-750 compared to calculations from
  Elena Bratkovskaya. $p_{T}$ spectra of $e^{+}e^{\u2212}$ pairs for 0.3 < $m_{ee}$
  < 0.75 GeV/$c^{2}$ in Min. Bias Au + Au collisions compared to the expectations
  from the calculations of respectively R. Rapp and van Hees [15, 18, 83], Dusling
  and Zahed [19, 84, 85], Cassing and Bratkovskaya [20, 27, 86, 87]. The spectra are
  fully acceptance corrected. The curves show separately partonic and hadronic yields.
  For the curves of Rapp and van Hees [15, 18, 83] the two scenarios: Hadron Many
  Body Theory (HMBT) and Dropping Mass (DM) are shown. The sum is calculated with
  HMBT. The calculations are compared to the data from which the contributions of
  the cocktail of hadronic decays and charmed meson decays have been subtracted."
keywords:
- name: reactions
  values: [$d$ + Au $\implies$ CHARGED X, Au + Au$\implies$ CHARGED X, $p + p$$\implies$
      CHARGED X]
- name: cmenergies
  values: [200.0]
- name: phrases
  values: [ppg088, $e^+e^-$ pair continuum, $J/\psi$ meson, direct photon production]
location: Data From Fig. 46c of PRC 81 (2009) 034911
name: Figure 46c pt.1
table_doi: 10.17182/hepdata.145190.v1/t112
