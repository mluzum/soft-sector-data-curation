data_file: ppg088fig25.yaml
description: (Color online) Inclusive mass spectrum of $e^+e^-$ pairs in the PHENIX
  acceptance in $p$+$p$ collisions compared to the expectations from the decays of
  light hadrons and correlated decays of charm, bottom, and Drell-Yan. The contribution
  from hadron decays is independently normalized based on meson measurements in PHENIX.
  The bottom panel shows the ratio of data to the cocktail of known sources. The systematic
  uncertainties of the data are shown as boxes, while the uncertainty on the cocktail
  is shown as band around 1.
