description: "Subtracted $p_{T}$ spectrum in 300-750 compared to calculations from
  Ralf Rapp. $p_{T}$ spectra of $e^{+}e^{\u2212}$ pairs for 0.3 < $m_{ee}$ < 0.75
  GeV/$c^{2}$ in Min. Bias Au + Au collisions compared to the expectations from the
  calculations of respectively R. Rapp and van Hees [15, 18, 83], Dusling and Zahed
  [19, 84, 85], Cassing and Bratkovskaya [20, 27, 86, 87]. The spectra are fully acceptance
  corrected. The curves show separately partonic and hadronic yields. For the curves
  of Rapp and van Hees [15, 18, 83] the two scenarios: Hadron Many Body Theory (HMBT)
  and Dropping Mass (DM) are shown. The sum is calculated with HMBT. The calculations
  are compared to the data from which the contributions of the cocktail of hadronic
  decays and charmed meson decays have been subtracted."
