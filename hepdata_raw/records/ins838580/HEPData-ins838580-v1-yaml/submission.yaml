  $p_{T}$ ranges compared to predictions from Ralf Rapp (0<$p_{T}$<0.5 GeV/$c$). Invariant
  mass spectra of $e^{+}e^{-}$ pairs in Min. Bias Au + Au collisions for different
  $p_{T}$ windows compared to the expectations from the calculations of Rapp and van
  Hees [15, 18, 83], separately showing the partonic and the hadronic yields and the
  different scenarios for the $\\rho$ spectral function, namely \u201CHadron Many
  Body Theory\u201D (HMBT) and \u201CDropping Mass\u201D (DM). The calculations have
  been added to the cocktail of hadronic decays (where the contribution of the freeze-out
