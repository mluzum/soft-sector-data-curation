  for different $p_{T}$ windows collisions compared to the expectations from the calculations
  of Cassing and Bratkovskaya [20, 27, 86, 87], separately showing the partonic and
  the hadronic yields calculated with different implementations of the $\\rho$ spectral
  function, namely according to collisional broadening, with or without a dropping
  mass scenario. The calculations which include the dropping mass scenario have been
  added to the cocktail of hadronic decays (which is calculated by the HSD model itself)
  and charmed meson decays products."
