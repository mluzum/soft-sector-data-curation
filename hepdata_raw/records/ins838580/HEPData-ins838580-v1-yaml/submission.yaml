- {description: Thumbnail Image file, location: thumb_fig27.png}
data_file: ppg088fig27a1.yaml
description: '(Color online) Invariant mass spectrum of $e^+e^-$ pairs inclusive in
  $p_T$ compared to expectations from the model of hadron decays for $p$+$p$ and for
  different Au+Au centrality classes. The charmed meson decay contribution based on
  PYTHIA [55] is included in the sum of sources (solid black line). The dotted line
  shows the contribution from charm calculated assuming an isotropic angular distribution.
  Statistical (bars) and systematic (boxes) uncertainties are shown separately. The
  systematic uncertainty on the expected hadronic sources is not shown: it ranges
  from ~10% in the $\pi^o$ region to ~30% in the region of the vector mesons. The
  uncertainty on the charm cross section, which dominates the IMR, is ~30% in both
  $p$+$p$ and in Au+Au collisions.'
