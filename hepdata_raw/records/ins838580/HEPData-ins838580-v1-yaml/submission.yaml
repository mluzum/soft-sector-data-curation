  Au+Au spectra are divided by $N_{part}/2$. The solid curves show the expectations
  from the sum of the hadronic decay cocktail and the contribution from charmed mesons.
  The dashed curves show the sum of the cocktail and charmed meson contributions plus
  the contribution from direct photons calculated by converting the photon yield from
  Fig. 34 to the $e^+e^-$ pair yield using Eqs. (31) and (B14). $p$$+$$p$ collision
  data shown.
