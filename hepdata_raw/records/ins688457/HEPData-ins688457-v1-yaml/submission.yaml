comment: |
  Measurement of J/PSI production in d+Au and p+p collisions at center-of-mass energy of 200GeV. The cross-sections and nuclear dependence of J/PSI production versus rapidity,transverse momentum and centrality are presented     In this paper, the value XF is the momentum fraction of the gluon in the deuteron, minus it's momentum fraction in Au.
dateupdated: 13/04/2011 00:00:00
hepdata_doi: 10.17182/hepdata.57513.v1
modifications:
- {action: Encoded, date: 13 apr 2011, who: SB}
record_ids:
- {id: 688457, type: inspire}
- {id: 4871, type: red}
---
data_file: Table1.yaml
description: |
  J/PSI differential cross section in P+P reactions( times di-lepton branching ratio B=5.9%) as a function of rapidity.
keywords:
- name: reactions
  values: [P P --> J/PSI X]
- name: observables
  values: [DSIG/DYRAP]
- name: plabs
  values: ['21321,21321']
- name: phrases
  values: [Inclusive, J/Psi, Single Differential Cross Section, Rapidity Dependence,
    Proton-Proton Scattering, Muon production, Electron production]
- name: cmenergies
  values: [200.0]
location: Data from F1 P4
name: Table 1
table_doi: 10.17182/hepdata.57513.v1/t1
