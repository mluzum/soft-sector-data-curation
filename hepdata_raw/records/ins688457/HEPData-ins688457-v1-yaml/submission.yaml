data_file: Table3.yaml
description: |
  Total cross-section for J/PSI production in P P reactions. The total cross section is estimated using a pythia calculation, normalized to our data. The di-lepton branching ratio used is 5.9%.The systematic error given is due to the fit. The choice of the PDF and model was estimated to have little impact in the value of the total cross section.
keywords:
- name: reactions
  values: [P P --> J/PSI X]
- name: observables
  values: [SIG]
- name: plabs
  values: ['21321,21321']
- name: phrases
  values: [Inclusive, J/Psi, Integrated Cross Section, Cross Section, Proton-Proton
      Scattering, Muon production, Electron production]
- name: cmenergies
  values: [200.0]
location: Data from P4
name: Table 3
table_doi: 10.17182/hepdata.57513.v1/t3
