data_file: data1.yaml
description: |
  Differential cross section for Y(1S) states as a function of their transverse momentum and per unit of rapidity in pp collisions. Statistical (systematic) uncertainties are displayed as error bars (boxes). Global relative uncertainties of 3.7% are not displayed.
keywords:
- name: reactions
  values: [P P --> UPSILON(1S) X]
- name: observables
  values: ['$\frac{d^2 \sigma}{dy dp_{T}}$ (nb / GeV/c)']
- name: phrases
  values: [Inclusive, Upsilon, Proton-Proton Scattering, Cross Section, Muon production]
- name: cmenergies
  values: [2760.0]
location: Data from Figure 2 left
name: Table 1
