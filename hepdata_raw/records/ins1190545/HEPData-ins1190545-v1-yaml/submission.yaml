comment: |
  CERN-LHC.  Measuremements of the charged-particle pseudorapidity density over 4 units of  pseusdorapidity in non-single diffractive (NSD) proton-Lead collisions at a centre-of-mass energy  per nucleon pair of 5.02 TeV.   The average value at midrapidity is measured to be 16.81+-0.71(sys)  which corresponds to 2.14+-0.17(sys) per participating nucleon.
