comment: |
  CERN-LHC. 2- and 3-pion Bose-Einstein correlations are measured in pp, p-Pb, and Pb-Pb collisions. The same-charge correlation functions are fit with Gaussian, Edgeworth, and exponential functions to extract the radii. The following measurements are reported:
  - Same- and mixed-charge 3-pion full and cumulant correlation functions.
  - Gaussian, Edgworth, and exponental radii and intercept parameters for 2- and 3-pion fits.
