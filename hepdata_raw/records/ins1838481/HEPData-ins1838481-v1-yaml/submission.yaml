- {description: arXiv, location: 'https://arxiv.org/abs/2012.13601'}
- {description: web page, location: 'https://drupal.star.bnl.gov/STAR/publications/'}
comment: " Global polarization of $\\Xi$ and $\\Omega$ hyperons has been measured
  for the first time in Au+Au collisions at $\\sqrt{s_{NN}}$ = 200 GeV. The measurements
  of the $\\Xi^-$ and $\\bar{\\Xi}^+$ hyperon polarization have been performed by
  two independent methods, via analysis of the angular distribution of the daughter
  particles in the parity violating weak decay $\\Xi\\rightarrow\\Lambda+\\pi$, as
  well as by measuring the polarization of the daughter $\\Lambda$-hyperon, polarized
  via polarization transfer from its parent. The polarization, obtained by combining
  the results from the two methods and averaged over $\\Xi^-$ and $\\bar{\\Xi}^+$,
  is measured to be $\\langle P_{\\Xi}\\rangle$ = 0.47 $\\pm$ 0.10 (stat.) $\\pm$
  0.23 (syst.) % for the collision centrality 20%-80%. The $\\langle P_{\\Xi}\\rangle$
  is found to be slightly larger than the inclusive $\\Lambda$ polarization and in
  reasonable agreement with a multiphase transport model. The $\\langle P_{\\Xi}\\rangle$\u27E8P\u039E\u27E9
  is found to follow the centrality dependence of the vorticity predicted in the model,
  increasing toward more peripheral collisions. The global polarization of $\\Omega$,
  $\\langle P_{\\Omega}\\rangle$ = 1.11 $\\pm$ 0.87 (stat.) $\\pm$ 1.97 (syst.) %
  was obtained by measuring the polarization of daughter $\\Lambda$ in the decay $\\Omega\\rightarrow\\Lambda+K$,
  assuming the polarization transfer factor $C_{\\Omega\\Lambda}$ = 1. "
hepdata_doi: 10.17182/hepdata.100234.v1
