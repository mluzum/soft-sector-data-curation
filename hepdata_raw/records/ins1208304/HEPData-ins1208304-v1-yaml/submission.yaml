additional_resources:
- {description: web page with auxiliary material, location: 'http://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2012-13/'}
comment: |
  CERN-LHC.  Two-particle correlations in relative azimuthal angle, Delta(phi), and pseudorapidity, Delta(eta), are measured in sqrt(sNN) = 5.02 TeV p+Pb collisions recorded in September 2012 using the ATLAS detector at the LHC.  The measurements are performed using approximately 1 mub^1 of data as a function of transverse momentum (pT) and the transverse energy summed over 3.1 < eta < 4.9 in the direction of the Pb beam.  The correlation function, constructed from charged particles, exhibits a long-range (2 < |Delta(eta)| < 5) near-side (Delta(phi) ~ 0) correlation that grows rapidly with increasing transverse energy.  A long-range away-side (Delta(phi) ~ pi) correlation, obtained by subtracting the expected contributions from recoiling dijets and other sources estimated using events with small transverse energy, is found to match the near-side correlation in magnitude, shape (in Delta(eta) and Delta(phi)) and transverse energy dependence.  The resultant Delta(phi) correlation is approximately symmetric about pi/2, and is consistent with a dominant cos(2*Delta(phi)) modulation for all transverse energy ranges and particle pT.
