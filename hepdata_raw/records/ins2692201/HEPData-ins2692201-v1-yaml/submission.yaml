additional_resources: []
comment: The transverse momentum ($p_T$) and centrality dependence of the nuclear
  modification factor $R_{AA}$ of prompt and non-prompt J/$\psi$, the latter originating
  from the weak decays of beauty hadrons, have been measured by the ALICE collaboration
  in Pb--Pb collisions at 5.02 TeV. The measurements are carried out through the e^+e^-
  decay channel at midrapidity ($|y| < 0.9$) in the transverse momentum region $1.5
  < $p_T$ < 10$~\GeVc. Both prompt and non-prompt J/$\psi$ measurements indicate a
  significant suppression for $p_T$ $>$ 5~\GeVc, which becomes stronger with increasing
  collision centrality. The results are consistent with similar LHC measurements in
  the overlapping $p_T$ intervals, and cover the kinematic region down to $p_T$ =
  1.5 \GeVc at midrapidity, not accessible by other LHC experiments. The suppression
  of prompt J/$\psi$ in central and semicentral collisions exhibits a decreasing trend
  towards lower transverse momentum, described within uncertainties by models implementing
  J/$\psi$ production from recombination of c and $\overline{\rm c}$ quarks produced
  independently in different partonic scatterings. At high transverse momentum, transport
  models including quarkonium dissociation are able to describe the suppression for
  prompt J/$\psi$. For non-prompt J/$\psi$, the suppression predicted by models including
  both collisional and radiative processes for the computation of the beauty-quark
  energy loss inside the quark--gluon plasma is consistent with measurements within
  uncertainties.
hepdata_doi: 10.17182/hepdata.146723.v1
