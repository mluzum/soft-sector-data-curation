comment: "Transverse momentum $(p_{\\rm T})$ spectra of charged particles was measured
  at mid-pseudorapidity in Xe\u2013Xe collisions at $\\sqrt{s_{\\rm NN}} = 5.44$ TeV,
  in the kinematic range of $0.15<p_{\\rm T}<50$ GeV/c and $|\\eta|<0.8$. The pp reference
  at $\\sqrt{s} = 5.44$ TeV is interpolated between existing pp measurements at $\\sqrt{s}
  = 5.02$ and $7$ TeV. The nuclear modification factor is calculated for Xe-Xe and
  Pb-Pb collisions at similar center-of-mass energy, as a function of $p_{\\rm T}$
  and the charged particle multiplicity density. The average transverse momentum $\\langle
  p_{\\rm T} \\rangle$ is calculated for both systems, as well as the ratio between
  them.\n"
hepdata_doi: 10.17182/hepdata.85727.v3
