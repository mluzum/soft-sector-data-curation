additional_resources:
- {description: web page with all results and auxiliary material, location: 'http://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-16-015/'}
comment: "CERN-LHC. Measurements of prompt $\\psi$(2S) meson production in proton-proton
  (pp) and proton-lead (pPb) collisions at a center-of-mass energy per nucleon pair
  of 5.02 TeV are reported. The results are based on pPb and pp data collected by
  the CMS experiment at the LHC, corresponding to integrated luminosities of 34.6
  nb$^{\u22121}$ and 28.0 pb$^{\u22121}$, respectively. The nuclear modification factor,
  $R_{\\mathrm{pPb}}$ is measured for prompt $\\psi$(2S) in the transverse momentum
  range 4 $<p_{\\mathrm{T}}<$30 GeV/c and the center-of-mass rapidity range -2.4$<y_{\\mathrm{CM}}<$1.93.\\n
  See arXiv:1805.02248 for more details.\\n\""
hepdata_doi: 10.17182/hepdata.83197.v2
---
data_file: data1.yaml
description: Differential cross section (multiplied by the dimuon branching fraction)
  of prompt $\psi$(2S) mesons in pPb collisions at $\sqrt(s_{\textrm{NN}})=5.02 $
  TeV, as a function of $p_{\textrm{T}}$, for four backward $y_{\mathrm{CM}}$ regions.
  The fully correlated luminosity uncertainty of 3.5% is not included in the point-by-point
  uncertainty. NOTE- The cross section unit is nb (nano barn); the y-axes of the figures
  in the publication show pb (pico barn) by mistake.
keywords:
- name: reactions
  values: [P PB --> PSI2S < MU+ MU- > X]
- name: observables
  values: [B*D2SIG/DPT/DY_CM]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Prompt Psi2S, Differential Cross Section, Proton-Lead]
location: Data from Fig. 2 of preprint and paper (upper).
name: Table 1
table_doi: 10.17182/hepdata.83197.v2/t1
