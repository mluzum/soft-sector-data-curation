additional_resources:
- {description: Created with hepdata_lib 0.9.0, location: 'https://zenodo.org/record/4946277'}
comment: Multiparticle azimuthal correlations of prompt $D^0$ mesons are measured
  in PbPb collisions at $\sqrt{s_{NN}}=5.02~TeV$. The data, collected using the CMS
  detector at the LHC in 2018, correspond to an integrated luminosity of $0.58~nb^{-1}$.
  The second Fourier coefficient of the azimuthal distribution ($v_2$) of $D^0$ mesons
  as a function of their transverse momentum and event centrality is extracted for
  the first time using a four-particle cumulant method. Using previously measured
  two-particle cumulant results, the ratios of $v_2$ values obtained with the four-
  and two-particle cumulant methods are found to be below unity for prompt $D^0$ mesons.
  These ratios are also comparable to those of all charged particles in the event.
  However, hints of deviation are seen in the most central and peripheral collisions.
  To further investigate the origin of flow fluctuations in the charm sector, these
  measurements are compared with models implementing different mechanisms of charm
  quark energy loss in the quark-gluon plasma.
