comment: |
  CERN-LHC. Measurements of the inclusive PT distributions of primary charged particles  from PB-PB collisions at a centre-of-mass energy per nucleon of 2.76 TeV.  The data, based on  1.6*10**7 minimum-bias events recorded in 2010 covering  the |eta| range < 0.8 and PT range 0.15-50 GeV/c, are presented as the charged particle   distributions and nuclear modification factors RAA as a function of PT in 9 centrality intervals   from 70-80% to 0-5%.
dateupdated: 04/12/2012 14:40:15
hepdata_doi: 10.17182/hepdata.59944.v1
modifications:
- {action: Encoded, date: 9 NOV 2012, who: Mike Whalley}
