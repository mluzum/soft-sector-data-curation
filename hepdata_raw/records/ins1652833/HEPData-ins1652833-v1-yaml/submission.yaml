additional_resources:
- {description: web page, location: 'http://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-16-005/index.html'}
comment: "CERN-LHC.  Measurements of the b jet pair transverse momentum asymmetry
  in proton-proton and lead-lead collisions at a centre-of-mass energy of 5.02 TeV
  with data collected in 2015.   The leading and subleading jets are required to be
  above 100 and 30 GeV, respectively.  Both jets are restricted to an absolute pseudorapidity
  of less than 1.6 units. \n"
hepdata_doi: 10.17182/hepdata.82819.v1
---
data_file: data1.yaml
description: Performance of double b-jet tagging, in terms of b-tagging purity and
  efficiency
keywords:
- name: reactions
  values: [PB PB (P P) --> BJET BJET]
- name: observables
  values: [b tagging efficiency, b-tagging purity]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Dijet asymmetry, B-jet, PbPb collisions]
location: Data from Page 3 of preprint
name: Table 1
table_doi: 10.17182/hepdata.82819.v1/t1
