comment: A search for magnetic monopoles is presented using 0.262 nb$^{-1}$ of Run
  3 ultraperipheral Pb+Pb collision (UPC) data at $\sqrt{s_{\textrm{NN}}}=5.36$ TeV
  collected by the ATLAS detector at the LHC. By exploiting the properties of clusters
  reconstructed in the innermost silicon detector layers, a new methodology for studying
  highly ionizing particles in heavy-ion data at the LHC is introduced. Using a non-perturbative
  semiclassical model, upper limits are set on the cross-section for pair production
  of monopoles with a single Dirac magnetic charge in the mass range of 20--150 GeV.
  The search improves the previous cross-section limits for production of monopoles
  with masses below 120 GeV in Pb+Pb UPC.
