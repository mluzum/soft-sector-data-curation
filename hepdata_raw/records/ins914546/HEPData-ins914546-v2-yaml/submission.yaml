- {description: arXiv, location: 'https://arxiv.org/abs/1106.4334'}
comment: "We present first measurements of the evolution of the differential transverse
  momentum correlation function, C, with collision centrality in Au+Au interactions
  at $\\sqrt{s_{NN}}$ = 200 GeV. This observable exhibits a strong dependence on collision
  centrality that is qualitatively similar to that of number correlations previously
  reported. We use the observed longitudinal broadening of the near-side peak of C
  with increasing centrality to estimate the ratio of the shear viscosity to entropy
  density, \u03B7/s, of the matter formed in central Au+Au interactions. We obtain
  an upper limit estimate of \u03B7/s that suggests that the produced medium has a
  small viscosity per unit entropy."
hepdata_doi: 10.17182/hepdata.102406.v2
