- {description: arXiv, location: 'https://arxiv.org/abs/1010.1246'}
- {description: InspireHEP, location: 'https://inspirehep.net/literature/871818'}
comment: |
  We present measurements of $J/\psi$ yields in $d$$+$Au collisions at $\sqrt{s_{_{NN}}}=200$ GeV recorded by the PHENIX experiment and compare them with yields in $p$$+$$p$ collisions at the same energy per nucleon-nucleon collision. The measurements cover a large kinematic range in $J/\psi$ rapidity ($-2.2<y<2.4$) with high statistical precision and are compared with two theoretical models: one with nuclear shadowing combined with final state breakup and one with coherent gluon saturation effects. In order to remove model dependent systematic uncertainties we also compare the data to a simple geometric model. The forward rapidity data are inconsistent with nuclear modifications that are linear or exponential in the density weighted longitudinal thickness, such as those from the final state breakup of the bound state.
hepdata_doi: 10.17182/hepdata.146014.v1
