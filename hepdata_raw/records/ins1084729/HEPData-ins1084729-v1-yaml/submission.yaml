comment: |
  CERN-LHC.  Measurement of the production of isolated photons in proton-proton and Lead-Lead collisions at centre-of-mass energies per nucleon of 2.76 TeV.  The data samples, collected with minimum bias and photon triggers, have integrated  luminosities of 231 nb-1 and 6.8 mub-1 for the p-p and Pb-Pb data respectively and cover the |pseudorapidity| range <1.44 with transverseenergy,ET, between 20 and 80 GeV.
