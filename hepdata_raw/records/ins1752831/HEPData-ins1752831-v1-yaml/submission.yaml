comment: |
  CERN-LHC. The production of the $\Lambda$(1520) baryonic resonance has been measured at midrapidity in inelastic pp collisions at $\sqrt{s}$ $\mathrm{=}$ 7 TeV and in p--Pb collisions at $\sqrt{s_{\rm{NN}}}$ $\mathrm{=}$ 5.02 TeV for non-single diffractive events and in multiplicity classes. The resonance is reconstructed through its hadronic decay channel $\Lambda$(1520) $\rightarrow$ pK$^{-}$ and the charge conjugate with the ALICE detector. The integrated yields and mean  transverse momenta are calculated from the measured transverse momentum distributions in pp and p--Pb collisions. The mean transverse momenta follow mass ordering as previously observed for other hyperons in the same collision systems. A Blast-Wave function constrained by other light hadrons ($\pi$, K, K$_{\rm{S}}^0$, p, $\Lambda$) describes the shape of the $\Lambda$(1520) transverse momentum distribution up to 3.5 GeV/$c$ in p--Pb collisions. In the framework of this model, this observation suggests that the $\Lambda$(1520) resonance participates in the same collective radial flow as other light hadrons. The ratio of the yield of $\Lambda$(1520) to the yield of the ground state particle $\Lambda$ remains constant as a function of charged-particle multiplicity, suggesting that there is no net effect of the hadronic phase in p--Pb collisions on the $\Lambda$(1520) yield.
hepdata_doi: 10.17182/hepdata.115139.v1
---
data_file: Table1.yaml
description: $p_{\rm T}$-differential yields of $\Lambda$(1520) (sum of particle and
  anti-particle states) at midrapidity in inelastic pp collisions at $\sqrt{s}$ $\mathrm{=}$
  7 TeV.
keywords:
- name: reactions
  values: [P P --> LAMBDA(1520) X, P P --> LAMBDA_BAR(1520) X]
- name: observables
  values: [DN/DPT/DYRAP]
- name: cmenergies
  values: [7000.0]
- name: phrases
  values: [Inclusive, Single Differential Distribution, Transverse Momentum Dependence]
location: Data from Figure 3
name: Table 1
table_doi: 10.17182/hepdata.115139.v1/t1
