  $\eta$ -> 3$\pi^0$, $\eta$ -> $\pi^+\pi^-\pi^0$, and $K_S^0$ -> $\pi^0\pi^0$, which
  were expected to be negligible. Normalization uncertainties of 11.7% for p+p and
  5.3% for d+Au are not shown.
