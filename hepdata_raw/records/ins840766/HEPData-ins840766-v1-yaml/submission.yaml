data_file: table_28.yaml
description: Cross sections for direct photon production at midrapidity in p + p and
  d + Au collisions at $\sqrt{s_{NN}}$ = 200 GeV, compared to the PHENIX measurement
  [29] and to the NLO pQCD calculation [68], which was scaled with $<T_{dA}>$ [Eq.
  (23)] in case of d + Au collisions. The error bars are statistical the shaded bands
  are $p_T$-correlated systematic uncertainties. The arrows correspond to the 95%
  confidence limits, as defined in the text. Normalization uncertainties of 11.7%
  for p+p and 5.3% for d+Au are not shown. Separate columns in the table show upper
  95% confidence limits. The 95% confidence limits for the cross section are used
  when $R_{\gamma}$ did not correspond to a significant direct photon signal, assuming
  that the statistical and systematic errors both followed a Gaussian distribution,
  and using the fact that $R_{\gamma}\geq 1$ by definition.
