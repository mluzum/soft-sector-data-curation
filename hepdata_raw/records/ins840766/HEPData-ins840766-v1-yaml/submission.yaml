- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/inclusive-pi0-eta-and-direct-photon-production-pp-and-dau-collisions-sqrtsnn-200-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/0912.3838'}
comment: We report a measurement of high-$p_T$ inclusive $\pi^0$, $\eta$, and direct
  photon production in p+p and d+Au collisions at $\sqrt{s_{NN}}$ = 200 GeV at midrapidity
  (0 < $\eta$ < 1). Photons from the decay $\pi^0$ -> $\gamma\gamma$ were detected
  in the Barrel Electromagnetic Calorimeter of the STAR experiment at the Relativistic
  Heavy Ion Collider. The $\eta$ -> $\gamma\gamma$ decay was also observed and constituted
  the first eta measurement by STAR. The first direct photon cross section measurement
  by STAR is also presented, the signal was extracted statistically by subtracting
  the $\pi^0$, $\eta$, and $\omega$(782) decay background from the inclusive photon
  distribution observed in the calorimeter. The analysis is described in detail, and
  the results are found to be in good agreement with earlier measurements and with
  next-to-leading order perturbative QCD calculations.
hepdata_doi: 10.17182/hepdata.99155.v1
