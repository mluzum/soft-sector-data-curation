comment: BNL-RHIC-BRAHMS. Transverse momentum spectra and rapidity densities, dN/dy,
  of protons, anti-protons, and net--protons (p-pbar) from central (0-5%) Au+Au collisions
  at sqrt(sNN) = 200 GeV were measured with the BRAHMS experiment within the rapidity
  range 0 < y < 3. The proton and anti-proton dN/dy decrease from mid-rapidity to
  y=3. The net-proton yield is roughly constant for y<1 at dN/dy~7, and increases
  to dN/dy~12 at y~3. The data show that collisions at this energy exhibit a high
  degree of transparency and that the linear scaling of rapidity loss with rapidity
  observed at lower energies is broken. The energy loss per participant nucleon is
  estimated to be 73 +- 6 GeV.
