data_file: tab2.yaml
description: '$\frac{\mathrm{d}N}{\mathrm{d}y}$ versus $y$ for $\mathrm{p}$,$\overline{\mathrm{p}}$,$\mathrm{p}-\overline{\mathrm{p}}$
  in $\mathrm{Au}-\mathrm{Au}$ at $\sqrt{s_{\mathrm{NN}}}=200\,\mathrm{Ge\!V}$ . The
  correction for the $\Lambda$ contribution is not straight forward since BRAHMS does
  not measure the $\Lambda$s and PHENIX and STAR only measures the $\Lambda$s at mid-rapidity!
  If one assumes that the mid-rapidity estimated in the paper of  $$R=\frac{\Lambda-\bar{\Lambda}}{\mathrm{p}-\bar{\mathrm{p}}}
  = \frac{\Lambda}{\mathrm{p}} = \frac{\bar{\Lambda}}{\bar{\mathrm{p}}} = 0.93\pm
  0.11(\mathrm{stat})\pm 0.25(\mathrm{syst}) $$ and the BRAHMS "acceptance factor"
  of  $A=0.53\pm 0.05$ which includes both that only 64% decays to protons and that
  some are rejected by the requirement of the track to point back to the IP. The corrected
  $\mathrm{p}$ ($\bar{\mathrm{p}}$ or net-$\mathrm{p}$) is then : $$\left.\frac{\mathrm{d}N}{\mathrm{d}y}\right|_{\mathrm{corrected}}
  = \frac{\mathrm{d}N}{\mathrm{d}y}(1/(1+RA))= \frac{\mathrm{d}N}{\mathrm{d}y}\left(0.67\pm
  0.05(\mathrm{stat})\pm 0.11(\mathrm{syst})\right)$$ Which can be used at all rapidities
  if one believes that R is constant. The fact that net-$\mathrm{K}=\mathrm{K}^{+}-\mathrm{K}^{-}$
  follows net-$\mathrm{p}$ (see fx. talk by Djamel Ouerdane at QM04), seems to indicate
  that the net-$\Lambda$ follow the net-$\mathrm{p}$ trend and the correction is reasonable.'
