additional_resources:
- {description: Created with hepdata_lib 0.10.1, location: 'https://zenodo.org/record/4946277'}
comment: The first study in heavy ion collisions of the shapes of jets arising from
  bottom (b) quarks is presented. Jet shapes are studied using charged hadron constituents
  as a function of their radial distance from the jet axis. Lead-lead (PbPb) collision
  data at a nucleon-nucleon center-of-mass energy of $\sqrt{s_{NN}}=5.02$~TeV were
  recorded by the CMS detector at the LHC, with an integrated luminosity of $1.69~\mathrm{nb}^{-1}$.
  Compared to proton-proton collisions, the quark-gluon plasma (QGP) created in PbPb
  collisions causes a redistribution of the energy in b jets to larger distances from
  the jet axis. This QGP-induced redistribution is substantially larger for b jets
  than for inclusive jets.
