additional_resources: []
comment: "CERN-LHC. The first measurement of $\\phi$-meson production in p-Pb collisions
  at a nucleon-nucleon centre-of-mass energy $\\sqrt{s_{\\rm NN}}$ = 5.02 TeV has
  been performed with the ALICE apparatus at the LHC. $\\phi$-mesons have been identified
  in the dimuon decay channel in the transverse momentum ($p_{\\rm T}$) range $1 <
  p_{\\rm T} < 7$ GeV/$c$, both in the p-going ($2.03 < y < 3.53$) and the Pb-going
  ($-4.46 < y < -2.96$) directions, where $y$ stands for the rapidity in the nucleon-nucleon
  centre-of-mass. Differential cross sections as a function of transverse momentum
  and rapidity are presented. The forward-backward asymmetry for phi-meson production
  is measured for $2.96<|y|<3.53$, showing no significant $p_{\\rm T}$ dependence
  within the uncertainties. The $p_{\\rm T}$-dependence of the phi nuclear modification
  factor $R_{\\rm pPb}$ exhibits an enhancement up to a factor 1.6 at $p_{\\rm T}$
  = 3-4 GeV/$c$ in the Pb-going direction. The $p_{\\rm T}$-dependence of the $\\phi$-meson
  cross section in pp collisions at $\\sqrt{s}$ = 2.76 TeV, which is used to determine
  a reference for the p-Pb results, is also presented here for $1 < p_{\\rm T} < 5$
  GeV/$c$ and $2.5 <y < 4$. \n"
