additional_resources:
- {description: web page with figures, location: 'https://drupal.star.bnl.gov/STAR/publications/kaon-production-and-kaon-pion-ratio-au-au-collisions-sqrt-s-sub-nn-sub-130-gev'}
comment: "Mid-rapidity transverse mass spectra and multiplicity densities of charged
  and neutral kaons are reported for Au+Au collisions at \\snn=130 GeV at RHIC. The
  spectra are exponential in transverse mass, with an inverse slope of about 280 MeV
  in central collisions. The multiplicity densities for these particles scale with
  the negative hadron pseudo-rapidity density. The charged kaon to pion ratios are
  K+/\u03C0\u2212=0.161\xB10.002(stat)\xB10.024(syst) and K\u2212/\u03C0\u2212=0.146\xB10.002(stat)\xB10.022(syst)
  for the most central collisions. The K+/\u03C0\u2212 ratio is lower than the same
  ratio observed at the SPS while the K\u2212/\u03C0\u2212 is higher than the SPS
  result. Both ratios are enhanced by about 50% relative to p+p and p\xAF+p collision
  data at similar energies.\n"
hepdata_doi: 10.17182/hepdata.98923.v1
