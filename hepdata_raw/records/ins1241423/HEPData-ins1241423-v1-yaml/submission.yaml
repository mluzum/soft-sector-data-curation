comment: |
  CERN-LHC. Measurements of the average transverse momentum versus the  multiplicity  of charged particles having 0.15 <PT < 10 GeV and |eta| < 0.3, produced in proton-Lead collisions   at a centre-of-mass energy/nucleon 5.02 TeV.    Results are also presented for  data from proton-proton and Lead-Lead collisions at centre-of-mass energies/nucleon  of 0.9, 2.76 and 7 TeV in the same kinematic regions.
