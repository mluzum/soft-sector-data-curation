comment: |
  CERN-LHC. Measurements of the PT distributions of primary charged particles produced in non-single-diffractive (NSD)  proton-Lead collisions at a centre-of-mass energy/nucleon of 5.02 TeV. The data, collected during the September  2012 LHC run, cover the PT region 0.5 to 20 GeV/c in 3 near central rapidity regions,  |eta|<0.3, 0.3-0.8 and 0.8-1.3. The nuclear modification factor R_pPb is determined to be consistent with unity above a PT of 2 GeV.
