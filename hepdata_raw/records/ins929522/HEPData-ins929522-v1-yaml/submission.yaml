- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/directed-and-elliptic-flow-charged-particles-cucu-collisions-sqrtbm-snn-224-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/1109.5446'}
comment: "This paper reports results for directed flow $v_{1}$ and elliptic flow $v_{2}$
  of charged particles in Cu+Cu collisions at $\\sqrt{s_{NN}}$ = 22.4 GeV at the Relativistic
  Heavy Ion Collider. The measurements are for the 0-60% most central collisions,
  using charged particles observed in the STAR detector. Our measurements extend to
  22.4 GeV Cu+Cu collisions the prior observation that $v_{1}$ is independent of the
  system size at 62.4 and 200 GeV, and also extend the scaling of $v_{1}$ with $\\eta/y_{beam}$
  to this system. The measured $v_{2}(p_{T})$ in Cu+Cu collisions is similar for $\\sqrt{s_{NN}}$
  = 22.4\u2212200 GeV. We also report a comparison with results from transport model
  (UrQMD and AMPT) calculations. The model results do not agree quantitatively with
  the measured $v_{1}(\\eta)$, $v_{2}(p_{T})$ and $v_{2}(\\eta)$."
hepdata_doi: 10.17182/hepdata.98622.v1
