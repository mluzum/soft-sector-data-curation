  Au + Au collisions at $\\sqrt{s_{NN}}$ = 200 GeV. Panels (a) and (b) show $v_2$
  as a function of transverse momentum $p_T$. The $v_2$ of all species for centrality
  0\u201320% has been scaled up by a factor of 1.6 for better comparison with results
  of 20\u201360% centrality. The error bars (shaded boxes) represent the statistical
  (systematic) uncertainties. The systematic uncertainties shown are type A and B
  only."
