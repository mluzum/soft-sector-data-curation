additional_resources:
- {description: web page with data points, location: 'https://phenix-intra.sdcc.bnl.gov/phenix/WWW/p/info/ppg/123/'}
- {description: arXiv, location: 'http://arxiv.org/abs/1203.2644'}
- {description: InspireHEP, location: 'https://inspirehep.net/literature/1093596'}
comment: "Measurements of the anisotropy parameter $v_2$ of identified hadrons (pions,
  kaons, and protons) as a function of centrality, transverse momentum $p_T$ , and
  transverse kinetic energy KE$_T$ at midrapidity (|$\\eta$| < 0.35) in Au + Au collisions
  at $\\sqrt{s_{NN}}$ =200 GeV are presented. Pions and protons are identified up
  to $p_T$ = 6 GeV/c, and kaons up to $p_T$ = 4 GeV/c, by combining information from
  time-of-flight and aerogel Cerenkov detectors in the PHENIX \u02C7Experiment. The
  scaling of $v_2$ with the number of valence quarks ($n_q$) has been studied in different
  centrality bins as a function of transverse momentum and transverse kinetic energy.
  A deviation from previously observed quark-number scaling is observed at large values
  of KE$_T$ /$n_q$ in noncentral Au + Au collisions (20\u201360%), but this scaling
  remains valid in central collisions (0\u201310%).\n"
hepdata_doi: 10.17182/hepdata.141645.v1
