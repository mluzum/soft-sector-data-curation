comment: |
  BNL-RHIC.  Dihadron correlations are analyzed in $\sqrt{s_{_{\rm NN}}} = 200$ GeV $d$+Au collisions classified by forward charged particle multiplicity and zero-degree neutral energy in the Au-beam direction. It is found that the jetlike correlated yield increases with the event multiplicity. After taking into account this dependence, the non-jet contribution on the away side is minimal, leaving little room for a back-to-back ridge in these collisions.
dateupdated: 04/07/2016 15:46:11
hepdata_doi: 10.17182/hepdata.73235.v1
