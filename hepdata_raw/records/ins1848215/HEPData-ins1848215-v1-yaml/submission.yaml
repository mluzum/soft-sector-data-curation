{comment: 'Correlations between moments of different flow coefficients are measured
    in Pb--Pb collisions at $\sqrt{s_{\rm NN}} = 5.02$~TeV recorded with the ALICE
    detector. Multiparticle mixed harmonic cumulants are calculated using charged
    particles in the pseudorapidity region $|\eta|<0.8$ with the transverse momentum
    range $0.2 < p_{\rm T} < 5.0$ GeV/$c$. The centrality dependence of correlations
    between two flow coefficients as well as the correlations between three flow coefficients,
    both in terms of their second moments, are shown. In addition, a collection of
    mixed harmonic cumulants involving higher moments of $v_2$ and $v_3$ is measured
    for the first time, where the characteristic signature of negative, positive and
    negative signs of four-, six- and eight-particle cumulants are observed, respectively.',
  hepdata_doi: 10.17182/hepdata.105046.v1}
