data_file: Fig1A_1.yaml
description: "The centrality dependence of e+e\u2212 invariant mass spectra within
  the STAR acceptance from Au+Au collisions and U+U collisions for pair pT < 0.15
  GeV/c. The vertical bars on data points depict the statistical uncertainties, while
  the systematic uncertainties are shown as gray boxes. The hadronic cocktail yields
  from U+U collisions are \u223C5%\u201312% higher than those from Au+Au collisions
  in given centrality bins; thus only cocktails for Au+Au collisions are shown here
  as solid lines, with shaded bands representing the systematic uncertainties for
  clarity."
