  cocktail) within the STAR acceptance in 60%\u201380% for Au + Au and U + U collisions,
  compared with a broadened rho meson model calculation [8]. The contributions of
  rho and phi from the photonuclear process are shown, as are the contributions of
  photon-photon process from two models [33,34]. The model calculations are for Au
  + Au collisions in the corresponding centrality bins."
