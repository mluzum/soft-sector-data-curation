comment: "CERN-LHC. \nA measurement of dijet correlations in p-Pb collisions at $\\mathbf{\\sqrt{{\\it
  s}_{NN}}}=5.02$ TeV with the ALICE detector is presented. Jets are reconstructed
  from charged particles measured in the central tracking detectors and neutral energy
  deposited in the electromagnetic calorimeter. The transverse momentum of the full
  jet (clustered from charged and neutral constituents) and charged jet (clustered
  from charged particles only) is corrected event-by-event for the contribution of
  the underlying event, while corrections for underlying event fluctuations and finite
  detector resolution are applied on an inclusive basis. \nA projection of the dijet
  transverse momentum, $\\it{k}_{T,y} = p_\\mathrm{T,jet}^\\mathrm{ch+ne} \\; \\mathrm{sin}(\\Delta
  \\phi_{\\mathrm{dijet}})$ with $\\Delta \\phi_{\\mathrm{dijet}}$ the azimuthal angle
  between a full and charged jet and $p_\\mathrm{T,jet}^\\mathrm{ch+ne}$ the transverse
  momentum of the full jet, is used to study nuclear matter effects in p-Pb collisions.
  This observable is sensitive to the acoplanarity of dijet production and its potential
  modification in p-Pb collisions with respect to pp collisions. Measurements of the
  dijet $\\it{k}_{T,y}$ as a function of the transverse momentum of the full and recoil
  charged jet, and the event multiplicity are presented. No significant modification
  of $\\it{k}_{T,y}$ due to nuclear matter effects in p-Pb collisions with respect
  to the event multiplicity or a PYTHIA8 reference is observed.\n"
