additional_resources:
- {description: Created with hepdata_lib 0.9.0, location: 'https://zenodo.org/record/4946277'}
comment: Production cross sections of $\Upsilon(1S)$, $\Upsilon(2S)$, and $\Upsilon(3S)$
  states decaying into $\mu^{+}\mu^{-}$ in proton-lead (pPb) collisions are reported
  using data collected by the CMS experiment at $\sqrt{s_{_{\mathrm{NN}}}} = $ 5.02
  TeV. A comparison is made with corresponding cross sections obtained with pp data
  measured at the same collision energy and scaled by the Pb nucleus mass number.
  The nuclear modification factor for $\Upsilon(1S)$ is found to be $R_{\mathrm{pPb}}(\Upsilon(1S))
  = $ 0.806 $ \pm\ $ 0.024 (stat) $ \pm\ $ 0.059 (syst). Similar results for the excited
  states indicate a sequential suppression pattern, such that $R_{\mathrm{pPb}}(\Upsilon(1S))
  > R_{\mathrm{pPb}}(\Upsilon(2S)) > R_{\mathrm{pPb}}(\Upsilon(3S))$. The suppression
  is much less pronounced in pPb than in PbPb collisions, and independent of transverse
  momentum $p^{\Upsilon}_{T}$ and center-of-mass rapidity $y^{\Upsilon}_{CM}$ of the
  individual $\Upsilon$ state in the studied range $p^{\Upsilon}_{T} < $ 30 GeV/c
  and $|y^{\Upsilon}_{CM}| < $ 1.93. Models that incorporate sequential suppression
  of bottomonia in pPb collisions are in better agreement with the data than those
  which only assume initial-state modifications.
data_license: {description: The content can be shared and adapted but you must             give
    appropriate credit and cannot restrict access to others., name: cc-by-4.0, url: 'https://creativecommons.org/licenses/by/4.0/'}
hepdata_doi: 10.17182/hepdata.88291.v1
---
data_file: table_1.yaml
description: Differential cross section times dimuon branching fraction of Y(1S) as
  a function of pT in pPb collisions. The global uncertainty arises from the integrated
  luminosity uncertainty in pPb collisions.
keywords:
- name: observables
  values: ['$ \mathcal{B} \times \frac{d\sigma}{dp_{T} dy} $']
- name: reactions
  values: [P Pb --> Upsilon(1S) X]
- name: phrases
  values: [Inclusive, Bottomonia, Cross Section, Proton-Lead Scattering, Muon Production]
- name: cmenergies
  values: ['5020.0']
location: Data from Figure 2 (upper left)
name: Table 1
table_doi: 10.17182/hepdata.88291.v1/t1
