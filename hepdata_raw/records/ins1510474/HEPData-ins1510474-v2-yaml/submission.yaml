description: Lambda and AntiLambda polarization as a function of collision energy.
  A 0.8% error on the alpha value used in the paper is corrected in this table. Systematic
  error bars include those associated with particle identification (negligible), uncertainty
  in the value of the hyperon decay parameter (2%) and reaction plane resolution (2%)
  and detector efficiency corrections (4%). The dominant systematic error comes from
  statistical fluctuations of the estimated combinatoric background under the (anti-)$\Lambda$
  mass peak.
