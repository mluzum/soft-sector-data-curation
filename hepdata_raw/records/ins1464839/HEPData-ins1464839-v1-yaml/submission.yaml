additional_resources: []
comment: 'The azimuthal correlations of D mesons and charged particles were measured
  with the ALICE detector in pp collisions at $\sqrt{s}=7$ TeV and p-Pb collisions
  at $\sqrt{s_{\rm NN}}=5.02$ TeV at the Large Hadron Collider. D$^0$, D$^+$, and
  D$^{*+}$ mesons with transverse momentum $3<~p_{\rm T}<~16$ GeV/$c$ and rapidity
  in the nucleon-nucleon centre-of-mass system $|y_{\rm cms}|<~0.5$ (pp collisions)
  and $-0.96<~y_{\rm cms}<~0.04$ (p-Pb collisions) were correlated to charged particles
  with $p_{\rm T}>0.3$ Gev/$c$. The properties of the correlation peak induced by
  the jet containing the D meson, described in terms of the yield of charged particles
  in the peak and peak width, are compatible within uncertainties between the two
  collision systems, and described by Monte-Carlo simulations based on the PYTHIA
  and POWHEG event generators. '
hepdata_doi: 10.17182/hepdata.77274.v1
record_ids:
- {id: 2153590, type: cds}
- {id: 1464839, type: inspire}
---
data_file: data1.yaml
data_license: {description: null, name: null, url: null}
description: Comparison of the azimuthal-correlation distributions of D mesons and
  charged particles obtained for D$^0$, D$^{+}$ and D$^{*+}$ mesons for $5 < p_{\rm
  T} < 8$ GeV/$c$, charged particles $p_{\rm T} > 1$ GeV/$c$, in pp collisions at
  $\sqrt{s} = 7$ TeV. Rapidity range for the D mesons is $|y^{\rm D}_{\rm cms}| <
  0.5$. Correlations are integrated for $|\Delta\eta|=|\eta_{\rm ch}-\eta_{\rm D}|
  < 1$. The azimuthal-correlation distributions are reported in the range $0 < \Delta\varphi
  < \pi$.
