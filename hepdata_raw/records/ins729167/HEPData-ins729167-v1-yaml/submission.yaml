comment: We present spectra of charged pions and protons in 0-10% central Au+Au collisions
  at $\sqrt{s_{NN}}=200$ GeV at mid-rapidity ($y=0$) and forward pseudorapidity ($\eta=2.2$)
  measured with the BRAHMS experiment at RHIC. The spectra are compared to spectra
  from p+p collisions at the same energy scaled by the number of binary collisions.
  The resulting nuclear modification factors for central Au+Au collisions at both
  $y=0$ and $\eta=2.2$ exhibit suppression for charged pions but not for (anti-)protons
  at intermediate $p_T$. The $\bar{p}/\pi^-$ ratios have been measured up to $p_T\sim
  3$ GeV/$c$ at the two rapidities and the results indicate that a significant fraction
  of the charged hadrons produced at intermediate $p_T$ range are (anti-)protons at
  both mid-rapidity and $\eta = 2.2$.
