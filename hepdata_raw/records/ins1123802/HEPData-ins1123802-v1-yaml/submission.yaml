comment: |
  CERN-LHC. Measurements of the net-charge fluctuations in Lead-Lead collisions  at a centre of mass energy per nucleon pair of 2.76 TeV. Measurements using P-P collisions  were also made at the same centre of mass energy.  The quantities described below were  calculated from the experimental measurements of the number of positive and negative  charged   particles counted in two pseudorapidity intervals DELTA(ETARAP)=1.0 or 1.6 defined around mid-rapidity.  and in the PT range 0.5 to 5 GeV/c.  The quantities measured are the dynamical net-charge fluctuation  NU(+-DYN), both uncorrected and corrected for charge conservation and finite acceptance effects, and the   rerlated quantity D-measure.  See the text of the paper for more details.
