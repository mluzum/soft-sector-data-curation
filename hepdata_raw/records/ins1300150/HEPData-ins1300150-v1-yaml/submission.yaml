comment: "CERN-LHC.  The first observation of Z boson production in proton-lead collisions
  at a centre-of-mass energy per proton-nucleon pair of sqrt(sNN) = 5 TeV is presented.
  The data sample corresponds to an integrated luminosity of 1.6 nb^{-1} collected
  with the LHCb detector. The Z candidates are reconstructed from pairs of oppositely
  charged muons with pseudorapidities 2.0 < ETARAP(MU+-) < 4.5 and transverse momenta
  PT(MU+-) > 20 GeV. The invariant dimuon mass is restricted to the range 60 < M(MU+
  MU-) < 120 GeV.  \n\nThe measured Z --> MU+ MU- cross sections in the forward and
  backward directions are presented. The measured forward-backward ratio, defined
  for a given value of sqrt(sNN) as R(FB) = SIG(+ABS(YRAP)) / SIG(-ABS(YRAP)) where
  here ABS(YRAP) represents the overlap region, is also presented.\n"
