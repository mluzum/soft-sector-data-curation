description: "Invariant $\\pi^0$ yields at midrapidity as a function of $p_T$ for
  minimum bias and nine centralities in $Au\\ +\\ Au$ at $\\sqrt{s_{NN}} = 200\\ GeV$
  [0%\u201310% (80%\u201392%) is most central (peripheral)]. The labels \"uncorr.\"
  and \"corr.\" include systematic errors that are uncorrelated and correlated point-to-point,
  respectively."
