  ($p+p$, Au+Au) errors. The label "sys(uncorr)" refers to the uncorrelated point-to-point
  uncertainty (which includes statistical errors), while "sys(norm)" is the normalization
  uncertainty.
keywords:
- name: reactions
  values: [Au Au --> pi0 X]
- name: cmenergies
  values: [200.0]
- name: phrases
  values: [ppg014, mid-rapidity]
location: Data from Fig. 2 of PRL 91 (072301) 2003.
name: Fig. 2 Part 11
table_doi: 10.17182/hepdata.143254.v1/t24
