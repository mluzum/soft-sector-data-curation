additional_resources: []
comment: Two-particle correlations are presented for $\mathrm{K^{0}_{S}}$, $\Lambda$,
  and $\overline{\Lambda}$ strange hadrons as a function of relative momentum in lead-lead
  collisions at $\sqrt{s_{_{\mathrm{NN}}}} = 5.02$ TeV. The dataset corresponds to
  an integrated luminosity of 0.607 $\mathrm{nb}^{-1}$ and was collected using the
  CMS detector at the CERN LHC. Such correlations are sensitive to quantum statistics
  and to final-state interactions between the particles. The source size extracted
  from the $\mathrm{K^{0}_{S}K^{0}_{S}}$ correlations is found to decrease from 4
  to 1 fm in going from central to peripheral collisions. Strong interaction scattering
  parameters (i.e., scattering length and effective range) are determined from the
  $\Lambda\mathrm{K^{0}_{S}}$ and $\Lambda\Lambda$ (including their charge conjugates)
  correlations using the Lednicky--Lyuboshits model and are compared to theoretical
  and other experimental results.
hepdata_doi: 10.17182/hepdata.133573.v1
