description: Chargino-neutralino production. Observed upper limits at 95% CL on the
  product of the cross section and the two branching fractions, $\sigma (\tilde{\chi}_1^\pm
  \tilde{\chi}_2^0) \, \mathcal{B} ( \tilde{\chi}_1^\pm \rightarrow \mathrm{W}^{\pm}
  \tilde{\chi}_1^0 ) \,  \mathcal{B} ( \tilde{\chi}_2^0 \rightarrow \mathrm{Z} \tilde{\chi}_1^0
  )$,  are shown using the color scale where the $\tilde{\chi}_1^\pm/\tilde{\chi}_2^0$
  mass is on the $x$-axis and the mass difference between the $\tilde{\chi}_1^\pm/\tilde{\chi}_2^0$
  and the LSP is  on the $y$-axis. For these results, based on the TChiWZ simplified
  model, the $\tilde{\chi}_1^\pm$ and $\tilde{\chi}_2^0$ masses are set equal. The
  expected lower mass limits (magenta line) together with their $\pm 1\sigma$ uncertainties
  (magenta dashed lines) and the observed lower mass limits (black line) are indicated
  for 100% branching fractions for Wino-like cross-sections (left panel) and for Higgsino-like
  cross-sections (right panel).
