comment: |
  CERN-LHC.  Measurements of charged pion, kaon and (anti)proton production at mid-rapidity in Pb-Pb collisions at sqrt(sNN) = 2.76 TeV recorded in the autumn of 2010 as a function of centrality.  The measurements cover the transverse momentum (pT) range from 100 MeV to 3 GeV for pions, 200 MeV to 3 GeV for kaons, and 300 MeV to 4.6 GeV for (anti)protons.  These data extend previous measurements for the most central bin (centrality of 0-5%) available from http://hepdata.cedar.ac.uk/view/ins1126966.
dateupdated: 24/08/2018 15:20:20
hepdata_doi: 10.17182/hepdata.61925.v1
modifications:
- {action: Encoded, date: 04 NOV 2013, who: Graeme Watt}
- {action: Updated, date: 24 AUG 2018, who: Graeme Watt}
record_ids:
- {id: 1222333, type: inspire}
- {id: 6122, type: red}
