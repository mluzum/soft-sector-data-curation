description: "Distribution of the $\\pi^{+}\\pi^{-}\\pi^{+}\\pi^{-}$ transverse momentum
  $p_{T} = |\\sum_{i=1}^{4}\\overrightarrow{p}_{T,i}|$\U0010FC07: The filled circles
  are the measured \U0010FC07points with the statistical errors. The hatched filled
  histogram shows the expected distribution from simulation of coherent photoproduction
  (cf. section III). The strong enhancement at low transverse momenta is due to coherently
  produced $\\pi^{+}\\pi^{-}\\pi^{+}\\pi^{-}$. This unique signature is used in the
  event selection which requires $p_{T}$ < 150 MeV/c (arrow). The remaining background
  is estimated from +2 or \u22122 charged four-prong combinations, by normalizing
  (factor = 1.186 $\\pm$ 0.054) their $p_{T}$ distribution (gray filled histogram)
  to that of the neutral four-prongs in the region of $p_{T}$ > 250 MeV/c (vertical
  line) yielding the unfilled histogram (see section IV)."
