{comment: 'The production of K$^{*0}$ and $\phi$ mesons are measured with the ALICE
    detector in pp and Pb-Pb collisions at the centre-of-mass energy per nucleon pair,
    $\sqrt{s_{\rm NN}}$ = 2.76 TeV. The invariant yield of K$^{*0}$ and $\phi$ for
    rapidity $|y|<0.5$ are presented as a function of transverse momentum ($p_{\rm
    T}$). The K$^{*0}$ and $\phi$ invariant yields are compared with model calculation
    for inelastic pp collisions. The $p_{\rm T}$ dependent particle ratios such K$^{*0}$/K,
    K$^{*0}/\pi$, $\phi$/K, $\phi/\pi$, p/K$^{*0}$ and p/$\phi$ in inelastic pp and
    Pb--Pb collisions are obtained. The nuclear modification factor $R_{\rm AA}$ was
    computed using a proton-proton reference at $\sqrt{s} = 2.76$ TeV.', hepdata_doi: 10.17182/hepdata.77995.v1}
---
data_file: Table1.yaml
description: Invariant yield of K$^{*0}$ meson normalized to the number of inelastic
  pp collisions at $\sqrt{s}=2.76~{\rm TeV}$.
keywords:
- name: reactions
  values: [P P --> K^*0 X, P P --> anti-K^*0 X]
- name: phrases
  values: [Invariant yield]
- name: cmenergies
  values: [2760.0]
location: Figure 4, left panel, black color solid marker
name: Table 1
table_doi: 10.17182/hepdata.77995.v1/t1
