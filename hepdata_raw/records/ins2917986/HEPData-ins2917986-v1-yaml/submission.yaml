{comment: "This work reports femtoscopy correlations of $p-p (\\overline{p}-\\overline{p})$
    and $p-d (\\overline{p}-\\overline{d})$ pairs measured in Pb--Pb collisions at
    center-of-mass energy $\\sqrt{s_{\\rm NN}}$ = 5.02~TeV by the ALICE Collaboration.
    A fit to the measured proton-proton correlation functions allows one to extract
    the dependence of the nucleon femtoscopic radius of the particle-emitting source
    as a function of the pair transverse mass ($m_\\text{T}$) and of the average charge
    particle multiplicity $\\langle\\text{dN}_\\text{ch}/\\text{d}\\eta\\rangle^{1/3}$
    for three centrality intervals (0--10$\\%$, 10--30$\\%$, 30--50$\\%$). In both
    cases, the expected power-law and liner scalings are observed, respectively. The
    measured \\pd correlations can be described by both two- and three-body calculations,
    indicating that the femtoscopy observable is not sensitive to the short-distance
    features of the dynamics of the p-(p-n) system, due to the large inter-particle
    distances in \\mbox{Pb--Pb} collisions at the LHC. Indeed, in this study, the
    minimum measured femtoscopic source sizes for protons and deuterons start at $2.73^{+0.05}_{-0.05}$
    and $3.10^{+1.04}_{-0.86}$~fm, respectively, for the 30\u201350$\\%$ centrality
    of the collisions. Moreover, the $m_{\\rm{T}}$-scaling obtained for the \\pP and
    \\pd systems is compatible within 1$\\sigma$ of the uncertainties. These findings
    provide new input for fundamental studies on the production of light (anti)nuclei
    under extreme conditions.", hepdata_doi: 10.17182/hepdata.165812.v1}
