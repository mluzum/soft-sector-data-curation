data_file: Table3.yaml
description: "First column: production cross sections per unit of rapidity for prompt
  D0 mesons, inclusive D0 mesons (no feed-down subtraction) and charm quarks at mid-rapidity
  in pp collisions at 7 TeV. For D0 mesons, the second (sys) error is from the luminosity
  uncertainty, the third (sys) error is from the branching-ratio uncertainties. For
  charm quarks, the second (sys) error is from the luminosity uncertainty, the third
  (sys) error is from the Fragmentation Function uncertainties, the fourth (sys) error
  is from the rapidity shapes of D0 mesons and single charm quarks.\nSecond column:
  total production cross sections, extrapolated to the full phase space, for prompt
  D0 mesons and charm quarks. \nFor D0 mesons, the second (sys) error is the from
  the extrapolation uncertainty, the third from the luminosity uncertainty and the
  fourth from the branching-ratio uncertainties. For charm quarks, the second (sys)
  error is from the extrapolation, the third is from the luminosity uncertainty and
  the fourth is from the Fragmentation Function uncertainties.\nThird column: value
  of <pT> of prompt D0 mesons. The first uncertainty is statistical, the second is
  the systematic uncertainty.\n"
keywords:
- name: reactions
  values: [P P --> D0 X, P P --> CHARM CHARMBAR X]
- name: observables
  values: [DSIG/DYRAP, SIG, PT]
- name: phrases
  values: [Inclusive, Integrated Cross Section, Cross Section, Differential Cross
      Section, Rapidity Dependence, Proton-Proton Scattering, Charm Production]
- name: cmenergies
  values: [7000.0]
location: Data from Equations 7,8,9,10,11,12
name: Table 3
table_doi: 10.17182/hepdata.73941.v1/t3
