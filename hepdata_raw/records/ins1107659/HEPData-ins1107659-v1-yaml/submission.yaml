comment: |
  CERN-LHC. Study of the anisotropy of the azimuthal distributions of charged particles produced in Lead-Lead collisions at a centre of mass energy per nulceon of 2.76 TeV.  The elliptic anisotropy parameter, V2, defined as the second coefficient in a Fourier expansion of the particle invariant yields, is extracted  using the event-plane method (EP), two- and four-particle cumulants (C2 and C4) ad Lee-Yang zeros (LYZ).  V2 is presented as a function of transverse momentum PT, pseudorapidity (ETARAP) over the ranges in PT of 0-3 GeV,  in |ETARAP| <2.4 and in 12 classes of centrality from 0-80%.
dateupdated: 19/05/2012 00:00:00
hepdata_doi: 10.17182/hepdata.58994.v1
modifications:
- {action: Encoded, date: 19 MAY 2012, who: Mike Whalley}
record_ids:
- {id: 1107659, type: inspire}
- {id: 4990, type: red}
---
