comment: |
  Measurement by the PHENIX experiment of the transverse momentum spectra (0.4<PT<5.0 GeV/c) of electrons as a function of centrality, in Au+Au collisons at center-of-mass energy of200 GeV. The resultant nuclear modification factor as a fonction of centrality is presented     The measurements are made at mid-rapidity (-0.35<y<0.35).     The contribution to the raw specra from photon conversions and Dalitz decays are removed with a "cocktail" substraction, where sources of electrons other than heavy flavordecay are calculatied from monte carlo simulation. After this subtraction, the remaining, non photonic, electrons are primarily due to the semi leptonic decay of hadronscontaining heavy quarks.     The minimum bias trigger used in this study corresponds to (92.2 +2.5 -3.0)% of the 6.8 +- 0.5 barn Au+Au inelastic cross section.
