comment: "Measurement of Z-boson production at forward rapidity in p-Pb collisions
  at a center-of-mass energy per nucleon pair of 8.16 TeV and Pb-Pb collisions at
  5.02 TeV. The measurement is done in the dimuon decay channel.\n\nThe fiducial region
  is defined by (all in laboratory frame)\n- eta (pseudorapidity) of individual muons
  between -4.0 and -2.5\n- pT (transverse momentum) of individual muons larger than
  20 GeV/c\n- y (rapidity) of dimuon between 2.5 and 4.0\n- mass of dimuon between
  60 and 120 GeV/c^2\n\nFor Pb-Pb collisions the laboratory frame and cms frame coincide.
  For p-Pb collisions the nucleon-nucleon cms is boosted with respect to the laboratory
  frame by $\\Delta y_{cms} = \\pm 0.465$ \n"
hepdata_doi: 10.17182/hepdata.97372.v1
