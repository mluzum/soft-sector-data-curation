additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/centrality-dependence-charged-hadron-and-strange-hadron-elliptic-flow-sqrt-s-nn-200-gev-au-au-collisions'}
comment: "We present STAR results on the elliptic flow $v_2$ of charged hadrons, strange
  and multi-strange particles from $\\sqrt{s_{NN}} = 200$ GeV $Au+Au$ collisions at
  RHIC. The detailed study of the centrality dependence of $v_{2}$ over a broad transverse
  momentum range is presented. Comparison of different analysis methods are made in
  order to estimate systematic uncertainties. In order to discuss the non-flow effect,
  we have performed the first analysis of $v_{2}$ with the Lee-Yang Zero method for
  $K_{S}^{0}$ and $\\Lambda$. In the relatively low $p_{T}$ region, $p_{T} \\le 2$
  GeV/c, a scaling with $m_{T}\u2212m$ is observed for identified hadrons in each
  centrality bin studied. However, we do not observe  $v_{2}(p_{T})$ scaled by the
  participant eccentricity to be independent of centrality. At higher $p_{T}$ , $2
  \\le p_{T} \\le 6$ GeV/c,  $v_{2}$ scales 3 with quark number for all hadrons studied.
  For the multi-strange hadron $\\Omega$, which does not suffer appreciable hadronic
  interactions, the values of $v_{2}$ are consistent with both $m_{T}\u2212m$ scaling
  at low $p_{T}$ and number-of-quark scaling at intermediate $p_{T}$. As a function
  of collision centrality, an increase of $p_{T}$-integrated $v_{2}$ scaled by the
  participant eccentricity has been observed, indicating a stronger collective flow
  in more central $Au+Au$ collisions."
hepdata_doi: 10.17182/hepdata.96906.v1
