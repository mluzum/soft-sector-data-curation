data_file: figure_12a.yaml
description: The $J/\psi$ nuclear modification factor versus transverse momentum for
  |y| < 1 and $p_T$ < 5 GeV/c for 0-60% centrality Au+Au collisions (solid circles).
  The data are compared with STAR high-$p_T$ (5 < $p_T$ < 10 GeV/c) results [9] and
  PHENIX results [8] in |y| < 0.35 (open squares). The statistical and systematic
  uncertainties on the baseline $J/\psi$ cross section in p+p collisions are indicated
  by the hatched and solid bands, respectively. Boxes on the vertical axes represent
  the uncertainty on $N_{coll}$ combined with the uncertainty on the inelastic cross
  section in p+p collisions
