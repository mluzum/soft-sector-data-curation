  in Au+Au collisions (solid circles). The results are compared to high-$p_T$ (3 <
  $p_T$ < 10 GeV/c) results from STAR [9] (solid squares) and PHENIX data [8] (open
  squares). Also shown is the yield in 0-60% centrality Cu+Cu collisions for low $p_T$
  (solid triangles) and high $p_T$ [48] (open triangles). The models are described
  in the text [49, 50]. The $J/\psi$ cross section in p+p collisions is also shown
  at STAR (stars) and PHENIX [51] (diamonds), and the scale is indicated on the right
  axis.
