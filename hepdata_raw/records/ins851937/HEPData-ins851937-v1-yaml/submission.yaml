data_file: fig2_part1.yaml
description: "Background-subtracted azimuthal angle difference distributions for associated
  particles with pT between 1.0 and 2.5 GeV/c and for different ranges of trigger
  particle pT , ranging from 2.5 \u2212 3.0 GeV/c to 3.0 \u2212 4.0 GeV/c. Results
  are shown for Au+Au collisions with different centrality and d+Au reference results.
  The rapidity range is |eta| < 1 and as a result the rapidity-difference |deta| <
  2. Results are shown for a restricted acceptance of |deta| < 0.7, using tracks within
  |eta| < 1. The upper and lower range of the systematic uncertainty due to the v2
  modulation of the subtracted background is indicated as well."
