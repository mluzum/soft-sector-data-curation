comment: "Measurement of W-boson production at forward rapidity in p-Pb collisions
  at $\\sqrt{s_{NN}} =$ 8.16 TeV and Pb-Pb collisions at $\\sqrt{s_{NN}} =$ 5.02 TeV.
  The measurement is done in the muon decay channel.\n\nThe fiducial region is defined
  by\n- $\\eta$ (pseudorapidity) of muons in $-4.0 < \\eta < -2.5$ in the laboratory
  frame and ALICE reference system\n- $p_{\\rm T}$ (transverse momentum) of muons
  larger than 10 GeV/$c$\n\nFor Pb-Pb collisions the laboratory frame and cms frame
  coincide. For p-Pb collisions the nucleon-nucleon cms is boosted with respect to
  the laboratory frame by $\\Delta y_{cms} = \\pm 0.465$ \n"
hepdata_doi: 10.17182/hepdata.133034.v1
