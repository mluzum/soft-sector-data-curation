description: <p>Per-trigger yield versus $\Delta\phi$ for various trigger and partner
  $p_T$ ($p_T^A$ $\otimes$ $p_T^B$), in $p$+$p$ and 0-20% Au+Au collisions.</p> <p><i>The
  systematic errors on $v_2$ are represented by "sys. corr." and are dominated by
  the reaction plane resolution. The fit that accounts for the overlap of the near-
  and away-side Gaussians at $\Delta\phi_{min}$ gives systematically lower $b_0$ values
  that that for ZYAM, and is assigned as the differences as one-sided systematic errors
  on $b_0$ represented by "sys. uncorr.".
