additional_resources:
- {description: arXiv, location: 'https://arxiv.org/pdf/1509.08397.pdf'}
comment: BNL-RHIC.  Elliptic flow ($v_{2}$) values for identified particles at midrapidity
  in Au + Au collisions measured by the STAR experiment in the Beam Energy Scan at
  the Relativistic Heavy Ion Collider at $\sqrt{s_{NN}}$ = 7.7-62.4 GeV are presented
  for three centrality classes. The centrality dependence and the data at $\sqrt{s_{NN}}$
  = 14.5 GeV are new. Except at the lowest beam energies we observe a similar relative
  $v_{2}$ baryon-meson splitting for all centrality classes which is in agreement
  within 15% with the number-of-constituent quark scaling. The larger $v_{2}$ for
  most particles relative to antiparticles, already observed for minimum bias collisions,
  shows a clear centrality dependence, with the largest difference for the most central
  collisions. Also, the results are compared with A Multiphase Transport Model and
  fit with a Blast Wave model.
hepdata_doi: 10.17182/hepdata.71527.v2
---
additional_resources:
- {description: Image file, location: Fig6.png}
- {description: Thumbnail image file, location: thumb_Fig6.png}
data_file: table_6a.yaml
description: The difference in $v_{2}$ between particles (X) and their corresponding
  antiparticles $\bar{X}$ (see legend) as a function of $\sqrt{s_{NN}}$ for 10%-40%
  central Au + Au collisions. The systematic errors are shown by the hooked error
  bars. The dashed lines in the plot are fits with a power-law function.
keywords:
- name: reactions
  values: [AuAu -->]
- name: phrases
  values: [flow, v2]
location: Data from Figure 6a
name: Figure 6a
table_doi: 10.17182/hepdata.71527.v2/t1
