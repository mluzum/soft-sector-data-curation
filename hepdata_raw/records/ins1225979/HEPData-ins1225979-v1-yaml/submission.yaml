comment: |
  CERN-LHC. The charged-particle pseudorapidity density distribution is measured for different centralities of Pb Pb collisions at $\sqrt{s}$/nucleon-pair of 2760 GeV. From this the total number of produced charged particles is calculated versus the number of participating nucleons along with the pseudorapidity density of charged particles per participant pair versus the number of participating nucleons for different eta ranges. Finally the distribution is converted to the charged-particle rapidity density distribution to extract the width of the distribution and compare it to lower energy data. UPDATE(15/07/2015):typo correction; 20-30%, 30-40% labels changed to 10-20, 20-30% on first table.
