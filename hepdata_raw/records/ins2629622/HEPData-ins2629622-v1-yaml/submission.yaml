additional_resources:
- {description: arXiv, location: 'https://arxiv.org/pdf/2208.00653.pdf'}
comment: We present the first measurements of transverse momentum spectra of $\pi^{\pm}$,
  $K^{\pm}$, $p(\bar{p})$ at midrapidity ($|y| < 0.1$) in U+U collisions at $\sqrt{s_{NN}}
  =$ 193~GeV with the STAR detector at the Relativistic Heavy Ion Collider (RHIC).
  The centrality dependence of particle yields, average transverse momenta, particle
  ratios and kinetic freeze-out parameters are discussed. The results are compared
  with the published results from Au+Au collisions at $\sqrt{s_{NN}} =$ 200~GeV in
  STAR. The results are also compared to those from A Multi Phase Transport (AMPT)
  model.
hepdata_doi: 10.17182/hepdata.132660.v1
record_ids:
- {id: 1727273, type: inspire}
