data_file: table_3.yaml
description: Ratio of isolated-photon cross section measured with $R=0.4$ over $R=0.2$
  for Pb$-$Pb and pp collisions at $\sqrt{s_{\mathrm{NN}}}=5.02~\mathrm{TeV}$. Each
  column for each Pb$-$Pb collisions centrality class and for pp collisions. The last
  two columns for the NLO pQCD JETPHOX calculations for pp (PDF) and Pb$-$Pb (nPDF)
  collisions. Data statistical and systematic uncertainties are provided. The theory
  statiscal (Monte Carlo approach) and PDF uncertainties are provided.
keywords:
- name: observables
  values: ['f_{R (0.4/0.2)} of isolated $\gamma$']
- name: reactions
  values: [pp --> $\gamma$ X, Pb$-$Pb --> $\gamma$ X]
- name: cmenergies
  values: [5020]
location: Data from Figure 14 or paper and Figure 25 of public note.
name: table_3
table_doi: 10.17182/hepdata.157542.v1/t3
