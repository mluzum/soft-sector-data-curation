comment: |
  CERN-LHC. Measurement of the charged and total energy flow in the pseudorapidity  range 1.9 < eta < 4.9 for inclusive minimum-bias interactions, hard scattering processes   and events with an enhanced or suppressed diffractive contribution.  For estimating the   total energy flow both charged and neutral stable particles are considered, but the event   class definitions require the presence (or absence) of charged stable particles in the specific   pseudorapidity (and PT) regions.
