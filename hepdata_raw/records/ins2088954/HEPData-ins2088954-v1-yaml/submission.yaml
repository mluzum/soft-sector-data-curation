description: K$^+$p (K$^+$p $\oplus$ K$^-\overline{\mathrm p}$)  correlation function
  in pp collisions at $\sqrt{s}=13$ TeV.
keywords:
- name: reactions
  values: [P P --> K P]
- name: reactions
  values: [P P --> Kbar Pbar]
- name: observables
  values: [CORR]
- name: cmenergies
  values: [5000]
location: Data from Figure 1
name: Table 1
table_doi: 10.17182/hepdata.132766.v1/t1
