data_file: Table8.yaml
description: This table shows the correlation coefficient between the $\alpha_{\mathrm{\overline{K}^0
  n}}$ and $\alpha_{\pi \Sigma}$ parameters extracted from the different fits to the
  K$^-$ p correlation function with free weights. The results are shown as a function
  of the core radius $r_{\mathrm{core}}$ shown in Table 7. The error on the correlation
  coefficient, shown as statistical errors in the table, are obteined by using the
  Pearson's formula to evaluate the probable error of correlation coefficient.
keywords:
- name: reactions
  values: [X X --> Kbar P]
- name: reactions
  values: [X X --> K Pbar]
- name: observables
  values: [CORRELATION]
- name: cmenergies
  values: [5020]
location: Correlation from fit to FIG. 4 5 6
name: Table 8
table_doi: 10.17182/hepdata.132766.v1/t17
