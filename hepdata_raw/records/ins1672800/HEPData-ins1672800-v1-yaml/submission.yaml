comment: "CERN-LHC. Inclusive J/Psi production is studied in Xe-Xe interactions at
  a centre-of-mass energy per nucleon pair of sqrt(s_NN) =5.44 TeV, using the ALICE
  detector at the CERN LHC. The J/Psi meson is reconstructed, via its decay to a muon
  pair, in the centre-of-mass rapidity intervals 2.5<y<4 and down to zero transverse
  momentum.  \nIn this Letter, the nuclear modification factors RAA for inclusive
  J/Psi, measured in the centrality range 0-90% as well as in the centrality intervals
  0-20% and 20-90% are presented. The RAA values are compared to previously published
  results for Pb-Pb collisions at\nsqrt(s_NN) = 5.02 TeV and to the calculation of
  a transport model. A good agreement is found between Xe-Xe and Pb-Pb results as
  well as between data and the model."
