additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/2506.02330'}
comment: "STAR-RHIC. Measurements of the variation of anisotropic flow-plane angles
  ($\\Psi_n$) with rapidity, commonly known as the flow-plane decorrelation, provide
  important insights into the initial conditions of the matter produced in heavy-ion
  collisions. In this paper, using data collected by the STAR experiment, we report
  the first measurement of the four-plane correlator observable $T_{n}\\{ba;dc\\}=\\langle\\langle\\sin
  [n(\\Psi^{b}_{n}-\\Psi^{a}_{n})]\\sin[n(\\Psi^{d}_{n}-\\Psi^{c}_{n})]\\rangle\\rangle$,
  where superscripts $a$, $b$, $c$, and $d$ denote sequential pseudorapidity ($\\eta$)
  regions with $a$ corresponding to the most backward region, $b$ and $c$ close to
  mid-rapidity with $\\eta_b<0$ and $\\eta_c>0$, and $d$ being the most forward. The
  measurement is performed for the elliptic and triangular flow (i.e. $n=2$ and $3$)
  in Au+Au and isobar (Ru+Ru, Zr+Zr) collisions at $\\sqrt{s_{_{\\mathrm{NN}}}}$ =
  200 GeV. The goal of calculating the correlation of the flow-plane angle variations
  from backward to mid-central, and from mid-central to forward regions, is to probe
  the systematic variation of flow angle over a wide $\\eta$ range. In mid-central
  collisions ($10-30\\%$ centrality), we find $T_{2}\\{ba;dc\\}= -0.004\\pm 0.001
  (\\rm stat)\\pm0.002(\\rm syst)$ independent of the collision system. Such a small
  value of $T_{2}$ favors a \u201Crandom-walk\u201D variation of the flow-plane angles,
  where the rapidity correlation length is smaller than the entire region under study.
  These measurements provide new information on the decorrelation patterns in the
  system and offer a quantitative estimate of possible systematic variations in anisotropic
  flow angles such as \u201Ctwist\u201D between forward and backward regions. This
  opens new opportunities for understanding the three-dimensional structure and the
  time evolution of the quark-gluon plasma created in heavy-ion collisions.\n"
hepdata_doi: 10.17182/hepdata.159929.v1
