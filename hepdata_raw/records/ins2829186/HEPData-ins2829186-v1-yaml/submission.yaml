data_file: b+_cross_section.yaml
description: The B+ meson $p_{\rm{T}}$-dependent production cross section in pp collisions.
  The measurment was carried out inside a fiducial region respecting ($p_{\rm{T}}$<10
  & 1.5<|y|<2.4) and ($p_{\rm{T}}$>10 & |y|<2.4). The luminosity is 302.3 pb^{-1}.
keywords:
- name: reactions
  values: [B+ -> J/Psi(mu+mu-) K+]
- name: cmenergies
  values: ['5020']
- name: observables
  values: [differential cross section]
- name: phrases
  values: [B meson Nuclear Modification Factor, Bottom, Transverse Momentum Dependence,
    R measurement]
location: Data from Fig. 2 (left)
name: B+ Cross Section
table_doi: 10.17182/hepdata.152831.v1/t1
