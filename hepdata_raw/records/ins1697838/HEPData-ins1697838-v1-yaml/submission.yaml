comment: "Measurement of the fiducial cross section of light-by-light scattering and
  exclusion limits on axion-like-particles in lead-lead collisions at a centre-of-mass
  energy of 5.02 TeV with 390 mub^-1 of data collected in 2015.  \n\nThe fiducial
  region is defined as:\n- 2Gamma\n- pt_Gamma > 2 GeV\n- $|\\eta_{\\gamma}| < 2.4$
  \n- exluding 1.444<|$\\eta$|<1.566 region \n- m_GammaGamma > 5 GeV\n- pt_GammaGamma
  < 1 GeV\n- aco_GammaGamma < 0.01\n"
hepdata_doi: 10.17182/hepdata.95242.v1
