comment: |
  CERN-LHC. Measurement of the identical charged kaon one-dimensional femtoscopy in p-Pb collisions at a center-of-mass energy per nucleon pair of 5.02 TeV by the ALICE experiment. Femtoscopic radii are obtained in as a function of three multiplicity event classes and two pair transverse momentum ranges. The measured p-Pb radii are equal to those observed in pp collisions.
hepdata_doi: 10.17182/hepdata.90683.v1
---
data_file: Fig2_1.yaml
description: |
  Correlation function as a function of pair relative momentum for 0-20% multiplicity class and pair transverse momentum range (0.2-0.5) GeV/c.
keywords:
- name: reactions
  values: [P PB --> K+K+ X]
- name: observables
  values: [CORR]
- name: cmenergies
  values: [5020.0]
location: Data in Figure 2, top left panel
name: Table 1
