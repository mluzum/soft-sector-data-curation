data_file: fig1l.yaml
description: "$v_1$ for $\\pi^{\\pm}$, $K^{\\pm}$, $K_{S}^{0}$ (left panel), p and
  $\\bar{p}$ (right panel) as a function of rapidity for 10-70$\\%$ $Au + Au$ collisions
  at $\\sqrt{s_{NN}} = 200$ GeV. The lines present the linear fit to the $\\pi^{\\pm}$,
  $K^{\\pm}$, $K_{S}^{0}$, p and $\\bar{p}$\u2019s $v_1$(y) respectively. Data points
  around $y = 0.29$ are slightly shifted horizontally to avoid overlapping."
