description: Measured differential fiducial cross sections of $\gamma\gamma \rightarrow
  \gamma\gamma$ production in Pb+Pb collisions at $\sqrt{s_{NN}}$ = 5.02 TeV for diphoton
  invariant mass  are shown as points with error bars giving the statistical uncertainty
  and grey bands indicating the size of the total uncertainty. The results are compared
  with the prediction from the SuperChic v3.0 MC generator (solid line) with bands
  denoting the theoretical uncertainty.
