additional_resources:
- {description: Image file, location: Sigma.png}
- {description: Thumbnail image file, location: thumb_Sigma.png}
data_file: SigmaLimit.yaml
description: The 95% CL upper limit on the ALP cross section $\sigma_{\gamma\gamma\rightarrow
  a \rightarrow\gamma\gamma}$ for the $\gamma\gamma\rightarrow a \rightarrow \gamma\gamma$
  process as a function of ALP mass m$_{a}$. The observed upper limit is shown as
  a solid black line and the expected upper limit  is shown by the dashed black line
  with its $\pm1$ and $\pm2$ standard deviation bands. The discontinuity at $m_{a}=70
  GeV$ is caused by the increase of the mass-bin width which brings an increase in
  signal acceptance.
keywords: []
location: Data from arXiv:2008.05355 Figure 9
name: The 95% CL upper limit on the ALP cross section
table_doi: 10.17182/hepdata.95747.v1/t9
