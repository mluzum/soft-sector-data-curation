additional_resources:
- {description: Created with hepdata_lib 0.15.0, location: 'https://doi.org/10.5281/zenodo.1217998'}
comment: Nuclear medium effects on $\text{B}^+$ meson production are studied using
  the binary-collision scaled cross section ratio between events of different charged-particle
  multiplicities from proton-lead collisions.  Data, collected by the CMS experiment
  in 2016 at a nucleon-nucleon center-of-mass energy of $\sqrt{s_{NN}} = 8.16\,$TeV,
  corresponding to an integrated luminosity of 175\nbinv, were used. The scaling factors
  in the ratio are determined using a novel approach based on the Z$\,\to\mu^{-}\mu^{+}$
  cross sections measured in the same events. The scaled ratio for $\text{B}^+$ is
  consistent with unity for all event multiplicities, putting stringent constraints
  on nuclear modification for heavy flavor.
