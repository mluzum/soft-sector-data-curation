comment: |
  CERN-LHC.  The production of the prompt charmed meson D^0 relative to the reaction plane was measured in Pb-Pb collisions recorded in November and December 2011 at a centre-of-mass energy per nucleon-nucleon collision of sqrt(sNN) = 2.76 TeV with the ALICE detector at the LHC.  D mesons were reconstructed via their hadronic decays at central rapidity in the transverse momentum (pT) interval 2-16 GeV.  The azimuthal anisotropy is quantified in terms of the second coefficient v2 in a Fourier expansion of the D meson azimuthal distribution, and in terms of the nuclear modification factor RAA, measured in the direction of the reaction plane and orthogonal to it.
