comment: |
  CERN-LHC.  Measurement of the inclusive Psi(2S) production in p-Pb collisions at sqrt(s_NN)=5.02TeV at CERN LHC.  The measurements are performed at forward (2.03<y_cms<3.53) and backward (-4.46<y_cms<-2.96) centre of mass rapidities, studying the Psi(2S) muon pair decay.
dateupdated: 14/01/2016 17:02:03
hepdata_doi: 10.17182/hepdata.66529.v1
modifications:
- {action: Encoded, date: 09 DEC 2014, who: Roberta Arnaldi}
- {action: Edited, date: 14 JAN 2016, who: Graeme Watt}
record_ids:
- {id: 1296307, type: inspire}
- {id: 6319, type: red}
---
data_file: Table1.yaml
description: "The cross section ratios B.R. sigma_Psi(2S)/ B.R. sigma_JPsi obtained
  in p-Pb and Pb-p collisions. \nThe first uncertainty is statistical, the second
  one is systematic.\n"
keywords:
- name: reactions
  values: [P PB --> J/PSI X, P PB --> PSI(2S) X]
- name: observables
  values: [SIG/SIG]
- name: phrases
  values: [Inclusive, Psi, Integrated Cross Section, Cross Section, Muon production]
- name: cmenergies
  values: [5020.0]
location: Data from Figure 2
name: Table 1
table_doi: 10.17182/hepdata.66529.v1/t1
