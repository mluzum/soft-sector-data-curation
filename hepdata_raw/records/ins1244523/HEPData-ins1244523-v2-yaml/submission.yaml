additional_resources: []
comment: CERN-LHC.  Measurements of the transverse momentum multiplicity dependences
  of Pion, Kaon, Proton and   Lambda production in Proton-Lead collisions at a centre-of-mass
  energy/nucleon of 5.02 TeV.  The dependences of the   multiplicity and mean transverse
  momentum on the  charged particle multiplicity density dN/dETARAP is also presented.
