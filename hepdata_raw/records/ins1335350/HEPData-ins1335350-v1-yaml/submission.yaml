comment: |
  CERN-LHC. We report measurements of the primary charged particle pseudorapidity
  density and transverse momentum distributions in p-Pb collisions at $\sqrt{s_{NN}}$ = 5.02 TeV,
  and investigate their correlation with experimental observables sensitive to the centrality
  of the collision.

  Modified 21 MAY 2015 by alice-publications@cern.ch.
  In fig.16 only the systematic uncertainty for minimum bias was plotted.
  Now, the uncertainty from the centrality selection was added.
