additional_resources: []
comment: CERN-LHC-ALICE. $\Upsilon$ production in $\mbox{p--Pb}$ interactions is studied
  at the centre-of-mass energy per nucleon--nucleon collision $\sqrt{s_{_{\rm {NN}}}}
  = 8.16$~TeV with the ALICE detector at the CERN LHC. The measurement is performed
  reconstructing bottomonium resonances via their dimuon decay channel, in the centre-of-mass
  rapidity intervals $2.03<y_{\rm{cms}}<3.53$ and $-4.46<y_{\rm{cms}}<-2.96$, down
  to zero transverse momentum. In this work, results on the $\Upsilon$(1S) production
  cross section as a function of rapidity and transverse momentum are presented. The
  corresponding nuclear modification factor shows a suppression of the $\Upsilon$(1S)
  yields with respect to \mbox{pp} collisions, both at forward and backward rapidity.
  This suppression is stronger in the low transverse momentum region and shows no
  significant dependence on the centrality of the interactions. Furthermore, the $\Upsilon$(2S)
  nuclear modification factor is evaluated, suggesting a suppression similar to that
  of the $\Upsilon$(1S). A first measurement of the $\Upsilon$(3S) has also been performed.
  Finally, results are compared with previous ALICE measurements in $\mbox{p--Pb}$
  collisions at $\sqrt{s_{_{\rm {NN}}}} = 8.16$~TeV and with theoretical calculations.
hepdata_doi: 10.17182/hepdata.95539.v1
