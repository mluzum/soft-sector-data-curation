description: "$\\rho^{0}/\\pi$ ratios as a function of c.m. system energy. The ratios
  are from measurements in $e^{+} e^{\u2212}$ collisions at $10.45$ GeV, $29$ GeV
  and $91$ GeV c.m. system energy, $p$+$p$ at $6.8$ GeV, $19.7$ GeV, $27.5$ GeV, and
  $52.5$ GeV, Kp at $7.82$ GeV and $\\pi^{-}$p at $19.6$ GeV. The errors on the ratios
  at $\\sqrt{s_{NN}}= 200$ GeV are the quadratic sum of the statistical and systematic
  errors. The ratios at $\\sqrt{s_{NN}}= 200$ GeV are offset from one another for
  clarity."
