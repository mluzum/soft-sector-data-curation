data_file: Figure_02.yaml
description: "The $\\rho^{0}$ mass as a function of $p_{T}$ for minimum bias $p$+$p$
  (filled circles), high multiplicity $p$+$p$ (open triangles), and peripheral Au+Au
  (filled squares) collisions. The error bars indicate the systematic uncertainty.
  Statistical errors are negligible. The $\\rho^{0}$ mass was obtained by fitting
  the data to the BW\xD7PS functional form described in the text. The dashed lines
  represent the average of the $\\rho^{0}$ mass measured in $e^{+} e^{\u2212}$. The
  shaded areas indicate the \u03C10 mass measured in $p$+$p$ collisions. The open
  triangles have been shifted downward on the abscissa by $50$ MeV/$c$ for clarity."
