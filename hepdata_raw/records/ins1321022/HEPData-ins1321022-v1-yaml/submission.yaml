comment: "CERN-LHC.  We report on the production of inclusive $\\Upsilon(1S)$ and
  $\\Upsilon(2S)$ in p-Pb collisions at $\\sqrt{s_{NN}} = 5.02$ TeV at the LHC. \nThe
  measurement is performed with the ALICE detector at backward ($-4.46 < y_{{\\rm
  cms}} < -2.96$) and forward ($2.03 < y_{{\\rm cms}} < 3.53$) rapidity down to zero
  transverse momentum. The production cross section of the $\\Upsilon(1S)$ and $\\Upsilon(2S)$
  are presented, as well as the nuclear modification factor and the ratio of the forward
  to backward yields of $\\Upsilon(1S)$. The data sets were taken in 2013 with two
  beam configurations, p-Pb and Pb-p with integrated luminosities of 5.0 nb-1 and
  5.8 nb-1, respectively.\n"
