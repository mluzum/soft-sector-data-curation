data_file: Table1.yaml
description: |
  Value of the Alpha power as used in a fit of dN/dy versus Ncoll of the form A*Ncoll^Alpha, where N is the non photonic electron yield and Ncoll the number of p+p collisions This value only includes data from Au+Au collisions The value of Alpha = 1 is the expectation in the absence of medium effects.
keywords:
- name: reactions
  values: [AU AU --> CHARM  CHARMBAR   X, AU AU --> BOTTOM  BOTTOMBAR  X]
- name: observables
  values: [POWER]
- name: plabs
  values: ['21321,21321']
- name: phrases
  values: [Inclusive, Electron production]
- name: cmenergies
  values: [200.0]
location: Data from P4
name: Table 1
table_doi: 10.17182/hepdata.57254.v1/t1
