comment: |
  STAR-RHIC. J/psi production in p+p and Cu+Cu collisions at sqrt(s) = 200 GeV, for high transverse momentum (above 5 GeV/c) and at mid-rapidity. The Cu+Cu data are from RHIC 2005 run and correspond to a sampled integrated luminosity of 860 mub-1, while the p+p data are from 2005 and 2006, and correspond to the respective sampled integrated luminosity of 2.8 and 11.3 pb-1 . Measurements were done in the dielectron decay channel for the J/psi, within the pseudorapidity region |eta|<1 and full azimuthal coverage. For Cu+Cu data, the centrality selection was based on the distribution of charged-particle multiplicity within the pseudorapidity range |eta|<0.5. An estimate of the contribution of B-hadron decays to J/psi production is given based on (J/psi + charged hadrons) azimuthal correlations.     preprint arXiv:0904.0439 [nucl-ex]. The values given below which correspond to the figures in the article are from STAR web site http://drupal.star.bnl.gov/STAR/files/starpublications/134/data.html.
