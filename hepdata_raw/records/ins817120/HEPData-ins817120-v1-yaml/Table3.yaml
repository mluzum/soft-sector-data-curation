dependent_variables:
- header: {name: (1/(2*PI*PT))*D2N/DYRAP/DPT, units: GEV **-2}
  qualifiers:
  - {name: CENTRALITY, units: pct, value: 0.0-60.0}
  - {name: RE, value: CU CU --> J/PSI < E+ E- > X}
  - {name: SQRT(S), units: GeV, value: '200.0'}
  values:
  - errors:
    - asymerror: {minus: -6.0e-09, plus: 1.1e-08}
      label: stat
    - {label: sys, symerror: 3.0e-09}
    value: 2.5e-08
  - errors:
    - asymerror: {minus: -6.0e-10, plus: 1.1e-09}
      label: stat
    - {label: sys, symerror: 4.0e-10}
    value: 3.2e-09
independent_variables:
- header: {name: PT, units: GEV/C}
  values:
  - {high: 6.0, low: 5.0}
  - {high: 8.0, low: 6.0}
