additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0306029'}
- {description: web page, location: 'https://drupal.star.bnl.gov/STAR/publications/rapidity-and-centrality-dependence-proton-and-anti-proton-production-au-au-collisions-sqrt-s-sub-nn-sub-130-gev'}
comment: 'We report on the rapidity and centrality dependence of proton and antiproton
  transverse mass distributions from Au+Au collisions at 130 GeV as measured by the
  STAR experiment at the Relativistic Heavy Ion Collider (RHIC). Our results are from
  the rapidity and transverse momentum range of $|y|<0.5$ and $0.35<p_T<1.0$ GeV/$c$.
  For both protons and antiprotons, transverse mass distributions become more convex
  from peripheral to central collisions demonstrating characteristics of collective
  expansion. The measured rapidity distributions and the mean transverse momenta versus
  rapidity are flat within $|y|<0.5$. Comparisons of our data with results from model
  calculations indicate that in order to obtain a consistent picture of the proton
  (antiproton) yields and transverse mass distributions the possibility of prehadronic
  collective expansion may have to be taken into account. '
hepdata_doi: 10.17182/hepdata.102320.v1
