comment: |
  .  We report on measurements of a charge-dependent flow using a novel three-particle correlator with ALICE in Pb-Pb collisions at the LHC, and discuss the implications for observation of local parity violation and the Chiral Magnetic Wave (CMW) in heavy-ion collisions. Charge-dependent flow is reported for different collision centralities as a function of the event charge asymmetry.
