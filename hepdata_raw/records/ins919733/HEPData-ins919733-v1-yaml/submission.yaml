comment: |
  CERN-LHC.  Measurement of charged hadron multiplicity densities in  Lead-Lead collisions, collected with a minimum-bias trigger, at a centre-of-mass  energy of 2.76 TeV per nucleon pair. Data are presented as functions of the  centrality class, the charged hadron pseudorapidity and the number of participating nucleons, determined from a Glauber MC simulation.
