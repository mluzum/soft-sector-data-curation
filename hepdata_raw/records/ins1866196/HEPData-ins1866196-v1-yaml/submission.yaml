additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/blog/tnonaka/net-p-c6-paper-webpage'}
- {description: arXiv, location: 'https://arxiv.org/abs/2105.14698'}
comment: "According to the first principle Lattice QCD calculations, the transition
  from quark-gluon plasma to hadronic matter is a smooth crossover in the region $\\mu_{B}$
  \u2264 $T_{c}$. As a result, higher-order cumulants and their ratios are predicted
  to be negative, $C_{6}/C_{2}$ < 0, for example. In this paper, we report the first
  measurement of the midrapidity net-proton $C_{6}/C_{2}$ from 27, 54.4 and 200 GeV
  Au+Au collisions at RHIC. The dependence on collision centrality and kinematic acceptance
  in ($p_{T}$ , $y$) are analyzed. While for 54.4 GeV collisions, most of C6/C2 values
  are larger or equal to zero, it is observed that for 27 and 200 GeV collisions,
  the values of C6/C2 progressively become negative from peripheral to central collisions.
  Transport model calculations without critical dynamics predict values around zero.
  These observations seem in favor of a smooth crossover in the high energy nuclear
  collisions at RHIC."
