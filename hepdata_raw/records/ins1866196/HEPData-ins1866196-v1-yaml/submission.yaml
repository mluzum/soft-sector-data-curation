data_file: Fig1_27GeV_010.yaml
description: "Event by event net-proton multiplicity, $\\Delta N_{p}$, distributions
  for Au+Au collisions at \u221AsNN = 27, 54.4, and 200 GeV in 0-10% and 30-40% centralities
  at midrapidity (|y| < 0.5) for the transverse momentum range of 0.4 < $p_{T}$ (GeV/c)
  < 2.0. These distributions are normalized by the corresponding numbers of events
  and are not corrected for detector efficiencies. Statistical uncertainties are shown
  as vertical lines. The dashed lines show the Skellam distributions for each collision
  energy and centrality. The bottom panel shows the ratio of the data to the Skellam
  expectations."
