  for 2.5% centrality bin width. Results from the conventional efficiency correction
  are shown as black filled circles, results from the unfolding with the binomial
  detector response are shown as black open circles, and results from beta-binomial
  detector response with $\alpha+\sigma$, $\alpha$ and $\alpha-\sigma$ are shown in
  green triangles, red squares and blue triangles, respectively. C5, C6, C2/C1, C5/C1
  and C6/C2 are scaled by constant shown in each column.
