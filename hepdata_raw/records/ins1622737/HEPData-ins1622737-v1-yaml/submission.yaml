additional_resources:
- {description: web page with auxiliary material, location: 'http://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2014-05/'}
comment: |
  CERN-LHC.  The modification of the production of J/psi psi(2S), and Upsilon(nS) (n = 1, 2, 3) in p+Pb collisions with respect to their production in pp collisions has been studied. The p+Pb and pp datasets used in this paper correspond to integrated luminosities of 28 nb^-1 and 25 pb^-1 respectively, collected in 2013 and 2015 by the ATLAS detector at the LHC, both at a centre-of-mass energy per nucleon pair of 5.02 TeV. .
hepdata_doi: 10.17182/hepdata.82624.v1
---
data_file: data1.yaml
description: Summary of results for cross-section of non-prompt J/psi decaying to
  a muon pair in pp collisions at 5.02 TeV in nb/GeV.  Uncertainties are statistical
  and systematic, respectively.
keywords:
- name: reactions
  values: [P P --> J/PSI X]
- name: observables
  values: [D2SIG/DPT/DY]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Non-prompt J/psi, Cross section, Proton-Proton Collision]
location: Data from Figure 3A
name: Table 1
table_doi: 10.17182/hepdata.82624.v1/t1
