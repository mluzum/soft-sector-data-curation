data_file: figure_3a.yaml
description: FIG. 3. Fit parameters for $\left(\eta_{\Delta}, \phi_{\Delta}\right)$
  correlation data from Au-Au collisions at $\sqrt{s_{N N}}=62$ (open symbols) and
  200 GeV (solid symbols) versus centrality measure $\nu$ computed at fixed energy
  $(200 \mathrm{GeV})$. The SS $2 \mathrm{D}$ Gaussian amplitudes, $\eta_{\Delta}$
  widths, and $\phi_{\Delta}$ widths are shown in the left, center, and right panels,
  respectively of the top row. The bottom row shows from left to right the amplitudes
  for the dipole, quadrupole, and SS peak width aspect ratio $\sigma_{\eta_{\Delta}}
  / \sigma_{\phi_{\Delta}} .$ Fitting errors are indicated by error bars where larger
  than the symbols. Solid lines connect the points for clarity. The dotted and dashed
  curves indicate Glauber linear superposition estimates for 62 - and 200 -GeV peak
  amplitudes respectively, as discussed in the text. The quadrupole data are consistent
  with Ref. [60]. The hatched regions indicate the full range of systematic uncertainties
  listed in Appendix F. The vertical dark bands indicate estimated $v$ equivalents
  for $N-N$ collisions and $b=0$ Au-Au collisions.
