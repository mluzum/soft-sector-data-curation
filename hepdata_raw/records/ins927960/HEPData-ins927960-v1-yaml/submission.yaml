  data for 62 -GeV Au-Au collisions. The top panels show from left to right the corrected
  data, model fit, fit residuals (data - model), and same-side 2D Gaussian. The bottom
  panels similarly show the away-side azimuth dipole, the nonjet azimuth quadrupole,
  the 1D $\eta_{\Delta}$ Gaussian, and the 2D exponential. This centrality is just
  below the sharp transition at $v_{\text {trans }}=3$. Fit residuals (c) are scaled
  up eightfold relative to the data.
