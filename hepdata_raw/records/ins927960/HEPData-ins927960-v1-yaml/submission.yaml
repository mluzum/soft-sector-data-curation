description: FIG. 1. (Color online) Perspective views of $2 \mathrm{D}$ charge-independent
  angular correlations $\Delta \rho / \sqrt{\rho_{\mathrm{ref}}}$ on $\left(\eta_{\Delta},
  \phi_{\Delta}\right)$ for Au-Au collisions at $\sqrt{s_{N N}}=200$ and $62 \mathrm{GeV}$
  (top and bottom rows, respectively). Centrality increases left to right from most
  peripheral to most central. Corrected total cross-section fractions are (left to
  right) $84 \%-93 \%, 55 \%-64 \%, 18 \%-28 \%,$ and $0 \%-5 \%$ for the $200-\mathrm{GeV}$
  data and $84 \%-95 \%, 56 \%-65 \%$ $18 \%-28 \%,$ and $0 \%-5 \%$ for the $62 \mathrm{GeV}$
  data (see Tables III and IV).
