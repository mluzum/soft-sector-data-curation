data_file: Table1a.yaml
description: Midrapidity $(|y| < 0.5)$ transverse momentum spectra of $\phi$ mesons
  for various collision centrality classes for $Cu+Cu$ collisions at $\sqrt{s_{NN}}=62.4$
  and 200 GeV. To study the system size dependence, comparison of $40-50\%$ $Au+Au$
  spectra to $10-20\%$ $Cu+Cu$ spectra at 200 GeV, and $40-60\%$ $Au+Au$ spectra to
  $20-30\%$ $Cu+Cu$ spectra at 62.4 GeV are shown. These centralities for the two
  colliding systems have similar $\langle N_{\scriptsize{\mbox{part}}}\rangle$ values
  as outlined in Table 2. The errors represent the statistical and systematic errors
  added in quadrature. They are found to be within the symbol size. The spectra are
  fitted to a Levy function discussed in the text.
