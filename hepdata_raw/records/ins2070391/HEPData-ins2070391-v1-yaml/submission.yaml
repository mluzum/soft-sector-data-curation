comment: |
  Measurements of antideuteron number fluctuations in Pb-Pb collisions at $\sqrt{s_\mathrm{NN}}$ = 5.02 TeV using the ALICE detector at the CERN LHC. Second order cumulant to fitrst order cumulant ratios of antideuteron multiplicity distributions are reported as a function of collision centrality. Furthermore, pearson correlations between measured antideuteron and antiproton are also presented as a function of collision centrality as well as pseudorapidity acceptance.
hepdata_doi: 10.17182/hepdata.136310.v1
---
data_file: Table1.yaml
description: Second order to first order cumulant ratio of the $\overline{d}$ multiplicity
  distribution as a function of collision centrality in Pb-Pb collisions at $\sqrt{s_\mathrm{NN}}$
  = 5.02 TeV.
keywords:
- name: observables
  values: [kappa2/kappa1]
- name: cmenergies
  values: [5020.0]
- name: reactions
  values: ['Pb Pb --> $\overline{d}$ + $X$']
location: Data from Figure 1
name: Table 1
table_doi: 10.17182/hepdata.136310.v1/t1
