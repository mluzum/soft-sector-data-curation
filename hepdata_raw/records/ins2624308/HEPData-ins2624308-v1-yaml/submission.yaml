comment: We present, for the first time at LHC energies, the forward rapidity gap
  spectra from  proton-lead collisions for both proton and lead dissociation processes.
  The analysis is performed over 10.4 units of pseudorapidity at a center-of-mass
  energy of $\sqrt{s_{\mathrm{NN}}}=8.16~\text{TeV}$, i.e. almost 300 times higher
  than previous measurements of diffractive production in proton-nucleus collisions.
  For lead dissociation processes, which corresspond to the pomeron-lead event topology,
  the EPOS-LHC predictions are a factor of two below the unfolded data but the model
  does give a reasonable description of the shape of the spectrum. For the pomeron-proton
  topology the EPOS-LHC, QGSJET II and HIJING generator predictions are all at least
  a factor of five below the data. This effect can be explained by a significant contribution
  of ultra-peripheral photoproduction events mimicking the signature of diffractive
  processes. The obtained data may be of significant help in understanding the high
  energy limit of QCD and modeling cosmic ray air showers.
