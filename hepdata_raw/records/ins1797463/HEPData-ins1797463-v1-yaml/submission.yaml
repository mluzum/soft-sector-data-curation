data_file: table_1.yaml
description: Average $v_2${SP} vs. $p_\mathrm{T}$ of prompt D$^0$, D$^+$, and D$^{*+}$
  mesons in Pb-Pb collisions at $\sqrt{s_\mathrm{NN}}=5.02$ TeV in the centrality
  class 0-10% in the rapidity interval $|y|<0.8$. The first (sys,data) error is the
  systematic uncertainty from all the other sources except for the B feed-down. The
  second (sys,FD) error is the systematic uncertainty from the B feed-down contribution.
keywords:
- name: observables
  values: [V2]
- name: reactions
  values: ['Pb-Pb --> D$^0$, D$^+$, D$^{*+}$ + X']
- name: cmenergies
  values: [5020.0]
location: Data from Figure 2 top-left panel (black circles)
name: Table 1
table_doi: 10.17182/hepdata.105256.v1/t1
