comment: CERN LHC. The elliptic and triangular flow coefficients $v_2$ and $v_3$ of
  prompt $\mathrm{D}^0$, $\mathrm{D}^+$, and $\mathrm{D}^{*+}$ mesons were measured
  at mid rapidity ($|y|<0.8$) in Pb-Pb collisions at the centre-of-mass energy per
  nucleon pair of $\sqrt{s_\mathrm{NN}}=5.02$ TeV with the ALICE detector at the LHC.
  The D mesons were reconstructed via their hadronic decays in the transverse momentum
  interval $1<p_\mathrm{T}<36$ GeV$/c$ in central (0-10%) and semi-central (30-50%)
  collisions. Compared to pions, protons, and $\mathrm{J}/\psi$ mesons, the D-meson
  $v_\mathrm{n}$ harmonics are found to follow a mass ordering for $p_\mathrm{T}<3$
  GeV$/c$, and to be similar to those of pions for higher $p_\mathrm{T}$. The coupling
  of the charm quark to the light quarks in the underlying medium is further investigated
  with the application of the event-shape engineering (ESE) technique to the D-meson
  $v_2$ and $p_\mathrm{T}$-differential yields. The D-meson $v_2$ is correlated with
  the average bulk elliptic flow in both central and semi-central collisions. Within
  the current precision, the ratios of per-event D-meson yields in the ESE-selected
  and unbiased samples are found to be compatible with unity.  All the measurements
  are found to be reasonably well described by theoretical calculations including
  the effects of charm-quark transport and the recombination of charm quarks with
  light quarks in a hydrodynamically expanding medium.
