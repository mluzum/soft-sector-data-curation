additional_resources: []
comment: "The production of prompt $\\Lambda_\\mathrm{c}^+$ baryons has been measured
  at midrapidity in the transverse momentum interval $0<p_\\mathrm{T}<1$ GeV/$c$ for
  the first time, in pp and p\u2013Pb collisions at a centre-of-mass energy per nucleon--nucleon
  collision  $\\sqrt{s_\\mathrm{NN}} = 5.02$ TeV. The measurement was performed in
  the decay channel $\\Lambda_\\mathrm{c}^{+}\\rightarrow \\mathrm{pK}^{0}_\\mathrm{S}$
  by applying new decay reconstruction techniques using a Kalman-Filter vertexing
  algorithm and adopting a machine-learning approach for the candidate selection.
  The $p_\\mathrm{T}$-integrated $\\Lambda_\\mathrm{c}^+$ production cross sections
  in both collision systems were determined and used along with the measured yields
  in \\PbPb collisions to compute the $p_\\mathrm{T}$-integrated nuclear modification
  factors $R_\\mathrm{pPb}$ and $R_\\mathrm{AA}$ of $\\Lambda_\\mathrm{c}^+$ baryons,
  which are compared to model calculations that consider nuclear modification of the
  parton distribution functions. The $\\Lambda_\\mathrm{c}^+/\\mathrm{D}^0$ baryon-to-meson
  ratio is reported for pp and p\u2013Pb collisions. Comparisons with models that
  include modified hadronisation processes are presented, and the implications of
  the results on the understanding of charm hadronisation in hadronic collisions are
  discussed. A significant ($3.7\\sigma$) modification of the mean transverse momentum
  of $\\Lambda_\\mathrm{c}^+$ baryons is seen in p\u2013Pb collisions with respect
  to pp collisions, while the $p_\\mathrm{T}$-integrated $\\Lambda_\\mathrm{c}^+/\\mathrm{D}^0$
  yield ratio was found to be consistent between the two collision systems within
  the uncertainties."
hepdata_doi: 10.17182/hepdata.140485.v1
