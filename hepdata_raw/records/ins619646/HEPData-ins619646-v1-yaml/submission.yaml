comment: |
  Measurement of J/PSI yield in the PHENIX experiment via electron-positron decay, at mid rapidity, for Au-Au reactions, at center-of-masse energy of 200 GeV. The yield is measured for different bins of centrality.     For the yield calculations, the branching ratio B(J/PSI -> e+e-) that has been used is B=(5.93+-0.10)e-2.     The number of collisions and the number of participants are evalutated with a Glauber model for the 3 bins of centrality :0-20%, 20-40% and 40-90% of Au-Au cross-section.The systematic error on expected binary collisions is neglegted and is not included in the systematic error on the yield.
