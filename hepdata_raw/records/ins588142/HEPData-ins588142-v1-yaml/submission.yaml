- {description: web page, location: 'https://drupal.star.bnl.gov/STAR/publications/coherent-rho-zero-production-ultra-peripheral-heavy-ion-collisions'}
comment: The STAR Collaboration reports the first observation of exclusive $\rho^0$
  photoproduction, $AuAu\rightarrow AuAu\rho^0$, and $\rho^0$ production accompanied
  by mutual nuclear Coulomb excitation, $AuAu\rightarrow Au^\ast Au^\ast \rho^0$,
  in ultraperipheral heavy-ion collisions. The $\rho^0$ have low transverse momenta,
  consistent with coherent coupling to both nuclei. The cross sections at $\sqrt{s_{_{NN}}}$
  = 130 GeV agree with theoretical predictions treating $\rho^0$ production and Coulomb
  excitation as independent processes.
hepdata_doi: 10.17182/hepdata.102319.v1
