{comment: 'Measurements of higher-order fluctuations of $\langle p_\mathrm{T}\rangle$
    distribution in Pb$-$Pb collisions, Xe$-$Xe collisions at $\sqrt{s_\mathrm{NN}}$
    = 5.02 TeV  and in pp collisions at at $\sqrt{s}$ = 5.02 TeV using the ALICE detector
    at the CERN LHC. Standardized skewness, intensive skewness and kurtosis of $\langle
    p_\mathrm{T}\rangle$ are presented as a function of $\langle\mathrm{d}N_\mathrm{ch}/\mathrm{d}\eta\rangle^{1/3}_{|\eta|<0.5}$
    for all the collision systems. The charged particles are selected in the transverse
    momentum range, 0.2 < $p_\mathrm{T}$ (GeV/c) < 3.0 and pseudorapidity range, $|\eta|$
    < 0.8.', hepdata_doi: 10.17182/hepdata.147284.v1}
