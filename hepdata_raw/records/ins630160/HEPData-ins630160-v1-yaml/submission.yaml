- {description: Image file, location: Fig1.png}
- {description: Thumbnail image file, location: thumb_Fig1.png}
data_file: fig1-1.yaml
description: invariant yield as function of transverse mass for $\pi^{\pm},K^{\pm}$
  and inclusive $p$ and $\bar{p}$ at mid-rapidity ($|y|<0.1$) for pp (bottom) and
  Au+Au events from $70-80\%$ (second bottom) to the $0-5\%$ centrality bin (top).
  Statistical and point-to-point systematic errors have been added in quadrature.
  Additional correlated systematic error due to uncertainty in the normalization is
  estimated to be $5\%$. Open circles are for positive particles (all proton spectra
  are scaled by 0.8), and closed triangles are for negative particles. The curves
  shown (Bose-Einstein fits for $\pi^-$ and blast-wave model fits for $K^-$ and $\bar{p}$)
  are explained in the text.
