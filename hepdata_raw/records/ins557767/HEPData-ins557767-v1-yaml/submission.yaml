data_file: Figure_01.yaml
description: "Normalized multiplicity distribution of $h^{\u2212}$ with $p_{T} > 100$
  MeV/$c$ at $|\\eta| < 0.5$ in Au+Au collisions at $\\sqrt{s_{NN}} = 130$ GeV. Systematic
  error on the vertical scale is estimated to be $10\\%$. The systematic error on
  the horizontal scale is $6\\%$ for the entire range of multiplicity. The shaded
  area is $5\\%$ most central collisions, selected by ZDC coincidence. The solid curve
  is the prediction from the HIJING model."
