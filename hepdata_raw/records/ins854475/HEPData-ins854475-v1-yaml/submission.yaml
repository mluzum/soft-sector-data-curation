- {description: arXiv, location: 'http://arxiv.org/abs/1005.1627'}
- {description: InspireHEP, location: 'https://inspirehep.net/literature/854475'}
comment: |
  Transverse momentum spectra of electrons ($p^e_T$) from semileptonic weak decays of heavy flavor mesons in the range of 0.3 < $p^e_T$ < 9.0 GeV/$c$ have been measured at mid-rapidity ($|y|$ < 0.35) by the PHENIX experiment at the Relativistic Heavy Ion Collider in $p$+$p$ and Au+Au collisions at $\sqrt{s_{NN}}$ = 200 GeV. In addition, the azimuthal anisotropy parameter $v_2$ has been measured for 0.3 < $p^e_T$ < 5.0 GeV/$c$ in Au+Au collisions. The substantial modification in the $p^e_T$ spectra in Au+Au compared with $p$+$p$ collisions as well as the nonzero $v_2$ indicate substantial interactions and flow of heavy quarks in traversing the produced medium. Comparisons of these observables with detailed theoretical calculations can be used to identify the nature of these interactions and to quantify their extent.
hepdata_doi: 10.17182/hepdata.142339.v1
