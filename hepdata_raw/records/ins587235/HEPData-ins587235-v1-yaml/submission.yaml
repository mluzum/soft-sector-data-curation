comment: |
  BNL-RHIC. Study of K*(892)0 production in heavy ion collisions. The transverse mass distribution from central AU-AU collisions at nucleon-nucleon SQRT(S) = 130 GeV is presented and ratios of K*0 yields to negative hadrons, kaon and phi mesons are derived by combining with previous STAR data.
dateupdated: 28/05/2002 00:00:00
hepdata_doi: 10.17182/hepdata.54898.v1
modifications:
- {action: Encoded, date: 28 May 2002, who: Mike Whalley}
record_ids:
- {id: 587235, type: inspire}
- {id: 4604, type: red}
---
data_file: Table1.yaml
description: |
  Transverse mass spectrum of K*0 with YRAP = -0.5 to 0.5 for the 14 PCT most central interactions. Numerical values requested from the authors.
keywords:
- name: reactions
  values: [AU AU --> K*(892)0 X, AU AU --> K*BAR(892)0 X]
- name: observables
  values: [DN/DY/DMT]
- name: plabs
  values: ['6.500E+01,6.500E+01']
- name: phrases
  values: [Inclusive, Single Differential Distribution, Strange production]
location: Data from F 2
name: Table 1
table_doi: 10.17182/hepdata.54898.v1/t1
