comment: |
  CERN-LHC. Measurement of inclusive J/PSI production in Lead-Lead collisions at a nucleon-nucleon  centre-of-mass energy of 2.76 TeV using data collected during 2010 having integrated luminosity ~ 3 mub-1.  The data cover the transverse momentum range > 0 and rapidity from 2.5 to 4.0. Tables of the nuclear   modification factor, RAA, are presented both as functions of the centrality of the collision and   its associated Number of particles, Npart, as well as in two rapidity and transverse momentum ranges.
