comment: The first relative transverse momentum ($k_{\text{T}}$) scan of the Lund
  jet plane of high-energy jets produced in lead-lead (PbPb) collisions is presented
  and compared to the result obtained in proton-proton (pp) collisions. The PbPb (pp)
  data were recorded by the CMS experiment in 2018 (2017) and correspond to an integrated
  luminosity of $1.7$ nb$^{-1}$ ($301$ pb$^{-1}$) at a nucleon-nucleon center-of-mass
  energy of 5.02 TeV. The angular distribution of the primary emissions with the highest
  $k_{\text{T}}$ of anti-$k_{\text{T}}$ jets with a distance parameter $R=0.4$ is
  reported. Two different ranges of $k_{\text{T}}$ are investigated for jets with
  transverse momentum in the range $200 < p_{\text{T}}^\text{jet} < 1000$ GeV, in
  order to explore the energy scale dependence of the jet quenching phenomena.The
  measurement was designed to test whether the earliest jet emissions are produced
  before the formation of the quark-gluon plasma in PbPb collisions.The angular distribution
  of emissions at high $k_{\text{T}}$ has a similar shape in pp and PbPb collisions,
  which is consistent with the emissions being part of the early and vacuum-like regime
  of the jet evolution in PbPb collisions.
