comment: "The BRAHMS collaboration has measured transverse momentum spectra of pions,
  kaons, protons, and antiprotons at rapidities 0 and 3 for Cu+Cu collisions at sNN=200
  GeV. As the collisions become more central the collective radial flow increases
  while the temperature of kinetic freeze-out decreases. The temperature is lower
  and the radial flow weaker at forward rapidity. Pion and kaon yields with transverse
  momenta between 1.5 and 2.5\_GeV/c are suppressed for central collisions relative
  to scaled p+p collisions. This suppression, which increases as the collisions become
  more central, is consistent with jet quenching models and is also present with comparable
  magnitude at forward rapidity. At such rapidities, initial state effects may also
  be present and persistence of the meson suppression to high rapidity may reflect
  a combination of jet quenching and nuclear shadowing. The ratio of protons to mesons
  increases as the collisions become more central and is largest at forward rapidities."
