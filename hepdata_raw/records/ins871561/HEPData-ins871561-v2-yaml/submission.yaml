additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/strange-and-multi-strange-particle-production-auau-collisions-sqrtsnn624gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/1010.0142'}
comment: "We present results on strange and multi-strange particle production in Au+Au
  collisions at \u221AsNN=62.4 GeV as measured with the STAR detector at RHIC. Mid-rapidity
  transverse momentum spectra and integrated yields of KS0, \u039B, \u039E, \u03A9
  and their anti-particles are presented for different centrality classes. The particle
  yields and ratios follow a smooth energy dependence. Chemical freeze-out parameters,
  temperature, baryon chemical potential and strangeness saturation factor obtained
  from the particle yields are presented. Intermediate transverse momentum (pT) phenomena
  are discussed based on the ratio of the measured baryon-to-meson spectra and nuclear
  modification factor. The centrality dependence of various measurements presented
  show a similar behavior as seen in Au+Au collisions at \u221AsNN=200 GeV."
