data_file: HEPData_CrossSecsJetKin.yaml
description: Fully unfolded triple-differential cross-sections as a function of $H_\text{T}$,
  $y_\text{jets}$, and $m_\text{jets}$. Systematic uncertainties are decomposed into
  symmetrized nuisance parameters, where parameters labelled "Corr" are fully correlated
  bin-to-bin, while parameters labelled "Uncorr" should be treated as un-correlated
  bin-to-bin. These cross-sections are not corrected for the effects of additional
  nuclear break-up. Values for the total fiducial cross-section in each bin are reported
  with full statistical and systematic uncertainties. Fractions of the total bin volume
  occupied by the fiducial region, fractions of the total cross-section in that bin
  satisfying fiducial requirements, and mean bin values for each axis variable are
  derived from Pythia 8 Monte Carlo and reported as well. For more details on these
  quantities, see Appendix B.
