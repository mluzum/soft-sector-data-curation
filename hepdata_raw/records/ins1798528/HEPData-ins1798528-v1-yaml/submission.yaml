comment: "\"Systematic studies of charge-dependent two- and three-particle correlations
  in \nPb--Pb collisions at $\\sqrt{\\it{s}_\\mathrm{{NN}}} = $ 2.76~and 5.02~TeV
  used to \nprobe the Chiral Magnetic Effect (CME) are presented. These measurements
  \nare performed for charged particles in the pseudorapidity ($\\eta$) and transverse
  \nmomentum ($p_{\\rm{T}}$) ranges $\\left|\\eta \\right| < 0.8$ and $0.2 < p_{\\mathrm{T}}
  < 5$~GeV/$c$. \nA significant charge-dependent signal that becomes more pronounced
  for peripheral \ncollisions is reported for the CME-sensitive correlators \n$\\gamma_{1,1}
  = \\langle \\cos (\\varphi_{\\alpha} +\\varphi_{\\beta} - 2\\Psi_{2}) \\rangle$
  \nand $\\gamma_{1,-3} = \\langle \\cos (\\varphi_{\\alpha} -3\\varphi_{\\beta} +
  2\\Psi_{2}) \\rangle$. \nThe results are used to estimate the contribution of background
  effects, associated \nwith local charge conservation coupled to anisotropic flow
  modulations, to measurements \nof the CME. A blast-wave parametrisation that incorporates
  local charge conservation \ntuned to reproduce the centrality dependent background
  effects is not able to fully describe \nthe measured $\\gamma_{1,1}$. Finally, the
  charge and centrality dependence of mixed-harmonics  \nthree-particle correlations,
  of the form \n$\\gamma_{1,2} = \\langle \\cos (\\varphi_{\\alpha} + 2 \\varphi_{\\beta}
  - 3\\Psi_{3}) \\rangle$, \nwhich are insensitive to the CME signal, verify again
  that background contributions \ndominate the measurement of $\\gamma_{1,1}$.\"\n"
hepdata_doi: 10.17182/hepdata.97127.v1
