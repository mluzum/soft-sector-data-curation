- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/disappearance-back-back-high-p-sub-t-sub-hadron-correlations-central-au-au-collisions-sqrt-s-sub-nn-sub-200-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0210033'}
comment: Azimuthal correlations for large transverse momentum charged hadrons have
  been measured over a wide pseudorapidity range and full azimuth in Au+Au and p+p
  collisions at $\sqrt{s_{_{\rm NN}}}=$200 GeV. The small-angle correlations observed
  in p+p collisions and at all centralities of Au+Au collisions are characteristic
  of hard-scattering processes previously observed in high-energy collisions. A strong
  back-to-back correlation exists for p+p and peripheral Au+Au. In contrast, the back-to-back
  correlations are reduced considerably in the most central Au+ Au collisions, indicating
  substantial interaction as the hard-scattered partons or their fragmentation products
  traverse the medium.
