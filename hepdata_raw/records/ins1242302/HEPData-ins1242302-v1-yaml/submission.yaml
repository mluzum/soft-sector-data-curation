data_file: Table1.yaml
description: |
  The Fourier coefficients V2(2PC,sub) extracted for all charged particles as a function of PT from the correlation in  the 0-20% multiplicity class after subraction of the correlation from the 60-100% event class.
keywords:
- name: reactions
  values: [P  PB --> CHARGED X]
- name: observables
  values: [CORR]
- name: phrases
  values: [Inclusive]
- name: cmenergies
  values: [5020.0]
location: Data from F 4
name: Table 1
table_doi: 10.17182/hepdata.61628.v1/t1
