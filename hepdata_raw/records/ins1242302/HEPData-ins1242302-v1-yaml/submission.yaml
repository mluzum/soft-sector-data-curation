comment: |
  CERN-LHC.  Measurements of angular correlations between unidentified charged trigger particles   and various species of charged associated partices (all charged, pions, kaon, protons and antiprotons)  produced from proton-lead collisions at a nucleon-nucleon centre-of-mass energy of 5.02 TeV in the   transverse momentum range 0.3-4 GeV/c.  The correlations, expressed as associated yield per trigger   particle, are obtained in the lab. pseudorapidity range |eta|<0.8.  Fourier coefficients are extracted  from the long-range correlations projected onto the azimuthal angle difference and studied as a function  of PT and in intervals of event multiplicity.  This record tabulates the values of the Fourier   coefficient V2 extracted using two methods refered to as 2PC, the two-particle correlation method, and  SP,  the scalar product method.  See the text of the paper for details. In figure 4 the per trigger  yield measured in high multiplicity events is subtracted from that of low multiplicity events to reduce  correaltions due to jets.
