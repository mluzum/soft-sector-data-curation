comment: |
  CERN-LHC.  Invariant yields of neutral pions at midrapidity in the transverse momentum range 0.6<pT<12 GeV/c measured in Pb-Pb collisions at \sqrt{s_{NN}} = 2.76 TeV are presented for six centrality classes. The pp reference spectrum was measured in the range 0.4<pT<10 GEV/c at the same center-of-mass energy. The nuclear modification factor, RAA, shows a suppression of neutral pions in central Pb-Pb collisions by a factor of up to about 8-10 for 5 \leq pT \leq 7 GeV/c. The presented measurements are compared with results at lower center-of-mass energies and with theoretical calculations.
