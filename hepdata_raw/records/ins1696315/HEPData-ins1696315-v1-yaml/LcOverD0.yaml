dependent_variables:
- header: {name: Lc/D0 ratio in Pb-Pb}
  qualifiers:
  - {name: RE, value: 'PB PB --> Lc X + CC, PB PB --> D0 X + CC'}
  - {name: SQRT(S)/NUCLEON, units: GEV, value: '5020.0'}
  - {name: PT, units: GEV/C, value: 6.0 TO 12.0}
  - {name: YRAP, value: -0.5 TO 0.5}
  - {name: CENTRALITY, units: pct, value: 0.0 TO 80}
  values:
  - errors:
    - {label: stat, symerror: 0.2}
    - asymerror: {minus: -0.14, plus: 0.15}
      label: sys
    value: 1.07
independent_variables:
- header: {name: PT, units: GEV/C}
  values:
  - {high: 12.0, low: 6.0, value: 9.0}
