description: Collision energy dependence of the ratios of cumulants, $C_4/C_2$, for
  proton (squares) and net-proton (red circles) from top 0-5% Au+Au collisions at
  RHIC. The points for protons are shifted horizontally for clarity. The new result
  for proton from $\sqrt{s_{NN}}$ = 3.0 GeV collisions is shown as a filled square.
  HADES data of $\sqrt{s_{NN}}$ = 2.4 GeV 0-10% collisions is also shown. The vertical
  black and gray bars are the statistical and systematic uncertainties, respectively.
  In addition, results from the HRG model, based on both Canonical Ensemble (CE) and
  Grand-Canonical Ensemble (GCE), and transport model UrQMD are presented.
