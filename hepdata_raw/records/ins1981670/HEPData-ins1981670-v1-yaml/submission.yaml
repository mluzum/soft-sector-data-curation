description: Centrality dependence of the proton cumulant ratios for Au+Au collisions
  at $\sqrt{s_{NN}}$ = 3.0 GeV. Protons are from $-0.5 < y < 0$ and $0.4 < p_{T} <
  2.0$ GeV/$c$. Systematic uncertainties are represented by gray bars. Statistical
  uncertainties are smaller than marker size. CBWC is applied to all cumulant ratios.
  While open squares represent the data without the VFC correction, blue triangles
  and red circles are the results with VFC using the $\langle N_{\rm{part}} \rangle$
  distributions from the UrQMD and Glauber models, respectively. UrQMD model results
  are represented as gold dashed line.
