comment: |
  Au+Au collisions at RHIC. Event-by-event transverse momentum fluctuations
  and the dynamical correlator C_pT, measured by the STAR experiment across
  the Beam Energy Scan, in both the fixed-target (FXT) and collider (COL)
  configurations. Charged particles are selected within ABS(ETARAP) < 0.5
  and 0.2 < PT < 2.0 GeV/c.
hepdata_doi: 10.17182/hepdata.181421.v1
