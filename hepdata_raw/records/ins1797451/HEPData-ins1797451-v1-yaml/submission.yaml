data_file: Fig9a.yaml
description: Probing the effect of varying the source shift in the outward direction,
  $\mu_{\mathrm{out}}$, within the THERMINATOR 2 framework. To achieve this, particle
  pairs are formed from the simulation, but with altered spatial characteristics achieved
  by drawing the out, side, and long components from predetermined Gaussian distributions.
  The sources in all three directions are Gaussians of width 5 fm. The distributions
  used for the side and long direction are centered at the origin, while the shift
  in the outward direction, $\mu_{\mathrm{out}}$, is varied. THERMINATOR 2 simulated
  correlation functions with $\mu_{\mathrm{out}} = 0$ fm.
