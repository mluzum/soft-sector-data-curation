dependent_variables:
- header: {name: RATIO}
  qualifiers:
  - {name: RE, value: PB PB --> J/PSI(1S) X}
  - {name: SQRT(S)/NUCLEON, units: GEV, value: 5020}
  - {name: YRAP, value: 2.5 to 4}
  - {name: PT, units: GEV/C, value: 0 to 0.3}
  values:
  - errors:
    - {label: stat, symerror: 1.5}
    - {label: sys_uncorr, symerror: 0.9}
    - asymerror: {minus: -0.5, plus: 0.4}
      label: sys_corr
    value: 2.5
  - errors:
    - {label: stat, symerror: 1}
    - {label: sys_uncorr, symerror: 0.5}
    - asymerror: {minus: -0.8, plus: 0.6}
      label: sys_corr
    value: 3.7
  - errors:
    - {label: stat, symerror: 0.5}
    - {label: sys_uncorr, symerror: 0.4}
    - asymerror: {minus: -0.6, plus: 0.5}
      label: sys_corr
    value: 2.8
independent_variables:
- header: {name: Centrality class, units: '%'}
  values:
  - {high: 50, low: 30}
  - {high: 70, low: 50}
  - {high: 90, low: 70}
