comment: |
  BNL-RHIC. Measurement of the spectra of identified PI+-,K+- and P/PBAR in AU AU collisions at a nucleon-nucleon centre-of-mass energy of 130 GeV. Data obtained from the PHENIX web publication server www.phenix.bnl.gov/papers.html.
dateupdated: 30/04/2003 00:00:00
hepdata_doi: 10.17182/hepdata.19421.v1
modifications:
- {action: Encoded, date: 30 Apr 2003, who: Mike Whalley}
record_ids:
- {id: 568437, type: inspire}
- {id: 4625, type: red}
---
data_file: Table1.yaml
description: |
  Transverse momentum spectra for PI+ in the midrapidity range for the centrality region 0 to 5 PCT. Errors are combined statistical and systematics.
keywords:
- name: reactions
  values: [AU AU --> PI+ X, NUCLEUS NUCLEUS --> PI+ X]
- name: observables
  values: [D2N/DPT/DYRAP]
- name: phrases
  values: [Inclusive, Double Differential Distribution, Transverse Momentum Dependence,
    Rapidity Dependence]
- name: cmenergies
  values: [130.0]
location: Data from F 1
name: Table 1
table_doi: 10.17182/hepdata.19421.v1/t1
