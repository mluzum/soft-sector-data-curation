comment: |
  ELECTRON SCATTERING AT 4-DEGREES WITH ENERGIES OF 4.5-GEV - 20-GEV ,ONLY ELASTIC RESULTS AT THIS PART.
  THESE DATA ARE FROM EXPEIMENT E61 AT SLAC. THE RANGES OF VARIABLES ARE E LAB 7.0 TO 20.0 GEV THETA LAB 4 DEGREES NU 0.199 TO 17.29 GEV Q2 0.060 TO 1.838 GEV**2 X 0.008 TO 0.860 W 1.073 TO 5.75 GEV THE DATA HAS BEEN PROCESSED BY SLAC RADIATIVE CORRECTIONS AND WAS OBTAINED THROUGH G.C.FOX AT CALTECH.
