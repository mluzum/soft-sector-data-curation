- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/azimuthal-anisotropy-and-correlations-hard-scattering-regime-rhic'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0206006'}
comment: Azimuthal anisotropy ($v_{2}$) and two-particle angular correlations of high
  $p_{T}$ charged hadrons have been measured in Au+Au collisions at $\sqrt{s_{NN}}$=130
  GeV for transverse momenta up to 6 GeV/c, where hard processes are expected to contribute
  significantly. The two-particle angular correlations exhibit elliptic flow and a
  structure suggestive of fragmentation of high $p_{T}$ partons. The monotonic rise
  of $v_{2}$($p_{T}$) for $p_{T}$<2 GeV/c is consistent with collective hydrodynamical
  flow calculations. At $p_{T}$>3 GeV/c a saturation of $v_{2}$ is observed which
  persists up to $p_{T}$=6 GeV/c.
hepdata_doi: 10.17182/hepdata.98579.v1
