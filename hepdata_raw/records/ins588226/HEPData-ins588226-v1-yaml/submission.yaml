description: $v_{2}$($p_{T}$) for minimum-bias events (circles). The error bars represent
  the statistical errors and the caps show the systematic uncertainty. The data are
  compared with hydro+pQCD calculations [9] assuming the initial gluon density $dN^{g}/dy$
  = 1000 (dashed line), 500 (dotted line), and 200 (dashed-dotted line). Also shown
  are pure hydrodynamical calculations [16] (solid line).
