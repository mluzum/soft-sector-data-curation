additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/directed-flow-identified-particles-au-au-collisions-sqrtsnn-200-gev-rhic'}
comment: "STAR\u2019s measurements of directed flow ($v_1$) splitting using produced
  particles $K^{-}$, $\\bar{p}$, $\\bar{\\Lambda}$, $\\phi$, $\\overline{\\Xi}^{+}$,
  ${\\Omega}^{-}$ and $\\overline{\\Omega}^{+}$, none of whose constituent quarks
  is transported from the colliding nuclei. Measurements are done in $Au + Au$ collisions
  at $\\sqrt{s_{NN}} = 27$ GeV and $\\sqrt{s_{NN}} = 200$ GeV. For 10-40\\% centrality,
  we examine quark coalescence behavior for particle combinations with identical quark
  content, and search for any departure from this behavior (``splitting'') for combinations
  having non-identical quark content. Under the assumption of quark coalescence for
  produced quarks, the splitting strength appears to increase with the electric charge
  difference of the constituent quarks in the combinations, consistent with electromagnetic
  effect expectations."
hepdata_doi: 10.17182/hepdata.139902.v1
