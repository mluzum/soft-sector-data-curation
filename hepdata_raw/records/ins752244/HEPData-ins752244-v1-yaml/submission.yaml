additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/forward-lambda-production-and-nuclear-stopping-power-d-au-collisions-sqrt-s-sub-nn-sub-200-gev'}
- {description: arXiv, location: 'https://arxiv.org/abs/0706.0472'}
comment: We report the measurement of Lamda and Anti-Lamda yields and inverse slope
  parameters in d + Au collisions at $\sqrt{s_{NN}}$ = 200 GeV at forward and backward
  rapidities (y = $\pm$2.75), using data from the STAR forward time projection chambers.
  The contributions of different processes to baryon transport and particle production
  are probed exploiting the inherent asymmetry of the d + Au system. Comparisons to
  model calculations show that the baryon transport on the deuteron side is consistent
  with multiple collisions of the deuteron nucleons with gold participants. On the
  gold side HIJING based models do not describe the measured particle yields while
  models with initial state nuclear effects and/or hadronic rescattering do. The Multi-Chain
  Model can provide a good description of the net baryon density in d + Au collisions
  at RHIC, and the derived parameters of the model agree with those from nuclear collisions
  at lower energies.
hepdata_doi: 10.17182/hepdata.98961.v1
