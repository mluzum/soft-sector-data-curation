description: (Color online) Net $\Lambda dN/dy$ for central, mid-central and peripheral
  events on both the deuteron and the Au side of the collision. The data are compared
  to calculations of the distribution of net baryons obtained with the Multichain
  model [16] with $\alpha$ = 2.9, scaled by 0.1 to account for the conversion from
  net baryons to net $\Lambda$. An overall scale uncertainty of 10% on the model curves
  from this conversion is not shown. See text for details.
