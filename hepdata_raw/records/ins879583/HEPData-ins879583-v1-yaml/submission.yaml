comment: |
  CERN-LHC.  Measurement of the inclusive transverse momentum spectra of primary charged particles produced in PB-PB collisions at a centre-of-mass energy per nulceon of 2.76 TeV.  Data are presented for central and peripheral collisions corresponding to 0-5% and 70-80% of the hadronic cross section.  The data cover the |pseudorapidity| region < 0.8 with transverse momenta from 0.3 to 20 GeV/c. Numerical values supplied by H Buesching.
