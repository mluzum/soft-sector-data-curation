data_file: figure_3.yaml
description: Probability for different neutron multiplicity classes (0n, 1n, and Xn
  with X $\ge$1) measured on each ZDC side for the exclusive $e^{+}e^{-}$ events passing
  the fiducial phase space of Table 1. The measured ratios are compared with SUPERCHIC
  4.2, STARLIGHT 3.13, and gamma-UPC 1.6 predictions.
keywords:
- name: observables
  values: [Neutron category probability]
- name: cmenergies
  values: [5020]
- name: reactions
  values: [$Pb~Pb~\rightarrow~Pb~Pb~e^+~e^-$]
- name: phrases
  values: [exclusive e+ e-, neutron multiplicity]
location: Figure 3
name: Figure 3
table_doi: 10.17182/hepdata.155674.v1/t1
