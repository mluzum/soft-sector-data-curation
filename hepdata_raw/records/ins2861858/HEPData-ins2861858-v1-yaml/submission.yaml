data_file: figure_8_(right).yaml
description: Observed and expected 95% CL limits on the production cross section $\sigma(\gamma\gamma
  \rightarrow a \rightarrow \gamma\gamma)$ as a function of the ALP mass $m_{a}$.
  The uncertainties indicate regions containing 68 and 95% of the distribution of
  limits expected under the background-only hypothesis. The additional datasets indicate
  the expected ALP cross sections as a function of $m_{a}$ for decreasing photon couplings
  ($g_{a\gamma} = 0.3, 0.1, 0.05 TeV^{-1}$).
keywords:
- name: observables
  values: ['$\sigma_{\gamma\gamma \to a \to \gamma\gamma}$ (nb)']
- name: cmenergies
  values: [5020]
- name: reactions
  values: [$Pb~Pb~\rightarrow~Pb~Pb~\gamma~\gamma$]
- name: phrases
  values: [ALP, cross section limits]
location: Figure 8 (right)
name: Figure 8 (right)
table_doi: 10.17182/hepdata.155674.v1/t8
