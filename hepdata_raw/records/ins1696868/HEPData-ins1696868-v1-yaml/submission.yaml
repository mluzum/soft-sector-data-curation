- {description: arXiv, location: 'https://arxiv.org/abs/1810.01473'}
comment: A measurement of the elliptic flow ($v_2$) of prompt $\mathrm{J}/\psi$ mesons
  in high-multiplicitypPb collisions is reported using data collected by the CMS experiment
  at a nucleon-nucleoncenter-of-mass energy $\sqrt{s_{\mathrm{NN}}}=8.16$ TeV. Prompt
  $\mathrm{J}/\psi$ mesons decaying intotwo muons are reconstructed in the rapidity
  region in the nucleon-nucleon center-of-massframe ($y_{\mathrm{cm}}$), corresponding
  to either $-2.86<y_{\mathrm{cm}}<-1.86$ or$0.94<y_{\mathrm{cm}}<1.94$. The average
  $v_2$ result from the two rapidity ranges is reported over the transverse momentum($p_{\mathrm{T}}$)
  range from 0.2 to 10 GeV. Positive $v_2$ values are observed for the prompt $\mathrm{J}/\psi$
  meson,as extracted from long-range two-particle correlations with charged hadrons,
  for $2 <p_{\mathrm{T}}< 8$ GeV.The prompt $\mathrm{J}/\psi$ results are compared
  with previous CMS measurements of elliptic flow for open charm mesons(D$^0$) and
  strange hadrons. From these measurements, constraints can be obtained on the collective
  dynamicsof charm quarks produced in high-multiplicity events arising from small
  systems.
