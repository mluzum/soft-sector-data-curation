comment: "The measurement of azimuthal correlations of charged particles is presented
  for Pb\u2013Pb collisions at 2.76 TeV and p\u2013Pb collisions at 5.02 TeV with
  the ALICE detector at the CERN Large Hadron Collider. These correlations are measured
  for the second, third and fourth order flow vector in the pseudorapidity region
  eta < 0.8 as a function of centrality and transverse momentum pT using two observables,
  to search for evidence of pT-dependent flow vector fluctuations. For Pb\u2013Pb
  collisions at 2.76 TeV, the measurements indicate that pT-dependent fluctuations
  are only present for the second order flow vector. Similar results have been found
  for p\u2013Pb collisions at 5.02 TeV. These measurements are compared to hydrodynamic
  model calculations with event-by-event geometry fluctuations in the initial state
  to constrain the initial conditions and transport properties of the matter created
  in Pb\u2013Pb and p\u2013Pb collisions.\n"
hepdata_doi: 10.17182/hepdata.80521.v1
