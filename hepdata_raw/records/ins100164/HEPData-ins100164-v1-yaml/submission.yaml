comment: |
  THE POLARIZED PHOTON BEAM WAS PRODUCED IN A DIAMOND TARGET. THE PI+ MESONS WERE DETECTED IN A MAGNETIC SPETROMETER USING TIME OF FLIGHT IN COINCIDENCE WITH THE RECOIL NEUTRON. FOR PI0 PRODUCTION THE RECOIL PHOTON WAS MOMENTUM ANALYZED AND DETECTED IN COINCIDENCE WITH A DECAY GAMMA.
