additional_resources:
- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/collision-energy-dependence-moments-net-kaon-multiplicity-distributions-rhic'}
- {description: arXiv, location: 'https://arxiv.org/abs/1709.00773'}
comment: ' Fluctuations of conserved quantities such as baryon number, charge, and
  strangeness are sensitive to the correlation length of the hot and dense matter
  created in relativistic heavy-ion collisions and can be used to search for the QCD
  critical point. We report the first measurements of the moments of net-kaon multiplicity
  distributions in Au+Au collisions at $\sqrt{s_{NN}}$ = 7.7, 11.5, 14.5, 19.6, 27,
  39, 62.4, and 200 GeV. The collision centrality and energy dependence of the mean
  ($M$), variance ($\sigma^2$), skewness ($S$), and kurtosis ($\kappa$) for net-kaon
  multiplicity distributions as well as the ratio $M/\sigma^2$ and the products $S\sigma$
  and $\kappa\sigma^2$ are presented. Comparisons are made with Poisson and negative
  binomial baseline calculations as well as with UrQMD, a transport model (UrQMD)
  that does not include effects from the QCD critical point. Within current uncertainties,
  the net-kaon cumulant ratios appear to be monotonic as a function of collision energy.'
data_license: {description: The content can be shared and adapted but you must give
    appropriate credit and cannot restrict access to others., name: cc-by-4.0, url: 'https://creativecommons.org/licenses/by/4.0/'}
hepdata_doi: 10.17182/hepdata.98573.v1
