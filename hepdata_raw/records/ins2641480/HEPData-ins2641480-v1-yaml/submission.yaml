additional_resources:
- {description: Image file, location: Figure_6.png}
- {description: Thumbnail image file, location: thumb_Figure_6.png}
data_file: Figure_6.yaml
description: HFE (electrons from semileptonic decays of heavy-flavor hadrons) $R_{\rm
  AA}$ (red circles) as a function of $p_{\rm T}$ in different centrality intervals
  of Au+Au collisions at $\sqrt{s_{\rm NN}}=200$ GeV, compared with STAR (yellow stars)
  and PHENIX (green squares) published results, and Duke ((modified Langevin transport
  model, blue line) and PHSD (parton-hadron-string dynamics model, orange line) model
  calculations. Vertical bars and boxes around data points represent combined statistical
  and systematic uncertainties from both Au+Au and $p$+$p$ measurements, respectively.
  Boxes at unity show the global uncertainties, which for this analysis include the
  8% global uncertainty on $p$+$p$ reference and the $N_{\rm coll}$ uncertainties.
  The left box is for PHENIX and the right one for STAR.
keywords:
- name: reactions
  values: [AuAu]
- name: cmenergies
  values: [200]
name: Figure 6
table_doi: 10.17182/hepdata.139080.v1/t5
