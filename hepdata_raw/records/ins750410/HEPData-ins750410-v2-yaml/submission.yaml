description: "(Color online) Global polarization of $\\Lambda$\u2013hyperons as a
  function of $\\Lambda$ pseudorapidity $\\eta^{\\Lambda}$. Filled circles show the
  results for Au+Au collisions at $\\sqrt{s_{NN}}$=200 GeV (centrality region 20-70%).
  A constant line fit to these data points yields $P_{\\Lambda}=(2.8\\pm 9.6)\\times
  10^{-3}$ with $\\chi^{2}/ndf=6.5/10$. Open squares show the results for Au+Au collisions
  at $\\sqrt{s_{NN}}$=62.4 GeV (centrality region 0-80%). A constant line fit gives
  $P_{\\Lambda}=(1.9\\pm 8.0)\\times 10^{-3}$ with $\\chi^{2}/ndf=14.3/10$. Only statistical
  uncertainties are shown."
