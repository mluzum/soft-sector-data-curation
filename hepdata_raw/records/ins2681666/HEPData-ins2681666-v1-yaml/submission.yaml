comment: The elliptic flow ($v_2$) of $\rm D^0$ mesons from beauty-hadron decays (non-prompt
  $\rm D^0$) was measured in midcentral (30--50\%) Pb--Pb collisions at a centre-of-mass
  energy per nucleon pair $\sqrt{s_{\rm NN}} = 5.02$ TeV with the ALICE detector at
  the LHC. The $\rm D^0$ mesons were reconstructed at midrapidity ($|y|<0.8$) from
  their hadronic decay $\mathrm{D^0 \to K^-\uppi^+}$, in the transverse momentum interval
  $2 < p_{\rm T} < 12$ GeV$/c$.
