data_file: table1_1.yaml
description: Inclusive muon $v_{2}^{\mu}$ as a function of $p_{\mathrm{T}}$ is measured
  by two-particle correlation method at forward rapidities in high-multiplicity (0$-$20%)
  p$-$Pb collisions at $\sqrt{s_\mathrm{NN}}$= 8.16 TeV. The event activity is estimated
  with the V0M estimator.
