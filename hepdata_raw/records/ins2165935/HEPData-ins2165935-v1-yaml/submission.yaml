  values: [P PB --> MUON X]
- name: observables
  values: [V2]
- name: cmenergies
  values: ['8160']
- name: phrases
  values: [Inclusive, Two-particle Correlation]
location: Data from figure 3 (1/2 left pannel), blue open circles
name: Table1_1
table_doi: 10.17182/hepdata.138430.v1/t1
