additional_resources:
- {description: web page with data points, location: 'https://drupal.star.bnl.gov/STAR/files/starpublications/319/data.html'}
comment: "BNL-RHIC.  Two-dimensional angular correlations of D0-mesons with charged
  hadrons, projected on delEta and delPhi at sNN\u2212\u2212\u2212sqrt=200GeV in STAR
  are presented. The correlations are fit with a 2D function containing components
  to capture the 2D jet-peak (Gaussian on delEta and delPhi), the azimuthal harmonics
  (dipole, quadrupole), and the constant offset. These fits are performed on the data
  in the three presented centrality bins, and the evolution of these extracted fit
  values with centrality discussed. Additionally, the per-trigger, near side yield
  (i.e. the per-trigger yield in the jet-like peak) is extracted and centrality evolution
  presented. The results indicate strong interaction of the charm-quark or D0-meson
  with the medium.\n"
hepdata_doi: 10.17182/hepdata.95209.v1
