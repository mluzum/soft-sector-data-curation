{comment: "We present results on the production of \u03C0+-, K+-, p, and pbar in Au+Au
    collisions at \u221AsNN = 54.4 GeV using the STAR detector at RHIC, at mid-rapidity
    (|y| < 0.1). Invariant yields of these particles as a function of transverse momentum
    are shown. We determine bulk properties such as integrated particle yields (dN/dy),
    mean transverse momentum (<pT>), particle ratios, which provide insight into the
    particle production mechanisms. Additionally, the kinetic freeze-out parameters
    (T_{kin} and betaT), which provide information about the dynamics of the system
    at the time of freeze-out, are obtained. The Bjorken energy density (epsilon_{BJ}),
    which gives an estimate of the energy density in the central rapidity region of
    the collision zone at the formation time tau, is calculated and presented as a
    function of multiplicity for various energies. The results are compared with those
    from the models such as A Multi-Phase Transport (AMPT) and Heavy Ion Jet INteraction
    Generator (HIJING) for further insights.", hepdata_doi: 10.17182/hepdata.168419.v1}
