- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0502008'}
comment: We present the first measurement of multiplicity and pseudorapidity distributions
  of photons in the pseudorapidity region $2.3 \leq \eta \leq 3.7$ for different centralities
  in Au + Au collisions at $\sqrt{s_{NN}}$ = 62.4 GeV. We find that the photon yield
  in this pseudorapidity range scales with the number of participating nucleons at
  all collision centralities studied. The pseudorapidity distribution of photons,
  dominated by neutral pion decays, has been compared to those of identified charged
  pions, photons, and inclusive charged particles from heavy ion and nucleon-nucleon
  collisions at various energies. The photon production in the measured pseudorapidity
  region has been shown to be consistent with the energy and centrality independent
  limiting fragmentation scenario.
hepdata_doi: 10.17182/hepdata.98929.v1
