---
data_file: Table1.yaml
description: |
  D3(SIG)/D3(P) is fitted by the equation: CONST*exp(-SLOPE*P**2/(2*M)). CONST is presented per nucleon.
keywords:
- name: reactions
  values: [P BE --> DEUT X, P BE --> P X, P BE --> TRITIUM X, P C --> DEUT X, P C
      --> P X, P C --> TRITIUM X, P CU --> DEUT X, P CU --> P X, P CU --> TRITIUM
      X, P TA --> DEUT X, P TA --> P X, P TA --> TRITIUM X, P NUCLEUS --> P X, P NUCLEUS
      --> DEUT X, P NUCLEUS --> TRITIUM X]
- name: observables
  values: [CONST, D3SIG/D3P, SLOPE]
- name: phrases
  values: [Inclusive, Triple Differential Cross Section]
location: Data from T I
name: Table 1
table_doi: 10.17182/hepdata.21102.v1/t1
