description: Heavy flavor electron yield, Run-8 $p$ + $p$, $d$+Au collisions. Electrons
  from heavy flavor decays, separated by centrality. The lines represent a fit to
  the previous $p+p$ result [23], scaled by $N_{coll}$. The inset shows the ratio
  of photonic background electrons determined by the converter and cocktail methods
  for Minimum Bias $d$+Au collisions, with error bars (boxes) that represent the statistical
  uncertainty on the converter data (systematic uncertainty on the photonic-electron
  cocktail).
