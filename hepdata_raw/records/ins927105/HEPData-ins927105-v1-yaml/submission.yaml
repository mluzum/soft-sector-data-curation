comment: |
  CERN-LHC.  Measurements of angular correlations between unidentified charged trigger and  associated particles produced in Lead-Lead collisions at a centre-of-mass energy of 2.76 TeV/nucleon. The data cover the trigger and associated particle PT in the range 0.25-15 GeV with the trigger particle PT > the assocated particle PT. The shapes of the pair correlation distributions are studied in a variety of collision centrality classes in the range 0-50% of the total hadronic  cross section for particles in the |pseudorapidity| interval < 1.0. Long-range correlations  are defined in distributions in relative azimuth (phi_trig-phi_assoc) for events with  |eta_trig-eta_assoc| > 0.8.  Fourier components VnDelta (<cos(nDelta(phi)>) are  extracted from these long-range azimuthal correlation functions. This record tabulated the values of VnDelta and best global fit values v_n{GF} for a variety of ranges of trigger and associated particle  PT and centrality classes.  See more details in the text of the paper.
