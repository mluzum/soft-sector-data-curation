comment: |
  CERN-LHC. Transverse momentum spectra of $\Sigma(1385)^{\pm}$ and $\Xi(1530)^{0}$ produced in p-Pb collisions at $\sqrt{s_{\rm{NN}}}$ = 5.02 TeV, measured in the rapidity range -0.5 < $y_{\rm{CMS}}$ < 0 with the ALICE detector at the LHC.
hepdata_doi: 10.17182/hepdata.77971.v2
---
data_file: Table1.yaml
description: |
  Average charged particle pseudo-rapidity density, $\langle\rm{d}N_{\rm{ch}}/\rm{d}\eta_{\rm{lab}}\rangle$, measured at mid-rapidity in visible cross section event classes. Multiplicity classes are defined using the V0A estimator; values for $\langle\rm{d}N_{\rm{ch}}/\rm{d}\eta_{\rm{lab}}\rangle$ are corrected for vertexing and trigger efficiency. Since statistical uncertainties are negligible, only total systematic uncertainties are reported.
keywords:
- name: reactions
  values: [P PB --> CHARGED X]
- name: observables
  values: [DN/DETARAP]
location: Data from Table 1
name: Table 1
table_doi: 10.17182/hepdata.77971.v2/t1
