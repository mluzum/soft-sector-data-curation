additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/2108.00044'}
comment: |
  STAR-RHIC. Global $\Lambda$-hyperon Polarization is measured at $\sqrt{s_{\rm NN}}=3$ GeV running RHIC/STAR in fixed-target mode. The previously used invariant-mass method is generalized to account for the asymmetries present when operating in this mode. The largest-yet $\overline{P}_{\rm H}$ is successfully measured, with nearly 6 sigma of statistical significance. $\overline{P}_{\rm H}$ increases with collision centrality, consistent with expectations. No observed dependence on transverse momentum, $p_{\rm T}$, or rapidity, $y$, is observed.
hepdata_doi: 10.17182/hepdata.110658.v1
---
additional_resources:
