data_file: InvMassDistributionWidths.yaml
description: The measured invariant-mass distributions of two classes of $\Lambda$-hyperon
  decays. The decay classes are defined using the scalar triple product $\left(\vec{p}_\Lambda\times\vec{p}_p^*\right)\cdot
  \vec{B}_{\rm STAR}$, which is positive for right decays and negative for left decays.
  The right decay class has a notably sharper invariant-mass distribution than the
  left decay class, and this is due to the effects of daughter tracks crossing in
  the STAR TPC with the STAR magnetic field anti-parallel to the lab frame's z direction.
  The opposite pattern is obtained by flipping the sign of the STAR magnetic field
  or by reconstructing $\bar{\Lambda}$ hyperons.
