data_file: PolarizationVsEnergy.yaml
description: 'The integrated Global $\Lambda$-hyperon Polarization in mid-central
  collisions at $\sqrt{s_{\rm NN}}=3$ GeV. The trend of increasing $\overline{P}_{\rm
  H}$ with decreasing $\sqrt{s_{\rm NN}}$ is maintained at this low collision energy.
  Previous experimental results are scaled by the updated $\Lambda$-hyperon decay
  parameter $\alpha_\Lambda=0.732$ for comparison with this result. Recent model calculations
  extended to low collision energy show disagreement between our data and AMPT and
  rough agreement with the 3-Fluid Dynamics (3FD) model. Previous measurements shown
  alongside our data can be found at: https://www.hepdata.net/record/ins750410?version=2;
  https://www.hepdata.net/record/ins1510474?version=1; https://www.hepdata.net/record/ins1672785?version=2;
  https://www.hepdata.net/record/ins1752507?version=2.'
