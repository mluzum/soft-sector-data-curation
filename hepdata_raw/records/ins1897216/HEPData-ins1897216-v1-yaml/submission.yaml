data_file: SineDependence.yaml
description: The signal polarizations extracted according to the restricted invariant-mass
  method as a function of $\phi_\Lambda - \phi_p^*$, for positive-rapidity $\Lambda$
  hyperons. The sinusoidal behavior is driven by non-zero net $v_1$. The vertical
  shift corresponds to the vorticity-driven polarization; in collider mode, where
  the net $v_1$ is zero, this dependence on $\phi_\Lambda - \phi_p^*$ does not exist.
