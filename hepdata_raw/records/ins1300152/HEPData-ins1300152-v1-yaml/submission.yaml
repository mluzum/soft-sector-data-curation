data_file: Table1.yaml
description: |
  Differences of D(Z) distributions in different centralities with respect to peripheral events for R = 0.3 jets. The errors represent combined statistical and systematic uncertainties.
keywords:
- name: reactions
  values: [PB PB --> JET X, PB PB --> CHARGED X]
- name: observables
  values: [DN/DZ]
- name: phrases
  values: [Inclusive, Single Differential Distribution, Jet Production]
- name: cmenergies
  values: [2760.0]
location: Data from Table 3
name: Table 1
table_doi: 10.17182/hepdata.64272.v1/t1
