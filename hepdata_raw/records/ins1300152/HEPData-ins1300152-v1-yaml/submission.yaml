additional_resources:
- {description: web page with auxiliary material, location: 'http://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2012-08/'}
comment: "CERN-LHC.  Measurements of charged-particle fragmentation functions of jets
  produced in ultra-relativistic nuclear collisions can provide insight into the modification
  of parton showers in the hot, dense medium created in the collisions. ATLAS has
  measured jets in sqrt(sNN) = 2.76 TeV PB PB collisions at the LHC using a data set
  recorded in 2011 with an integrated luminosity of 0.14 nb^{-1}. Jets were reconstructed
  using the anti-kt algorithm with distance parameter values R = 0.2, 0.3, and 0.4.
  \n\nHere is the summary of results for the charged particle (CH) longitudinal momentum
  fraction, Z = PT(CH).PT(JET)/ABS(PT(JET))**2, distributions, D(Z) = (1/N(JET))*D(N(CH))/DZ
  and distributions of transverse momenta of particles in jets, D(PT(CH)) = (1/N(JET))*D(N(CH))/DPT(CH).
  The jets have PT>100 GeV, |ETA|<2.1, and the particle to jet association is done
  using geometrical matching with DELTA R <= 0.4 for all three different R values.\n"
dateupdated: 14/05/2015 20:25:59
hepdata_doi: 10.17182/hepdata.64272.v1
modifications:
- {action: Encoded, date: 13 MAY 2015, who: Martin Spousta (ATLAS)}
record_ids:
- {id: 1300152, type: inspire}
