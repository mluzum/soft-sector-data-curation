comment: |
  CERN-LHC.  Measurements of the inclusive J/PSI elliptic flow, V2,  in PB-PB collisions at a centre-of-mass energy per nucleon of 2.76 TeV. The   data cover the rapidity range 2.5-4.0 with transverse momentum in the  range 0-10 GeV/c.
