additional_resources: []
comment: 'This paper presents the measurement of charged-hadron and identified-hadron
  (K^{0}_{S}, #Lambda, #Xi^{-}) yields in photo-nuclear collisions using 1.7 nb^{-1}
  of #sqrt{s_{NN}} = 5.02 TeV Pb+Pb data collected in 2018 with the ATLAS detector
  at the Large Hadron Collider. Candidate photo-nuclear events are selected using
  a combination of tracking and calorimeter information, including the zero-degree
  calorimeter. The yields as a function of transverse momentum and rapidity are measured
  in these photo-nuclear collisions as a function of charged-particle multiplicity.
  These photo-nuclear results are compared with 0.1 nb^{-1} of #sqrt{s_{NN}} = 5.02
  TeV p+Pb data collected in 2016 by ATLAS using similar charged-particle multiplicity
  selections. These photo-nuclear measurements shed light on potential quark-gluon
  plasma formation in photo-nuclear collisions via observables sensitive to radial
  flow, enhanced baryon-to-meson ratios, and strangeness enhancement. The results
  are also compared with the Monte Carlo DPMJET generator and hydrodynamic calculations
  to test whether such photo-nuclear collisions may produce small droplets of quark-gluon
  plasma that flow collectively.'
hepdata_doi: 10.17182/hepdata.158635.v1
