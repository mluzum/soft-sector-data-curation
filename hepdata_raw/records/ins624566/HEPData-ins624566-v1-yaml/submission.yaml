- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0307024'}
- {description: web page, location: 'https://drupal.star.bnl.gov/STAR/publications/multi-strange-baryon-production-au-au-collisions-sqrt-s-sub-nn-sub-130-gev'}
comment: The transverse mass spectra and midrapidity yields for $\Xi$s and $\Omega$s
  are presented. For the 10% most central collisions, the $\bar{\Xi}^+/h^-$ ratio
  increases from the Super Proton Synchrotron to the Relativistic Heavy Ion Collider
  energies while the $\Xi^-/h^-$ stays approximately constant. A hydrodynamically
  inspired model fit to the $\Xi$ spectra, which assumes a thermalized source, seems
  to indicate that these multistrange particles experience a significant transverse
  flow effect, but are emitted when the system is hotter and the flow is smaller than
  values obtained from a combined fit to $\pi$, $K$, $p$, and $\Lambda$s.
hepdata_doi: 10.17182/hepdata.102321.v1
