comment: |
  New analysis of the p+p and d+Au data recorded in 2003 and 2005 at the PHENIX experiment, at center-of-mass energy of 200GeV. Plots of the J/PSI invariant (1/(2PI*PT))*D2(N)/DPT/DYRAP, mean transverse momentum and nuclear modification factor RdA versus transverse momentum, rapidity and centrality are presented. The study also (1/(2PI*PT))*D2(N)/DPT/DYRAPed values for the breakup cross section of cc_bar pairs in cold nuclear matter     The statistical errors are the combination of statistical error and uncorrelated point-to-point systematic error (i.e. which can move the points independently of each other), quadratically summed. The systematic error is the point-to-point correlated systematic errors (which can move the points coherently, thus not necessarly by the same amount).Global systematic are mentionned in comments, if necessary.     Erratum : corrected values of breakup cross sections of cc_bar pairs presented in the article : "Cold Nuclear Matter Effects on J/Psi as Constrained by Deuteron-Gold Measurements at sqrt(s_NN) = 200 GeV" (IRN of the original paper : 7541414). arXiv reference of the original paper : arXiv:0711.3917v1.
