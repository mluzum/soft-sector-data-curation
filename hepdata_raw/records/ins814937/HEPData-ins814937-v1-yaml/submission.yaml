additional_resources:
- {description: webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/pion-interferometry-au-au-and-cu-cu-collisions-rhic'}
- {description: arXiv, location: 'https://arxiv.org/abs/0903.1296'}
comment: |
  We present a systematic analysis of two-pion interferometry in Au+Au collisions at sqrt(sNN) = 62.4 GeV and Cu+Cu collisions at sqrt(sNN) = 62.4 and 200 GeV using the STAR detector at RHIC. The multiplicity and transverse momentum dependences of the extracted correlation lengths (radii) are studied. The scaling with charged particle multiplicity of the apparent system volume at final interaction is studied for the RHIC energy domain. The multiplicity scaling of the measured correlation radii is found to be independent of colliding system and collision energy.
hepdata_doi: 10.17182/hepdata.97124.v1
