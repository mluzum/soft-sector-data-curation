data_file: ppg011f4a.yaml
description: Single electron cross sections $\frac{d\sigma_e}{dy}|_{y=0}$ of this
  measurement and ISR experiments [9,11,31] are displayed (bottom of figure, right-hand
  scale) with charm decay contributions calculated with PYTHIA. Open and filled symbols
  for 1.0 < $p_T$ < 1.4 GeV/$c$ and $p_T$ > 1.4 GeV/$c$, respectively. The derived
  charm cross section of this measurement is compared with charm cross sections from
  SPS/FNAL experiments (top of figure, left-hand scale). The thick curve and the shaded
  band represent the charm cross section in the PYTHIA model and in a NLO pQCD calculation
  [30], respectively.
