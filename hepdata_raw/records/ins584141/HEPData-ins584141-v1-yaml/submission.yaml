data_file: Figure_04.yaml
description: $\Lambda$ and $\bar\Lambda$ rapidity density as a function of negative
  hadron multiplicity at mid-rapidity. The open symbols in the figure are data points
  from an independent analysis of minimum bias data set using event-mixing techniques.
  Errors shown are statistical only. Systematic errors on hyperon yields $10\%$, on
  negative hadron yields $6\%$. $\Lambda$ and $\bar\Lambda$ measured for $|y|<0.5$,
  negative hadrons for $|\eta|<0.1$. Dashed lines correspond to $\Lambda = 0.054 h^{-}$,
  $\bar\Lambda = 0.040 h^{-}$.
keywords:
