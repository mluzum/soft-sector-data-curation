data_file: Figure_03.yaml
description: The mid-rapidity $\bar\Lambda$ ($|y|<0.5$) transverse momentum distribution
  from the top $5\%$ most central collisions. For comparison the distributions for
  negative hadrons ($d^{2}N/(2 \pi p_{T})dp_{T}d\eta$, $|\eta|<0.1$) and anti-protons
  ($|y|<0.1$) for the similar centrality bin are included. Only statistical errors
  are listed. Statistical errors are less than the size of the data points. Combined
  systematic errors on hyperons estimated to be $10\%$. Correlated systematic errors
  for negative hadrons estimated to be $6\%$. Systematic errors on antiprotons are
  $8\%$ point-to-point and $10\%$ in the overall normalization.
keywords:
- name: reactions
  values: [AuAu]
- name: cmenergies
  values: [130]
name: Figure 3
