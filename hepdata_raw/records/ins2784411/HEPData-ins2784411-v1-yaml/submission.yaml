data_file: fitted_mu.yaml
description: 'The signal strength $\mu_{t\bar{t}}$, defined as the ratio of the observed
  signal for the combined six signal regions ($e+$jets: $1\ell1b$ and $1\ell2b\mathrm{incl}$,
  $\mu+$jets: $1\ell1b$ and $1\ell2b\mathrm{incl}$, dilepton: $2\ell1b$ and $2\ell2b\mathrm{incl}$.)
  to the SM expectation with no nPDF effects included, is measured using a binned
  profile-likelihood method. The parameter $\mu_{t\bar{t}}$ is determined by the fit
  to the $H_{T}^{\ell,j}$ data distributions in the six signal regions, where the
  $H_{T}^{\ell,j}$ variable is defined as the scalar sum of the transverse momenta
  of the leptons and HI jets. Over all 9% uncertainties is observed'
keywords:
- name: reactions
  values: [P Pb -> TOP TOP]
- name: phrases
  values: [signal strength]
- name: cmenergies
  values: [8160]
- name: observables
  values: [signal strength]
name: Fitted $\mu_{t\bar{t}}$
table_doi: 10.17182/hepdata.153893.v1/t16
