additional_resources:
- {description: fig_03a, location: fig_03a.png}
data_file: fitted_xsec.yaml
description: 'The figure shows the measurement of the top quark pair production cross-section,
  $\sigma_{t\bar{t}}$, in proton-lead (p+Pb) collisions at a center-of-mass energy
  of $\sqrt{s_{\mathrm{NN}}} = 8.16$ TeV, based on 165 nb$^{-1}$ of data. The central
  measured value is shown alongside theoretical predictions using various parton distribution
  functions (PDFs): MCFM TUJU21, MCFM nNNPDF30, MCFM nCTEQ15HQ, and MCFM EPPS21. The
  green and yellow bands represent the total and statistical uncertainties of the
  data, respectively. Additional measurements for comparison include the CMS result
  at 8.16 TeV for p+Pb collisions and an extrapolated ATLAS+CMS result for pp collisions
  at 8 TeV. Relevant references are indicated: PRL 119 (2017) 242001 and JHEP 07 (2023)
  213.'
keywords:
- name: reactions
  values: [P Pb -> TOP TOP]
- name: phrases
  values: [Integrated Cross Section, Cross Section, Proton-Proton Scattering, top-quark
      Pair Production, top-quark Production]
- name: cmenergies
  values: [8160]
- name: observables
  values: [SIG]
name: Fitted cross section
table_doi: 10.17182/hepdata.153893.v1/t17
