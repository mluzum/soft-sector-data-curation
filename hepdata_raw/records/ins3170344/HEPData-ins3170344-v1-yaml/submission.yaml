additional_resources:
- {description: Created with hepdata_lib 0.21.0, location: 'https://doi.org/10.5281/zenodo.1217998'}
- {description: Webpage with all figures and tables, location: 'https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2025-04'}
- {description: arXiv, location: 'https://arxiv.org/abs/2606.20257'}
comment: Measurements of charged-particle transverse momentum spectra, multiplicity,
  and mean transverse momentum are presented as a function of pseudorapidity and collision
  centrality in O+O and Ne+Ne collisions at $\sqrt{s_{_\text{NN}}}= 5.36$ TeV using
  27.7 $\mu\text{b}^{-1}$ and 53.1 $\mu\text{b}^{-1}$ data sets recorded by the ATLAS
  experiment at the LHC. The collision centrality is characterized by the total transverse
  energy measured in the ATLAS forward calorimeters. The kinematics of charged particles
  are reconstructed with the inner detector over the fiducial pseudorapidity and transverse
  momentum ranges $|\eta|<2.5$ and $0.27 < p_{\text{T}} < 5$ GeV using data from the
  ATLAS inner detector. The per-event charged-particle pseudorapidity density $dn/d\eta$
  and mean transverse momentum $\langle p_{\text{T}}\rangle$ are measured over this
  fiducial range as a function of $\eta$. The results are reported in 5%-wide centrality
  intervals covering the 5--80% centrality range, and in 1%-wide intervals covering
  the 0--5% centrality range. Invariant per-event yields are evaluated as a function
  of $\eta$ and $p_{\text{T}}$. Their $p_{\text{T}}$ dependence is fitted to estimate
  extrapolated $dn/d\eta$ and $\langle p_{\text{T}}\rangle$ values over $0 < p_{\text{T}}
  < 5$ GeV. To evaluate the impact of using pseudorapidity instead of rapidity, measurements
  are also performed as a function of rapidity computed using a pion mass hypothesis.
  The fiducial and extrapolated results are compared with hydrodynamic calculations.
