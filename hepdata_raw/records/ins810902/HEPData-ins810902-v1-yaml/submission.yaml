description: (Color online) Measured dynamical $K/\pi$ fluctuations in terms of $\nu_{dyn,K\pi}$
  for 62.4 and 200 GeV Au+Au compared with $\sigma^{2}_{dyn}$ from central Pb+Pb collisions
  at 6.3, 7.6, 8.8, 12.3, and 17.3 GeV from NA49 [7]. Statistical errors are shown
  for the STAR data. Statistical and systematic errors are shown for the NA49 results.
  The solid line corresponds to a fit to the STAR data of the form $c + d/(dN/d\eta)$.
