data_file: figure_2.yaml
description: "(Color online) Measured dynamical $K/\\pi$ fluctuations in terms of
  \u03C3dyn for central collisions (0 - 5%) of 19.6, 62.4, 130, and 200 GeV Au+Au
  compared with the central collisions (0 - 3.5%) of Pb+Pb from NA49 [7] and the statistical
  hadronization (SH) model of Ref. [14]. The solid line represents the relationship
  of the incident energy dependence of $\\sigma_{dyn}$ in central collisions to the
  collision centrality dependence of $\\nu_{dyn,K\\pi}$ at higher energies. Both statistical
  (vertical line with horizontal bar) and systematic (no vertical line) error bars
  are shown for the experimental data."
