comment: |
  Energy dependence of coherent photonuclear production of J/psi mesons in ultra-peripheral Pb-Pb collisions at sqrt(s_NN) 5.02 TeV.
hepdata_doi: 10.17182/hepdata.144758.v1
---
data_file: Table1.yaml
description: "Measured coherent J/psi cross section for the 0N0N class. Note that
  for each rapidity range the 0n0n uncertainty related to migrations is preceded by
  a \u2213, while the other neutron classes have a \xB1; this means that these uncertainties
  are anti-correlated."
keywords:
- name: reactions
  values: [PB, PB]
- name: cmenergies
  values: [5020.0]
- name: phrases
  values: [Ultra-peripheral collisions, Electromagnetic dissociation, Neutron emission,
    ZDC, Coherent, Energy dependence]
location: Data from Figure 3a, Table 3
name: Table 1
table_doi: 10.17182/hepdata.144758.v1/t1
