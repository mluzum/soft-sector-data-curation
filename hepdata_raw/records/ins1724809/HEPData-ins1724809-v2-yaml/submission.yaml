additional_resources:
- {description: erratum, location: 'https://www.star.bnl.gov/protected/bulkcorr/arghya/PaperProposal/erratumdraft/v1.pdf'}
- {description: arXiv, location: 'https://arxiv.org/pdf/1903.05370.pdf'}
comment: "We report the first measurements of a complete second-order cumulant matrix
  of net-charge, net-proton and net-kaon multiplicity distributions for the first
  phase of the beam energy scan programat RHIC. This includes the centrality and,
  for the first time, the pseudorapidity window dependenceof both diagonal and off-diagonal
  cumulants in Au+Au collisions atthe available acceptance of |\u03B7| < 0.5, the
  cumulants grow linearly with the pseudorapidity window. Relative to the corresponding
  measurements in peripheral collisions, the ratio of off-diagonal over \u221AsNN
  = 7.7-200 GeV. Within 2 diagonal cumulants in central collisions indicates an excess
  correlation between net-charge and net-kaon, as well as between net-charge and net-proton.
  The strength of such excess correlation increasewith the collision energy. The correlation
  between net-proton and net-kaon multiplicity distributions \u221AsNN = 200 GeV and
  change to positive at the lowest collision energy. Model calculations based on non-thermal
  (UrQMD) and thermal (HRG) production of hadrons cannot explain the data. These measurements
  will help map the QCD phase diagram, constrain hadron resonance gas model calculations
  and provide new insights on the energy dependence of is observed to be negative
  at baryon-strangeness correlations.\n"
hepdata_doi: 10.17182/hepdata.105908.v2
