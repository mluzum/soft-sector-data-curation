comment: "CERN-LHC.  Measurements of charge dependent azimuthal correlations of charged
  particles produced   in Lead-Lead collisions  at a centre of mass energy per nucleon
  pair of 2.76 TeV.  The data sample of about 13 million minimum  bias events covers
  the |eta| range <0.8 with data presented as a function of the collision  centrality,
  particle separation in pseudorapidity and transverse momentum. Data for two-particle
  \ and three-particle correlation functions are presented. See the text of the paper
  \ for more details of the analysis. \nThe indices A and B refer to the charge of
  the particle and the MEAN values are an average  over the particle pairs within
  the event as well as an average over all analysed events.\n"
