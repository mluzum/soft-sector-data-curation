comment: |
  CERN-LHC.  Measurements of the elliptic (V2), triangular (V3), quadrangular (V4) and pentagonal (V5) charged  particle flows in Lead-Lead collisions and a centre-of-mass energy per nucleon-nucleon collision of 2.76 TeV.  Data are shown as a function of the event centrality percentile and the transverse momentum.  The data were  collected in November 2010 during the first run with heavy ions at the LHC.
