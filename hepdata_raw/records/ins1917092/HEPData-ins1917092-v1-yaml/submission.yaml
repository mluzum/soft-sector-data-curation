data_file: table_1.yaml
description: The acceptance- and efficiency-corrected yields for the $\mathrm{B}^{0}_{\mathrm{s}}$
  mesons, scaled by $T_{\mathrm{AA}}$ and $N_{\text{MB}}$ in PbPb collisions at $\sqrt{s_{NN}}=5.02$
