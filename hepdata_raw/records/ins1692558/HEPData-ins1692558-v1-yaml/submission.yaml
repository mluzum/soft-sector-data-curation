? CERN-LHC.  Measurements of the pt spectra of charged particles in XeXe collisions
  at sqrt(s_NN)=5.44 TeV.  A pp reference at 5.44 TeV is extrapolated from 5.02 TeV
  data.  The nuclear modification factor, RAA, and another ratio, RXePb, are constructed
  and compared to PbPb collisions.  For more information, see JHEP 10 (2018) 138.  PbPb
  data and 5.02 TeV pp data used in ratios is taken from a previous measurement, described
  in JHEP 1704 (2017) 039, and available on hepdata here
: https://doi.org/10.17182/hepdata.77101.v2. Charged particles are measured in the
  range |eta|<1.
additional_resources:
- {description: web page with auxiliary material, location: 'https://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-18-004/index.html'}
