  |eta|<1 in pp collisions at sqrt(s)=5.44 TeV, after extrpolation from 5.02 TeV data.  The
  first systematic uncertainty describes uncertainties that are not fully correlated
  across points, while the second systematic uncertainty is a normalization uncertainty
  that is fully correlated across all points.  The data is measured and extrapolated
  as a differential cross section, and transformed into a differential yield using
  an inelastic cross-section of 70 mb.
