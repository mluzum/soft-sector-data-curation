comment: |
  CERN-LHC. Measurement of the two-pion three-dimensional femtoscopy in p-Pb collisions at a center-of-mass energy of 5.02 TeV. Femtoscopic radii are obtained in as a function of four multiplicity event classes and seven pair transverse momentum ranges. The measured p-Pb radii, at high multiplicity and low pair transverse momentum, are 10-20% higher than those observed in pp collisions but below those ones observed in A-A collisions.
