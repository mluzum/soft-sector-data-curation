data_file: fig2.yaml
description: Event plane resolution as a function of collision centrality from Au+Au
  collisions at $\sqrt{s_{NN}}$=3 (a), 27 and 54.4 GeV (b). In case of the 3 GeV collisions,
  $\Psi_{1}$ is used to determine the event plane resolutions for the first and second
  harmonic coefficients shown as $R_{11}$ and $R_{12}$ in left panel. In the 27 and
  54.4 GeV collisions, $\Psi_{2}$ is used to evaluate the second order event plane
  resolution, see right panel. In all cases, the statistic uncertainties are smaller
  than symbol sizes.
