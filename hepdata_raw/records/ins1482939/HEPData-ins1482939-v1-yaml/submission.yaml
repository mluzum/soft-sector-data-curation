data_file: figure_8.yaml
description: "(Color online) Quarkonium $R_{AA}$ versus binding energy in Au+Au and
  U+U collisions. Open symbols represent 0-60% centrality data, filled symbols are
  for 0-10% centrality. The $\\Upsilon$ measurements in U+U collisions are denoted
  by red points. In the case of Au+Au collisions, the $\\Upsilon$(1S) measurement
  is denoted by a blue square, while for the $\\Upsilon$(2S+3S) states, a blue horizontal
  line indicates a 95% upper confidence bound. The black diamonds mark the high-$p_{T}$
  $J/\\psi$ measurement. The vertical lines represent nominal binding energies for
  the $\\Upsilon$(1S) and $J/\\psi$, calculated based on the mass defect, as 2$m_{D}$
  $\u2212m_{J/\\psi}$ and 2$m_{B} \u2212m_{$\\Upsilon$}$, respectively (where $m_{X}$
  is the mass of the given meson X) [39]. The shaded area spans between the binding
  energies of $\\Upsilon$(2S) and $\\Upsilon$(3S). The data points are slightly shifted
  to the left and right from the nominal binding energy values to improve their visibility."
