data_file: Fig2.yaml
description: J/Psi azimuthal anisotropy v2 vs pT measured via the dielectron channel
  in 0-10%, 10-40%, and 40-80% central Au+Au collisions at 200 GeV. The brackets represent
  systematic errors. The boxes show the estimated maximum possible range of v2 if
  the nonflow influence is corrected. The mean pT in each bin for v2 calculation is
  drawn, but is shifted a little for some centralities so that all points can be seen
  clearly.
