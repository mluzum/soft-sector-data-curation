- {description: arXiv, location: 'http://arxiv.org/abs/arXiv:1212.3304'}
comment: " The measurement of J/Psi azimuthal anisotropy is presented as a function
  of transverse momentum for different centralities in Au+Au collisions at \\sqrt{s_{NN}}=200\u2009GeV.
  The measured J/Psi elliptic flow is consistent with zero within errors for transverse
  momentum between 2 and 10\u2009GeV/c. Our measurement suggests that J/Psi particles
  with relatively large transverse momenta are not dominantly produced by coalescence
  from thermalized charm quarks, when comparing to model calculations."
