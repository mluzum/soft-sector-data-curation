comment: "CERN-LHC.  Transverse momentum spectra of charged particles are measured
  by the CMS experiment at the CERN LHC in pPb collisions at sqrt(s[NN]) =5.02 TeV,
  in the range 0.4 < pt < 120 GeVc and pseudorapidity abs(eta[CM]) < 1.8 in the proton-nucleon
  center-of-mass frame, with the convention that the incoming proton travels in the
  positive eta[CM] direction.\n\nThe charged particle yields reported in the tables
  are given as per double-sided event yields, where double-sided events are defined
  as a collision producing at least one particle in the pseudorapidity range -5 <
  eta[LAB] < -3 and another in the range 3 < eta[LAB] < 5, each with proper lifetime
  tau > 10^-18 s and energy E > 3 GeV (see See Eur.Phys.J. C74 (2014) 2847). The data
  are corrected for the finite bin-width effect. \n\nA pp reference spectrum at sqrt(s)
  = 5.02 TeV is obtained by interpolation from previous measurements at higher and
  lower center-of-mass energies, and is used to determine the nuclear modification
  factor for abs(eta[CM]) < 1.0. Note that the uncertainty of 4.8 percent in the Glauber
  calculation of the nuclear thickness function, T_pPb, is not included in the total
  systematic uncertainty quoted in the table. \n\nThe forward-backward asymmetry of
  the yields for A < abs(eta[CM]) < B is defined as the ratio of the differential
  charged particle yield integrated over the range -B < eta[CM] < -A (Pb-going side)
  to the differential charged particle yield integrated over the range A < eta[CM]
  < B (p-going side). This quantity is measured for three  ranges: 0.3 < abs(eta[CM])
  < 0.8, 0.8 < abs(eta[CM]) < 1.3, and 1.3 < abs(eta[CM]) < 1.8.\n"
