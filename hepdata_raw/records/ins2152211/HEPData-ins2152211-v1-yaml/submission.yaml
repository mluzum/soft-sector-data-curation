{comment: 'The most precise measurements to date of the $^{3}_{\Lambda}\mathrm H$
    lifetime $\tau_{^{3}_{\Lambda}\mathrm H}$ and $\Lambda$ separation energy $\mathrm{B_{\Lambda}}$
    are obtained using the data sample of Pb--Pb collisionsat $\sqrt{s_{\mathrm{NN}}}=$5.02
    TeV collected by the ALICE experiment at the LHC. The ^{3}_{\Lambda}\mathrm H
    is reconstructed via its charged two-body mesonic decay channel ($^{3}_{\Lambda}\mathrm
    H$ $\rightarrow$ $^3$He + $\pi^-$and the charge-conjugate process). The measured
    values $\tau_{^{3}_{\Lambda}\mathrm H} = [253 \pm 11 \text{~(stat.)} \pm 6 \text{~(syst.)}]$
    ps and $\mathrm{B_{\Lambda}} = [102 \pm 63 \text{~(stat.)} \pm 67 \text{~(syst.)}]$
    keV are compatible with predictions from effective field theories and conclusively
    confirm that the $^{3}_{\Lambda}\mathrm H$ is a weakly-bound system.', hepdata_doi: 10.17182/hepdata.142234.v1}
