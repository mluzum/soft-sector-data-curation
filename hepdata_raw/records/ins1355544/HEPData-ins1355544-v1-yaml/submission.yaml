data_file: Table8.yaml
description: |
  Estimate of the $p_{\rm T}$-dependence of the Cold Nuclear Matter effects in Pb-Pb collisions calculated as $R_{\rm pPb}$(-4.46 <y< -2.96) $\times$  $R_{\rm pPb}$(2.03 <y< 3.53).
  The first uncertainty is statistical, the second one is the $p_{\rm T}$-uncorrelated systematic uncertainty, the third is the partially $p_{\rm T}$-correlated, while the fourth is the $p_{\rm T}$ correlated one.
