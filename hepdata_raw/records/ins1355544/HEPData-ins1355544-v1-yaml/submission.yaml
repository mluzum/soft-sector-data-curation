---
data_file: Table1.yaml
description: "$p_{\\rm T}$-differential inclusive cross section ${\\rm d}^2\\sigma^{J/\\psi}/{\\rm
  d}y{\\rm d}p_{T}$ in the backward rapidity range (-4.46<$y_{\\rm cms}$<-2.96). \nThe
  first uncertainty is statistical, the second one is the $p_{\\rm T}$-uncorrelated
  systematic uncertainty, while the third is the $p_{\\rm T}$-correlated one.\n"
keywords:
- name: reactions
  values: [P PB --> J/PSI X]
