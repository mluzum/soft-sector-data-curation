data_file: Table9.yaml
description: |
  $p_{\rm T}$-dependence of the ratio between the $R_{\rm PbPb}$ and the cold nuclear matter effects evaluated as $R_{\rm pPb}$(-4.46 <y< -2.96) $\times$  $R_{\rm pPb}$(2.03 <y< 3.53).
  The first uncertainty is statistical, the second one is the quadratic combination of $p_{\rm T}$-uncorrelated and $p_{\rm T}$-partially correlated systematic uncertainties, while the third is the $p_{\rm T}$ correlated one.
