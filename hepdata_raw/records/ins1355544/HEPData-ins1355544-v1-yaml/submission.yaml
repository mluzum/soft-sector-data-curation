comment: |
  CERN-LHC.  Measurement of the rapidity and transverse-momentum dependence of the inclusive J/$\psi$ production in p-Pb collisions at $\sqrt{s_{\rm NN}} = 5.02$ TeV at CERN LHC, in three center-of-mass rapidity ($y_{\rm cms}$) regions, down to zero $p_{\rm T}$. The measurements are performed at forward (2.03<$y_{\rm cms}$<3.53), mid (-1.37<$y_{\rm cms}$<0.43) and backward (-4.46<$y_{\rm cms}$<-2.96) centre of mass rapidities.
dateupdated: 05/02/2016 20:37:57
hepdata_doi: 10.17182/hepdata.70846.v1
modifications:
- {action: Encoded, date: 02 FEB 2016, who: ALICE Publications}
- {action: Edited, date: 05 FEB 2016, who: Graeme Watt}
