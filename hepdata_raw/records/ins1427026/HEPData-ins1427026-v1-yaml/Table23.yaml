  - errors:
    - {label: stat, symerror: 0.014}
    - {label: sys, symerror: 0.086}
    - {label: 'sys,Normalization uncertainty', symerror: 12.0%}
    value: 1.093
  - errors:
    - {label: stat, symerror: 0.015}
    - {label: sys, symerror: 0.074}
    - {label: 'sys,Normalization uncertainty', symerror: 12.0%}
    value: 1.077
  - errors:
    - {label: stat, symerror: 0.014}
    - {label: sys, symerror: 0.085}
    - {label: 'sys,Normalization uncertainty', symerror: 12.0%}
    value: 1.048
  - errors:
    - {label: stat, symerror: 0.023}
    - {label: sys, symerror: 0.12}
    - {label: 'sys,Normalization uncertainty', symerror: 12.0%}
    value: 1.044
independent_variables:
- header: {name: Centrality (ZNA)}
  values:
