{comment: "The measurement of inclusive, prompt, and non-prompt J/$\\psi$ production
    in p$-$Pb collisions at a nucleon--nucleon centre-of-mass energy $\\sqrt{s_\\mathrm{NN}}$
    = 5.02 TeV is presented. The inclusive $\\rm{J}/\\psi$ mesons are reconstructed
    in the dielectron decay channel at midrapidity down to a transverse momentum $p_\\mathrm{T}$
    = 0. Non-prompt J/$\\psi$ mesons, which originate from the decay of beauty hadrons,
    are separated from promptly produced J/$\\psi$ on a statistical basis for $p_\\mathrm{T}$
    larger than 1.0 GeV/$c$. These results are based on the data sample collected
    by the ALICE detector during the 2016 LHC p\u2212Pb run, corresponding to an integrated
    luminosity of $\\it{L}_{int}$=292$\\pm$11$\\mathrm{\\mu b}^{-1}$. ", hepdata_doi: 10.17182/hepdata.130237.v1}
