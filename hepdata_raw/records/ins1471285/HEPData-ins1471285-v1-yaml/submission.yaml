comment: |
  CERN-LHC.  The elliptic, triangular, quadrangular and pentagonal anisotropic flow coefficients for $\pi^{\pm}$, $\mathrm{K}^{\pm}$ and p+$\overline{\mathrm{p}}$ in Pb-Pb collisions at $\sqrt{s_\mathrm{{NN}}} = 2.76$ TeV were measured with the ALICE detector at the Large Hadron Collider. The results were obtained with the Scalar Product method, correlating the identified hadrons with reference particles from a different pseudorapidity region. Effects not related to the common event symmetry planes (non-flow) were estimated using correlations in pp collisions and were subtracted from the measurement.
dateupdated: 05/10/2016 13:04:17
hepdata_doi: 10.17182/hepdata.74447.v1
