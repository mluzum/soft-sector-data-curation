comment: |
  CERN-LHC. Measurement of freeze-out radii for pairs of identical-charge pions measured in Pb--Pb collisions at $\sqrt{s_{NN}}$=2.76 TeV as a function of collision centrality and the average transverse momentum of the pair $k_{\rm T}$. Three-dimensional sizes of the system (femtoscopic radii), as well as direction-averaged one-dimensional radii  are extracted.
dateupdated: 28/07/2015 11:31:17
hepdata_doi: 10.17182/hepdata.67353.v1
