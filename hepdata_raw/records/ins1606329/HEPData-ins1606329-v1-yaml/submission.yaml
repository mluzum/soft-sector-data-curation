additional_resources:
- {description: web page with auxiliary material, location: 'http://lhcbproject.web.cern.ch/lhcbproject/Publications/LHCbProjectPublic/LHCb-PAPER-2017-014.html'}
comment: |
  CERN-LHC. Measurements of the cross sections, the nuclear modification factors and the forward-backward ratios for prompt and nonprompt $J/\psi$ meson production via their dimuon decay modes in proton-lead collisions at a centre-of-mass energy of 8.16 TeV. The used data, that was taken in November and December 2016, has an integrated luminosity of 13.6 nb$^{-1}$ for the proton-lead beam configuration and 20.8 nb$^{-1}$ for the backward beam configuration. The data cover the rapidity range 1.5-4.0 (- 2.5 - - 5.0) in the nucleon-nucleon centre-of-mass system and transverse momentum range 0-14 GeV/$c$ for the proton-lead (lead-proton) beam configuration. When applicable, the first systematic uncertainty indicates the bin-by-bin correlated systematic uncertainty and the second systematic uncertainty the bin-by-bin uncorrelated systematic uncertainty.
hepdata_doi: 10.17182/hepdata.79799.v1
modifications:
- {action: Encoded, date: 17 NOV 2017, who: Michael Winn}
- {action: Modified, date: 17 NOV 2017, who: Michael Winn}
record_ids:
- {id: 1606329, type: inspire}
