  values: [P PB --> J/PSI X]
- name: observables
  values: [SIG]
- name: cmenergies
  values: [8160.0]
location: Data from P 9 (C=PREPRINT)
name: Table 1
table_doi: 10.17182/hepdata.79799.v1/t1
