additional_resources:
- {description: Webpage with all figures and tables, location: 'https://drupal.star.bnl.gov/STAR/publications/'}
- {description: arXiv, location: 'https://arxiv.org/abs/2108.00924'}
comment: |
  BNL-RHIC. We report on the first multi-differential measurement of $\phi$ meson and $\Xi^{-}$ hyperon production as well as the $\phi/K^-$ and $\phi/\Xi^-$ ratio in Au+Au collisions at ${\sqrt{s_{\mathrm{NN}}} = \mathrm{3\,GeV}}$ with the STAR experiment under its fixed target configuration at RHIC. $\phi$ mesons and $\Xi^{-}$ hyperons are measured through their hadronic decay channels, $\phi\rightarrow K^+K^-$ and $\Xi^-\rightarrow \Lambda\pi^-$. The transverse kinetic energy spectra of $K^-$, $\phi$ and $\Xi^{-}$ are presented in different centrality and rapidity intervals. The total production yields and the ratios within a $4\pi$ coverage are calculated and compared to thermal model predictions. The calculation within grand canonical ensemble framework shows a clear discrepancy from our measurement. Our data favors the canonical ensemble approach employing local strangeness conservation with a small strangeness correlation length ($r_c \leq 4.2$\,fm) in $\mathrm{0--10\%}$ central Au+Au collisions at ${\sqrt{s_{\mathrm{NN}}} = \mathrm{3\,GeV}}$.
hepdata_doi: 10.17182/hepdata.110657.v1
