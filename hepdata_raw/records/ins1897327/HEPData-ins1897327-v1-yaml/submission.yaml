data_file: gpc310_fig4_data_01.yaml
description: $\phi/K^-$ (a) and $\phi/\Xi^-$ (b) ratio as a function of collision
  energy, $\sqrt{s_{\mathrm{NN}}}$. The solid black circles show the measurements
  presented here in 0-10\% centrality bin, while empty markers in black or grey are
  used for data from various other energies and/or collision systems. The grey solid
  line represents a THERMUS calculation based on the Grand Canonical Ensemble (GCE)
  while the dotted lines depict calculations based on the Canonical Ensemble (CE)
  with different parameters of strangeness correlation radius ($r_c$). The green dashed
  line, green shaded band and the solid red line show transport model calculations
  from the public versions $\mathrm{UrQMD}^{1}$, modified $\mathrm{UrQMD}^{2}$ and
  SMASH, respectively.
keywords:
- name: observables
  values: [PHI/K & PHI/XI RATIO]
- name: reactions
  values: [AU AU --> K- X, AU AU --> PHI X, AU AU --> XI- X]
- name: cmenergies
  values: [3.0]
- name: phrases
  values: [Energy Dependence, Strangeness Production]
location: Data from Figure for $\phi/K^-$ and $\phi/\Xi^-$
name: Data from Figure 4
