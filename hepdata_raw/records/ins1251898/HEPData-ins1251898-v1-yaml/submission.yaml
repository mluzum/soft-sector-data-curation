data_file: Table1.yaml
description: "The inclusive JPsi nuclear modification factor obtained in p-Pb and
  Pb-p collisions. \nThe first uncertainty is statistical, the second one is the uncorrelated
  systematic uncertainty, while the third one is the partially correlated systematic
  uncertainty. The fourth is a global uncertainty common to p-Pb and Pb-p results.\n"
keywords:
- name: reactions
  values: [P PB --> J/PSI X]
- name: observables
  values: [RAA]
- name: phrases
  values: [Inclusive, J/Psi]
location: Data from Figure 2
name: Table 1
table_doi: 10.17182/hepdata.64892.v1/t1
