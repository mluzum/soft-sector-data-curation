comment: CERN-LHC. Jet fragmentation transverse momentum ($j_\mathrm{T}$) distributions
  are measured in proton-proton (pp) and proton-lead (p--Pb) collisions at $\sqrt{s_\mathrm{NN}}$
  with the ALICE experiment at the LHC. Jets are reconstructed with the ALICE tracking
  detectors and electromagnetic calorimeter using the anti-$k_\mathrm{T}$ algorithm
  with resolution parameter $R = 0.4$ in the pseudorapidity range $|\eta|<0.25$. The
  $j_\mathrm{T}$ values are calculated for charged particles inside a fixed cone with
  a radius $R = 0.4$ around the reconstructed jet axis. The $j_\mathrm{T}$ distributions
  are further characterised by fitting them with a function composed of an inverse
  gamma function for higher $j_\mathrm{T}$ values (called the wide component), related
  to the perturbative component of the fragmentation process, and with a Gaussian
  for lower $j_\mathrm{T}$ values (called the narrow component), predominantly connected
  to the hadronisation process.
