comment: |
  CERN-LHC. Measurement of the effect of  event background fluctuations on charged particle jet reconstruction in PB-PB collisions at a centre-of-mass energy of 2.76 TeV/nucleon. Rigid cones with radius R=0.4 are placed in  each reconstructed event at random PHI and ETA with their centroid within |ETA|<0.5  and the background fluctuations are characterized by DeltaPT which is the difference of the scalar sum of all track PT in the cone and the expected background.  See the text of the paper for more details. Probability densities are presented for different random cone scenarios.
dateupdated: 02/02/2012 00:00:00
hepdata_doi: 10.17182/hepdata.58285.v1
