- {description: Thumbnail image file, location: thumb_Fig6.png}
data_file: Fig6_left_AuAu_200.yaml
description: The upper limit on $\sigma_{v_2}/\langle v_2 \rangle$ for 200 GeV (left)
  and 62.4 GeV (right) Au+Au collisions from Eq. (9) compared to $\sigma_\varepsilon/\varepsilon$
  from Eq. (10) for three different models. The upper limit is found using the LS
  results for $v_2\{2\}$. Data are from the range $0.15 < p_T < 2.0$ GeV/$c$. The
  shaded bands reflect the uncertainties on the models which are dominated by uncertainty
  on the distribution of nucleons inside the nucleus. The uncertainty is only shown
  for the MCG-N and fKLN-CGC models. The uncertainty on the MCG-Q model is the same
  as for the MCG-N model but is not shown for the visual clarity.
