  values: [Au Au --> CHARGED X]
- name: cmenergies
  values: [200.0, 130.0, 19.6, 17.2, 8.7]
- name: phrases
  values: [ppg019, mid-rapidity, transverse energy, charged particle multiplicity]
location: Data From Table 2 of PRC 71 (2005) 034908
name: Table 2a-1
table_doi: 10.17182/hepdata.142940.v1/t1
