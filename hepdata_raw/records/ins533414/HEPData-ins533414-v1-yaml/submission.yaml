data_file: data1.yaml
description: Elliptic flow as a function of centrality defined as nch/nmax. Also given
  is epsilon, the initial space eccentricity of the overlap region, as well as the
  cumulative fraction of events starting with the most central. From the results of
  the study of non-flow contributions by different subevent selections and the maximum
  magnitudes of the first and higher-order harmonics, we estimate a systematic error
  for v2 of about 0.007, with somewhat smaller uncertainty for the mid-centralities
  where the resolution of the event plane is high.
