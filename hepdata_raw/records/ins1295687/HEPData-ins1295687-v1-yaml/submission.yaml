comment: |
  CERN-LHC.  The transverse momentum (pT) distribution of primary charged particles is measured at midrapidity in minimum-bias p-Pb collisions at sqrt(sNN) = 5.02 TeV from 2013 with the ALICE detector at the LHC in the range 0.15 < pT < 50 GeV.  The spectra are compared to the expectation based on binary collision scaling of particle production in pp collisions, leading to a nuclear modification factor consistent with unity for pT larger than 2 GeV.
