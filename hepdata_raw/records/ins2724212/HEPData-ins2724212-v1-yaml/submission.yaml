comment: |
  The measurement of coherent $K^+K^-$ photoproduction
  in ultra-peripheral Pb$-$Pb collisions at $\sqrt{s_\mathrm{NN}}$ = 5.02 TeV is presented. These
  results are based on the data sample collected by the ALICE detector during the
  2015 LHC Pb$-$Pb run.
hepdata_doi: 10.17182/hepdata.151670.v1
