comment: |
  CERN-LHC.  Measurements of the Bose-Einstein correlation in the production of two charged pions in central PB-PB collisions at a nucleon centre-of-mass energy of 2.76 TeV. The data set includes projections of two-pion correlation functions in various kt regions and the HBT radii in the outward, sideward and longitudinal directions.  Numerical values supplied by Dariusz Miskowiec.
dateupdated: 20/01/2011 00:00:00
hepdata_doi: 10.17182/hepdata.56743.v1
