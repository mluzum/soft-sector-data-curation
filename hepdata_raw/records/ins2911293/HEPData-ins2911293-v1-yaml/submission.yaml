data_file: table_1a.yaml
description: The unfolded dijet balance distribution, $(1/N_{dijet})(dN_{dijet}/dx_{j})$,
  as function of $x_{j}$ for the $10-60$, $60-120$, $120-185$, $185-250$ and $250-400$
  multiplicity ranges with both jets at the midrapidity regions.
keywords:
- name: observables
  values: [ASYM, '$x_{j}$', '$(1/N_{dijet})(dN_{dijet}/dx_{j})$']
- name: phrases
  values: [Transverse Momentum Balance]
- name: reactions
  values: [P PB -> DIJET+X]
- name: cmenergies
