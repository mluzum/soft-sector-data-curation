data_file: Table1.yaml
description: |
  The measured K+ production cross section and the K+/PI+ cross section ratio for the angular range 20 to 140 mrad.  The errors on the ratios are statistical only.
keywords:
- name: reactions
  values: [P C --> K+ X, P C --> PI+ X]
- name: observables
  values: [DSIG/DP, SIG/SIG]
- name: phrases
  values: [Inclusive, Integrated Cross Section, Cross Section, Single Differential
      Cross Section, Strange production]
location: Data from T 1, F 9,10
name: Table 1
table_doi: 10.17182/hepdata.59717.v1/t1
