description: Upper - differential cross section as a function of $p^{2}_{T, J/\psi}$
  of \jpsi photoproduction in UPCs at $\sqrt{s_{_{\rm NN}}}=200\rm~GeV$. Data for
  the total diffractive process are shown with solid markers, while data with neutron
  tagging in the deuteron-going ZDC are shown with open markers. Theoretical predictions
  based on the saturation model (Color Glass Condensate)[Phys.Rev.C 101 (2020) 1,
  015203] and the gluon shadowing model (LTA) [V. Guzey, M. Strikman, E. Kryshen,
  M. Zhalov] are compared with data, shown as solid lines. Statistical uncertainty
  is represented by the error bars, and the systematic uncertainty is denoted by the
  shaded box. For the lower, ratios of total data and models are presented as a function
  of $-t \approx p^{2}_{T, J/\psi}$. Color bands are statistical uncertainty based
  on the data only, while systematic uncertainty is indicated by the gray box.
