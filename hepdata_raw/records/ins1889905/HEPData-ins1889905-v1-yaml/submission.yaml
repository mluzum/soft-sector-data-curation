comment: The study of nuclei and antinuclei production has proven to be a powerful
  tool to investigate the formation mechanism of loosely bound states in high-energy
  hadronic collisions. The first measurement of the production of $^{3}_{\Lambda}\text{H}$
  in p-Pb collisions at $\sqrt{s_{\mathrm{NN}}}$ = 5.02 TeV is presented in this Letter.
  Its production yield measured in the rapidity interval $-1 < y < 0$ for the 40%
  highest multiplicity p-Pb collisions is $\mathrm{d} N /\mathrm{d} y =[\mathrm{6.3
  \pm 1.8 (stat.) \pm 1.0 (syst.) ] \times 10^{-7}}$.The measurement is compared with
  the expectations of statistical hadronisation and coalescence models, which describe
  the nucleosynthesis in hadronic collisions. These two models predict very different
  yields of the hypertriton in small collision systems such as p-Pb and therefore
  the measurement of $\mathrm{d} N /\mathrm{d} y$ is crucial to distinguish between
  them.The precision of this measurement leads to the exclusion with a significance
  larger than 6$\sigma$ of some configurations of the statistical hadronisation, thus
  constraining the production mechanism of loosely bound states.
