additional_resources:
- {description: Webpage with all figures and tables, location: 'https://drupal.star.bnl.gov/STAR/publications/evidence-d-au-measurements-final-state-suppression-high-pt-hadrons-au-au-collisions-rhic'}
- {description: arXiv, location: 'https://arxiv.org/abs/nucl-ex/0306024v3'}
comment: We report measurements of single-particle inclusive spectra and two-particle
  azimuthal distributions of charged hadrons at high transverse momentum (high $p_{T}$
  ) in minimum bias and central d+Au collisions at $\sqrt{s_{NN}}$ = 200 GeV. The
  inclusive yield is enhanced in d+Au collisions relative to binary-scaled p+p collisions,
  while the two-particle azimuthal distributions are very similar to those observed
  in p+p collisions. These results demonstrate that the strong suppression of the
  inclusive yield and back-to-back correlations at high $p_{T}$ previously observed
  in central Au+Au collisions are due to final-state interactions with the dense medium
  generated in such collisions.
hepdata_doi: 10.17182/hepdata.98576.v1
