additional_resources: []
comment: CERN-LHC. Neutral pion and ETA meson production cross sections were measured
  up to unprecedentedly high transverse momenta ($p_\mbox{T}$) in p-Pb collisions
  at $\sqrt{s_\mbox{NN}}=8.16$ TeV. The mesons were reconstructed via their two-photon
  decay channel in the rapidity interval $-1.3<y_\mbox{cms}<0.3$ in the ranges of
  $0.4<p_\mbox{T}<200$ GeV/$c$ and $1.0<p_\mbox{T}<50$ GeV/$c$, respectively. The
  respective nuclear modification factor ($R_\mbox{pPb}$) is presented for $p_\mbox{T}$
  up to of 200 and 30 GeV/$c$, where the former was achieved extending the PI0 measurement
  in pp collisions at $\sqrt{s}=8$ TeV. The values of $R_\mbox{pPb}$ are below unity
  for $p_\mbox{T}<10$ GeV/$c$, while they are consistent with unity for $p_\mbox{T}>10$
  GeV/$c$, leaving essentially no room for final state energy loss. The new data provide
  constraints for nuclear parton distribution and fragmentation functions over a broad
  kinematic range and are compared to model predictions as well as previous results
  at $\sqrt{s_\mbox{NN}}=5.02$ TeV.
hepdata_doi: 10.17182/hepdata.128138.v1
