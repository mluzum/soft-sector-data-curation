additional_resources: []
comment: The production cross section of prompt $\Lambda_{\rm {c}}^{+}$ charmed baryons
  was measured with the ALICE detector at the LHC at midrapidity in proton-proton
  (pp) and proton-lead (p-Pb) collisions at a centre-of-mass energy per nucleon pair
  of $\sqrt{s_{\rm {NN}}} = 5.02$ TeV. The $\Lambda_{\rm {c}}^{+}$ and $\Lambda_{\rm
  {c}}^{-}$ baryons were reconstructed in the hadronic decay channels $\Lambda_{\rm
  {c}}^{+} \to {\rm p} {\rm K}^{-}\pi^{+}$ and $\Lambda_{\rm {c}}^{+} \to {\rm p}
  {\rm K}^{0}_{S}$ and respective charge conjugates. The measured differential cross
  sections as a function of transverse momentum ($p_{\rm {T}}$) and the $p_{\rm {T}}$-integrated
  $\Lambda_{\rm {c}}^{+}$ production cross section in pp and in p-Pb collisions are
  presented. The $\Lambda_{\rm {c}}^{+}$ nuclear modification factor ($R_\mathrm{pPb}$),
  calculated from the cross sections in pp and in p-Pb collisions, is presented and
  compared with the $R_\mathrm{pPb}$ of D mesons. The $\Lambda_{\rm {c}}^{+}$/${\rm
  D}^{0}$ ratio is also presented and compared with the light-flavour baryon-to-meson
  ratios p$/\pi$ and $\Lambda / {\rm K}^{0}_{S}$, and measurements from other LHC
  experiments. The results are compared to predictions from model calculations and
  Monte Carlo event generators.
hepdata_doi: 10.17182/hepdata.114213.v1
