description: |-
  $p_{\rm {T}}$-integrated prompt $\Lambda_{\rm {c}}^{+}$ baryon cross section in pp collisions at $\sqrt{s} = 5.02$ TeV in the rapidity interval $|y|<0.5$, and in p-Pb collisions at $\sqrt{s_{\rm {NN}}} = 5.02$ TeV in the rapidity interval $-0.96 \lt y \lt 0.04$.
  First column: The $p_{\rm {T}}$-integrated cross section in the visible (measured) $p_{\rm {T}}$ region, which in pp collisions is $1 \lt p_{\rm T} \lt 12$ GeV/c and in p-Pb collisions is $1 \lt p_{\rm T} \lt 24$ GeV/c. The second (sys) error is from the luminosity uncertainty.
  Second column: The $p_{\rm {T}}$-integrated cross section extrapolated to all $p_{\rm {T}}$. The second (sys) error is from the luminosity uncertainty and the third (sys) error is from the extrapolation to the full $p_{\rm {T}}$ range.
