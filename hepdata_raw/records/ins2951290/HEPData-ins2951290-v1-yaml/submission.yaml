data_file: table_1.yaml
description: $\Delta\varphi$ correlation distribution between electrons from heavy-flavor
  hadron decays and associated charged particles for $4 < p_\mathrm{T}^\mathrm{e}
  < 12$ GeV/$c$ and $1 < p_\mathrm{T}^\mathrm{assoc} < 7$ GeV/c in Pb--Pb collisions
  at $\sqrt{s_\mathrm{NN}} = 5.02$ TeV in the 0--10% centrality class. The publication
  shows the correlation distribution for $p_\mathrm{T}^\mathrm{assoc}$ intervals $1
  < p_\mathrm{T}^\mathrm{assoc} < 2$, $2 < p_\mathrm{T}^\mathrm{assoc} < 3$, and $5
  < p_\mathrm{T}^\mathrm{assoc}< 7$ GeV/$c$. Appendix Figure 1 shows all $p_\mathrm{T}^\mathrm{assoc}$
  intervals.
keywords:
- name: observables
  values: ['$1/{N^\mathrm{(c,b)\rightarrow e}}\mathrm{d}N^\mathrm{assoc}/\mathrm{d}\Delta\varphi
      \mathrm{(rad^{-1})}$']
- name: reactions
  values: ['Pb--Pb --> (c,b)->e + X']
- name: cmenergies
  values: ['5020.0']
location: Data from Figure 1
name: Table 1
table_doi: 10.17182/hepdata.168549.v1/t1
---
