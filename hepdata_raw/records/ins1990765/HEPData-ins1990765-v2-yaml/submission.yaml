additional_resources:
- {description: Created with hepdata_lib 0.9.0, location: 'https://zenodo.org/record/4946277'}
comment: "The production of prompt\_$\\rm \\Lambda_{\\rm c}^{+}$\_baryons at midrapidity
  ($|y|<0.5$) was measured in central (0--10\\%) and mid-central (30--50\\%) Pb--Pb
  collisions at the center-of-mass energy per nucleon--nucleon pair $\\sqrt{s_{\\mathrm{NN}}}=5.02$
  TeV with the ALICE detector. The\_$\\rm \\Lambda_{\\rm c}^{+}$ production yield,
  the\_$\\rm \\Lambda_{\\rm c}^{+} / D^0$ production ratio, and the\_$\\rm \\Lambda_{\\rm
  c}^{+}$ nuclear modification factor $R_{\\rm AA}$ are reported. The results are
  more precise and more differential in transverse momentum ($p_{\\rm T}$) and centrality
  with respect to previous measurements. The\_$\\rm \\Lambda_{\\rm c}^{+} / D^0$ ratio,
  which is enhanced with respect to the pp measurement for $4<p_{\\rm T}<8$ GeV/$c$,
  is described by theoretical calculations that model the charm-quark transport in
  the quark--gluon plasma and include hadronization via both coalescence and fragmentation
  mechanisms."
