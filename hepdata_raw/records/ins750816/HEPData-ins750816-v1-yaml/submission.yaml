data_file: Table4.yaml
description: "$R_{AA}$ as a function of $p_{T}$ from $0-5\\%$ and $60-80\\%$ central
  Au+Au events for $\\Lambda$. Stat. and syst. errors added in quadrature.The band
  at unity shows the systematic uncertainty on $\u27E8N_{bin}\u27E9$. The dashed line
  below unity shows the expected value of RAA should the yields scale with $\u27E8N_{part}\u27E9$,
  and the band around it shows the systematic uncertainty on \u27E8Npart \u27E9. $N_{bin}$
  Scaling 1 $\\pm$ 0.16 and $N_{part}$ Scaling 0.168 $\\pm$ 0.02 ."
keywords:
- name: observables
  values: [RAA]
- name: cmenergies
  values: ['200.0']
- name: phrases
  values: [Nuclear modification factor, pT dependence]
location: Data from Figure 2 and 4.
name: Table 4
