data_file: Table1.yaml
description: Midrapidity E(i) as a function of $<N_{part}>$ for $\Lambda$, $\bar{\Lambda}$
  ($|y| < 1.0$), $\Xi^{-}$, $\bar{\Xi}^{+}$ ($|y| < 0.75$). Error bars on the data
  points represent those from the heavy ions. Stat. and syst. errors added in quadrature.
  Grand Canonical Model arrows(values in brackets), for $\Lambda$ E(2.6) and T(165
  MeV) for  $\bar{\Lambda}$ E(2.2) and T(170 MeV), for $\Xi$ E(10.7) and T(165 MeV),
  for anti-$\Xi$ E(7.5) and T(170 MeV).
keywords:
- name: observables
  values: [Enhancement E(i)]
- name: cmenergies
  values: ['200.0']
- name: phrases
  values: [Enhancement, Relative Yeild, Npart dependence]
location: Data from Figure 1.
name: Table 1
table_doi: 10.17182/hepdata.105866.v1/t1
