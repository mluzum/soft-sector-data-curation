additional_resources:
- {description: arXiv, location: 'https://arxiv.org/abs/hep-ex/0205072'}
- {description: web page, location: 'https://drupal.star.bnl.gov/STAR/publications/azimuthal-anisotropy-k0s-and-lambda-lambdabar-production-mid-rapidity-au-au-collisions-sqrt-s-sub-nn-sub-130-gev'}
comment: We report STAR results on the azimuthal anisotropy parameter $v_2$ for strange
  particles $K_s^0$, $\Lambda$, and $\bar{\Lambda}$ at midrapidity in Au+Au collisions
  at $\sqrt{s_{_{NN}}}$ = 130 GeV at the Relativistic Heavy Ion Collider. The value
  of $v_2$ as a function of transverse momentum, $p_T$, of the produced particle and
  collision centrality is presented for both particles up to $p_T\sim3.0$ GeV/$c$.
  A strong $p_T$ dependence in $v_2$ is observed up to 2.0 GeV/$c$. The $v_2$ measurement
  is compared with hydrodynamic model calculations. The physics implications of the
  $p_T$ integrated $v_2$ magnitude as a function of particle mass are also discussed.
  An erratum of this paper can be found in Phys. Rev. Lett. 127, 089901 (2021).
hepdata_doi: 10.17182/hepdata.102318.v1
