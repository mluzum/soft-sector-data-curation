- {description: Webpage with all figures, location: 'https://drupal.star.bnl.gov/STAR/publications/azimuthal-anisotropy-and-correlations-large-transverse-momenta-p-p-and-au-au-collisions-sqrt-s-sub-nn-sub-200-gev'}
- {description: arXiv, location: 'http://arxiv.org/abs/arXiv:nucl-ex/0407007'}
comment: "Results on high transverse momentum charged particle emission with respect
  to the reaction plane are presented for Au+Au collisions at $\\sqrt{s_{NN}}$ = 200
  GeV. Two- and four-particle correlations results are presented as well as a comparison
  of azimuthal correlations in Au+Au collisions to those in $p+p$ at the same energy.
  Elliptic anisotropy, $v_{2}$, is found to reach its maximum at $p_{t}$ \u223C 3
  GeV/c, then decrease slowly and remain significant up to $p_{t} \\approx$ 7 -- 10
  GeV/c. Stronger suppression is found in the back-to-back high-pt particle correlations
  for particles emitted out-of-plane compared to those emitted in-plane. The centrality
  dependence of $v_{2}$ at intermediate pt is compared to simple models based on jet
  quenching."
