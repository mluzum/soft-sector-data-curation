additional_resources:
- {description: Web page with all results and auxiliary material, location: 'http://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-14-005/'}
comment: "CERN-LHC. The nuclear modification factor $R_{AA}$ and the azimuthal anisotropy
  coefficient $v_{2}$ of prompt and nonprompt (i.e. those from decays of b hadrons)
  J/$\\psi$ mesons, measured from PbPb and pp collisions at $\\sqrt{\\mathrm{s_{NN}}}$=2.76
  TeV at the LHC, are reported. The results are presented in several event centrality
  intervals and several kinematic regions, for transverse momenta $p_{T}>$6.5 GeV/c
  and rapidity $|y|<$2.4, extending down to $p_{T}$=3 GeV/c in the 1.6$<|y|<$2.4 range.
  The $v_{2}$ of prompt J/$\\psi$ is found to be nonzero and constant over the full
  kinematic range studied, while the measured $v_{2}$ of nonprompt J/$\\psi$ is consistent
  with zero. The $R_{AA}$ of prompt J/$\\psi$ exhibits a suppression that increases
  with centrality but does not vary as a function of either y or $p_{T}$ in the fiducial
  range. The nonprompt J/$\\psi$ $R_{AA}$ shows a suppression which becomes stronger
  as rapidity or $p_{T}$ increase. The $v_{2}$ and nuclear suppression of open and
  hidden charm, and of open charm and beauty, are compared. \n\nSee arXiv:1610.00613
  for more details.\n"
hepdata_doi: 10.17182/hepdata.77015.v2
