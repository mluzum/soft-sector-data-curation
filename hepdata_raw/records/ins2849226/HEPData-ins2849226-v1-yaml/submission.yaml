  energy of $\sqrt{s_{\mathrm{NN}}} = 5.02$ TeV, with an integrated luminosity of
  1.9 nb$^{-1}$. The data correspond to the SR1 (Signal Region 1 (SR\(_1\)):} Events
  with exactly one muon and one oppositely charged electron, a dilepton invariant
  mass \( m_{e\mu} \geq 30 \, \mathrm{GeV} \), at least two jets with \( p_T \geq
  35 \, \mathrm{GeV} \), and a dilepton transverse momentum \( p_T^{e\mu} > 40 \,
  \mathrm{GeV} \). This region is expected to be signal-dominated) channel in a pre-fit
  configuration. The stacked histograms represent different processes contributing
  to the event yield.
