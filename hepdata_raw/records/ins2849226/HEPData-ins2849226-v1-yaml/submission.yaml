additional_resources:
- {description: AUX Table 01, location: tabaux_01.png}
data_file: Impact_mu_XS_ttbar.yaml
description: Breakdown of relative systematic uncertainties in the measured ${t\bar{t}}$
  cross-section. The quoted uncertainties are obtained by repeating the fit with a
  group of nuisance parameters fixed to their fitted values and subtracting in quadrature
  the resulting total uncertainty from the uncertainty of the complete fit. However,
  the total uncertainty is not the quadratic sum of the grouped impacts, as this approach
  neglects the correlation among the different groups.
keywords:
- name: reactions
  values: [Pb Pb -> TOP TOP]
- name: cmenergies
  values: [5020]
location: Data from AUX Table 01
name: Grouped impact table for signal strength
table_doi: 10.17182/hepdata.156982.v1/t4
