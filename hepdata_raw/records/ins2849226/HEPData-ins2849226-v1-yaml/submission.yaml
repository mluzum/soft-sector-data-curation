additional_resources:
- {description: AUX Figure 01, location: ranking.png}
data_file: Ranking_mu_XS_ttbar.yaml
description: The impact of systematic uncertainties on the fitted signal-strength
  parameter $\hat{\mu}$ for the combined fit of all channels. Only the 10 most significant
  systematic uncertainties are shown and listed in decreasing order of their impact
  on $\mu$ on the $y$-axis. The empty (filled) blue/cyan boxes correspond to the pre-fit
  (post-fit) impact on $\mu$, referring to the upper $x$-axis. The impact of each
  systematic uncertainty, $\Delta \mu$, is calculated by comparing the nominal best-fit
  value of $\mu$ with the result of the fit when fixing the corresponding nuisance
  parameter $\theta$ to its best-fit value $\hat{\theta}$ shifted by its pre-fit (post-fit)
  uncertainties $\hat{\theta} \pm \Delta \theta(\hat{\theta} \pm \Delta \hat{\theta})$.
  The black points, which refer to the lower $x$-axis, show the pulls of the fitted
  nuisance parameters, i.e., the deviations of the fitted parameters $\hat{\theta}$
  from their nominal values $\theta_0$, normalized to their nominal uncertainties
  $\Delta \theta$. The black lines show the post-fit uncertainties of the nuisance
  parameters, relative to their nominal uncertainties, which are indicated by the
  dashed lines.
keywords:
- name: reactions
  values: [Pb Pb -> TOP TOP]
- name: cmenergies
  values: [5020]
location: Data from AUX Figure 01
name: Nuisance parameter ranking
table_doi: 10.17182/hepdata.156982.v1/t3
