comment: |
  This paper presents the measurement of the isolated prompt photon inclusive production cross section in pp and p--Pb collisions by the ALICE Collaboration at the LHC.
  The measurement is performed in p--Pb collisions at centre-of-mass energies per nucleon pair of $\sqrt{s_{\text{NN}}}=5.02$ TeV and 8.16 TeV, as well as in pp collisions at $\sqrt{s}=5.02$ TeV and 8 TeV.
  The cross section is obtained at mid-rapidity $(|y|<0.7)$ using a charged-track  based isolation momentum $p_{\rm T}^{\text{iso,~ch}}<$1.5 GeV/c in a cone with radius $R=0.4$.
  The data for both collision systems are well reproduced by perturbative QCD (pQCD) calculations at next-to-leading order (NLO) using recent parton distribution functions for free (PDF) and bound (nPDF) nucleons.
  Furthermore, the nuclear modification factor $R_{\text{pA}}$ for both collision energies is consistent with unity for $p_{\rm T} > 20$ GeV/c.
hepdata_doi: 10.17182/hepdata.165479.v1
