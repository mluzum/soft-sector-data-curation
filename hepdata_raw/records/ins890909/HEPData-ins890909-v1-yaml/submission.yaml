comment: |
  CERN-LHC. Measurement of the production of Z0 bosons in Lead-Lead collisions at a nucleon-nucleon centre-of-mass energy of 2.76 TeV.  Z0s are observed in  their opposite sign di-muon decay mode with invariant mass in the range  60 to 120 GeV.  39 events are observed in the data sample which has a total  integrated luminosity of 7.2 mub-1. Dependencies on rapidity, transverse momentum and centrality are also measured.
