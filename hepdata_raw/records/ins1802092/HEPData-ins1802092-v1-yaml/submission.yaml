description: Inclusive $\mathrm{t\bar{t}}$ cross sections measured with two methods,
  relying on the leptonic information alone ($2\ell_{\mathrm{OS}}$), and the second
  one exploits, in addition, the presence of bottom quarks ($2\ell_{\mathrm{OS}}+N_{\mathrm{b-tag}}$),
  in the combined  $\mathrm{e}^+\mathrm{e}^-$, $\mu^+\mu^-$, and $\mathrm{e}^\pm\mu^\mp$
  final states in PbPb collisions at 5.02 TeV, and pp results at $\sqrt{\smash[b]{s}}=5.02$
  TeV (scaled by $A^2$) from JHEP 03 (2018) 115. The measurements are compared with
  theoretical predictions at NNLO+NNLL accuracy in QCD. The inner (outer) experimental
  uncertainty bars include statistical (statistical and systematic, added in quadrature)
  uncertainties.  The inner (outer) theoretical uncertainty bands correspond to nuclear
  or free-nucleon PDF (PDF and scale, added in quadrature) uncertainties.
