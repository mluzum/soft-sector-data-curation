data_file: Table1.yaml
description: $p_{\rm T}$-spectra of charged particles in transverse region for different
  multiplicity classes in pp collisions at $\sqrt{s}$ = 5.02 TeV.
keywords:
- name: reactions
  values: [pp --> X]
- name: observables
  values: ['(1/N$_{\rm ev}$)*d$N^{\rm{T}}_{\rm{ch}}$/(d$p_{\rm T}$)']
- name: cmenergies
  values: ['5020.0']
- name: phrases
  values: [Charged particle production]
location: Data from Figure 2 (top left panel).
name: Table 1
table_doi: 10.17182/hepdata.136308.v1/t1
