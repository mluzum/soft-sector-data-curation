additional_resources:
- {description: Created with hepdata_lib 0.11.0, location: 'https://zenodo.org/record/4946277'}
comment: The measurement of the production of deuterons, tritons and \ensuremath{^{3}\mathrm{He}}\xspace
  and their antiparticles in \mbox{Pb--Pb}\xspace collisions at $\sqrt{s_{\mathrm{NN}}}
  = 5.02$ TeV is presented in this article. The measurements are carried out at midrapidity
  ($|y| < $ 0.5) as a function of collision centrality using the ALICE detector. The
  \ensuremath{p_{\rm T}}\xspace-integrated yields, the coalescence parameters and
  the ratios to protons are reported and compared with nucleosynthesis models. The
  comparison of these results in different collision systems at different  centre-of-mass
  collision energies reveals a suppression of nucleus production in small systems.
  In the Statistical Hadronisation Model framework, this can be explained by a small
  correlation volume where the baryon number is conserved, as already shown in previous
  fluctuation analyses. However, a different size of the correlation volume is required
  to describe the proton yields in the same data sets. The coalescence model can describe
  this suppression by the fact that the wave functions of the nuclei are large and
  the fireball size starts to become comparable and even much smaller than the actual
  nucleus at low multiplicities.
