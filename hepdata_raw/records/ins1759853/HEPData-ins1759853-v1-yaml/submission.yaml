additional_resources:
- {description: Webpage with all figures and tables, location: 'https://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-17-005/'}
- {description: arXiv, location: 'https://arxiv.org/abs/1910.08789'}
comment: Anisotropies in the initial energy density distribution of the quark-gluon
  plasma created in high energy heavy ion collisions lead to anisotropies in the azimuthal
  distributions of the final-state particles known as collective anisotropic flow.
  Fourier harmonic decomposition is used to quantify these anisotropies. The higher-order
  harmonics can be induced by the same order anisotropies (linear response) or by
  the combined influence of several lower order anisotropies (nonlinear response)
  in the initial state. The mixed higher-order anisotropic flow and nonlinear response
  coefficients of charged particles are measured as functions of transverse momentum
  and centrality in PbPb collisions at nucleon-nucleon center-of-mass energies $\sqrt{\smash[b]{s_{_{\mathrm{NN}}}}}
  = 2.76$ and $5.02$ TeV with the CMS detector. The results are compared with viscous
  hydrodynamic calculations using several different initial conditions, as well as
  microscopic transport model calculations. None of the models provides a simultaneous
  description of the mixed higher-order flow harmonics and nonlinear response coefficients.
