    - 10.0
    - 12.0
    - 16.0
    - 24.0
  eta:
    min: -0.8
    max: 0.8
    bins:
    - -0.8
    - 0.8
harmonic: 2
method: event_plane
value_type: v_2
dimensionality: differential_pT
