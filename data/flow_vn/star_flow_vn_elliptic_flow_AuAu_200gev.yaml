    name: RefMult
    observable: Nch
  eta:
  - max: 0.5
    min: -0.5
  notes: centrality classes not auto-parsed from HEPData qualifiers
collision_system:
  energy_gev: 200.0
  reaction: AU AU
dimensionality: integrated
flow_reference:
  detector: TPC
  notes: STAR midrapidity event plane reconstructed from TPC tracks in -1 < eta <
    1 -- the same tracks whose flow is measured (STAR's 'standard event plane method',
    V2{EP}, as opposed to the modified V2{EP2} that excludes same-side tracks). INFERRED
    from the collaboration's standard practice and from this table's charged rows,
    NOT quoted from the paper's method section; re-check provenance=assumed_tpc against
    the text.
  provenance: assumed_tpc
  same_sample_as_poi: true
harmonic: 2
hepdata_file: data1.yaml
hepdata_table_label: Elliptic flow as a function of centrality defined as nch/nmax.
  Also given is epsilon, the initial space eccentricity of the overlap region, as
  well as the cumulative fraction of events starting with the most central. From the
  results of the study of non-flow contributions by different subevent selections
  and the maximum magnitudes of the first and higher-order harmonics, we estimate
  a systematic error for v2 of about 0.007, with somewhat smaller uncertainty for
  the mid-centralities where the resolution of the event plane is high.
inspire_id: '533414'
kinematic_range:
  eta:
    bins:
    - -1.0
    - 1.0
    max: 1.0
    min: -1.0
  pT:
    max: 10
    min: 0.15
method: event_plane
observable_type: flow_vn
particle_id:
  species: charged
qualifiers:
  re: AU AU
  sqrt(snn): '130'
value_type: v2
version: 1
