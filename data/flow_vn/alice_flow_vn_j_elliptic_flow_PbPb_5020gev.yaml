version: 1
hepdata_file: data1.yaml
hepdata_table_label: Transverse momentum dependence of inclusive J/$\psi$ $v_2$ at $\sqrt{s_{\rm NN}}=5.02$ TeV for the 20-40%
  centrality class (forward rapidity). The first uncertainty (stat) is statistical, the second (sys,uncorrel) is the uncorrelated
  systematic, while the third one (sys,correl) is a $p_{\rm T}$-correlated systematic uncertainty.
qualifiers:
  centrality: 20.0-40.0
  re: PB PB --> JPSI < MU+ MU- > X
  sqrt(s)/nucleon: '5020.0'
  yrap: 2.5 TO 4.0
collision_system:
  energy_gev: 5020.0
  reaction: PB PB --> JPSI < MU+ MU- > X
centrality:
  classes:
  - 20.0-40.0%
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: charged
kinematic_range:
  pT:
    min: 0.0
    max: 12.0
    bins:
    - 0.0
    - 2.0
    - 4.0
    - 6.0
    - 8.0
    - 12.0
  eta:
    min: -0.8
    max: 0.8
    bins:
    - -0.8
    - 0.8
harmonic: 2
method: event_plane
value_type: v_2
dimensionality: differential_pT
