    min: 3.2
  - max: -3.2
    min: -4.9
  notes: 'Event plane measured with the forward calorimeter: "The FCal detectors located
    at positive and negative eta, FCal_P and FCal_N, provide such a division" into
    two subevents for the 2SE resolution. The POI is inner-detector tracks at |eta|
    < 2.5, so the reference shares no particles with it. FCal window 3.2 < |eta| <
    4.9 as quoted in this paper. CAVEAT: ATLAS weights the FCal signal by deposited
    E_T, whereas the grid pipeline accumulates a particle count in the same window,
    so the weighting differs even though the acceptance matches.'
  provenance: paper
  reference: arXiv:1203.3087 (INSPIRE 1093733) Sec IV.1 Event plane method
harmonic: 2
