observable_type: flow_vn
inspire_id: '2605845'
version: 1
hepdata_file: fig3_a.yaml
hepdata_table_label: $\Lambda$ hyperon and hypernuclei directed flow $v_1$, shown
  as a function of rapidity, from the $\sqrt{s_{NN}}$ = 3 GeV 5-40% mid-central Au+Au
  collisions. In the case of $^{3}_{\Lambda}$H $v_1$, both two-body (dots) and three-body
  (triangles) decays are used. The linear terms of the fitting for $#Lambda$, $^{3}_{\Lambda}$H
  and $^{4}_{\Lambda}$H are shown as the yellow-red lines. The rapidity dependence
  of $v_1$ for $p$, $d$, $t$, $^3$He, and $^4$He are also shown as open markers (circles,
  diamonds, up-triangles, down-triangles and squares), and the linear terms of the
  fitting results are shown as dashed lines in the positive rapidity region.
collision_system:
  energy_gev: 200
  reaction: AuAu
centrality:
  classes:
  - 5-40%
  estimator:
    name: RefMult
    observable: Nch
    detector: TPC
  eta:
  - min: -0.5
    max: 0.5
particle_id:
  species: Lambda
kinematic_range:
  eta:
    min: -1.0
    max: 1.0
    bins:
    - -1.0
    - 1.0
  pT:
    min: 0.15
    max: 10
harmonic: 1
method: event_plane
value_type: v_{1}
dimensionality: integrated
