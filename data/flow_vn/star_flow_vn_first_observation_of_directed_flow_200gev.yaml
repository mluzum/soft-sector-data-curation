version: 1
hepdata_file: fig4_h_JAM.yaml
hepdata_table_label: Mass dependence of the mid-rapidity $v_1$ slope, $dv_1/dy$, for
  $\Lambda$, $^{3}_{\Lambda}$H and $^{4}_{\Lambda}$H from the $\sqrt{s_{NN}}$ = 3
  GeV 5-40% mid-central Au+Au collisions. The statistical and systematic uncertainties
  are presented by vertical lines and square brackets, respectively. The slopes of
  $p$, $d$, $t$, $^3$He and $^4$He from the same collisions are shown as black circles.
  The blue and dashed green lines are the results of a linear fit to the measured
  light nuclei and hypernuclei $v_1$ slopes, respectively. For comparison, calculations
  of transport models plus coalescence afterburner are shown as gold and red bars
  from JAM model, and blue bars from UrQMD model.
collision_system:
  energy_gev: 200
  reaction: AuAu
centrality:
  classes:
  - 5-40%
  estimator:
    name: RefMult
    observable: Nch
    detector: TPC
  eta:
  - min: -0.5
    max: 0.5
particle_id:
  species: Lambda
kinematic_range:
  eta:
    min: -1.0
    max: 1.0
    bins:
    - -1.0
    - 1.0
  pT:
    min: 0.15
    max: 10
    bins:
    - 0.15
    - 10
harmonic: 1
method: event_plane
value_type: dv_{1 }/dy|_{y=0}
dimensionality: differential_eta
