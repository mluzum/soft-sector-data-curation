hepdata_file: ppg004fig2a.yaml
hepdata_table_label: $v_2$ vs. centrality for several $p_T$ selections. [F] and [A]
  indicate results obtained with the fixed-$p_T$ and assorted-$p_T$ methods respectively.
  Systematic errors are estimated to be $\sim 5$%; they are dominated by the normalization
  of the correction function for real tracks. For the centrality range 0-5%, the data
  points are statistically uncertain and the points are omitted.
inspire_id: '585347'
kinematic_range:
  eta:
    max: 0.35
    min: -0.35
  pT:
    max: 20
    min: 0.2
method: cumulant
notes:
  value: 'method was ''event_plane'' but this paper measures v2 from TWO-PARTICLE
    azimuthal correlations, not from an event plane. arXiv:nucl-ex/0204005: ''In the
    first hadron pairs were formed by selecting both particles from a common pT range
    (fixed-pT method).  In the second hadron pairs were formed by selecting one member
    from a fixed pT range and the other from outside this range (assorted-pT method).''  The
    [F]/[A] in value_type are those two pair constructions; v2 is the Fourier amplitude
    of the resulting 2PC, i.e. the two-particle cumulant. Reclassified from event_plane
    to cumulant order 2.'
observable_type: flow_vn
particle_id:
  species: charged
value_type: '[F] 1.0 < $p_T$ < 2.5 (GeV/$c$)'
version: 1
