    at negative eta for these beam configurations), not the two-arm sum. Multiplicity
    is likewise selected from the same negative- eta BBC. v_2 is corrected with AMPT
    + GEANT-3 to correspond to hadrons integrated over all pT within each pseudorapidity
    bin, so a simulated v_2 restricted to the record's pT acceptance is NOT directly
    comparable to the published value without that correction.
