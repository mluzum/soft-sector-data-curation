hepdata_file: fig5_a_1.yaml
hepdata_table_label: Collision energy dependence of (top panel) directed flow slope
  $dv_1/dy|_{y=0}$ for p, $\Lambda, \pi$(combined from $\pi^{\pm}$), K(combined from
  $K^{\pm}$ and $K_S^0$), $\phi$ and $\Xi^−$, and (bottom panel) elliptic flow $v_2$
  for p, $\pi$(combined from $\pi^{\pm}$) in heavy- ion collisions. Collision centrality
  for all data from RHIC is 10-40%, except for 4.5 GeV where 10-30% is for $dv_1/dy|_{y=0}$
  and 0-30% is for $v_2$. Statistical and systematic uncertainties are shown as bars
  and gray bands, respectively. Some uncertainties are smaller than the data points.
  The JAM and UrQMD results are shown as colored bands:golden, red and blue bands
  stand for JAM mean-field, UrQMD mean-field and UrQMD cascade mode, respectively.
  For clarity the x-axis value of the data points have been shifted.
inspire_id: '1897294'
kinematic_range:
  eta:
    bins:
    - -1.0
    - 1.0
    max: 1.0
    min: -1.0
  pT:
    bins:
    - 0.15
    - 10
    max: 10
    min: 0.15
method: event_plane
observable_type: flow_vn
particle_id:
  species: Lambda
qualifiers:
  collision energy $\sqrt{s_{nn}}: $dv_1/dy|_{y=0}$
value_type: dv_1/dy|_{y=0}$ $\pi
version: 1
