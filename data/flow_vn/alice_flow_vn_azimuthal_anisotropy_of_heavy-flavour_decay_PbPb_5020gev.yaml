observable_type: flow_vn
inspire_id: '1672812'
version: 1
hepdata_file: v2.yaml
hepdata_table_label: $v_2^{HFe}$ in bins of $p_T$ for p-Pb collisions at $\sqrt{s_{NN}}$ = 5.02 TeV. The systematic and statistical
  uncertainties correspond to the combined uncertainties of the $V_{2\Delta}^{HFe-ch}$ and of the charged particle $v_2$.
  The results are obtained by subtracting associated per-trigger correlation distribution in low-multiplicity (60-100% V0A)
  collisions from the correlation distribution in high-multiplicity (0-20% V0A) collisions.
