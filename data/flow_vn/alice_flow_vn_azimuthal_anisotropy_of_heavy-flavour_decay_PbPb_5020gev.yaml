  energy_gev: 5020.0
  reaction: P PB --> (E+ + E-)/2 X
centrality:
  classes:
  - 60-100%
  - 0-20%
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: charged
kinematic_range:
  pT:
    min: 1.5
    max: 6.0
    bins:
    - 1.5
    - 2.0
    - 4.0
    - 6.0
  eta:
    min: -0.8
    max: 0.8
    bins:
    - -0.8
    - 0.8
