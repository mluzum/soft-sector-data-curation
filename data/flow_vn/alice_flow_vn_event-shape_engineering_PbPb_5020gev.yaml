version: 1
hepdata_file: Table_1.yaml
hepdata_table_label: "v_{2}{EP} vs. p_{T} of prompt D0 mesons in Pb-Pb collisions at sqrt{s_{NN}}=5.02 TeV in the centrality\
  \ class 10-30% in the rapidity interval |y|<0.8 \nThe first (sys) error is the systematic uncertainty from the other sources\n\
  The second (sys) error is the systematic uncertainty from the B feed-down contribution.\n"
