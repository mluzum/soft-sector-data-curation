    vs centrality; classes from the tabulated centres (2.5, 7.5, 15, ... -> 0-5, 5-10, 10-20, ...%). Scalar product: the identified
    hadron in one TPC subevent (-0.8 < eta < 0 or 0 < eta < 0.8), charged reference particles in the other; non-flow subtracted
    with pp (v_n^sub). Reference pT range not stated here: 0.2-5 GeV/c assumed. Errors: statistical and systematic.'
