flow_reference:
  detector: BBC
  eta:
  - max: -3.1
    min: -3.9
  notes: 'Event plane from the SOUTH BBC only (single arm), covering -3.9 < eta <
    -3.1; the paper notes the pseudorapidity gap "excludes auto-correlations and reduces
    short-range correlations". Event centrality is likewise set by the south BBC charge.
    This is a single-arm reference, NOT the two-arm sum. POI is central-arm tracks,
    so the reference still shares no particles with it. Resolution is low in these
    small collision systems and is included in the systematic uncertainty. NOTE: psi_3
    is stated explicitly in the paper; v_2 is taken to use the same plane (same section,
    same analysis), which is flagged here rather than asserted.'
