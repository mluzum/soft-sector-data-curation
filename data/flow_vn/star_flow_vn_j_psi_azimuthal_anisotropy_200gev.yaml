hepdata_file: Fig2.yaml
hepdata_table_label: J/Psi azimuthal anisotropy v2 vs pT measured via the dielectron
  channel in 0-10%, 10-40%, and 40-80% central Au+Au collisions at 200 GeV. The brackets
  represent systematic errors. The boxes show the estimated maximum possible range
  of v2 if the nonflow influence is corrected. The mean pT in each bin for v2 calculation
  is drawn, but is shifted a little for some centralities so that all points can be
  seen clearly.
inspire_id: '1207322'
kinematic_range:
  eta:
    bins:
    - -1.0
    - 1.0
    max: 1.0
    min: -1.0
  pT:
    max: 10
    min: 0.15
method: event_plane
observable_type: flow_vn
particle_id:
  species: J/psi
source_column: v2 in centrality 0-10%
value_type: v2
version: 1
