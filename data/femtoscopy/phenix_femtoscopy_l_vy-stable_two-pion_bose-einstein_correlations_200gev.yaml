hepdata_table_label: Example fits of Bose-Einstein correlation functions of (a) $\pi^{-}\pi^{-}$ pair with $m_{T}$ between
  0.331 and 0.349 GeV/$c^2$ and of (b) $\pi^{+}\pi^{+}$ pair with $m_T$ between 0.655 and 0.675 GeV/$c^2$, as a function $Q$
  ≡ |$q_{LCMS}$|, defined in Eq. (26). Both fits show the measured correlation function and the complete fit function (described
  in VI A), while a Bose-Einstein fit function $C^{(0)}_{2} (Q)$ is also shown, with the Coulomb-corrected data, i.e. the
  raw data multiplied by $C^{(0)}_{2} (Q)/C_{2}(Q)$. In this analysis we measured 62 such correlation functions (for ++ and
  -- pairs, in 31 $m_T$ bins), and fitted all of them with the method described in VIA. The first visible point on both panels
  corresponds to $Q$ values below the accessible range (based on an evaluation of the two-track cuts), these were not taken
  into account in the fitting.
