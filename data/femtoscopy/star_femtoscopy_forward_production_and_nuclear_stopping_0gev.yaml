hepdata_table_label: $\overline{\Lambda}/\Lambda$ ratio and net $\Lambda$ and $\overline{\Lambda}$ yields as a function of
  collision centrality on both the deuteron (left) and the gold side (right). On the deuteron side, centrality is expressed
  by the number of collisions per deuteron participant, while on the gold side the number of Au participants is chosen. Only
  statistical errors are shown. The increase in baryon number transport with centrality, shown by the net $\Lambda$ yield,
  is matched by the increase of $\overline{\Lambda}$-$\Lambda$ pair production, thus keeping the $\overline{\Lambda}/\Lambda$
  ratio constant over a wide centrality range.
