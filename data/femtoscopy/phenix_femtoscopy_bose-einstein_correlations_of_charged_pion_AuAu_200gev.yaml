hepdata_file: ppg021fig1.yaml
hepdata_table_label: Panel (a) and (b) show one-dimensional correlation functions for $\pi^+\pi^+$ and $\pi^-\pi^-$. The bottom
  figures show the three-dimensional correlation function for $\pi^-\pi^-$ with the full Coulomb (open circle) and without
  Coulomb (filled triangle) corrections for 0.2 < $k_T$ < 2.0 GeV/$c$ for 0-30% centrality. The projection of the 3-D correlation
  functions are averaged over the lowest 40 MeV in the orthogonal directions. The error bars are statistical only. The lines
  overlaid on the open circles (filled triangles) correspond to fits to Eq. 1 (Eq. 2) over the entire distribution. Panel
  (c) shows the one-dimensional correlation function of unlike-signed pions for 0.2 < $k_T$ < 2.0 GeV/$c$. The two overlaid
  histograms show calculations for the full (dashed) and the 50% partial (solid) Coulomb corrections. $<k_T>$ ~ 0.45 ($\pm$0.17)
  GeV/$c$ and $<N_{part}>$ ~ 281 ($\pm$4).
