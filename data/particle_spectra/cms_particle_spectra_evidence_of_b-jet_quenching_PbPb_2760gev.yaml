---
observable_type: particle_spectra
inspire_id: '1269454'
version: 1
hepdata_file: Table1.yaml
hepdata_table_label: 'The b-jet yield as a function of pT is for the 0-100% centrality class of PbPb collisions. The yields
  are scaled by the equivalent number of minimum bias events sampled and by TAA.

  '
qualifiers:
  abs(etarap(c = bjet)): < 2.0
  centrality in pct: 0.0-100.0
  r: '0.3'
  re: PB PB --> BJET X
  sqrt(s)/nucleon: '2760.0'
collision_system:
  energy_gev: 2760.0
  reaction: PB PB --> BJET X
centrality:
  classes:
  - 0.0-100.0%
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: charged
kinematic_range:
  pT:
    min: 80.0
    max: 250.0
    bins:
    - 80.0
    - 90.0
    - 110.0
    - 130.0
    - 170.0
    - 250.0
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
observable: dN_dpT_dy
value_type: invariant_yield
