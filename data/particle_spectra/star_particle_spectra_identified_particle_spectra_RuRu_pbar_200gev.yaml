hepdata_table_label: 'Identified particle spectra. Identified particle spectra, including all decay contribu-

  tions, within |y| < 0.5 in Ru+Ru (left two columns) and Zr+Zr (right two columns) collisions at

  √sNN = 200 GeV. From top to the bottom, the particles being plotted are pions, kaons, protons

  and deuterons, respectively. The x-axis, pT/A, is the transverse momentum per nucleon. For

  simplicity, A = 1 for pions and kaons even though they are not nucleons. For both the Zr and

  Ru cases, the left column shows positively charged particles, and the right shows negatively

  charged particles. The vertical error bar size represents the statistical uncertainty while the

  box height represents the systematic uncertainty. The dashed curves show the fitted Blast-wave

  function (38).'
