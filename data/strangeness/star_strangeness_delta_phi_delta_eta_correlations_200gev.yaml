hepdata_table_label: 'FIG. 6: “(Color online)”a) left side: The charge dependent (CD) signal shape is a 2 dimensional (2-D)
  approximate gaussian which is symmetrical. The average gaussian width is 27.5$^{\circ}$ $\pm$ 3.2$^{\circ}$ (0.48 $\pm$
  0.056 rad) both in $\Delta\phi$ and $\Delta\eta$. Thus we are observing a greater probability for unlike-sign charge pairs
  of particles than for like-sign charge pairs emitted randomly on 2-D $\eta\phi$ directions. b) right side: The CD signal
  data corresponding to the adjacent signal fit on the left.'
