hepdata_file: Table1a.yaml
hepdata_table_label: Midrapidity $(|y| < 0.5)$ transverse momentum spectra of $\phi$ mesons for various collision centrality
  classes for $Cu+Cu$ collisions at $\sqrt{s_{NN}}=62.4$ and 200 GeV. To study the system size dependence, comparison of $40-50\%$
  $Au+Au$ spectra to $10-20\%$ $Cu+Cu$ spectra at 200 GeV, and $40-60\%$ $Au+Au$ spectra to $20-30\%$ $Cu+Cu$ spectra at 62.4
  GeV are shown. These centralities for the two colliding systems have similar $\langle N_{\scriptsize{\mbox{part}}}\rangle$
  values as outlined in Table 2. The errors represent the statistical and systematic errors added in quadrature. They are
  found to be within the symbol size. The spectra are fitted to a Levy function discussed in the text.
qualifiers:
  cu+cu$, $\sqrt{s_{nn}}=200$ gev: $d^{2}N/(2\pi p_{T}dydp_{T})$, $(\mbox{GeV}/c)^{-2}$
collision_system:
  energy_gev: 200.0
  reaction: Cu Cu --> \phi X
centrality:
  classes:
  - 40.0-50.0%
  - 10.0-20.0%
  - 40.0-60.0%
  - 20.0-30.0%
  estimator:
    name: RefMult
    observable: Nch
    detector: TPC
  eta:
  - min: -0.5
    max: 0.5
particle_id:
  species: charged
kinematic_range:
  pT:
    min: 0.4
    max: 4.875
    bins:
    - 0.4
    - 0.5
    - 0.6000000000000001
    - 0.7
    - 0.825
    - 1.0
    - 1.225
    - 1.5
    - 1.825
    - 2.2
    - 2.5999999999999996
    - 3.025
    - 3.5
    - 4.125
    - 4.875
  eta:
    min: -1.0
    max: 1.0
    bins:
    - -1.0
    - 1.0
observable: charged_spectra
value_type: invariant_yield
