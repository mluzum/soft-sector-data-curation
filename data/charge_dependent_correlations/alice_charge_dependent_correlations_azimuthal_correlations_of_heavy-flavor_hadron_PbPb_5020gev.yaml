observable_type: charge_dependent_correlations
inspire_id: '2637679'
version: 1
hepdata_file: Delphi_panel1.yaml
hepdata_table_label: '$\Delta\varphi$ distribution between heavy-flavor decay electrons and associated charged particles for
  $4 < p_{\rm T}^{\rm e} < 12$ ${\rm GeV}/c$ and $1 < p_{\rm T}^{\rm assoc} < 7$ ${\rm GeV}/c$ in pp collisions at $\sqrt{s_{\rm{NN}}}
  = 5.02$ TeV. The publication shows $\Delta\varphi$ distribution only for the ranges $1 < p_{\rm T}^{\rm assoc} < 2$, $2
  < p_{\rm T}^{\rm assoc} < 3$, and $5 < p_{\rm T}^{\rm assoc} < 7$  ${\rm GeV}/c$.

  '
qualifiers:
  delta eta: -1 to 1
  electron eta: -0.6 to 0.6
  pt condition: $p_{T}^{e} > p_{T}^{assoc}$
  ptassoc: 5 to 7
  pte: 4 to 12
  re: pp -> (c,b)->e + X
  sqrt(s)/nucleon: '5020.0'
collision_system:
  energy_gev: 5020.0
  reaction: pp -> (c,b)->e + X
centrality:
  classes:
  - MB
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: charged
kinematic_range:
