  abs(deta): <1
  pt(charged): '>1'
  pt(d): 5.0 TO 8.0
  sqrt(s): '7000.0'
  yrap: -0.5 TO 0.5 (D0, D+, D*+)
collision_system:
  energy_gev: 7000.0
  reaction: p Pb --> D X
centrality:
  classes:
  - 0-0.3927%
  - 0.3927-0.7854%
  - 0.7854-1.178%
  - 1.178-1.5708%
  - 1.5708-1.9635%
  - 1.9635-2.3562%
  - 2.3562-2.7489%
  - 2.7489-3.1415%
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: charged
kinematic_range:
  eta:
    min: -0.8
    max: 0.8
    bins:
    - -0.8
    - 0.8
  pT:
    min: 0.15
    max: 50
observable: gamma_ss
value_type: gamma_ss
