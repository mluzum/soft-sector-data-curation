hepdata_file: data1.yaml
hepdata_table_label: Comparison of the azimuthal-correlation distributions of D mesons and charged particles obtained for
  D$^0$, D$^{+}$ and D$^{*+}$ mesons for $5 < p_{\rm T} < 8$ GeV/$c$, charged particles $p_{\rm T} > 1$ GeV/$c$, in pp collisions
  at $\sqrt{s} = 7$ TeV. Rapidity range for the D mesons is $|y^{\rm D}_{\rm cms}| < 0.5$. Correlations are integrated for
  $|\Delta\eta|=|\eta_{\rm ch}-\eta_{\rm D}| < 1$. The azimuthal-correlation distributions are reported in the range $0 <
  \Delta\varphi < \pi$.
