  - 1.5708-1.7671%
  - 1.7671-1.9635%
  - 1.9635-2.1598%
  - 2.1598-2.3562%
  - 2.3562-2.5525%
  - 2.5525-2.7489%
  - 2.7489-2.9452%
  - 2.9452-3.1416%
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: charged
kinematic_range:
