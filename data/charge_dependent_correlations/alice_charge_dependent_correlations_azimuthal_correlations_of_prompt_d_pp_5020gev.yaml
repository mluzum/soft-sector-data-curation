hepdata_file: data1.yaml
hepdata_table_label: Comparison of the azimuthal-correlation distributions of D mesons (average of D$^{0}$, D$^{+}$, D$^{*+}$)
  with $3 < p_{\rm T} < 5$ GeV/$c$ and charged particles with $p_{\rm T} > 0.3$ GeV/$c$, in pp collisions at $\sqrt{s} = 5.02$
  TeV and p-Pb collisions at $\sqrt{s_{NN}} = 5.02$ TeV, after baseline subtraction. Rapidity range for the D mesons are $|y^{\rm
  D}_{\rm cms}| < 0.5$ in pp, $-0.96 < y^{\rm D}_{\rm cms} < 0.04$ in p-Pb. Correlations are integrated for $|\Delta\eta|=|\eta_{\rm
  ch}-\eta_{\rm D}| < 1$. The azimuthal-correlation distributions are reported in the range $0 < \Delta\varphi < \pi$.
qualifiers:
  abs(deta): <1
  pt(charged): '>0.3'
  pt(d): 3.0 TO 5.0
  sqrt(s) (pp): '5020'
  sqrt(s)/nucleon (p-pb): '5020'
  yrap (pp): -0.5 TO 0.5 (D0, D+, D*+)
  yrap(rf=cms) (p-pb): -0.96 TO 0.04 (D0, D+, D*+)
collision_system:
  energy_gev: 5020.0
  reaction: p p --> D X
centrality:
  classes:
  - 0-0.1963%
  - 0.1963-0.3927%
  - 0.3927-0.589%
  - 0.589-0.7854%
  - 0.7854-0.9817%
  - 0.9817-1.1781%
  - 1.1781-1.3744%
