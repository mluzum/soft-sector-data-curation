---
observable_type: charge_dependent_correlations
inspire_id: '1658057'
version: 1
hepdata_file: data1.yaml
hepdata_table_label: The distribution of jet-correlated charged-particle tracks with $|{\Delta\phi}|<1.0$ as a function of
  $\Delta\eta$ in pp and PbPb collisions. The PbPb results are shown for different centrality regions.
qualifiers:
  centrality: pp
  jet algo: ANTI-K_T JET R = 0.4
  pt(jet): '> 120'
  pt(trk): '> 0.7'
  re: P P --> CHARGED X
  sqrt(s)/nucleon: '5020.0'
  '|eta(jet)|': < 1.6
  '|eta(trk)|': < 2.4
collision_system:
  energy_gev: 5020.0
  reaction: P P --> CHARGED X
centrality:
  classes:
  - MB
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: charged
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: gamma_ss
value_type: gamma_ss
charge_combo: all
