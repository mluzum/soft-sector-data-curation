observable_type: charge_dependent_correlations
inspire_id: '851937'
version: 1
hepdata_file: fig2_part1.yaml
hepdata_table_label: Background-subtracted azimuthal angle difference distributions for associated particles with pT between
  1.0 and 2.5 GeV/c and for different ranges of trigger particle pT , ranging from 2.5 − 3.0 GeV/c to 3.0 − 4.0 GeV/c. Results
  are shown for Au+Au collisions with different centrality and d+Au reference results. The rapidity range is |eta| < 1 and
  as a result the rapidity-difference |deta| < 2. Results are shown for a restricted acceptance of |deta| < 0.7, using tracks
  within |eta| < 1. The upper and lower range of the systematic uncertainty due to the v2 modulation of the subtracted background
  is indicated as well.
qualifiers:
  dataset: 3.0 < $p_{T}^{trig}$ < 4.0 GeV/c, 0-12% Au+Au, |$\Delta\eta$| < 0.7
collision_system:
  energy_gev: 200.0
  reaction: AuAu --> X
centrality:
  classes:
  - 0-12%
  estimator:
    name: RefMult
    observable: Nch
    detector: TPC
  eta:
  - min: -0.5
    max: 0.5
particle_id:
  species: charged
kinematic_range:
  eta:
    min: -1.0
    max: 1.0
    bins:
    - -1.0
    - 1.0
  pT:
    min: 0.15
    max: 10
    bins:
    - 0.15
    - 10
observable: gamma_ss
value_type: gamma_ss
charge_combo: all
