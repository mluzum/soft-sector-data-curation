version: 1
hepdata_file: Table1.yaml
hepdata_table_label: 'Distributions of $C(\Delta\varphi)$ for h$-$h, K$^{0}_\mathrm{S}$-h,and ($\Lambda+\overline{\Lambda})-$h
  as trigger particles with $8 < p_\mathrm{T,trig}<16 \mathrm{GeV}/c$ and associated particles with $4 < p_\mathrm{T,assoc}<6$
