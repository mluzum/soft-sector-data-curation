---
observable_type: charge_dependent_correlations
inspire_id: '1512112'
version: 1
hepdata_file: data1.yaml
hepdata_table_label: Distribution of the azimuthal angle difference between the Z boson and the jet in pp collisions. The
  distribution is normalized by the number of Z events. The resolutions of the measured jet energy and azimuthal angle are
  smeared to match those of the PbPb sample.
qualifiers:
  jet algo: ANTI-K_T JET R = 0.3
  pt(jet): '> 30'
  pt(z): '> 60'
  re: P P --> Z0 < LEPTON+ LEPTON- > JET
  sqrt(s_nn): '5020'
  '|eta(jet)|': < 1.6
collision_system:
  energy_gev: 5020.0
  reaction: P P --> Z0 < LEPTON+ LEPTON- > JET
centrality:
  classes:
  - MB
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: p
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: gamma_ss
value_type: gamma_ss
charge_combo: all
