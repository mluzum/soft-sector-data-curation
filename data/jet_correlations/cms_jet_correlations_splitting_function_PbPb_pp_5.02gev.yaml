---
observable_type: jet_correlations
inspire_id: '1620905'
version: 1
hepdata_file: data2.yaml
hepdata_table_label: Self-normalized zg distribution in pp collisions for jets with PTJET 160-180 GeV.
qualifiers:
  delta r_12: '>0.1'
  jet algo: ANTI-K_T R=0.4
  ptjet: 160-180
  re: P P --> JET X
  soft drop beta: '0'
  soft drop z_cut: '0.1'
  sqrt(s)/nucleon: '5.02'
  '|etajet|': <1.3
collision_system:
  energy_gev: 5.02
  reaction: P P --> JET X
centrality:
  classes:
  - 0.1-0.15%
  - 0.15-0.2%
  - 0.2-0.25%
  - 0.25-0.3%
  - 0.3-0.35%
  - 0.35-0.4%
  - 0.4-0.45%
  - 0.45-0.5%
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: p
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: jet_fragmentation
value_type: fragmentation_function
correlation_type: dihadron_jet_properties
