---
observable_type: mean_pT_fluctuations
inspire_id: '1672011'
version: 2
hepdata_file: data1.yaml
hepdata_table_label: Differential cross section (multiplied by the dimuon branching fraction) of prompt $\psi$(2S) mesons
  in pPb collisions at $\sqrt(s_{\textrm{NN}})=5.02 $ TeV, as a function of $p_{\textrm{T}}$, for four backward $y_{\mathrm{CM}}$
  regions. The fully correlated luminosity uncertainty of 3.5% is not included in the point-by-point uncertainty. NOTE- The
  cross section unit is nb (nano barn); the y-axes of the figures in the publication show pb (pico barn) by mistake.
qualifiers:
  global uncertainty: 3.5 PCT
  re: P PB --> PSI(2S) < MU+ MU- > X
  sqrt(s)/nucleon: '5020'
  y_{\textrm{cm}}: -2.4--1.93
collision_system:
  energy_gev: 5020.0
  reaction: P PB --> PSI(2S) < MU+ MU- > X
centrality:
  classes:
  - 4-6.5%
  - 6.5-10%
  - 10-30%
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: p
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: sigma_mean_pT
value_type: Sigma
