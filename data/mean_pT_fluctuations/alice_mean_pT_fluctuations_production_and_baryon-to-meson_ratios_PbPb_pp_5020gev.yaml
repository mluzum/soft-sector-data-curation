---
observable_type: mean_pT_fluctuations
inspire_id: '1829739'
version: 1
hepdata_file: hepCrossSectionIntegrated.yaml
hepdata_table_label: '$p_{\rm {T}}$-integrated prompt $\Lambda_{\rm {c}}^{+}$ baryon cross section in pp collisions at $\sqrt{s}
  = 5.02$ TeV in the rapidity interval $|y|<0.5$, and in p-Pb collisions at $\sqrt{s_{\rm {NN}}} = 5.02$ TeV in the rapidity
  interval $-0.96 \lt y \lt 0.04$.

  First column: The $p_{\rm {T}}$-integrated cross section in the visible (measured) $p_{\rm {T}}$ region, which in pp collisions
  is $1 \lt p_{\rm T} \lt 12$ GeV/c and in p-Pb collisions is $1 \lt p_{\rm T} \lt 24$ GeV/c. The second (sys) error is from
  the luminosity uncertainty.

  Second column: The $p_{\rm {T}}$-integrated cross section extrapolated to all $p_{\rm {T}}$. The second (sys) error is from
  the luminosity uncertainty and the third (sys) error is from the extrapolation to the full $p_{\rm {T}}$ range.'
qualifiers:
  re: P PB --> Lc X
  sqrt(s)/nucleon: '5020.0'
collision_system:
  energy_gev: 5020.0
  reaction: P PB --> Lc X
centrality:
  classes:
  - MB
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: Lambda
kinematic_range:
  eta:
    min: -0.8
    max: 0.8
    bins:
    - -0.8
    - 0.8
  pT:
    min: 0.15
    max: 50
    bins:
    - 0.15
    - 50
observable: sigma_mean_pT
value_type: Sigma
