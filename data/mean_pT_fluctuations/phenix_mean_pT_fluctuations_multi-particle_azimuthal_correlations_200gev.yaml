  The black lines above and below the points indicate the systematic uncertainties. The red (green) boxes indicate the statistical
  uncertainties at the 68.27% (95.45%) confidence level. In the case of $\langle v_{2}\rangle$, the statistical uncertainties
  at the 68.27% confidence level are too small to be seen, and the uncertainties at the 95.45% confidence level are visible
  but noticeably smaller than the marker size. Shown as blue squares are the same quantities as determined using the cumulant
  based calculation—these points are slightly offset in the x-coordinate to improve visibility.
