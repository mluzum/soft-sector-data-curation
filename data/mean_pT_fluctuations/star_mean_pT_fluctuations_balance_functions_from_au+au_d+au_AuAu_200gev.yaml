  pions and kaons from Au+Au collisions at $\sqrt{s_{NN}}$ = 200 GeV and p+p collisions at $\sqrt{s}$ = 200 GeV using a thermal
  fit (Eq. 3) where $\sigma$ is the width. Filtered HIJING and UrQMD calculations are shown for pions and kaons from Au+Au
