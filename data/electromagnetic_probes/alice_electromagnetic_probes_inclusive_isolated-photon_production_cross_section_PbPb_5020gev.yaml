hepdata_table_label: Isolated-photon differential cross section measured in pp and
  Pb$-$Pb collisions at $\sqrt{s_{\mathrm{NN}}}=5.02~\mathrm{TeV}$ for five Pb$-$Pb
  centrality classes for $R=0.2$. Note that the Pb$-$Pb data in the first five columns
  is scaled by $\langle N_{\mathrm{coll}} \rangle$, unlike in the figure in the paper
  where the theory was scaled by $\langle N_{\mathrm{coll}} \rangle$. Last two columns
  correspond to theory NLO pQCD calculations with JETPHOX, for pp (PDF) and Pb$-$Pb
  (nPDF) collisions calculated for the 0$-$100% centrality class. Data statistical
  and systematic uncertainties are provided. The theory scale and PDF uncertainties
  are provided. The data normalisation uncertainties are provided in the paper.
