hepdata_table_label: $\gamma^\mathrm{iso}$-hadron correlation functions for pp (red) and p$-$Pb (blue) data at $\sqrt{s_\mathrm{NN}}$
  = 5.02 TeV as measured by the ALICE detector. The different panels represent three different $z_\mathrm{T}$ bins. The correlation
  functions are projected over the range $|\Delta\eta| < 1.2$. The darker bands at zero represents the uncertainty from the
  underlying event estimation in pp and p$-$Pb. The underlying event was estimated over the range $|0.4 <\Delta\varphi < 1.6|$.
  The vertical bars represent statistical uncertainties only. The boxes indicate the systematic uncertainties. The dashed
  green line represents the $\gamma^\mathrm{iso}$-hadron correlation function obtained with PYTHIA 8.2 Monash Tune. '$p$'
  is the p-value for the hypothesis that the pp and p$-$Pb data follow the same true correlation function.
