---
observable_type: electromagnetic_probes
inspire_id: '3122090'
version: 1
hepdata_file: SupFigure1.yaml
hepdata_table_label: Photon-tagged jet $p_T$ spectrum in pp and PbPb collisions for jets with $30 < p_T^{jet} < 100$ GeV recoiling
  from photons with $60 < p_T^{\gamma} < 200$ GeV, normalized per photon. Results are included for PbPb centrality 0-10%,
  10-30%, 30-50%, and 50-90%.
qualifiers:
  centrality: 0-10%
  jet algo: ANTI-KT R = 0.3
  jet pt: 30 - 100
  photon pt: 60 - 200
  re: Pb Pb --> JET + PHOTON
  sqrt(s)/nucleon: '5020'
  '|jet eta|': < 1.6
  '|photon eta|': < 1.44
  '|photon-jet dphi|': '> 2*PI/3'
collision_system:
  energy_gev: 5020.0
  reaction: Pb Pb --> JET + PHOTON
centrality:
  classes:
  - 0-10%
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: photon
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: direct_photon_spectra
value_type: direct_photon_yield
probe: direct_photon
