hepdata_table_label: Dielectron invariant mass spectrum of excess in Pb--Pb collisions at $\sqrt{s_{NN}}$ = 5.02 TeV for the
  0--10\% centrality class. Electrons are measured within $|\eta_{\rm e}| < 0.8$ and $0.2 < p_{\rm T,e} < 10$ GeV/$c$. Dielectrons
