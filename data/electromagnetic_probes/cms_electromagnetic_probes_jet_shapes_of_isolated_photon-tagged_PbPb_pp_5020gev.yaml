---
observable_type: electromagnetic_probes
inspire_id: '1695278'
version: 1
hepdata_file: data1.yaml
hepdata_table_label: The differential jet shape, $\rho(r)$, for jets associated with an isolated photon in pp collisions.
qualifiers:
  delta(phi_jgamma): '> 7 * PI / 8'
  jet algo: ANTI-K_T JET R = 0.3
  pt(gamma): '> 60'
  pt(jet): '> 30'
  pt(trk): '> 1'
  re: P P --> GAMMA JET
  '|eta(gamma)|': < 1.44
  '|eta(jet)|': < 1.6
collision_system:
  energy_gev: 5020.0
  reaction: P P --> GAMMA JET
centrality:
  classes:
  - 0-0.05%
  - 0.05-0.1%
  - 0.1-0.15%
  - 0.15-0.2%
  - 0.2-0.25%
  - 0.25-0.3%
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: photon
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: direct_photon_spectra
value_type: direct_photon_yield
probe: direct_photon
