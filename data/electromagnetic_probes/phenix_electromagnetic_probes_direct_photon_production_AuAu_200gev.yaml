  - 1.3-1.6%
  - 1.6-1.8%
  - 1.8-2.1%
  - 2.1-2.3%
  - 2.3-2.6%
  - 2.6-2.8%
  - 2.8-3.2%
  - 3.2-3.4%
  - 3.4-4.3%
  - 4.3-4.5%
  estimator:
    name: BBC
    observable: amplitude
    detector: BBC
  eta:
  - min: -3.9
    max: -3.0
  - min: 3.0
    max: 3.9
particle_id:
  species: photon
kinematic_range:
  eta:
    min: -0.35
    max: 0.35
  pT:
    min: 0.2
    max: 20
    bins:
    - 0.2
    - 20
observable: direct_photon_spectra
value_type: direct_photon_yield
