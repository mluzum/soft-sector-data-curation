hepdata_file: ppg140fig1a.yaml
hepdata_table_label: 'Direct photon fraction. The direct-photon fractions from the virtual-photon analysis as a function of
  $p_{T}$ in $p+p$ (MB) [1] collisions. The values in the table are equal to this mean value. The statistical and systematic
  uncertainties are shown by the bars and bands, respectively. The curves show expectations from a NLO pQCD calculation [17,
  18] with different cutoff mass scales: (solid) $\mu$ = 0.5 $p_{T}$ , (dash) $\mu$ = 1.0 $p_{T}$ , and (dash-dot) $\mu$ =
  2.0 $p_{T}$.'
qualifiers:
  particle: $p+p$ (RUN5 & RUN6 combined)
collision_system:
  energy_gev: 200.0
  reaction: Au + Au\implies CHARGED X
centrality:
