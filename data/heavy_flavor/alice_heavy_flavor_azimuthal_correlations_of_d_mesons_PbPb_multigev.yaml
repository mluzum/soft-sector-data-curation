hepdata_table_label: Near-side-peak associated yield values measured in pp collisions at $\sqrt{s} = 7$ TeV, for correlations
  of D mesons (D$^{0}$, D$^{+}$, D$^{*+}$ average) and charged particles, as a function of the D-meson $p_{\rm T}$, for associated
  track $p_{\rm T} > 0.3$ GeV/$c$. Rapidity range for the D mesons is $|y^{\rm D}_{\rm cms}| < 0.5$. Correlations are integrated
  for $|\Delta\eta|=|\eta_{\rm ch}-\eta_{\rm D}| < 1$.
qualifiers:
