  pt(charged): '>0.3'
  sqrt(s): '7000.0'
  yrap: -0.5 TO 0.5 (D0, D+, D*+)
collision_system:
  energy_gev: 7000.0
  reaction: p Pb --> D X
centrality:
  classes:
  - 3-5%
  - 5-8%
  - 8-16%
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: charged
  particle: D0
kinematic_range:
  eta:
    min: -0.8
    max: 0.8
    bins:
    - -0.8
    - 0.8
  pT:
    min: 0.15
    max: 50
observable: d0_dN_dy
