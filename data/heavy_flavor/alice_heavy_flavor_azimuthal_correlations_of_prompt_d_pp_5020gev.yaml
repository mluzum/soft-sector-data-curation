hepdata_table_label: Comparison of the near-side associated peak yields measured in pp collisions at $\sqrt{s} = 5.02$ TeV
  and p-Pb collisions at $\sqrt{s_{NN}} = 5.02$ TeV, for correlations of D mesons (average of D$^{0}$, D$^{+}$, D$^{*+}$)
  and charged particles, as a function of the D-meson $p_{\rm T}$, for associated particle $p_{\rm T} > 0.3$ GeV/$c$. Rapidity
