version: 2
hepdata_file: data11.yaml
hepdata_table_label: "Nuclear modification factor for Υ(1S) states in PbPb collisions as a function of pT. Statistical (systematic)\
  \ uncertainties are displayed as error bars (boxes), while the global (fully correlated) uncertainty (7.5%) is displayed\
  \ as a grey box at unity. \n"
qualifiers:
  abs(rap): 0-2.4
  centrality: 0-100%
  global uncertainty: 7.5%
  re: P P --> UPSILON(1S) < MU+ MU- > X
  sqrt(s)/nucleon: '2760'
collision_system:
  energy_gev: 2760.0
  reaction: P P --> UPSILON(1S) < MU+ MU- > X
centrality:
  classes:
  - 0-100%
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: p
  particle: upsilon
kinematic_range:
  pT:
    min: 0.0
    max: 20.0
    bins:
    - 0.0
    - 2.5
    - 5.0
    - 8.0
    - 12.0
    - 20.0
