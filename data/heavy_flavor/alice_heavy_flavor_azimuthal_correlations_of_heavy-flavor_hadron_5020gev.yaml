---
observable_type: heavy_flavor
inspire_id: '2637679'
version: 1
hepdata_file: BaselineppandpPb.yaml
hepdata_table_label: 'Baseline of $\Delta\varphi$ distribution between heavy-flavor decay electrons and associated charged
  particles for $4 < p_{\rm T}^{\rm e} < 12$ ${\rm GeV}/c$ in pp and p$\textendash$Pb collisions at $\sqrt{s_{\rm{NN}}} =
  5.02$ TeV. The publication shows $\Delta\varphi$ distribution only for the ranges $1 < p_{\rm T}^{\rm assoc} < 2$, $2 <
  p_{\rm T}^{\rm assoc} < 3$, and $5 < p_{\rm T}^{\rm assoc} < 7$  ${\rm GeV}/c$.

  '
qualifiers:
  delta eta: -1 to 1
  electron eta: -0.6 to 0.6
  pt condition: $p_{T}^{e} > p_{T}^{assoc}$
  pte: 4 to 12
  re: p$\textendash$Pb -> (c,b)->e + X
  sqrt(s)/nucleon: '5020.0'
collision_system:
  energy_gev: 5020.0
  reaction: p\textendashPb -> (c,b)->e + X
centrality:
  classes:
  - 1-2%
  - 2-3%
  - 3-4%
  - 4-5%
  - 5-7%
  estimator:
    name: V0M
    observable: amplitude
    detector: V0
  eta:
  - min: -3.7
    max: -1.7
  - min: 2.8
    max: 5.1
particle_id:
  species: charged
  particle: D0
kinematic_range:
  eta:
    min: -0.8
    max: 0.8
    bins:
    - -0.8
    - 0.8
  pT:
    min: 0.15
    max: 50
    bins:
    - 0.15
    - 50
observable: d0_invariant_yield
value_type: invariant_yield
particle: D0
