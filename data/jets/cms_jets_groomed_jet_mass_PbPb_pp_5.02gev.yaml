---
observable_type: jets
inspire_id: '1672962'
version: 1
hepdata_file: Figure1a.yaml
hepdata_table_label: Groomed jet energy fraction in pp collision for jets with PTJET 160-180 GeV
qualifiers:
  delta r_12: '> 0.1'
  jet algo: ANTI-K_T R = 0.4
  ptjet: 140-160
  re: P P --> JET X
  soft drop beta: '1.5'
  soft drop z_cut: '0.5'
  sqrt(s)/nucleon: '5.02'
  '|etajet|': < 1.3
collision_system:
  energy_gev: 5.02
  reaction: P P --> JET X
centrality:
  classes:
  - MB
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: p
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: jet_spectra
value_type: jet_spectra
