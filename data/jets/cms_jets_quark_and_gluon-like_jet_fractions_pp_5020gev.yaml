---
observable_type: jets
inspire_id: '1789224'
version: 1
hepdata_file: data1.yaml
hepdata_table_label: Unfolded jet charge measurements for the $p_{T}$-weighting factor $\kappa = 0.5$ and a minimum track
  $p_{T}$ of 1 GeV for inclusive jets in pp and PbPb data. The PbPb results are shown for different centrality regions.
qualifiers:
  centrality: pp
  jet algo: ANTI-K_T JET R = 0.4
  kappa: '0.5'
  pt(jet): '> 120'
  pt(trk): '> 1'
  re: P P --> CHARGED X
  sqrt(s)/nucleon: '5020.0'
  '|eta(jet)|': < 1.5
  '|eta(trk)|': < 2.4
collision_system:
  energy_gev: 5020.0
  reaction: P P --> CHARGED X
centrality:
  classes:
  - MB
  estimator:
    name: HF
    observable: ET
    detector: HF
  eta:
  - min: -5.2
    max: -2.9
  - min: 2.9
    max: 5.2
particle_id:
  species: charged
kinematic_range:
  eta:
    min: -2.4
    max: 2.4
    bins:
    - -2.4
    - 2.4
  pT:
    min: 0.3
    max: 20
observable: jet_spectra
value_type: jet_spectra
