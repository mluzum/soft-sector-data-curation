hepdata_table_label: The p2T distributions of excess yields within the STAR acceptance
  in the mass regions of 1.2–2.6 GeV/c2 in 60%–80% Au + Au and U + U collisions. The
  systematic uncertainties are shown as gray boxes. The solid and dotted lines are
  exponential fits to the data in Au + Au and U + U collisions, respectively. The
  dot-dashed and dot-dot- dashed lines represent the p2T distributions for the photon-photon
  process from two models [33,34] within the STAR acceptance in 60%–80% Au + Au collisions.
  The dashed lines illustrate the corresponding p2T distributions for e+e− pairs from
  the model [33] traversing 1 fm in a constant magnetic field of 10^14 T perpendicular
  to the beam line.
