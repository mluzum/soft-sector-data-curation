# Centrality definition schema.
#
# This is a composable schema fragment, used by *every* observable type
# via "composes: [centrality#centrality]".  It describes how centrality
# percentiles were determined: which detector/observable was used and
# in what kinematic acceptance.
#
# Many measurements from the same collaboration share an identical
# centrality definition.  Storing it fully in each record enables
# downstream simulation code to reproduce the event selection and
# to group measurements by centrality definition.
#
# When published bins result from merging narrower analysis bins, set
# `analysis_classes` to the finer binning and describe the recombination
# method in `notes`.
#
# Examples:
#   ALICE V0M:  amplitude, V0A+V0C,  -3.7 < η < 5.1
#   ATLAS FCal: ET-sum,    FCal,       3.2 < |η| < 4.9
#   CMS HF:     ET-sum,    HF,         2.9 < |η| < 5.2
#   STAR RefMult:  Nch,   TPC,        |η| < 0.5,  pT > 0.15 GeV/c

centrality:
  description: >
    Definition of the centrality determination method. Describes what
    detector/observable was used to define centrality percentiles and the
    kinematic acceptance of that observable. Omit the entire block for
    minimum-bias measurements with no centrality selection.
  fields:
    classes:
      type: list
      required: true
      description: >
        List of centrality percentile bins ('0-5%'), or of track-count
        ranges ('10-20') with multiplicity_bins.
      items:
        type: string
        example: "0-5%"
    estimator:
      type: object
      required: true
      description: >
        The detector/observable used to determine centrality percentiles.
      fields:
        name:
          type: string
          required: true
          description: >
            Common name of the centrality estimator.
            Examples: "V0M", "FCal", "HF", "RefMult", "BBC", "ZDC"
          example: "V0M"
        observable:
          type: string
          required: true
          description: >
            The physical quantity measured by the estimator.
            spectator_neutrons: the neutron energy in a zero-degree
            calorimeter (ALICE ZNA); refused, since models have no
            spectators.
          allowed:
            - amplitude
            - Nch
            - ET
            - energy
            - spectator_neutrons
          example: "amplitude"
        detector:
          type: string
          required: false
          description: >
            Subdetector name (e.g. "V0", "V0A", "V0C", "FCal", "HF",
            "TPC", "BBC", "ZDC").
          example: "V0"
        sum:
          type: string
          required: false
          allowed: [count, transverse_mass]
          description: >
            What the estimator sums over the charged particles in its
            acceptance: count (the default, also for calorimeter E_T
            estimators, whose model proxy is the charged multiplicity) or
            transverse_mass, sum sqrt(pT^2 + mass^2) with one assumed mass
            (ALICE's TPC E_T: the pion mass, 0.15 <= pT < 50 GeV).  The
            Poisson smearing then takes E_T's compound-Poisson width.
          example: transverse_mass
        mass:
          type: float
          required: false
          description: "sum: transverse_mass: the assumed mass (GeV), default the pion's (0.13957)."
          example: 0.13957
        efficiency:
          type: float
          required: false
          description: >
            Percentile classes of a track count of reconstructed tracks
            (ATLAS's N_ch^rec): the model's count is Poisson(efficiency x
            N) in the estimator acceptance (cent method poisson), the
            detector's resolution; default the run's --poisson-efficiency.
          example: 0.6
    eta:
      type: list
      required: true
      description: >
        Pseudorapidity acceptance regions of the centrality estimator.
        Some estimators have multiple disjoint regions (e.g. V0A+V0C,
        FCal±, HF±); each region is listed as a {min, max} pair.
      items:
        type: object
        fields:
          min:
            type: float
            required: true
            description: Minimum η of this acceptance region.
            example: -3.7
          max:
            type: float
            required: true
            description: Maximum η of this acceptance region.
            example: -1.7
    pT:
      type: object
      required: false
      description: >
        Transverse momentum acceptance (for track-based estimators like
        RefMult, ITS-TPC tracks).  Omitted for calorimeter-based and
        scintillator-based estimators which have no pT cut.
      fields:
        min:
          type: float
          required: true
          description: Minimum pT [GeV/c] of the estimator acceptance.
          example: 0.15
        max:
          type: float
          required: false
          description: Maximum pT [GeV/c] of the estimator acceptance.
          example: 100.0
    percentiles:
      type: boolean
      required: false
      description: >
        true: the classes are percentile intervals although they look like
        kinematic bins to the dispatcher's guard (non-integer edges that do
        not span the central few to 10 percent: ultra-central intervals,
        ALICE's 0-0.005% ... 4.5-5%, ATLAS's narrow Sigma E_T intervals).
        Parsing, range and overlap are still checked.
      example: true
    points:
      type: list
      required: false
      description: >
        Published centrality values (e.g. the mean percentile of each
        multiplicity bin) when the class edges are not published.
        `classes` are then windows of width `point_window` centred on
        them (clipped at 0), a curation choice the record states: the
        comparison assumes the observable varies slowly across the
        unpublished bin.
      items:
        type: float
        example: 58.0
    point_window:
      type: float
      required: false
      description: Width, in percent, of the windows around `points`.
      example: 2.0
    multiplicity_bins:
      type: object
      required: false
      description: >
        The classes are ranges of the estimator's track count, not
        percentiles: `classes` 'lo-hi' (no '%') mean lo <= N_trk < hi in
        the estimator acceptance (`eta`, `pT`).  A model event of charged
        multiplicity N there counts N_trk = Poisson(efficiency x N) (cent
        method poisson; efficiency x N with simple) and enters each class
        with that probability (analysis.weights.MultiplicityBinWeights):
        STAR's isobar ratios vs N_trk(|eta| < 0.5), ATLAS N_ch^rec, CMS
        N_trk^offline.  Absolute: no anchor, actual_classes,
        normalization or points; combined_from only unit_multiplicity
        (cells of one track).
      fields:
        efficiency:
          type: float
          required: true
          description: >
            Tracking efficiency of the counted tracks (1.0 for a corrected
            multiplicity).
          example: 0.87
        normalized_to:
          type: object
          required: false
          description: >
            {percentile: p}: the classes are in units of the count R above
            which p percent of the total cross section lies (ATLAS's
            N_ch / N_ch^{5%}): lo <= N_trk / R < hi, R from the events' own
            distribution with the group's anchor, rebuilt in each jackknife
            replicate (analysis.weights.NormalizedMultiplicityBinWeights);
            not with combined_from.
          example: {percentile: 5.0}
        notes: {type: string, required: false}
    abscissa_bins:
      type: object
      required: false
      description: >
        Classes of the estimator labelled on another count's scale (CMS
        2747107: 50 GeV intervals of HF E_T reported at N_ch / N_ch^0 of
        |eta| < 0.5): `classes` 'lo-hi' (no '%') hold the events whose
        estimator lies between the values where the conditional mean of the
        abscissa count (charged particles in `eta`, `pT`) over its mean in
        the estimator's `reference_class` equals lo and hi -- intervals of
        the estimator, as the experiment's, rebuilt in each jackknife
        replicate (analysis.weights.AbscissaBinWeights).
      fields:
        eta: {type: list, required: true, example: [{min: -0.5, max: 0.5}]}
        pT: {type: object, required: false, example: {min: 0.0, max: 100.0}}
        reference_class: {type: string, required: true, example: "0-5%"}
    slices:
      type: object
      required: false
      description: >
        Slices of a second count within a percentile class of the estimator
        (ATLAS 2806288 Fig. 4: N_ch slices of the FCal 0-1% events):
        `classes` 'lo-hi' (no '%') hold the events of the estimator's
        `within` class whose N_trk = Poisson(efficiency x N), N the charged
        particles in `eta`, `pT`, satisfies lo <= N_trk / <N_trk>_within <
        hi; the class mean and the `within` class rebuilt in each jackknife
        replicate (analysis.weights.SliceWeights).
      fields:
        within: {type: string, required: true, example: "0-1%"}
        eta: {type: list, required: true, example: [{min: -2.5, max: 2.5}]}
        pT: {type: object, required: false, example: {min: 0.5, max: 5.0}}
        efficiency: {type: float, required: false, example: 0.6}
    actual_classes:
      type: list
      required: false
      description: >
        The actual percentile range of each listed class, in the same
        order, when it differs from the nominal label: STAR's isobar classes
        are integer Ntrk cuts, so label 40-50% is 39.89-49.86% in Ru+Ru and
        40.16-50.07% in Zr+Zr (arXiv:2109.00131 Table III).  Model classes
        are assigned with these; the labels stay nominal.
      items:
        type: string
        example: "39.89-49.86%"
    normalization:
      type: object
      required: false
      description: >
        Experiment-defined percentile normalization: the events with
        estimator count >= estimator_threshold hold fraction_above of the
        total (STAR isobars: Ntrk >= 50 holds F50 of a Case-3 Glauber
        total).  The model estimator is Poisson(efficiency x N) in the
        estimator acceptance (centrality.eta, centrality.pT), and the
        simulation's coverage is f = fraction_above / <P(Ntrk >=
        threshold)> (analysis.weights.threshold_anchor) instead of the
        sigma_inel anchor.
      fields:
        estimator_threshold: {type: float, required: true, example: 50}
        fraction_above: {type: float, required: true, example: 0.4712}
        efficiency: {type: float, required: false, example: 0.87}
        notes: {type: string, required: false}
    combined_from:
      type: string
      required: false
      allowed:
        - unit_multiplicity
        - analysis_classes
      description: >
        The class values combine values measured in narrower bins of the
        estimator: unit_multiplicity, bins of one unit of its multiplicity
        (STAR's centrality-bin-width correction, e.g. RefMult);
        analysis_classes, narrower percentile classes (`analysis_classes`
        or `analysis_class_width`), averaged with `combination_weight`
        (e.g. ALICE 1% bins weighted by the charged-particle yield, PHENIX
        0-50% from 10% classes weighted by the particle's multiplicity).
        Both are computed per sub-class and combined
        (analysis/cent_combine.py).  unit_multiplicity needs classes in
        track count (multiplicity_bins: STAR's isobar results, every
        observable in unit N_trk bins averaged into the wider bins): cell
        k holds each event with weight P(N_trk = k), the cells averaged
        with `combination_weight` (default events; cells under two
        expected events left out).  With percentile classes it is refused.
      example: "unit_multiplicity"
    analysis_class_width:
      type: float
      required: false
      description: >
        With combined_from analysis_classes: the width (percent) of the
        sub-classes tiling every class (ALICE: 1.0), instead of listing
        them in `analysis_classes`.
      example: 1.0
    combination_weight:
      type: string
      required: false
      allowed: [yield, charged_yield, events]
      description: >
        With combined_from: the weight of each sub-class value.  yield
        (the default for analysis_classes): the yield of the record's
        species in its acceptance; charged_yield: of charged particles in
        that acceptance; events (the default for unit_multiplicity): the
        number of events (a plain average for equal widths).
      example: "charged_yield"
    analysis_classes:
      type: list
      required: false
      description: >
        Finer centrality bins used during analysis before merging into
        the reported `classes` (with combined_from analysis_classes).
        Each class must be tiled exactly by the sub-classes inside it.
      items:
        type: string
        example: "0-0.5%"
    notes:
      type: string
      required: false
      description: >
        Additional details about the centrality determination
        (e.g. "V0A and V0C combined", "symmetric sum of HF towers",
        "multiplicity classes instead of percentiles").
      example: "V0A and V0C combined"
