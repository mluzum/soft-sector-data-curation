observable_type: flow_pT_correlations
description: >
  Correlations between anisotropic flow and the event mean transverse
  momentum [pT] (analysis/flow_pt.py):
    rho_n = cov(v_n^2, [pT]) / sqrt(var(v_n^2) c_k)
    cov_n = <sum_{i!=j!=k} w w w e^{in(phi_i - phi_j)} (pT_k - <[pT]>)> / <sum w w w>
    var(v_n^2) = c_n{4} + c_n{2}^2,   c_k = <Delta pT_i Delta pT_j>
  (ALICE PLB 834 (2022) 137393; ATLAS PRC 107 (2023) 054910).  The record
  states the windows of each term: the full window (kinematic_range) and
  the subevents A, B, C (particles: ABC).

composes:
  - _common#collision_system
  - centrality#centrality
  - _common#particle_id
  - _common#kinematic_range

required_fields:
  observable:
    type: string
    required: true
    description: Short identifier.
    example: "rho_vn2_pT"
  value_type:
    type: string
    required: true
    description: >
      'rho_n' (the modified Pearson coefficient rho(v_n^2, [pT])), 'cov_n'
      (cov(v_n^2, [pT]), GeV), or 'cov_n_over_pT' (cov_n over the class
      mean <[pT]> of the pT window, triplet-weighted; dimensionless).
    example: "rho_n"
  harmonic:
    type: integer
    required: true
    description: "Flow harmonic n correlated with [pT]."
    example: 2

optional_fields:
  correlation_type:
    type: string
    required: false
    description: "'rho_vn2_pT'."
    example: "rho_vn2_pT"
  covariance_method:
    type: string
    required: false
    description: >
      Triplets of cov_n: 'standard' (all three particles in the full
      window), 'two_subevent' (flow pair from A and C, the pT particle from
      A or C), 'three_subevent' (flow pair from A and C, the pT particle
      from B; the default), 'combined_subevent' (the mean of the two- and
      three-subevent cov, ATLAS).
    example: "three_subevent"
  variance_terms:
    type: object
    required: false
    description: >
      Windows of var(v_n^2) = c_n{4} + c_n{2}^2: each 'standard' (the full
      window) or 'two_subevent' (<<4>>_{AA|CC} and <<2>>_{A|C}).  ALICE
      (v_n{2}^4 - v_n{4}^4 from subevents): both two_subevent, the
      default; ATLAS: c4 standard, c2 two_subevent; STAR 2937844: c4
      standard, c2 two_subevent for rho_n^pcc (Eq. 5), and c4 'none' for
      rho_n (Eq. 6): <v_n^2>^2 alone, rho_n = cov_n / (<v_n^2>
      sqrt(<(dpT)^2>)).
    fields:
      c4: {type: string, required: true, example: "two_subevent"}
      c2: {type: string, required: true, example: "two_subevent"}
  ck_window:
    type: string
    required: false
    description: >
      Window of the pairs of c_k: 'full', 'A', 'B' (the default) or 'C', or
      'two_subevent' (STAR 2937844: pairs i in A, j in C, deviations from
      the full window's mean pT).
    example: "B"
  multiplicity_baseline:
    type: object
    required: false
    description: >
      Deviations at fixed multiplicity, the counterpart of measuring in
      narrow multiplicity bins and combining them (ATLAS: Sigma E_T or
      N_ch^rec bins): [pT] (in cov_n and c_k) and the v_n^2 terms of
      var(v_n^2) regressed linearly on this multiplicity within each class.
    fields:
      observable: {type: string, required: false, example: "Nch"}
      eta: {type: list, required: true, example: [{min: -2.5, max: 2.5}]}
      pT: {type: object, required: false, example: {min: 0.5, max: 5.0}}
  particles:
    type: string
    required: false
    description: "'ABC' when subevents are given."
    example: "ABC"
  subevents:
    type: object
    required: false
    description: "Subevent windows {A, B, C: {kinematic_range: {eta, pT}}} (pT default: the record's)."
  value_scale:
    type: float
    required: false
    example: 1.0

validation:
  rules:
    - "rho_between_minus_one_and_one"
