observable_type: multiplicity_distribution
description: >
  Event-by-event distribution P(N) of a multiplicity estimator, usually for
  minimum-bias events.  Experiments mostly publish it at detector level (the
  number of reconstructed tracks, not corrected for tracking efficiency),
  marked `efficiency_corrected: false`; such records are not dispatched
  until a detector-response model (e.g. binomial efficiency smearing of the
  model multiplicity) is supplied.  The high-multiplicity tail and the ratio
  between systems are sensitive to nuclear structure.

  Computed form (value_type `event_fraction`, normalization `cross_section`):
  the fraction of the inelastic cross section in each centrality class --
  ALICE's and CMS's event fractions in intervals of a centrality estimator
  labelled by N_ch / N_ch^{0-5%} (centrality.abscissa_bins), ATLAS's
  distribution of N_ch / N_ch^{5%} (centrality.multiplicity_bins with
  normalized_to).  The model value is the class's events (importance weights
  included) over the anchor's total, rebuilt in each jackknife replicate
  (pipeline key event_fraction).  A distribution normalized to its own
  classes is a ratio record (centrality_ratio) over the classes' union.

composes:
  - _common#collision_system
  - _common#kinematic_range

optional_composes:
  - _common#particle_id
  - _common#notes
  - centrality#centrality

required_fields:
  observable:
    type: string
    required: true
    description: Short identifier.
    example: "multiplicity_distribution"
  value_type:
    type: string
    required: true
    description: >
      The distribution as labelled by the publication, or 'event_fraction'
      for the computed form (the fraction of the cross section in each
      centrality class).
    example: "P(N_trk^offline)"
  efficiency_corrected:
    type: boolean
    required: true
    description: Whether the counted multiplicity is corrected for efficiency and acceptance.
    example: false

optional_fields:
  measured_quantity:
    type: string
    required: false
    description: What exactly is counted (detector, acceptance, track cuts).
    example: "N_trk^offline: TPC tracks, |eta|<0.5, pT>0.2 GeV/c, DCA<3 cm, >=10 fit points"
  event_selection:
    type: string
    required: false
    description: Which events enter the distribution and how it is normalized.
    example: "minimum bias, normalized to unit integral"
  dimensionality:
    type: string
    required: false
    allowed: [differential_multiplicity, integrated]
    description: >
      The independent variable is the multiplicity itself
      (differential_multiplicity), or the classes are the binning
      (integrated: event_fraction records).
    example: "differential_multiplicity"
  normalization:
    type: string
    required: false
    allowed: [cross_section]
    description: >
      For value_type event_fraction: the fractions are of the inelastic
      cross section (the experiments' centrality normalization).
    example: "cross_section"
  value_scale:
    type: float
    required: false
    description: >
      A factor the tabulated values carry (load_experimental divides by it):
      an arbitrarily normalized density converted to fractions per class.
    example: 1.0
