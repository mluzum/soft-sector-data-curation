observable_type: flow_harmonic_correlations
description: >
  Correlations between different anisotropic flow harmonics.  This covers
  three distinct but related sub-types:
    1. Symmetric Cumulants:
         SC(n,m) = ⟨vn² vm²⟩ − ⟨vn²⟩⟨vm²⟩
    2. Event-plane angle correlations (symmetry plane correlations):
         ⟨cos[k(Ψₙ − Ψₘ)]⟩, including Gaussian estimator variants
    3. Multi-harmonic correlations:
         Normalised correlations between different flow amplitudes,
         e.g. ρ_n^{k} = ⟨vn² v_{k}²⟩ / √⟨vn⁴⟩⟨v_{k}⁴⟩
    4. Linear and mode-coupled flow harmonics (mode_coupling):
         V_k = V_k^L + χ_{k,nm} V_n V_m, k = n + m (or χ_{k,nml} V_n V_m V_l,
         k = n + m + l); the correlator C_{k,nm(l)}, the inclusive,
         mode-coupled and linear v_k, χ and ρ (analysis/mode_coupling.py)
    5. Symmetry-plane correlations (plane_correlation):
         ⟨cos(Σ c_i n_i Φ_{n_i})⟩, Σ c_i n_i = 0, each plane from its own
         subevent, scalar-product method (analysis/plane_correlations.py)
    6. pT-dependent flow-vector fluctuations (pT_flow_vector_fluctuations):
         v_n{2}/v_n[2], the factorization ratio r_n, A_n^f, M_n^f
         (analysis/flow_vector_fluct.py)

composes:
  - _common#collision_system
  - centrality#centrality
  - _common#kinematic_range

optional_composes:
  # Event-plane correlation records (NAC, rho) also need the reference.
  - _common#flow_reference
  - _common#notes

required_fields:
  observable:
    type: string
    required: true
    description: Short identifier.
    example: "SC_5_2"
  correlation_type:
    type: string
    required: true
    allowed:
      - symmetric_cumulant
      - event_plane_correlation
      - multi_harmonic_correlation
      - longitudinal_decorrelation
      - mode_coupling
      - plane_correlation
      - pT_flow_vector_fluctuations
    description: >
      Sub-type of the correlation observable.  `mode_coupling`: linear and
      mode-coupled flow harmonics (harmonics [k, n, m] or [k, n, m, l],
      `quantity`).
      `plane_correlation`: symmetry-plane correlations (`planes`,
      `plane_subevents`, `estimator: SP`).  `pT_flow_vector_fluctuations`:
      v_n{2}/v_n[2], r_n, A_n^f, M_n^f per POI pT bin (`quantity`,
      `flow_reference.pT`, `subevents`, `four_particle_subevents`,
      `trigger_pT`).
      `longitudinal_decorrelation`:
      decorrelation of the flow vector or flow plane between pseudorapidity
      windows (r_n(eta), multi-plane cumulants T_n); needs a model with
      longitudinal dynamics.
    example: "symmetric_cumulant"
  harmonics:
    type: list
    required: true
    description: "List of harmonics involved (e.g. [5, 2] for SC(5,2))."
    items:
      type: integer
    example: [5, 2]

optional_fields:
  quantity:
    type: string
    required: false
    allowed: [C, v_inclusive, v_mode_coupled, v_linear, chi, rho, v_ratio, r, A_f, M_f, angle_lower_limit,
              magnitude_upper_limit, r_nn, T_n]
    description: >
      mode_coupling (harmonics [k, n, m], k = n + m): C = <<cos(k phi_1 - n
      phi_2 - m phi_3)>>; v_inclusive = v_k{2}; v_mode_coupled = C /
      sqrt(<v_n^2 v_m^2>), <v_n^2 v_m^2> = <<cos(n phi_1 + m phi_2 - n
      phi_3 - m phi_4)>>; v_linear = sqrt(v_inclusive^2 -
      v_mode_coupled^2); chi = v_mode_coupled / sqrt(<v_n^2 v_m^2>); rho =
      v_mode_coupled / v_inclusive.  Harmonics [k, n, m, l] (k = n + m + l,
      v_{6,222}, v_{7,223}): C = <<cos(k phi_1 - n phi_2 - m phi_3 - l
      phi_4)>> over <v_n^2 v_m^2 v_l^2>, a six-particle correlator.  With
      particles AB, particle 1 (of the pair and of C; the first half of the
      normalization) in one subevent and the rest in the other, both
      orientations pooled; without, all in the window.  differential_pT:
      particle 1 in the pT bin, the normalizations over the record's pT
      range.  With flow_reference.subevents A, B (CMS 1759853, the split
      layout): particle 1 in the record's window (each pT bin), the first
      lower harmonic in A and the rest in B, the normalization's positive
      harmonics in A; quantities C, v_mode_coupled (v_k{Psi_nm}) and chi
      (chi_denominator poi or P4).
      pT_flow_vector_fluctuations (one harmonic, per POI pT bin): v_ratio =
      v_n{2}/v_n[2]; r = r_n(pT_a, pT_trigger); A_f, M_f (ALICE Eqs. 10,
      14); angle_lower_limit = sqrt((A_f + 1)/2); magnitude_upper_limit =
      v_ratio / sqrt((A_f + 1)/2).  longitudinal_decorrelation: r_nn (see
      decorrelation_reference), or T_n, the four-plane correlator
      T_n{ba; dc} = <<sin n(phi_b - Psi_a) sin n(Psi_d - phi_c)>> /
      (<cos n(phi_b - Psi_a)><cos n(Psi_d - phi_c)>) (STAR 2928639, Eqs.
      17-19, particle level; dimensionality integrated): b, c the record's
      |eta| window at negative and positive eta, a, d the
      decorrelation_reference at -|eta_ref| and +|eta_ref|, as flow vectors
      (the scalar-product analog, the event-plane result at low resolution
      of a and d).
    example: chi
  chi_denominator:
    type: string
    required: false
    allowed: [P4, factorized, poi]
    description: >
      mode_coupling chi: v_mode_coupled divided by sqrt(<v_n^2 v_m^2>) (P4,
      the default), by sqrt(<v_n^2><v_m^2>) (factorized: STAR's
      differential chi_{5,23}), or C over <<cos(n phi_1 + m phi_2 - n phi_A
      - m phi_B)>> with particles 1, 2 in the record's window (each pT bin)
      and A, B as in C (poi: CMS's chi_{k,nm} = Re<Q_k Q_nA* Q_mB*> /
      Re<Q_n Q_m Q_nA* Q_mB*>, split layout only).
    example: factorized
  decorrelation_reference:
    type: object
    required: false
    description: >
      longitudinal_decorrelation (quantity r_nn or T_n): the reference window
      {eta: {min, max}} in |eta| (both signs) and its pT; r_{n|n}(eta) =
      <<cos n(phi(-eta) - phi_ref)>> / <<cos n(phi(eta) - phi_ref)>>, the POI
      in the record's |eta| bins, both orientations pooled
      (analysis/eta_regions.py; ALICE 2679248, the r_n of CMS and ATLAS).
    example: {eta: {min: 2.0, max: 2.4}, pT: {min: 0.0, max: 100.0}}
  four_particle_subevents:
    type: object
    required: false
    description: >
      pT_flow_vector_fluctuations: the subevents A, B of the four-particle
      correlators (A_f, M_f; ALICE: no gap, eta < 0 and eta > 0), each
      {eta: {min, max}}: the positive harmonics in one, the negative in the
      other, both orientations pooled.
    example: {A: {eta: {min: -0.8, max: 0.0}}, B: {eta: {min: 0.0, max: 0.8}}}
  trigger_pT:
    type: object
    required: false
    description: "pT_flow_vector_fluctuations r_n: the trigger particles' pT range {min, max}."
    example: {min: 0.2, max: 0.6}
  planes:
    type: list
    required: false
    description: >
      plane_correlation: the planes of <cos(sum_i c_i n_i Phi_{n_i})>
      {harmonic: n_i, coefficient: c_i}, distinct n_i, c_i != 0, sum c_i n_i
      = 0 (<cos 4(Phi_2 - Phi_4)>: [{harmonic: 2, coefficient: 2},
      {harmonic: 4, coefficient: -1}]); two or three for SP, any number for
      GE (ALICE: up to five).  For GE, |c_i| particles carry harmonic
      sign(c_i) n_i.
    example: [{harmonic: 2, coefficient: 2}, {harmonic: 4, coefficient: -1}]
  plane_subevents:
    type: object
    required: false
    description: >
      plane_correlation: the subevents, each a list of eta ranges (pT from
      kinematic_range.pT).  Two planes: P and N, the planes measured in P
      and N and in N and P, the two averaged, each resolution from P and N
      (ATLAS Eqs. 12, 16).  Three planes: A, B, C (A and C symmetric); type
      t puts plane t in B and the other two in A and C (both assignments
      averaged), plane t's resolution from the three subevents, the others'
      from A and C; the three types averaged (ATLAS Eqs. 13, 17).
    example: {P: [{min: 0.5, max: 4.8}], N: [{min: -4.8, max: -0.5}]}
  particles:
    type: string
    required: false
    allowed: [AB]
    description: "mode_coupling: two subevents (`subevents.A`, `subevents.B` with kinematic_range eta)."
    example: AB
  subevents:
    type: object
    required: false
    description: "The subevents named by `particles` (kinematic_range per subevent)."
    example: {A: {kinematic_range: {eta: {min: 0.35, max: 1.0}}}, B: {kinematic_range: {eta: {min: -1.0, max: -0.35}}}}
  dimensionality:
    type: string
    required: false
    allowed: [integrated, differential_pT]
    description: "mode_coupling: integrated, or in the pT bins of kinematic_range.pT."
    example: differential_pT
  normalized:
    type: boolean
    required: false
    description: >
      symmetric_cumulant: true for NSC(m,n) = SC(m,n) / (<v_m^2><v_n^2>)
      (NSC(k,l,m) = SC(k,l,m) / (<v_k^2><v_l^2><v_m^2>)), false for SC.
      Required by the computation (two or three harmonics).
    example: true
  normalization_eta_gap:
    type: float
    required: false
    description: >
      NSC: the <v_n^2> of the denominator from two-particle correlations
      between the two halves of the window separated by this gap (ALICE:
      |Delta eta| > 1).  Absent: from the same particles as SC.  A
      symmetric cumulant with `particles: AB` and `subevents` A, B (ALICE
      2825785) has every term across the subevents (<<m, n | -m, -n>>,
      <<m | -m>>, <<n | -n>>) and no normalization gap.
    example: 1.0
  estimator:
    type: string
    required: false
    description: >
      Estimator used. Common values: 'standard' (default SC), 'GE' (Gaussian
      estimator for symmetry-plane correlations), 'SP' (scalar product), 'EP'
      (event plane).  plane_correlation computes SP (subevents,
      plane_subevents) and GE (one window, the record's kinematic_range:
      sqrt(pi/4) N / sqrt(D), N the sum |c_i|-particle correlator, D the
      2 sum |c_i|-particle <prod v^{2|c_i|}>; key plane_corr_ge); EP depends
      on the detector's event-plane resolution.
    example: "GE"
  value_type:
    type: string
    required: false
    description: >
      Specific observable label. Examples:
      'NSC(5,2)', 'SC(5,2)', '⟨cos[4(Ψ₄−Ψ₂)]⟩', 'ρ_2^{3}'
    example: "NSC(5,2)"

validation:
  rules:
    - "harmonics_must_be_positive"
    - "symmetric_cumulant_range_validation"
