observable_type: observable_ratios
description: >
  Ratios of a measured observable between two collision systems, two
  particle species, or a double ratio of both.  These records are stored
  for the Bayesian analysis, which forms model ratios after emulator
  training; the analysis pipeline does not dispatch them.  Whenever the
  numerator and denominator are separately curated, the optional
  `numerator_record` / `denominator_record` fields point at those records.

composes:
  - _common#collision_system
  - _common#kinematic_range

optional_composes:
  - centrality#centrality
  - _common#particle_id

required_fields:
  observable:
    type: string
    required: true
    description: Short identifier of the quantity being ratioed.
    example: "v2"
  value_type:
    type: string
    required: true
    description: Human-readable ratio label.
    example: "v2_Ru_over_Zr"
  numerator:
    type: string
    required: true
    description: Numerator system, species, or quantity.
    example: "Ru+Ru"
  denominator:
    type: string
    required: true
    description: Denominator system, species, or quantity.
    example: "Zr+Zr"
  ratio_type:
    type: string
    required: true
    description: "One of: 'system_ratio', 'energy_ratio' (the same system at two collision energies), 'centrality_ratio' (one system, each class over a reference class: denominator_class), 'rapidity_ratio' (one system and class, two eta or y windows), 'particle_ratio', 'double_ratio', 'quantity_ratio', 'system_combination' (no ratio: one observable over two collision systems combined, e.g. STAR's 'Ru+Ru and Zr+Zr combined', the `combination` of the numerator and denominator records)"
    example: "system_ratio"

optional_fields:
  numerator_record:
    type: string
    required: false
    description: >
      Repository-relative path of the curated numerator record, when separate;
      append "#<document index>" for a multi-document file.
    example: "data/flow_vn/star_flow_vn_isobar_v2_v22_RuRu_200gev.yaml"
  denominator_record:
    type: string
    required: false
    description: >
      Repository-relative path of the curated denominator record, when separate;
      append "#<document index>" for a multi-document file.
    example: "data/flow_vn/star_flow_vn_isobar_v2_v22_ZrZr_200gev.yaml"
  numerator_system:
    type: string
    required: false
    description: Collision system of the numerator, when it differs from the record reaction.
    example: "Ru+Ru"
  denominator_system:
    type: string
    required: false
    description: Collision system of the denominator, when it differs from the record reaction.
    example: "Zr+Zr"
  numerator_particle:
    type: string
    required: false
    description: Particle species of the numerator.
    example: "pi+"
  denominator_particle:
    type: string
    required: false
    description: Particle species of the denominator.
    example: "pi-"
  denominator_class:
    type: string
    required: false
    description: >
      The centrality class of the denominator side for every class of the
      ratio (a ratio to a reference class, e.g. ATLAS O+O spectra over the
      70-80% spectrum); without it both sides are computed at the ratio's
      classes.
    example: "70-80%"
  scale:
    type: number
    required: false
    description: >
      A factor on numerator / denominator (ALICE's Lambda/K0S is
      (Lambda + Lambdabar) / (2 K0S): the Lambda + Lambdabar side over the
      K0S side, scale 0.5).
    example: 0.5
  side_normalization:
    type: object
    required: false
    description: >
      Each side is a pT spectrum divided by its pT-integrated yield over
      this pT range (in the side's window and class) before the ratio is
      formed, inside the jackknife: a ratio of spectrum shapes.  The range
      need not be the ratio's bins (ATLAS 3170344: bins from 0.21 GeV, yields
      over the fiducial 0.27-5 GeV); its limits must be bin edges.
    example: {pT: {min: 0.27, max: 5.0}}
  combination:
    type: string
    required: false
    allowed: [mean]
    description: >
      ratio_type system_combination: how the two linked records combine.
      mean: (numerator + denominator) / 2, each side computed on its own
      system's simulation set (scripts/compute_ratios.py), standing for the
      measurement on the pooled events of two samples of about equal size.
    example: mean
  efficiency_cancels:
    type: boolean
    required: false
    description: >
      True when numerator and denominator are detector-level quantities
      (e.g. uncorrected track counts) measured with the same detector under
      the same conditions, so that the efficiency cancels in their ratio and
      it can be compared with the ratio of the corresponding corrected model
      quantities.  False or absent otherwise; a ratio of distributions at a
      fixed detector-level multiplicity does not qualify.
    example: true
  notes:
    type: string
    required: false
    description: Free-text provenance or caveats.
