observable_type: mean_pT_fluctuations
description: >
  Event-by-event fluctuations of the mean transverse momentum.
  Common observables include:
    Σ = √⟨⟨ΔpTi ΔpTj⟩⟩ / ⟨⟨pT⟩⟩       (integral correlator, ALICE)
    √⟨⟨ΔpTi ΔpTj⟩⟩ / ⟨⟨pT⟩⟩             (normalised standard deviation)
    σ_⟨pT⟩ / ⟨⟨pT⟩⟩                       (relative fluctuation)
  These quantify the strength of dynamical pT correlations event-by-event.

composes:
  - _common#collision_system
  - centrality#centrality
  - _common#particle_id
  - _common#kinematic_range

required_fields:
  observable:
    type: string
    required: true
    description: Short identifier.
    example: "sigma_mean_pT"
  value_type:
    type: string
    required: true
    description: >
      One of: 'Sigma', 'sqrt_<dpt1_dpt2>_over_<pT>', 'sigma_<pT>_over_<pT>',
      'dyn_fluctuation', 'F_pT', 'Delta_fluctuation'
    example: "Sigma"

optional_fields:
  method:
    type: string
    required: false
    description: "Analysis method (e.g. 'integral_correlator', 'two_particle', 'spherocity')."
    example: "integral_correlator"
  pT_integration_range:
    type: object
    required: false
    description: "pT range used for the fluctuation measurement."
    fields:
      min: {type: float, required: true, example: 0.15}
      max: {type: float, required: true, example: 2.0}
  multiplicity_range:
    type: object
    required: false
    description: "Multiplicity range if reported vs Nch."
    fields:
      min: {type: float, required: false, example: 0}
      max: {type: float, required: false, example: 100}
  averaging:
    type: string
    required: false
    description: >
      How <Delta pT_i Delta pT_j> averages over a class: 'pairs' (the
      default; ALICE, EPJC 74 (2014) 3077 Eq. 2-3: the sum over all pairs of
      all events over the number of pairs, deviations from the mean pT of
      all particles) or 'events' (STAR, PRC 72 (2005) 044902 Eq. 1-4 and
      later: the mean of the events' pair averages, deviations from and
      normalization by the mean of the event means).  They differ when the
      multiplicity varies across the class.
    example: "events"
  multiplicity_baseline:
    type: object
    required: false
    description: >
      Deviations pT_i - <<pT>>(N) from the mean pT at the event's
      multiplicity N instead of the class mean (STAR: <<pT>> fitted vs the
      multiplicity that defines the centrality, or computed per
      reference-multiplicity bin and averaged over the class), which
      removes the spread of <pT> across a wide class.  Computed by a linear
      regression of the event mean pT on this multiplicity within each
      class; the normalization stays the class mean.
    fields:
      observable: {type: string, required: false, example: "Nch"}
      eta: {type: list, required: true, example: [{min: -0.5, max: 0.5}]}
      pT: {type: object, required: false, example: {min: 0.15, max: 100.0}}
  value_scale:
    type: float
    required: false
    description: "Factor the tabulated values carry (100 for percent)."
    example: 100.0

validation:
  rules:
    - "sigma_must_be_positive"
